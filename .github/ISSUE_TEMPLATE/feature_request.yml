name: Feature request
description: 提议新的产品能力或工程改进
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明目标用户、场景与当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述预期行为、范围与可接受性标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 已考虑过的替代方式及其取舍。
  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议
      options:
        - P0 - 阻塞发布或关键使用场景
        - P1 - 重要能力
        - P2 - 常规改进
        - P3 - 长期探索
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 设计稿、相关 Issue、兼容性或迁移要求。
