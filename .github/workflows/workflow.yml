name: Service Build
permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: master-ci
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # 矩阵配置：列出所有需要打包的服务名
      matrix:
        service: [bbs, user, content, economy, notify, im, platform, scheduler]
      # 即使一个服务失败，其他服务也继续构建
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Aliyun & GHCR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: common/build/docker/service.Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.service }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/${{ matrix.service }}:latest
            ghcr.io/cooooing/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - language: typescript-axios
            make-target: sdk-typescript-axios
            output-dir: common/proto/gen-sdk/typescript-axios
            branch: sdk/typescript-axios
          - language: typescript-fetch
            make-target: sdk-typescript-fetch
            output-dir: common/proto/gen-sdk/typescript-fetch
            branch: sdk/typescript-fetch
          - language: go
            make-target: sdk-go
            output-dir: common/proto/gen-sdk/go
            branch: sdk/go
          - language: java
            make-target: sdk-java
            output-dir: common/proto/gen-sdk/java
            branch: sdk/java
          - language: rust
            make-target: sdk-rust
            output-dir: common/proto/gen-sdk/rust
            branch: sdk/rust
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install development tools
        run: |
          make init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate SDK
        run: make -C app/bbs ${{ matrix.make-target }}

      - name: Push SDK Branch
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${{ matrix.output-dir }}"
          branch="${{ matrix.branch }}"
          publish_dir="$(mktemp -d)"

          if [ ! -d "$output_dir" ]; then
            echo "[ERROR] SDK output directory does not exist: $output_dir" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git worktree add "$publish_dir" "origin/$branch"
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" checkout --orphan "$branch"
          fi

          find "$publish_dir" -mindepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$output_dir"/. "$publish_dir"/

          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "[sdk] no changes for $branch"
            exit 0
          fi

          git -C "$publish_dir" commit -m "chore: update ${{ matrix.language }} sdk"
          git -C "$publish_dir" push origin "HEAD:$branch"
