name: Image Build
permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: master-ci
  cancel-in-progress: true

jobs:
  build-services:
    name: Build and Push Services
    runs-on: ubuntu-latest
    strategy:
      # 矩阵配置：列出所有需要打包的服务名
      matrix:
        service: [bff_bbs, bff_bbs_admin, bff_game_idle, content, economy, game_idle, game_town, im, notify, platform, push_hub, push_node, scheduler, user]
      # 即使一个服务失败，其他服务也继续构建
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Aliyun & GHCR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: common/build/docker/service.Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_NAME=${{ matrix.service }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/${{ matrix.service }}:latest
            ghcr.io/cooooing/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-monolith:
    name: Build and Push Monolith
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Aliyun & GHCR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push Monolith Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: monolith/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/monolith:latest
            ghcr.io/cooooing/monolith:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bff_bbs, bff_bbs_admin, bff_game_idle]
        language: [typescript-axios, typescript-fetch, go, java, rust]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install development tools
        run: |
          make init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate SDK
        run: |
          make -C app/${{ matrix.service }} sdk-${{ matrix.language }}

      - name: Push SDK Branch
        shell: bash
        run: |
          set -euo pipefail

          output_dir="common/proto/gen-sdk/${{ matrix.language }}/${{ matrix.service }}"
          branch="sdk/${{ matrix.service }}/${{ matrix.language }}"
          publish_dir="$(mktemp -d)"

          if [ ! -d "$output_dir" ]; then
            echo "[ERROR] SDK output directory does not exist: $output_dir" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git worktree add "$publish_dir" "origin/$branch"
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" checkout --orphan "$branch"
          fi

          find "$publish_dir" -mindepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$output_dir"/. "$publish_dir"/

          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "[sdk] no changes for $branch"
            exit 0
          fi

          git -C "$publish_dir" commit -m "chore: update ${{ matrix.service }} ${{ matrix.language }} sdk"
          git -C "$publish_dir" push origin "HEAD:$branch"
