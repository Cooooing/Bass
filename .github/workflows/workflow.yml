name: Service Build
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: master-ci
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # 矩阵配置：列出所有需要打包的服务名
      matrix:
        service: [gateway, user, content, notify, im, signal, connector, infra]
      # 即使一个服务失败，其他服务也继续构建
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login (Aliyun & GHCR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          # 动态引用矩阵中的服务名，寻找对应的 Dockerfile
          file: app/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.service }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/${{ matrix.service }}:latest
            ghcr.io/cooooing/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max