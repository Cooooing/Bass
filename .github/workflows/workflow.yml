name: Image Build

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: master-ci
  cancel-in-progress: true

jobs:
  build-toolchain:
    name: Build Toolchain Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.toolchain.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login (GHCR)
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Calculate Toolchain Tag
        id: toolchain-tag
        env:
          TOOLCHAIN_TAG: ${{ hashFiles('common/build/docker/toolchain.Dockerfile', 'common/build/make/common.mk') }}
        run: echo "tag=${TOOLCHAIN_TAG}" >> "$GITHUB_OUTPUT"
      - name: Resolve Toolchain Image
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/cooooing/bass-build-tools:${{ steps.toolchain-tag.outputs.tag }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "[toolchain] reusing ${image}"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "[toolchain] building ${image}"
          fi
      - name: Build and Push Toolchain Image
        if: steps.toolchain.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: common/build/docker/toolchain.Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.toolchain.outputs.image }}
            ghcr.io/cooooing/bass-build-tools:latest
          cache-from: type=gha,scope=bass-toolchain
          cache-to: type=gha,mode=max,scope=bass-toolchain

  build-services:
    name: Build and Push Services
    needs: build-toolchain
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            bff_bbs,
            bff_bbs_admin,
            bff_game_idle,
            content,
            economy,
            game_idle,
            game_town,
            im,
            notify,
            platform,
            push_hub,
            push_node,
            scheduler,
            user,
          ]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login (Aliyun & GHCR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and Push Service Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: common/build/docker/service.Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_NAME=${{ matrix.service }}
            TOOLCHAIN_IMAGE=${{ needs.build-toolchain.outputs.image }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/${{ matrix.service }}:latest
            ghcr.io/cooooing/${{ matrix.service }}:latest
          cache-from: type=gha,scope=service-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.service }}

  build-monolith:
    name: Build and Push Monolith
    needs: build-toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login (Aliyun & GHCR)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.cn-hangzhou.aliyuncs.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and Push Monolith Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: monolith/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: TOOLCHAIN_IMAGE=${{ needs.build-toolchain.outputs.image }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/docker-cooooing/monolith:latest
            ghcr.io/cooooing/monolith:latest
          cache-from: type=gha,scope=monolith
          cache-to: type=gha,mode=max,scope=monolith

  generate-sdk:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        service: [bff_bbs, bff_bbs_admin, bff_game_idle]
        language: [typescript-axios, typescript-fetch, go, java, rust]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0
      - name: Restore SDK generator caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.openapi-generator
            ~/go/bin/protoc-gen-openapi
          key: sdk-generator-${{ runner.os }}-go1.26-openapi-v0.7.1-openapi-cli-v2.41.0-${{ hashFiles('common/proto/sdk/openapitools.json') }}
      - name: Install SDK development tool
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$(go env GOPATH)/bin/protoc-gen-openapi" ]; then
            go install github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate SDK
        shell: bash
        run: |
          set -euo pipefail
          make -C app/${{ matrix.service }} sdk SDK_LANGUAGES=${{ matrix.language }}
      - name: Push SDK Branch
        shell: bash
        run: |
          set -euo pipefail
          output_dir="common/proto/gen-sdk/${{ matrix.language }}/${{ matrix.service }}"
          branch="sdk/${{ matrix.service }}/${{ matrix.language }}"
          publish_dir="$(mktemp -d)"
          if [ ! -d "$output_dir" ]; then
            echo "[ERROR] SDK output directory does not exist: $output_dir" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git worktree add "$publish_dir" "origin/$branch"
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" checkout --orphan "$branch"
          fi
          find "$publish_dir" -mindepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$output_dir"/. "$publish_dir"/
          rm -rf "$publish_dir/.github"
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "[sdk] no changes for $branch"
            exit 0
          fi
          git -C "$publish_dir" commit -m "chore: update ${{ matrix.service }} ${{ matrix.language }} sdk"
          git -C "$publish_dir" push origin "HEAD:$branch"
