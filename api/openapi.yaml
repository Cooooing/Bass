openapi: 3.0.3
info:
  description: Bass 社区 HTTP/JSON API
  title: Bass BBS API
  version: 1.0.0
servers:
- url: /
tags:
- description: AccountService 提供 BBS 账号接口
  name: AccountService
- description: ArticleSearchService 向社区客户端提供公开文章关键词搜索。
  name: ArticleSearchService
- description: ArticleService 提供 BBS 文章接口
  name: ArticleService
- description: 服务定义。
  name: AssetService
- description: 认证接口。
  name: AuthService
- description: BadgeService 向社区客户端提供徽章预览与设计草稿管理。
  name: BadgeService
- description: 评论接口。
  name: CommentService
- description: 领域 HTTP 接口。
  name: DomainService
- description: EmojiService 提供当前登录账号的 IM 表情分组 HTTP 接口。
  name: EmojiService
- description: 服务定义。
  name: GlobalChatService
- description: 节假日服务。
  name: HolidayService
- description: LivenessService 提供当前业务日活跃度查询和前一日活跃奖励领取入口。
  name: LivenessService
- description: 平台地理数据接口。
  name: LocationService
- description: MoonbreezeService 提供社区短动态入口。
  name: MoonbreezeService
- description: 通知接口。
  name: NotificationService
- description: OTP 接口。
  name: OtpService
- description: PostscriptService 提供 BBS 文章附言接口。
  name: PostscriptService
- description: 账号偏好设置接口。
  name: PreferencesService
- description: 账号隐私设置接口。
  name: PrivacySettingService
- description: 服务定义。
  name: PrivateChatService
- description: 服务定义。
  name: RealtimeService
- description: 账号关系接口。
  name: RelationService
- description: 标签 HTTP 接口。
  name: TagService
paths:
  /v1/asset/badge-font/complete:
