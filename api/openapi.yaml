  /v1/badge/maker/render:
    get:
      description: RenderMaker 仅允许已登录用户预览其提交的完整 Maker 参数。
      operationId: BadgeService_RenderMakerBadge
      parameters:
      - description: Platform 已确认可用的徽章图标资源 ID。
        explode: true
        in: query
        name: render_spec.image_asset_id
        required: false
        schema:
          type: string
        style: form
      - description: 文字条内容。
        explode: true
        in: query
        name: render_spec.text
        required: false
        schema:
          type: string
        style: form
      - description: 背景颜色列表。
        explode: true
        in: query
        name: render_spec.background_colors
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: 文字颜色列表。
        explode: true
        in: query
        name: render_spec.text_colors
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: 背景渐变方向或角度。
        explode: true
        in: query
        name: render_spec.background_direction
        required: false
        schema:
          type: string
        style: form
      - description: 文字渐变方向或角度。
        explode: true
        in: query
        name: render_spec.text_direction
        required: false
        schema:
          type: string
        style: form
      - description: 图标边长。
        explode: true
        in: query
        name: render_spec.size
        required: false
        schema:
          format: uint32
          type: integer
        style: form
      - description: 图标边距。
        explode: true
        in: query
        name: render_spec.border
        required: false
        schema:
          format: uint32
          type: integer
        style: form
      - description: 文字条长度。
        explode: true
        in: query
        name: render_spec.text_bar_length
        required: false
        schema:
          format: uint32
          type: integer
        style: form
      - description: 文字字号。
        explode: true
        in: query
        name: render_spec.text_size
        required: false
        schema:
          format: uint32
          type: integer
        style: form
      - description: 文字条圆角。
        explode: true
        in: query
        name: render_spec.text_bar_radius
        required: false
        schema:
          format: uint32
          type: integer
        style: form
      - description: 整体缩放比例。
        explode: true
        in: query
        name: render_spec.scale
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: 阴影强度。
        explode: true
        in: query
        name: render_spec.shadow
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: 动画时长。
        explode: true
        in: query
        name: render_spec.animation_seconds
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Platform 已确认可用的自定义字体资源 ID。
        explode: true
        in: query
        name: render_spec.font_asset_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderMakerBadge_Resp"
          description: OK
      tags:
      - BadgeService
      x-accepts:
      - application/json
