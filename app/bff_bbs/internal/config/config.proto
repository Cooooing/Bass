syntax = "proto3";
package kratos.api.bff_bbs.config;

import "common/config.proto";

option go_package = "bff_bbs/internal/config;config";

message Bootstrap {
  common.api.app.common.Server server = 1;
  common.api.app.common.HTTP http = 2;
  common.api.app.common.GRPC grpc = 3;
  common.api.app.common.Consul consul = 4;
  common.api.app.common.Redis redis = 6;
  common.api.app.common.Trace trace = 8;
  common.api.app.common.Observability observability = 9;
  Business business = 10;

  message Business {
    PublicEndpoint public_endpoint = 1;
    BadgeMakerUpload badge_maker_upload = 2;

    message PublicEndpoint {
      string api_url = 1;
      string site_url = 2;
    }

    // BadgeMakerUpload 限制 Maker 图片与字体的单文件直传大小；热更新后仅影响后续上传校验。
    message BadgeMakerUpload {
      int64 max_image_bytes = 1; // 图片最大字节数；非正值使用 3 MiB 默认值。
      int64 max_font_bytes = 2; // 字体最大字节数；非正值使用 3 MiB 默认值。
    }
  }
}
