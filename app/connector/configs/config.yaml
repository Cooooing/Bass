server:
  name: connector-service
  version: 1.0.0
  mode: dev
  http:
    host: 0.0.0.0
    port: 8009
    timeout: 5s
  grpc:
    host: 0.0.0.0
    port: 9009
    timeout: 5s
  cluster: false # 是否集群模式
  key: main # 节点 key
  master_url: "127.0.0.1:8000" # 主服务地址
data:
  redis:
    addr: 127.0.0.1:16379
    password: "123456"
    dial_timeout: 5s
    db: 0
    read_timeout: 5s
    write_timeout: 5s
    pool_size: 150
    min_idle_conns: 30
    pool_timeout: 2s
    conn_max_idle_time: 600s
    conn_max_life_time: 1800s
trace:
  enable_otel: false # 是否采集上报到 otel
  endpoint: "127.0.0.1:4317"  # OTel Collector 地址
  insecure: true
  sampler: 1  # 100% 采样率
