syntax = "proto3";
package kratos.api.bootstrap;

option go_package = "connector/internal/conf/bootstrap;bootstrap";

import "google/protobuf/duration.proto";

message Bootstrap {
  string name = 1;
  string version = 2;
  string mode = 3;

  Registry registry = 4;
  Config config = 5;
  Log log = 6;
}

message Registry {
  message Consul {
    string address = 1;
    string token = 2;
  }
  Consul consul = 1;
}

message Config {
  string path = 1;
}

message Log {
  bool enable = 1;
  string level = 2; // debug, info, warn, error, fatal, panic
  string file = 3;
}