syntax = "proto3";
package kratos.api.conf;

option go_package = "connector/internal/conf/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  string register_address = 4;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  string cluster = 7;
  string key = 8;
  string master_url = 9;
}

message Data {
  Redis redis = 2;
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    google.protobuf.Duration dial_timeout = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
    int32 pool_size = 7;
    int32 min_idle_conns = 8;
    google.protobuf.Duration pool_timeout = 9;
    google.protobuf.Duration conn_max_idle_time = 10;
    google.protobuf.Duration conn_max_life_time = 11;
  }
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}
