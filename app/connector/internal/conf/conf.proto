syntax = "proto3";
package kratos.api.conf;

option go_package = "connector/internal/conf/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Registry registry = 3;
  Trace trace = 4;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 4;
  GRPC grpc = 5;
  bool cluster = 6;
  string key = 7;
  string master_url = 8;
}

message Data {
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    google.protobuf.Duration dial_timeout = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
    int32 pool_size = 7;
    int32 min_idle_conns = 8;
    google.protobuf.Duration pool_timeout = 9;
    google.protobuf.Duration conn_max_idle_time = 10;
    google.protobuf.Duration conn_max_life_time = 11;
  }
  Redis redis = 2;
}

message Registry {
  message Consul {
    string address = 1;
    string datacenter = 2;
    string token = 3;
    google.protobuf.Duration dial_timeout = 4;
  }
  Consul consul = 1;
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}