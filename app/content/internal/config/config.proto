syntax = "proto3";
package kratos.api.content.config;

import "common/config.proto";
option go_package = "content/internal/config;config";

message Bootstrap {
  common.api.app.common.Server server = 1;
  common.api.app.common.HTTP http = 2;
  common.api.app.common.GRPC grpc = 3;
  common.api.app.common.Consul consul = 4;
  common.api.app.common.Database database = 5;
  common.api.app.common.Redis redis = 6;
  common.api.app.common.Nats nats = 7;
  common.api.app.common.DTM dtm = 10;
  common.api.app.common.Trace trace = 8;
  common.api.app.common.Observability observability = 9;
  Business business = 21;
}

message Business {
  Article article = 1;
  Comment comment = 2;

  message Article {
    int64 thank_points = 3; // 感谢文章时转赠的积分数量。
    int64 reward_setup_points = 4; // 发布含打赏区文章时扣除的积分数量。
  }
  message Comment {
    int64 thank_points = 1; // 感谢评论时转赠的积分数量。
  }
}
