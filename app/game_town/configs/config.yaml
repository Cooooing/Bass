server:
  name: game_town
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}
http:
  network: tcp
  host: ${HTTP_HOST:0.0.0.0}
  port: ${HTTP_PORT:8105}
  timeout: 5s
grpc:
  network: tcp
  host: ${GRPC_HOST:0.0.0.0}
  port: ${GRPC_PORT:9105}
  timeout: 5s
consul:
  address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
  datacenter: dc1
  token: ${CONSUL_ACL_APP_TOKEN:token}
  dial_timeout: 5s
database:
  driver: postgres
  source: postgresql://${POSTGRES_USER:admin}:${POSTGRES_PASSWORD:123456}@${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bass}?sslmode=disable
  merge: true
  debug: false
  slow_sql_threshold: 1s
  sample_rate: 1
trace:
  enable_otel: false
  endpoint: ${OTEL_ENDPOINT:127.0.0.1:4317}
  insecure: true
  sampler: 1
observability:
  enable_metrics: true
game_town:
  agent:
    global_concurrency: 4
    model_concurrency: 2
    world_concurrency: 2
    max_retry: 2
    retry_base_delay: 5s
    tick_interval: ${GAME_TOWN_TICK_INTERVAL:60s}
    recent_event_limit: 20
  world:
    max_npc_count: 12
    max_location_count: 20
    time_scale: 24
    max_catch_up_changes: 100
  memory:
    embedding_enabled: false
    base_url: http://192.168.100.10:31434
    model: bge-m3
    dimensions: 1024
    timeout: 30s
    candidate_limit: 32
    result_limit: 8
