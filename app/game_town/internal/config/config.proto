syntax = "proto3";
package kratos.api.config;

import "common/config.proto";
import "google/protobuf/duration.proto";

option go_package = "game_town/internal/config;config";

message Bootstrap {
  common.api.app.common.Server server = 1;
  common.api.app.common.HTTP http = 2;
  common.api.app.common.GRPC grpc = 3;
  common.api.app.common.Consul consul = 4;
  common.api.app.common.Database database = 5;
  common.api.app.common.Trace trace = 6;
  common.api.app.common.Observability observability = 7;
  GameTown game_town = 21;
}

message GameTown {
  Agent agent = 1;
  World world = 2;
  Memory memory = 3;
}

message Agent {
  uint32 global_concurrency = 1;
  uint32 model_concurrency = 2;
  uint32 world_concurrency = 3;
  uint32 max_retry = 4;
  google.protobuf.Duration retry_base_delay = 5;
  google.protobuf.Duration tick_interval = 6;
  uint32 recent_event_limit = 7;
}

message World {
  uint32 max_npc_count = 1;
  uint32 max_location_count = 2;
  uint32 time_scale = 3;
  uint32 max_catch_up_changes = 4;
}

message Memory {
  bool embedding_enabled = 1;
  string base_url = 2;
  string model = 3;
  uint32 dimensions = 4;
  google.protobuf.Duration timeout = 5;
  uint32 candidate_limit = 6;
  uint32 result_limit = 7;
}
