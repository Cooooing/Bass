server:
  name: gateway
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}
  http:
    host: ${HTTP_HOST:0.0.0.0}
    port: ${HTTP_PORT:8000}
    timeout: 5s
  grpc:
    host: ${GRPC_HOST:0.0.0.0}
    port: ${GRPC_PORT:9000}
    timeout: 5s
  oss:
    minio:

    qiniu:
      access_key: L8l6DGiYXzmx0IVT0GpIxI-Mj8LqfoIKF6iAnrWa
      secret_key: qY6ohp-qZEtd20NZN94o7TScg3IeEGSZe-ZRsVXW
  ip_data:
    enable: true
    ipv4_xdb_path: ./configs/ip2region_v4.xdb
    ipv6_xdb_path: ./configs/ip2region_v6.xdb
data:
  database:
    driver: postgres
    source: postgresql://${POSTGRES_USER:admin}:${POSTGRES_PASSWORD:123456}@${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bass}?sslmode=disable # postgresql://<user>:<pass>@<host>/<database>
    merge: true # 是否同步表到数据库
  redis:
    addr: ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    dial_timeout: 5s
    db: 0
    read_timeout: 5s
    write_timeout: 5s
    pool_size: 150
    min_idle_conns: 30
    pool_timeout: 2s
    conn_max_idle_time: 600s
    conn_max_life_time: 1800s
  nats:
    url: ${NATS_URL:nats://127.0.0.1:4222}
    name: nats-client
    timeout: 5s
    max_reconnects: 10
    reconnect_wait: 2s
    ping_interval: 30s
    flusher_timeout: 5s
    enable_jet_stream: false
    stream_name: ""
    jet_stream_domain: ""
  consul:
    address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
    datacenter: dc1
    token: ${CONSUL_ACL_APP_TOKEN:token}
    dial_timeout: 5s
trace:
  enable_otel: false # 是否采集上报到 otel
  endpoint: 127.0.0.1:4317  # OTel Collector 地址
  insecure: true
  sampler: 1  # 100% 采样率