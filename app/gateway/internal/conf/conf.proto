syntax = "proto3";
package kratos.api.conf;

import "google/protobuf/duration.proto";
import "common/api/app/common/config.proto";

option go_package = "user/internal/conf/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  Oss oss = 7;
  message Oss {
    Minio minio = 1;
    message Minio {}
    Qiniu qiniu = 2;
    message Qiniu {
      string access_key = 1;
      string secret_key = 2;
    }
  }
  IpData ip_data = 8;
  message IpData {
    bool enable = 1;
    string ipv4_xdb_path = 2;
    string ipv6_xdb_path = 3;
  }
}

message Data {
  common.api.app.common.Database database = 1;
  common.api.app.common.Redis redis = 2;
  common.api.app.common.Consul consul = 3;
  common.api.app.common.RabbitMQ rabbitmq = 4;
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}
