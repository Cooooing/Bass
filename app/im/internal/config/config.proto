syntax = "proto3";
package kratos.api.im.config.v1;

import "common/v1/config.proto";
import "google/protobuf/duration.proto";

option go_package = "im/internal/config;config";

// 服务启动配置。
message Bootstrap {
  // 服务基础信息配置。
  common.api.app.common.v1.Server server = 1;
  // HTTP 服务配置。
  common.api.app.common.v1.HTTP http = 2;
  // gRPC 服务配置。
  common.api.app.common.v1.GRPC grpc = 3;
  // Consul 服务发现配置。
  common.api.app.common.v1.Consul consul = 4;
  // 数据库配置。
  common.api.app.common.v1.Database database = 5;
  // Redis 配置。
  common.api.app.common.v1.Redis redis = 6;
  // NATS 配置。
  common.api.app.common.v1.Nats nats = 7;
  // DTM 分布式事务配置。
  common.api.app.common.v1.DTM dtm = 10;
  // 链路追踪配置。
  common.api.app.common.v1.Trace trace = 8;
  // 可观测性配置。
  common.api.app.common.v1.Observability observability = 9;
  // 业务运行配置。
  Business business = 21;
}

// Business 是即时消息领域的业务运行参数。
message Business {
  // 表情分组分享码的有效期，例如 604800s 表示 7d。
  google.protobuf.Duration emoji_share_ttl = 1;
  // 设置全局聊天室话题消耗的积分。
  int64 global_chat_topic_points = 2;
  // 同一账号设置全局聊天室话题的限流间隔。
  google.protobuf.Duration global_chat_topic_user_interval = 3;
  // 全局聊天室话题设置的限流间隔。
  google.protobuf.Duration global_chat_topic_global_interval = 4;
  // 发送全局聊天室弹幕消耗的积分。
  int64 global_chat_barrage_points = 5;
  // 同一账号发送全局聊天室弹幕的限流间隔。
  google.protobuf.Duration global_chat_barrage_user_interval = 6;
}
