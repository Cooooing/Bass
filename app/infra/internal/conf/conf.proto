syntax = "proto3";
package kratos.api.conf;

option go_package = "infra/internal/conf/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Registry registry = 3;
  Trace trace = 4;
  Oss oss = 5;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 4;
  GRPC grpc = 5;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
    bool merge = 3;
  }
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    google.protobuf.Duration dial_timeout = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
    int32 pool_size = 7;
    int32 min_idle_conns = 8;
    google.protobuf.Duration pool_timeout = 9;
    google.protobuf.Duration conn_max_idle_time = 10;
    google.protobuf.Duration conn_max_life_time = 11;
  }
  message RabbitMQ {
    string url = 1;
    google.protobuf.Duration heartbeat = 2;
    google.protobuf.Duration dial_timeout = 3;
    int32 prefetch_count = 4;
    bool prefetch_global = 5;
    int32 delivery_mode = 6;
    bool auto_ack = 7;
  }
  Database database = 1;
  Redis redis = 2;
  RabbitMQ rabbitmq = 3;
}

message Registry {
  message Consul {
    string address = 1;
    string datacenter = 2;
    string token = 3;
    google.protobuf.Duration dial_timeout = 4;
  }
  Consul consul = 1;
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}

message Oss{
  string provider = 1;
  message Qiniu{
    string access_key = 1;
    string secret_key = 2;
    string bucket = 3;
    google.protobuf.Duration timeout = 4;
    int64 size_min = 5;
    int64 size_max = 6;
    string callback_url = 7;
    bool increment_audit = 8;
    string increment_audit_callback_url = 9;
  }
  Qiniu qiniu = 10;
  message Minio{
  }
  Minio minio = 11;
}
