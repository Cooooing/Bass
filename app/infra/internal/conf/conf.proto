syntax = "proto3";
package kratos.api.conf;

import "google/protobuf/duration.proto";

option go_package = "infra/internal/conf/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  Oss oss = 7;
  message Oss {
    string provider = 1;
    message Qiniu {
      string access_key = 1;
      string secret_key = 2;
      string bucket = 3;
      google.protobuf.Duration timeout = 4;
      int64 size_min = 5;
      int64 size_max = 6;
      string callback_url = 7;
      bool increment_audit = 8;
      string increment_audit_callback_url = 9;
    }
    Qiniu qiniu = 10;
    message Minio {}
    Minio minio = 11;
  }
  Email email = 8;
  message Email {
    bool enable = 1; // 是否启用邮件
    string smtp_host = 2; // SMTP 服务器地址
    uint32 smtp_port = 3; // SMTP 端口
    string username = 4; // SMTP 用户名
    string password = 5; // SMTP 密码
    string from = 6; // 发件人邮箱
  }
  Sms sms = 9;
  message Sms {
    string provider = 1;
    message TencentSmsConfig {
      string secret_id = 1;
      string secret_key = 2;
      string diyu = 3;
      string sms_sdk_app_id = 4;
      string sign_name = 5;
      string template_id = 6;
    }
    TencentSmsConfig tencent = 2;
  }
}

message Data {
  Database database = 1;
  message Database {
    string driver = 1;
    string source = 2;
    bool merge = 3;
  }
  Redis redis = 2;
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    google.protobuf.Duration dial_timeout = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
    int32 pool_size = 7;
    int32 min_idle_conns = 8;
    google.protobuf.Duration pool_timeout = 9;
    google.protobuf.Duration conn_max_idle_time = 10;
    google.protobuf.Duration conn_max_life_time = 11;
  }
  RabbitMQ rabbitmq = 3;
  message RabbitMQ {
    string url = 1;
    google.protobuf.Duration heartbeat = 2;
    google.protobuf.Duration dial_timeout = 3;
    int32 prefetch_count = 4;
    bool prefetch_global = 5;
    int32 delivery_mode = 6;
    bool auto_ack = 7;
  }
  Consul consul = 4;
  message Consul {
    string address = 1;
    string datacenter = 2;
    string token = 3;
    google.protobuf.Duration dial_timeout = 4;
  }
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}
