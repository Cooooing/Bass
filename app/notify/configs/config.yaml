server:
  name: notify
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}
  http:
    host: ${HTTP_HOST:0.0.0.0}
    port: ${HTTP_PORT:8004}
    timeout: 5s
  grpc:
    host: ${GRPC_HOST:0.0.0.0}
    port: ${GRPC_PORT:9004}
    timeout: 5s
  email:
    enable: true
    smtp_host: ${EMAIL_SMTP_HOST:smtp.qq.com}
    smtp_port: ${EMAIL_SMTP_PORT:465}
    username: ${EMAIL_USERNAME:example}
    password: ${EMAIL_PASSWORD:example}
    from_email: ${EMAIL_FROM_EMAIL:example@example.com}
    from_name: ${EMAIL_FROM_NAME:example}
  sms:
    enable: false
    provider: tencent
    tencent:
      secret_id: ${TENCENT_SMS_SECRET_ID:}
      secret_key: ${TENCENT_SMS_SECRET_KEY:}
      diyu: ap-beijing
      sms_sdk_app_id: ${TENCENT_SMS_APP_ID:}
      sign_name: ${TENCENT_SMS_SIGN_NAME:}
      template_id: ${TENCENT_SMS_TEMPLATE_ID:}
  lark_webhook:
    base_url: ${LARK_WEBHOOK_BASE_URL:https://open.larksuite.com/open-apis/bot/v2/hook/}
    timeout: 10s
  notification_rate_limit:
    enable: true
    window: 300s
    max_count: 2
  oss:
    provider: qiniu
    minio:
    qiniu:
      access_key: ${QINIU_ACCESS_KEY:}
      secret_key: ${QINIU_SECRET_KEY:}
      bucket: ${QINIU_BUCKET:bass-test}
      timeout: 300s
      size_min: 0
      size_max: 20
      callback_url: ${QINIU_CALLBACK_URL:}
data:
  database:
    driver: postgres
    source: postgresql://${POSTGRES_USER:admin}:${POSTGRES_PASSWORD:123456}@${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bass}?sslmode=disable # 数据库连接串模板
    merge: true # 是否同步表到数据库
  redis:
    addr: ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    dial_timeout: 5s
    db: 0
    read_timeout: 5s
    write_timeout: 5s
    pool_size: 150
    min_idle_conns: 30
    pool_timeout: 2s
    conn_max_idle_time: 600s
    conn_max_life_time: 1800s
  nats:
    host: ${NATS_HOST:127.0.0.1}
    port: ${NATS_PORT:4222}
    user: ${NATS_USER:admin}
    password: ${NATS_PASSWORD:123456}
    name: nats-client
    timeout: 5s
    max_reconnects: 10
    reconnect_wait: 2s
    ping_interval: 30s
    flusher_timeout: 5s
    enable_jet_stream: false
    stream_name: ""
    jet_stream_domain: ""
  consul:
    address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
    datacenter: dc1
    token: ${CONSUL_ACL_APP_TOKEN:token}
    dial_timeout: 5s
trace:
  enable_otel: true # 是否采集并上报链路数据
  endpoint: ${OTEL_ENDPOINT:127.0.0.1:4317}  # OTel Collector 地址
  insecure: true
  sampler: 1  # 100% 采样率
