server:
  name: notify
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}
  http:
    host: ${HTTP_HOST:0.0.0.0}
    port: ${HTTP_PORT:8004}
    timeout: 5s
  grpc:
    host: ${GRPC_HOST:0.0.0.0}
    port: ${GRPC_PORT:9004}
    timeout: 5s
  email:
    enable: true
    smtp_host: smtp.qq.com
    smtp_port: 465
    username: example
    password: example
    from: example@example.com
  sms:
    provider: 
data:
  database:
    driver: postgres
    source: postgresql://${POSTGRES_USER:admin}:${POSTGRES_PASSWORD:123456}@${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bass}?sslmode=disable # postgresql://<user>:<pass>@<host>/<database>
    merge: true # 是否同步表到数据库
  redis:
    addr: ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    dial_timeout: 5s
    db: 0
    read_timeout: 5s
    write_timeout: 5s
    pool_size: 150
    min_idle_conns: 30
    pool_timeout: 2s
    conn_max_idle_time: 600s
    conn_max_life_time: 1800s
  rabbitmq:
    url: amqp://${RABBITMQ_DEFAULT_USER:admin}:${RABBITMQ_DEFAULT_PASS:123456}@${RABBITMQ_HOST:127.0.0.1}:${RABBITMQ_PORT:5672}/${RABBITMQ_DEFAULT_VHOST:admin_vhost}
    heartbeat: 10s            # 心跳，秒
    dial_timeout: 5s          # 连接超时，秒
    prefetch_count: 10        # Qos，未确认消息最大数量
    prefetch_global: false    # Qos 是否全局
    delivery_mode: 2          # 消息持久化 1: transient, 2: persistent
    auto_ack: false           # 是否自动确认消息
  consul:
    address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
    datacenter: dc1
    token: ${CONSUL_ACL_APP_TOKEN:token}
    dial_timeout: 5s
trace:
  enable_otel: false # 是否采集上报到 otel
  endpoint: 127.0.0.1:4317  # OTel Collector 地址
  insecure: true
  sampler: 1  # 100% 采样率