syntax = "proto3";
package kratos.api.conf;

import "common/config.proto";
import "google/protobuf/duration.proto";

option go_package = "platform/internal/conf/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  common.api.app.common.Trace trace = 3;
  common.api.app.common.Observability observability = 7;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  IpData ip_data = 7;
  message IpData {
    bool enable = 1;
    string ipv4_xdb_path = 2;
    string ipv6_xdb_path = 3;
  }
  Oss oss = 8;
  message Oss {
    string provider = 1;
    message Qiniu {
      string access_key = 1;
      string secret_key = 2;
      string bucket = 3;
      google.protobuf.Duration timeout = 4;
      int64 size_min = 5;
      int64 size_max = 6;
      string callback_url = 7;
      bool increment_audit = 8;
      string increment_audit_callback_url = 9;
    }
    Qiniu qiniu = 10;
    message Minio {}
    Minio minio = 11;
  }
}

message Data {
  common.api.app.common.Database database = 1;
  common.api.app.common.Redis redis = 2;
  common.api.app.common.Consul consul = 3;
  common.api.app.common.Nats nats = 4;
}
