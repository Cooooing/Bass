syntax = "proto3";
package kratos.api.conf;

import "common/config.proto";
import "google/protobuf/duration.proto";

option go_package = "push_hub/internal/conf/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  common.api.app.common.Trace trace = 3;
  common.api.app.common.Observability observability = 4;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
}
message Data {
  common.api.app.common.Redis redis = 2;
  common.api.app.common.Consul consul = 3;
  common.api.app.common.Nats nats = 4;
}
