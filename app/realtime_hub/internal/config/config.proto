syntax = "proto3";
package kratos.api.realtime_hub.config;

import "common/v1/config.proto";
import "google/protobuf/duration.proto";

option go_package = "realtime_hub/internal/config;config";
message Bootstrap {
  common.api.app.common.v1.Server server = 1;
  common.api.app.common.v1.HTTP http = 2;
  common.api.app.common.v1.GRPC grpc = 3;
  common.api.app.common.v1.Consul consul = 4;
  common.api.app.common.v1.Redis redis = 5;
  common.api.app.common.v1.Nats nats = 6;
  common.api.app.common.v1.Trace trace = 7;
  common.api.app.common.v1.Observability observability = 8;
  Business business = 9;
}

message Business {
  google.protobuf.Duration connection_lease = 1; // 节点和连接登记租期
}
