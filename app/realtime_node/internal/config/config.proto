syntax = "proto3";

package kratos.api.realtime_node.config;

import "common/config.proto";

option go_package = "realtime_node/internal/config;config";

message Bootstrap {
  common.api.app.common.Server server = 1;
  common.api.app.common.HTTP http = 2;
  common.api.app.common.GRPC grpc = 3;
  common.api.app.common.Consul consul = 4;
  common.api.app.common.Trace trace = 5;
  common.api.app.common.Observability observability = 6;
}
