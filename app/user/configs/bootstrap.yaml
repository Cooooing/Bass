server:
  name: user-service
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}

config:
  consul:
    address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
    token: ${CONSUL_ACL_APP_TOKEN:token}
    path: config/user-service/${SERVICE_MODE:dev}.yaml
    timeout: 5s

log:
  level: ${LOG_LEVEL:debug}
  file: ${LOG_FILE:}