server:
  name: user
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}
http:
  network: tcp
  host: ${HTTP_HOST:0.0.0.0}
  port: ${HTTP_PORT:8101}
  timeout: 5s
grpc:
  network: tcp
  host: ${GRPC_HOST:0.0.0.0}
  port: ${GRPC_PORT:9101}
  timeout: 5s
consul:
  address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
  datacenter: dc1
  token: ${CONSUL_ACL_APP_TOKEN:token}
  dial_timeout: 5s
database:
  driver: postgres
  source: postgresql://${POSTGRES_USER:admin}:${POSTGRES_PASSWORD:123456}@${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bass}?sslmode=disable
  merge: true
  debug: false
  slow_sql_threshold: 1s
  sample_rate: 1
redis:
  addr: ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:"123456"}
  dial_timeout: 5s
  db: 0
  read_timeout: 5s
  write_timeout: 5s
  pool_size: 150
  min_idle_conns: 30
  pool_timeout: 2s
  conn_max_idle_time: 600s
  conn_max_life_time: 1800s
nats:
  host: ${NATS_HOST:127.0.0.1}
  port: ${NATS_PORT:4222}
  user: ${NATS_USER:admin}
  password: ${NATS_PASSWORD:"123456"}
  name: nats-user
  timeout: 5s
  max_reconnects: 10
  reconnect_wait: 2s
  ping_interval: 30s
  flusher_timeout: 5s
  enable_jet_stream: false
  stream_name: ""
  jet_stream_domain: ""
trace:
  enable_otel: false
  endpoint: ${OTEL_ENDPOINT:127.0.0.1:4317}
  insecure: true
  sampler: 1
observability:
  enable_metrics: true
alert:
  lark_webhook:
    base_url: ${ALERT_LARK_BASE_URL:https://open.larksuite.com/open-apis/bot/v2/hook/}
    token: ${ALERT_LARK_TOKEN:}
    secret: ${ALERT_LARK_SECRET:}
    timeout: 10s
event:
  outbox:
    max_retry: 10
    publish_timeout: 300s
    poll_lock_ttl: 60s
    publish_limit: 1000
    min_poll_interval: 1s
    max_poll_interval: 8s
  dead_letter:
    enable_alert: false
    scan_interval: 60s
    alert_dedup_window: 3600s
business:
  app: FishPi
  avatar: https://treble.sxisa.com/api/user/v1/user/avatar/%s
  jwt:
    secret: ${USER_JWT_SECRET:your-jwt-secret-here}
    expires: 864000s
    email_expire: 300s
    phone_expire: 300s
