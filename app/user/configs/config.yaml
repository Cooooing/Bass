server:
  name: user
  version: 1.0.0
  mode: ${SERVICE_MODE:dev}
http:
  network: tcp
  host: ${HTTP_HOST:0.0.0.0}
  port: ${HTTP_PORT:8101}
  timeout: 5s
grpc:
  network: tcp
  host: ${GRPC_HOST:0.0.0.0}
  port: ${GRPC_PORT:9101}
  timeout: 5s
consul:
  address: ${CONSUL_HOST:127.0.0.1}:${CONSUL_PORT:8500}
  datacenter: dc1
  token: ${CONSUL_ACL_APP_TOKEN:token}
  dial_timeout: 5s
database:
  driver: postgres
  source: postgresql://${POSTGRES_USER:admin}:${POSTGRES_PASSWORD:123456}@${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bass}?sslmode=disable
  merge: true
  debug: false
  slow_sql_threshold: 1s
  sample_rate: 1
redis:
  addr: ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:"123456"}
  dial_timeout: 5s
  db: 0
  read_timeout: 5s
  write_timeout: 5s
  pool_size: 10
  min_idle_conns: 1
  pool_timeout: 2s
  conn_max_idle_time: 300s
  conn_max_life_time: 900s
nats:
  host: ${NATS_HOST:127.0.0.1}
  port: ${NATS_PORT:4222}
  user: ${NATS_USER:admin}
  password: ${NATS_PASSWORD:"123456"}
  name: nats-user
  timeout: 5s
  max_reconnects: 10
  reconnect_wait: 2s
  ping_interval: 30s
  flusher_timeout: 5s
  enable_jet_stream: false
  stream_name: ""
  jet_stream_domain: ""
dtm:
  grpc_endpoint: ${DTM_GRPC_ENDPOINT:127.0.0.1:36790}
  timeout: 5s
  tcc_timeout_to_fail: 30s
  retry_interval: 1s
trace:
  enable_otel: false
  endpoint: ${OTEL_ENDPOINT:127.0.0.1:4317}
  insecure: true
  sampler: 1
observability:
  enable_metrics: true
business:
  app: FishPi
  avatar: https://treble.sxisa.com/api/user/v1/user/avatar/%s
  auth:
    session:
      secret: ${USER_JWT_SECRET:your-jwt-secret-here}
      access_token_ttl: 2592000s # 30d
      refresh_token_ttl: 2592000s # 30d
      session_ttl: 15552000s # 180d
      max_sessions: 5 # 同一用户同一 realm 最多保留 5 个 session
    verification_code:
      code_ttl: 300s # 5min
      max_attempts: 5
    totp:
      temporary_secret_ttl: 300s # 5min
  liveness:
    checkin:
      minimum_score: 30
      reward_minimum: 10
      reward_maximum: 50
      streak_interval: 10
      streak_reward: 100
    score:
      maximum: 300
      article:
        limit: 1
        count_per_unit: 1
        points_per_unit: 15
      comment:
        limit: 5
        count_per_unit: 1
        points_per_unit: 5
      like:
        limit: 2
        count_per_unit: 1
        points_per_unit: 5
      thank:
        count_per_unit: 1
        points_per_unit: 5
      reward:
        count_per_unit: 1
        points_per_unit: 10
      view:
        limit: 5
        count_per_unit: 2
        points_per_unit: 1
      global_chat_message:
        limit: 20
        count_per_unit: 1
        points_per_unit: 5
