syntax = "proto3";
package kratos.api.conf;

import "google/protobuf/duration.proto";

option go_package = "user/internal/conf/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  string app = 7;
  string avatar = 8;
  Jwt jwt = 9;
  message Jwt {
    string secret = 1;
    google.protobuf.Duration expires = 2;
    google.protobuf.Duration email_expire = 3;
    google.protobuf.Duration phone_expire = 4;
  }
}

message Data {
  Database database = 1;
  message Database {
    string driver = 1;
    string source = 2;
    bool merge = 3;
  }
  Redis redis = 2;
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    google.protobuf.Duration dial_timeout = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
    int32 pool_size = 7;
    int32 min_idle_conns = 8;
    google.protobuf.Duration pool_timeout = 9;
    google.protobuf.Duration conn_max_idle_time = 10;
    google.protobuf.Duration conn_max_life_time = 11;
  }
  RabbitMQ rabbitmq = 3;
  message RabbitMQ {
    string url = 1;
    google.protobuf.Duration heartbeat = 2;
    google.protobuf.Duration dial_timeout = 3;
    int32 prefetch_count = 4;
    bool prefetch_global = 5;
    int32 delivery_mode = 6;
    bool auto_ack = 7;
  }
  Consul consul = 4;
  message Consul {
    string address = 1;
    string datacenter = 2;
    string token = 3;
    google.protobuf.Duration dial_timeout = 4;
  }
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}
