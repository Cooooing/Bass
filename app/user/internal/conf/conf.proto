syntax = "proto3";
package kratos.api.conf;

import "common/config.proto";
import "google/protobuf/duration.proto";

option go_package = "user/internal/conf/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Trace trace = 3;
}

message Server {
  string name = 1;
  string version = 2;
  string mode = 3;
  HTTP http = 5;
  message HTTP {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  GRPC grpc = 6;
  message GRPC {
    string network = 1;
    string host = 2;
    int32 port = 3;
    google.protobuf.Duration timeout = 4;
  }
  string app = 7;
  string avatar = 8;
  Jwt jwt = 9;
  message Jwt {
    string secret = 1;
    google.protobuf.Duration expires = 2;
    google.protobuf.Duration email_expire = 3;
    google.protobuf.Duration phone_expire = 4;
  }
}

message Data {
  common.api.app.common.Database database = 1;
  common.api.app.common.Redis redis = 2;
  common.api.app.common.Consul consul = 3;
  common.api.app.common.Nats nats = 4;
}

message Trace {
  bool enable_otel = 1;
  string endpoint = 2;
  bool insecure = 3;
  double sampler = 4;
}
