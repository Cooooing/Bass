syntax = "proto3";
package kratos.api.conf;

import "common/config.proto";
import "google/protobuf/duration.proto";

option go_package = "user/internal/conf/conf;conf";

message Bootstrap {
  common.api.app.common.Server server = 1;
  Data data = 2;
  common.api.app.common.Trace trace = 3;
  common.api.app.common.Event event = 4;
  common.api.app.common.Alert alert = 5;
  common.api.app.common.Observability observability = 6;
  common.api.app.common.HTTP http = 7;
  common.api.app.common.GRPC grpc = 8;
  Business business = 9;
}

message Business {
  string app = 1;
  string avatar = 2;
  Jwt jwt = 3;

  message Jwt {
    string secret = 1;
    google.protobuf.Duration expires = 2;
    google.protobuf.Duration email_expire = 3;
    google.protobuf.Duration phone_expire = 4;
  }
}

message Data {
  common.api.app.common.Database database = 1;
  common.api.app.common.Redis redis = 2;
  common.api.app.common.Consul consul = 3;
  common.api.app.common.Nats nats = 4;
}
