syntax = "proto3";
package kratos.api.config;

import "common/config.proto";
import "google/protobuf/duration.proto";

option go_package = "user/internal/config;config";

message Bootstrap {
  common.api.app.common.Server server = 1;
  common.api.app.common.HTTP http = 2;
  common.api.app.common.GRPC grpc = 3;
  common.api.app.common.Consul consul = 4;
  common.api.app.common.Database database = 5;
  common.api.app.common.Redis redis = 6;
  common.api.app.common.Nats nats = 7;
  common.api.app.common.Trace trace = 8;
  common.api.app.common.Observability observability = 9;
  common.api.app.common.Alert alert = 10;
  common.api.app.common.Event event = 11;
  Business business = 21;
}

message Business {
  string app = 1; // TOTP issuer 和默认应用名。
  string avatar = 2; // 默认头像 URL 模板。
  Auth auth = 3; // 认证、会话和验证码配置。

  message Auth {
    Session session = 1; // token 与会话配置。
    VerificationCode verification_code = 2; // 邮箱/手机验证码配置。
    Totp totp = 3; // TOTP 配置。
  }

  message Session {
    string secret = 1; // access/refresh JWT 签名密钥。
    google.protobuf.Duration access_token_ttl = 2; // access token 有效期，例如 900s 表示 15min。
    google.protobuf.Duration refresh_token_ttl = 3; // refresh token 空闲有效期，例如 2592000s 表示 30d。
    google.protobuf.Duration session_ttl = 4; // session 最长生命周期，例如 15552000s 表示 180d。
    int32 max_sessions = 5; // 同一用户同一 realm 最大 session 数，未配置或小于等于 0 时默认 5。
  }

  message VerificationCode {
    google.protobuf.Duration code_ttl = 1; // 验证码有效期，例如 300s 表示 5min。
    google.protobuf.Duration resend_interval = 2; // 同账号重复发送间隔，例如 60s 表示 1min。
    int32 max_attempts = 3; // 单个验证码最大校验次数。
    reserved 4;
  }

  message Totp {
    google.protobuf.Duration temporary_secret_ttl = 1; // 启用 TOTP 临时密钥有效期，例如 300s 表示 5min。
  }
}