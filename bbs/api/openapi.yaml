openapi: 3.0.3
info:
  description: Bass 社区 HTTP/JSON API
  title: Bass BBS API
  version: 1.0.0
servers:
- url: /
tags:
- description: AccountService 提供 BBS 账号接口
  name: AccountService
- description: ArticleService 提供 BBS 文章接口
  name: ArticleService
- description: 认证接口。
  name: AuthService
- name: CheckinService
- description: 评论接口。
  name: CommentService
- description: 领域 HTTP 接口。
  name: DomainService
- description: 账号地理资料接口。
  name: LocationService
- description: 通知接口。
  name: NotificationService
- description: OTP 接口。
  name: OtpService
- description: PostscriptService 提供 BBS 文章附言接口。
  name: PostscriptService
- description: 账号偏好设置接口。
  name: PreferencesService
- description: 账号隐私设置接口。
  name: PrivacySettingService
- description: 账号关系接口。
  name: RelationService
- description: 标签 HTTP 接口。
  name: TagService
