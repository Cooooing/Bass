      description: 校验 TOTP 验证码并关闭 TOTP。
      operationId: TotpService_Disable
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTotp_Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisableTotp_Reply"
          description: OK
      tags:
      - TotpService
  /v1/user/totp/get-current:
    post:
      description: 获取当前账号的 TOTP 状态。
      operationId: TotpService_GetCurrent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetCurrentTotp_Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentTotp_Reply"
          description: OK
      tags:
      - TotpService
