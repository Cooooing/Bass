          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAnswerArticle_Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptAnswerArticle_Reply"
          description: OK
      tags:
      - ArticleService
      x-content-type: application/json
      x-accepts:
