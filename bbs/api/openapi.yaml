openapi: 3.0.3
info:
  description: Bass 社区 HTTP/JSON API
  title: Bass BBS API
  version: 1.0.0
servers:
- url: /
tags:
- description: 账号接口。
  name: AccountService
- description: 文章接口。
  name: ArticleService
- description: 认证接口。
  name: AuthService
- description: 评论接口。
  name: CommentService
- description: 内容板块接口。
  name: DomainService
- description: 账号地理资料接口。
  name: LocationService
- description: 通知接口。
  name: NotificationService
- description: 文章附言接口。
  name: PostscriptService
- description: 账号偏好设置接口。
  name: PreferencesService
- description: 账号隐私设置接口。
  name: PrivacySettingService
- description: 账号关系接口。
  name: RelationService
- description: 标签接口。
  name: TagService
- description: TOTP 认证接口。
  name: TotpService
