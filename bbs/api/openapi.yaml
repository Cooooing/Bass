  /v1/content/article/accept-answer:
    post:
      description: 采纳文章评论为答案。
      operationId: ArticleService_AcceptAnswer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAnswerArticle_Request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptAnswerArticle_Reply"
          description: OK
      tags:
      - ArticleService
  /v1/content/article/collect:
