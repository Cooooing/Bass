      operationId: ArticleService_Archive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveArticle_Req"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveArticle_Resp"
