syntax = "proto3";

package common.api.app.bbs.v1;

import "common/common.proto";
import "google/api/annotations.proto";

option go_package = "common/api/gen/bbs/v1;v1";

// BBS 服务
service BbsService {
  // 健康检查
  rpc Ping(PingBbs.Request) returns (PingBbs.Reply) {
    option (google.api.http) = {
      get: "/v1/bbs/ping"
    };
  }

  // 查询版块信息
  rpc GetBoard(GetBoardBbs.Request) returns (GetBoardBbs.Reply) {
    option (google.api.http) = {
      post: "/v1/bbs/get-board"
      body: "*"
    };
  }

  // 创建帖子
  rpc CreatePost(CreatePostBbs.Request) returns (CreatePostBbs.Reply) {
    option (google.api.http) = {
      post: "/v1/bbs/create-post"
      body: "*"
    };
  }

  // 帖子列表（分页）
  rpc ListPosts(ListPostsBbs.Request) returns (ListPostsBbs.Reply) {
    option (google.api.http) = {
      post: "/v1/bbs/list-posts"
      body: "*"
    };
  }

  // 删除帖子
  rpc DeletePost(DeletePostBbs.Request) returns (DeletePostBbs.Reply) {
    option (google.api.http) = {
      post: "/v1/bbs/delete-post"
      body: "*"
    };
  }
}

// --- Ping ---

message PingBbs {
  message Request {}
  message Reply {
    string message = 1;
  }
}

// --- GetBoard: REQUIRED + OUTPUT_ONLY 示例 ---

message GetBoardBbs {
  message Request {
    // 版块 ID
    int64 board_id = 1;
    // 是否包含统计数据
    bool include_stats = 2;
  }
  message Reply {
    // 版块 ID（仅响应返回）
    int64 id = 1;
    // 版块名称
    string name = 2;
    // 版块描述
    string description = 3;
    // 帖子数量
    int64 post_count = 4;
  }
}

// --- CreatePost: REQUIRED + OPTIONAL + INPUT_ONLY 示例 ---

message CreatePostBbs {
  message Request {
    // 版块 ID
    int64 board_id = 1;
    // 帖子标题
    string title = 2;
    // 帖子内容
    string content = 3;
    // 作者昵称（选填，不填则使用当前用户昵称）
    string author_name = 4;
    // 标签列表（选填）
    repeated string tags = 5;
    // 审核备注（仅请求使用，响应不返回）
    string audit_note = 6;
  }
  message Reply {
    // 帖子 ID（仅响应返回）
    int64 id = 1;
    // 创建时间（仅响应返回）
    string created_at = 2;
  }
}

// --- ListPosts: 分页 + 可选过滤 ---

message ListPostsBbs {
  message Request {
    // 分页参数
    common.PageRequest page = 1;
    // 版块 ID（选填，不填则查全部）
    int64 board_id = 2;
    // 搜索关键词（选填）
    string keyword = 3;
  }
  message Reply {
    // 分页信息
    common.PageReply page = 1;
    // 帖子列表
    repeated Post rows = 2;
  }
}

// --- DeletePost: 单个 REQUIRED 参数 ---

message DeletePostBbs {
  message Request {
    // 帖子 ID
    int64 post_id = 1;
  }
  message Reply {}
}

// --- 公共模型 ---

message Post {
  int64 id = 1;
  int64 board_id = 2;
  string title = 3;
  string content = 4;
  string author_name = 5;
  repeated string tags = 6;
  string created_at = 7;
}
