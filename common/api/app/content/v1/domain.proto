syntax = "proto3";

package common.api.app.content.v1;

import "validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";
import "content/v1/tag.proto";
import "content/v1/enum.proto";

option go_package = "common/api/gen/content/v1;v1";

// 领域服务
service ContentDomainService {
  // 新增领域
  rpc Adds (AddDomainsRequest) returns (AddDomainsReply);

  // 修改领域信息
  rpc Update (UpdateDomainRequest) returns (UpdateDomainReply);

  // 查询领域
  rpc Page (PageDomainRequest) returns (PageDomainReply);
}

// 实体定义

message Domain {
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
  // 创建人
  optional int64 created_by = 1002;
  // 更新人
  optional int64 updated_by = 1003;

  // 主键
  int64 id = 3;
  // 领域名称
  string name = 4;
  // 描述
  optional string description = 5;
  // 状态 1-正常，2-禁用
  DomainStatus status = 6 [(validate.rules).enum = {defined_only: true,not_in: [0]}];
  // 链接
  optional string url = 7;
  // 图标
  optional string icon = 8;
  // 标签数量
  int32 tagCount = 9;
  // 是否导航
  bool isNav = 10;
  // tags
  repeated Tag tags = 100;
}

message DomainSave {
  // 主键
  int64 id = 1;
  // 领域名称
  string name = 2;
  // 描述
  optional string description = 3;
  // 状态 1-正常，2-禁用
  optional DomainStatus status = 4 [(validate.rules).enum = {defined_only: true,not_in: [0]}];
  // 链接
  optional string url = 5;
  // 图标
  optional string icon = 6;
  // 是否导航
  bool isNav = 7;
}

// 查询参数定义

message DomainQueryParams {
  // 主键
  repeated int64 ids = 2;
  // 领域名称
  optional string name = 3;
  // 描述
  optional string description = 4;
  // 状态 1-正常，2-禁用
  optional DomainStatus status = 5 [(validate.rules).enum = {defined_only: true,not_in: [0]}];
  // 链接
  optional string url = 6;
  // 图标
  optional string icon = 7;
  // 是否导航
  optional bool isNav = 8;
  // 标签数量范围
  common.v1.Int32Range tagCount = 9;
}

// 请求/响应结构定义

message AddDomainsRequest {
  // 领域信息
  repeated DomainSave domains = 1;
}
message AddDomainsReply {
  // 添加的领域信息
  repeated Domain data = 1;
}

message UpdateDomainRequest {
  // 领域信息
  DomainSave domain = 1;
}
message UpdateDomainReply {
  // 修改的领域信息
  Domain data = 1;
}

message PageDomainRequest {
  // 分页参数
  optional common.v1.PageRequest page = 1;
  // 查询参数
  DomainQueryParams query = 2;
}
message PageDomainReply {
  // 分页信息
  optional common.v1.PageReply page = 1;
  // 领域信息
  repeated Domain rows = 2;
}
