syntax = "proto3";

package common.api.app.infra.v1;

option go_package = "common/api/gen/infra/v1;v1";

// Email 服务
service InfraEmailService {
  // 发送邮件
  rpc Send(SendEmail.Request) returns (SendEmail.Reply);
}

message SendEmail {
  message Request {
    // 邮件标题
    string title = 1;
    // 邮件内容
    string content = 2;
    // 接收人
    repeated string to = 3;
    // 抄送人
    repeated string cc = 4;
    // 密送人
    repeated string bcc = 5;
  }
  message Reply {}
}
