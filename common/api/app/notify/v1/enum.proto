syntax = "proto3";

package common.api.app.notify.v1;

option go_package = "common/api/gen/notify/v1;v1";

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0; // 未指定
  NOTIFICATION_CHANNEL_STATION = 1; // 站内信
  NOTIFICATION_CHANNEL_EMAIL = 2; // 邮件
  NOTIFICATION_CHANNEL_TENCENT_SMS = 3; // 腾讯云短信
  NOTIFICATION_CHANNEL_LARK_WEBHOOK = 4; // Lark webhook
}

enum NotificationChannelStatus {
  NOTIFICATION_CHANNEL_STATUS_UNSPECIFIED = 0; // 未指定
  NOTIFICATION_CHANNEL_STATUS_PROCESSING = 1; // 正在处理
  NOTIFICATION_CHANNEL_STATUS_SUCCEEDED = 2; // 已成功
  NOTIFICATION_CHANNEL_STATUS_SKIPPED = 3; // 已跳过
  NOTIFICATION_CHANNEL_STATUS_FAILED = 4; // 明确失败
  NOTIFICATION_CHANNEL_STATUS_UNKNOWN = 5; // 结果不确定
  NOTIFICATION_CHANNEL_STATUS_INTERNAL_ERROR = 6; // 内部错误
}
