syntax = "proto3";

package common.api.app.notify.v1;

import "common/common.proto";
import "google/api/annotations.proto";
import "notify/v1/model.proto";

option go_package = "common/api/gen/notify/v1;v1";

// NotificationRecord 服务
service NotifyNotificationRecordService {
  // 查询通知详情数据
  rpc List(ListNotificationRecords.Request) returns (ListNotificationRecords.Reply) {
    option (google.api.http) = {
      post: "/v1/notification-record/list"
      body: "*"
    };
  }

  // 已读
  rpc MarkRead(MarkReadNotificationRecord.Request) returns (MarkReadNotificationRecord.Reply) {
    option (google.api.http) = {
      post: "/v1/notification-record/mark-read"
      body: "*"
    };
  }

  // 查询当前登录账号未读数量
  rpc CountUnread(CountUnreadNotificationRecords.Request) returns (CountUnreadNotificationRecords.Reply) {
    option (google.api.http) = {
      post: "/v1/notification-record/count-unread"
      body: "*"
    };
  }
}

message ListNotificationRecords {
  message Request {
    // 分页参数
    common.PageRequest page = 1;
    // 查询条件
    NotificationRecordQueryParams query = 2;
  }
  message Reply {
    // 分页信息
    common.PageReply page = 1;
    // 通知记录列表
    repeated NotificationRecord rows = 2;
  }
}

message MarkReadNotificationRecord {
  message Request {
    // 通知 ID 列表
    repeated int64 ids = 1;
    // 已读时间范围
    common.TimeRange read_time_range = 2;
    // 通知记录 ID 列表
    repeated int64 notification_record_ids = 3;
  }
  message Reply {
    // 已读数量
    int32 count = 1;
  }
}

message CountUnreadNotificationRecords {
  message Request {}
  message Reply {
    int64 count = 1;
  }
}
