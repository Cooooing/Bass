syntax = "proto3";

package common.api.app.notify.v1;

import "notify/v1/enum.proto";

option go_package = "common/api/gen/notify/v1;v1";

service NotifyRateLimitService {
  // 查询通知通道收件目标是否已被限流。
  rpc Check(CheckNotificationRateLimit.Request) returns (CheckNotificationRateLimit.Reply) {}
}

message CheckNotificationRateLimit {
  message Request {
    NotificationChannel channel = 1;
    string recipient = 2;
  }
  message Reply {
    bool limited = 1;
    int64 retry_after_seconds = 2;
    int64 remaining_count = 3;
  }
}
