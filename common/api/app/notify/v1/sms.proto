syntax = "proto3";

package common.api.app.notify.v1;

option go_package = "common/api/gen/notify/v1;v1";

service NotifySmsService {
  rpc Send(SendSms.Request) returns (SendSms.Reply);
}

message SendSms {
  message Request {
    repeated string phone = 1;
    repeated string params = 2;
  }
  message Reply {}
}
