syntax = "proto3";

package common.api.app.user.v1;

import "user/v1/model.proto";

option go_package = "common/api/gen/user/v1;v1";

// Auth 服务
service UserAuthService {
  // -- 账号注册

  // 邮箱注册
  rpc RegisterEmail(RegisterEmailAuth.Request) returns (RegisterEmailAuth.Reply) {}

  // 邮箱注册验证码验证
  rpc RegisterEmailVerify(RegisterEmailVerifyAuth.Request) returns (RegisterEmailVerifyAuth.Reply) {}

  // 手机号注册
  rpc RegisterPhone(RegisterPhoneAuth.Request) returns (RegisterPhoneAuth.Reply) {}

  // 手机号注册验证码验证
  rpc RegisterPhoneVerify(RegisterPhoneVerifyAuth.Request) returns (RegisterPhoneVerifyAuth.Reply) {}

  // -- 账号信息查询

  // 邮箱是否存在
  rpc ExistEmail(ExistEmailAuth.Request) returns (ExistEmailAuth.Reply) {}

  // 手机号是否存在
  rpc ExistPhone(ExistPhoneAuth.Request) returns (ExistPhoneAuth.Reply) {}

  // 用户名是否存在
  rpc ExistUsername(ExistUsernameAuth.Request) returns (ExistUsernameAuth.Reply) {}

  // -- 账号登录

  // 账号登录（用户名/邮箱）
  rpc LoginAccount(LoginAccountAuth.Request) returns (LoginAccountAuth.Reply) {}

  // 账号登出
  rpc Logout(LogoutAuth.Request) returns (LogoutAuth.Reply) {}
}

message RegisterEmailAuth {
  message Request {
    // 邮箱
    string email = 1;
    // 密码
    string password = 2;
    // 用户名
    string name = 3;
    // 昵称
    optional string nickname = 4;
  }
  message Reply {
    // 验证码令牌
    string code_token = 1;
    // 验证码（仅供调试使用）
    string code = 2;
  }
}

message RegisterEmailVerifyAuth {
  message Request {
    // 验证码 6 位验证码
    string code = 1;
    // 验证码令牌
    string code_token = 2;
  }
  message Reply {}
}

message RegisterPhoneAuth {
  message Request {
    // 邮箱 11 位国内手机号
    string phone = 1;
    // 密码
    string password = 2;
    // 用户名
    string name = 3;
    // 昵称
    optional string nickname = 4;
  }
  message Reply {
    // 验证码令牌
    string code_token = 1;
    // 验证码（仅供调试使用）
    string code = 2;
  }
}

message RegisterPhoneVerifyAuth {
  message Request {
    // 验证码 6 位验证码
    string code = 1;
    // 验证码令牌
    string code_token = 2;
  }
  message Reply {}
}

message ExistEmailAuth {
  message Request {
    // 邮箱
    string email = 1;
  }
  message Reply {
    // 是否存在
    optional bool exist = 1;
  }
}

message ExistUsernameAuth {
  message Request {
    // 用户名 4-32位 只能包含字母数字字符或单个连字符，不能以连字符开头或结尾
    string username = 1;
  }
  message Reply {
    // 是否存在
    optional bool exist = 1;
  }
}

message ExistPhoneAuth {
  message Request {
    // 手机号 11 位国内手机号
    string phone = 1;
  }
  message Reply {
    // 是否存在
    optional bool exist = 1;
  }
}

message LoginAccountAuth {
  message Request {
    // 账号（用户名/邮箱）
    string account = 1;
    // 密码
    string password = 2;
  }
  message Reply {
    // 登录令牌
    string token = 1;
    // 用户信息
    user.v1.User user = 2;
  }
}

message LogoutAuth {
  message Request {}
  message Reply {}
}
