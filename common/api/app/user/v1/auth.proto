syntax = "proto3";

package common.api.app.user.v1;

import "user/v1/model.proto";

option go_package = "common/api/gen/user/v1;v1";

service AuthService {
  // 使用邮箱发起账号注册，成功后返回验证码令牌。
  rpc StartEmailRegistration(StartEmailRegistration.Request) returns (StartEmailRegistration.Reply) {}

  // 校验邮箱注册验证码并创建账号。
  rpc VerifyEmailRegistration(VerifyEmailRegistration.Request) returns (VerifyEmailRegistration.Reply) {}

  // 使用手机号发起账号注册，成功后返回验证码令牌。
  rpc StartPhoneRegistration(StartPhoneRegistration.Request) returns (StartPhoneRegistration.Reply) {}

  // 校验手机号注册验证码并创建账号。
  rpc VerifyPhoneRegistration(VerifyPhoneRegistration.Request) returns (VerifyPhoneRegistration.Reply) {}

  // 使用账号名、邮箱或手机号加密码登录。
  rpc LoginByPassword(LoginByPassword.Request) returns (LoginByPassword.Reply) {}

  // 登出账号并清理令牌。
  rpc Logout(Logout.Request) returns (Logout.Reply) {}

  // 解析登录令牌。
  rpc ParseToken(ParseToken.Request) returns (ParseToken.Reply) {}
}

message StartEmailRegistration {
  message Request {
    string email = 1;
    string password = 2;
    string name = 3;
    optional string nickname = 4;
  }
  message Reply {
    string code_token = 1;
    string code = 2;
  }
}

message VerifyEmailRegistration {
  message Request {
    string code = 1;
    string code_token = 2;
  }
  message Reply {}
}

message StartPhoneRegistration {
  message Request {
    string phone = 1;
    string password = 2;
    string name = 3;
    optional string nickname = 4;
  }
  message Reply {
    string code_token = 1;
    string code = 2;
  }
}

message VerifyPhoneRegistration {
  message Request {
    string code = 1;
    string code_token = 2;
  }
  message Reply {}
}

message LoginByPassword {
  message Request {
    string account = 1;
    string password = 2;
  }
  message Reply {
    string token = 1;
    Account account = 2;
  }
}

message Logout {
  message Request {
    string token = 1;
  }
  message Reply {}
}

message TokenUser {
  int64 id = 1;
  string name = 2;
  string nickname = 3;
  string language = 4;
  string timezone = 5;
}

message ParseToken {
  message Request {
    string token = 1;
  }
  message Reply {
    TokenUser user = 1;
  }
}
