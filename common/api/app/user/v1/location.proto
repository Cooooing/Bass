syntax = "proto3";

package common.api.app.user.v1;

import "user/v1/model.proto";

option go_package = "common/api/gen/user/v1;v1";

service LocationService {
  // 获取当前登录账号的地理资料。
  rpc GetCurrent(GetCurrentLocation.Request) returns (GetCurrentLocation.Reply) {}

  // 更新当前登录账号的地理资料；缺省扩展表使用 upsert 创建。
  rpc Upsert(UpsertLocation.Request) returns (UpsertLocation.Reply) {}
}

message GetCurrentLocation {
  message Request {}
  message Reply {
    Location location = 1;
  }
}

message UpsertLocation {
  message Request {
    optional string country = 1;
    optional string province = 2;
    optional string city = 3;
  }
  message Reply {
    Location location = 1;
  }
}
