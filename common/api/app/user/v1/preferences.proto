syntax = "proto3";

package common.api.app.user.v1;

import "user/v1/model.proto";

option go_package = "common/api/gen/user/v1;v1";

service PreferencesService {
  // 获取当前登录账号的偏好设置，缺省时返回默认设置。
  rpc GetCurrent(GetCurrentPreferences.Request) returns (GetCurrentPreferences.Reply) {}

  // 更新当前登录账号的偏好设置；缺省扩展表使用 upsert 创建。
  rpc Update(UpdatePreferences.Request) returns (UpdatePreferences.Reply) {}
}

message GetCurrentPreferences {
  message Request {}
  message Reply {
    Preferences preferences = 1;
  }
}

message UpdatePreferences {
  message Request {
    optional string language = 1;
    optional string timezone = 2;
    optional string theme = 3;
    optional string mobile_theme = 4;
    optional bool enable_web_notify = 5;
    optional bool enable_email_subscribe = 6;
  }
  message Reply {
    Preferences preferences = 1;
  }
}
