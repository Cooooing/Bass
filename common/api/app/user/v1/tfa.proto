syntax = "proto3";

package common.api.app.user.v1;

import "user/v1/model.proto";

option go_package = "common/api/gen/user/v1;v1";

service TfaService {
  // 校验账号的二步验证码。
  rpc Validate(ValidateTfa.Request) returns (ValidateTfa.Reply) {}

  // 开始启用二步验证，生成临时密钥和二维码图片。
  rpc BeginEnable(BeginEnableTfa.Request) returns (BeginEnableTfa.Reply) {}

  // 确认二步验证码并正式启用二步验证。
  rpc ConfirmEnable(ConfirmEnableTfa.Request) returns (ConfirmEnableTfa.Reply) {}

  // 校验二步验证码并关闭二步验证。
  rpc Disable(DisableTfa.Request) returns (DisableTfa.Reply) {}

  // 获取账号二步验证状态。
  rpc Get(GetTfa.Request) returns (GetTfa.Reply) {}
}

message ValidateTfa {
  message Request {
    int64 user_id = 1;
    string code = 2;
  }
  message Reply {
    bool verified = 1;
  }
}

message BeginEnableTfa {
  message Request {
    int64 user_id = 1;
    string account_name = 2;
  }
  message Reply {
    bytes data = 1;
    string content_type = 2;
  }
}

message ConfirmEnableTfa {
  message Request {
    int64 user_id = 1;
    string code = 2;
  }
  message Reply {}
}

message DisableTfa {
  message Request {
    int64 user_id = 1;
    string code = 2;
  }
  message Reply {}
}

message GetTfa {
  message Request {
    int64 user_id = 1;
  }
  message Reply {
    Tfa tfa = 1;
  }
}
