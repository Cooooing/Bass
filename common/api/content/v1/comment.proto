syntax = "proto3";

package common.api.content.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "common/v1/common.proto";
import "user/v1/user.proto";

option go_package = "common/api/content/v1;v1";

// 评论服务
service ContentCommentService {

  // 新增评论
  rpc Add (AddCommentRequest) returns (AddCommentReply) {
    option (google.api.http) = {
      post: "/v1/comment/add"
      body: "*"
    };
  }

  // 查询评论列表
  rpc Page (PageCommentRequest) returns (PageCommentReply) {
    option (google.api.http) = {
      post: "/v1/comment/page"
      body: "*"
    };
  }

  // 点赞评论
  rpc Like (LikeCommentRequest) returns (LikeCommentReply) {
    option (google.api.http) = {
      post: "/v1/comment/like"
      body: "*"
    };
  }

  // 感谢评论
  rpc Thank (ThankCommentRequest) returns (ThankCommentReply) {
    option (google.api.http) = {
      post: "/v1/comment/thank"
      body: "*"
    };
  }

  // 修改评论状态
  rpc UpdateStatus (UpdateStatusCommentRequest) returns (UpdateStatusCommentReply) {
    option (google.api.http) = {
      post: "/v1/comment/updateStatus"
      body: "*"
    };
  }

}

// 实体定义

message Comment {
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
  // 创建人
  optional int64 created_by = 1002;
  // 更新人
  optional int64 updated_by = 1003;

  // 评论Id
  int64 id = 1;
  // 文章Id
  int64 article_id = 2;
  // 评论内容
  string content = 4;
  // 评论内容渲染
  string content_render = 12;
  // 评论层级
  int32 level = 5;
  // 父级评论Id
  optional int64 parent_id = 6;
  // 回复评论Id
  optional int64 reply_id = 7;
  // 状态
  int32 status = 8;
  // 感谢数量
  int32 thank_count = 13;
  // 点赞数量
  int32 like_count = 10;
  // 收藏数量
  int32 collect_count = 11;
  // 子评论数量
  int32 reply_count = 9;

  // 用户信息
  user.v1.User user = 15;
  // 回复评论的用户信息
  user.v1.User reply_user = 16;
}

// 查询参数定义

message CommentQueryParams {
  // 评论Id
  optional int64 comment_id = 2;
  // 文章Id
  optional int64 article_id = 3;
  // 父级评论Id
  optional int64 parent_id = 4;
  // 回复评论Id
  optional int64 reply_id = 5;
  // 排序 0-最新 1-最热
  optional int32 order = 6;
  // 用户Id
  optional int64 user_id = 7;
  // 层级
  optional int32 level = 8;
}

// 请求/响应结构定义

message AddCommentRequest {
  // 文章Id
  int64 article_id = 2;
  // 评论内容
  string content = 4;
  // 回复评论Id
  int64 reply_id = 6;
}
message AddCommentReply {
  // 评论
  Comment comment = 1;
}

message PageCommentRequest {
  // 分页
  optional common.v1.PageRequest page = 1;
  // 查询参数
  CommentQueryParams query = 2;
}
message PageCommentReply {
  // 分页
  common.v1.PageReply page = 1;
  // 评论列表
  repeated Comment rows = 2;
}

message LikeCommentRequest {
  // 评论Id
  int64 id = 1;
  // 是否点赞
  bool active = 2;
}
message LikeCommentReply {}

message ThankCommentRequest {
  // 评论Id
  int64 id = 1;
  // 是否感谢
  bool active = 2;
}
message ThankCommentReply {}

message UpdateStatusCommentRequest {
  // 评论Id
  int64 id = 1;
  // 状态
  int64 status = 2;
}
message UpdateStatusCommentReply {}