syntax = "proto3";

package common.api.infra.v1;

option go_package = "common/gen/infra/v1;v1";

// Sms 服务
service InfraSmsService {

  // 发送短信
  rpc Send(SendSmsRequest) returns (SendSmsReply);

}

message SendSmsRequest {
  // 手机号
  repeated string phone = 1;
  // 参数
  repeated string params = 2;
}
message SendSmsReply {}
