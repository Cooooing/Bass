syntax = "proto3";

package common.api.notify.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "common/v1/common.proto";
import "notify/v1/enum.proto";

option go_package = "common/api/notify/v1;v1";

// Notification_Meta 服务
service NotifyNotificationMetaService {

  // 查询通知元数据
  rpc Page (NotificationMetaPageRequest) returns (NotificationMetaPageReply) {
    option (google.api.http) = {
      post: "/v1/notificationMeta/page"
      body: "*"
    };
  }

}

// 实体定义

message NotificationMeta {
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;

  // 主键
  int64 id = 3;
  // uuid
  string uuid = 4;
  // 通知类型
  NotificationType notification_type = 5 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  // 发送者ID
  int64 sender_id = 6;
  // 通知元数据
  string meta = 7;
  // 状态 1-正常 2-被取消
  NotificationStatus status = 8 [(validate.rules).enum = {defined_only: true, not_in: [0]}];

  // 渲染内容
  string content_render = 20;

}

// 查询参数定义

message NotificationMetaQueryParams {
  // 主键
  repeated int64 ids = 2;
  // uuid
  repeated string uuids = 3;
  // 通知类型
  optional NotificationType notification_type = 5 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  // 发送者ID
  repeated int64 sender_ids = 6;
  // 状态 1-正常 2-被取消
  optional NotificationStatus status = 8 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

// 请求/响应结构定义

message NotificationMetaPageRequest {
  // 分页参数
  common.v1.PageRequest page = 1;
  // 查询参数
  NotificationMetaQueryParams query = 2;
}

message NotificationMetaPageReply {
  // 分页信息
  common.v1.PageReply page = 1;
  // 通知元数据信息
  repeated NotificationMeta rows = 2;
}