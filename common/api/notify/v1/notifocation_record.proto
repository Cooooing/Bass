syntax = "proto3";

package common.api.notify.v1;

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "common/v1/common.proto";
import "notify/v1/enum.proto";
import "notify/v1/notifocation_mete.proto";

option go_package = "common/gen/notify/v1;v1";

// Notification_Record 服务
service NotifyNotificationRecordService {

  // 查询通知详情数据
  rpc Page (NotificationRecordPageRequest) returns (NotificationRecordPageReply);

  // 已读
  rpc Read (NotificationRecordReadRequest) returns (NotificationRecordReadReply);

}

// 实体定义

message NotificationRecord {
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;

  // 主键
  int64 id = 3;
  // 通知元数据id
  int64 notification_id = 4;
  // 接收者ID
  int64 receiver_id = 5;
  // 已读时间
  google.protobuf.Timestamp read_time = 6;

  // 通知元数据
  NotificationMeta notification_meta = 20;
}

// 查询参数定义

message NotificationRecordQueryParams {
  // 主键
  repeated int64 ids = 2;
  // uuid
  repeated string uuids = 3;
  // 通知类型
  optional NotificationType notification_type = 5 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
  // 发送者ID
  repeated int64 sender_ids = 6;
  // 状态 1-正常 2-被取消
  optional NotificationStatus status = 8 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

// 请求/响应结构定义

message NotificationRecordPageRequest {
  // 分页参数
  common.v1.PageRequest page = 1;
  // 查询参数
  NotificationRecordQueryParams query = 2;
}
message NotificationRecordPageReply {
  // 分页信息
  common.v1.PageReply page = 1;
  // 通知元数据信息
  repeated NotificationRecord rows = 2;
}

message NotificationRecordReadRequest{
  repeated int64 ids = 1;
  common.v1.TimeRange read_time_range = 2;
  repeated int64 notification_record_ids = 3;
}
message NotificationRecordReadReply{
  int32 count = 1;
}
