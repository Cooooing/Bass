syntax = "proto3";

package common.api.signal.v1;

import "signal/v1/model.proto";
import "signal/v1/enum.proto";

option go_package = "common/gen/signal/v1;v1";

// Node 服务
service SignalNodeService {

  // 保存节点
  rpc Save (SignalNodeSaveRequest) returns (SignalNodeSaveReply);

  // 更新节点信息
  rpc Update (SignalNodeUpdateRequest) returns (SignalNodeUpdateReply);

  // 获取密钥
  rpc GetSecret (SignalNodeGetSecretRequest) returns (SignalNodeGetSecretReply);

  // 更新密钥
  rpc UpdateSecret (SignalNodeUpdateSecretRequest) returns (SignalNodeUpdateSecretReply);

  // 查询节点列表
  rpc List (SignalNodeListRequest) returns (SignalNodeListReply);

  // 客户端调度/协商
  rpc Negotiate (SignalNodeNegotiateRequest) returns (SignalNodeNegotiateReply);

  // 注册节点
  rpc Register (SignalNodeRegisterRequest) returns (SignalNodeRegisterReply);

  // 注销节点
  rpc Unregister (SignalNodeUnregisterRequest) returns (SignalNodeUnregisterReply);

  // 获取 websocket ticket
  rpc Ticket (SignalNodeTicketRequest) returns (SignalNodeTicketReply);

  // 用户上线
  rpc Online (SignalNodeOnlineRequest) returns (SignalNodeOnlineReply);

  // 用户下线
  rpc Offline (SignalNodeOfflineRequest) returns (SignalNodeOfflineReply);

  // 在线用户列表
  rpc OnlineList (SignalNodeOnlineListRequest) returns (SignalNodeOnlineListReply);

}

// 查询参数定义



// 请求/响应结构定义

message SignalNodeSaveRequest {
  // 节点信息
  Node node = 1;
}
message SignalNodeSaveReply {
  // 节点信息
  Node node = 1;
}

message SignalNodeUpdateRequest {
  // 节点信息
  Node node = 1;
}
message SignalNodeUpdateReply {
  // 节点信息
  Node node = 1;
}

message SignalNodeGetSecretRequest {
  // 节点 ID
  int64 id = 1;
}
message SignalNodeGetSecretReply {
  // 密钥
  string secret = 1;
}

message SignalNodeUpdateSecretRequest {
  // 节点 ID
  int64 id = 1;
}
message SignalNodeUpdateSecretReply {
  // 密钥
  string secret = 1;
}

message SignalNodeListRequest {
  // 节点状态
  NodeStatus status = 1;
}
message SignalNodeListReply {
  // 节点列表
  repeated Node nodes = 1;
}

message SignalNodeNegotiateRequest {}
message SignalNodeNegotiateReply {
  // ticket
  string ticket = 1;
  // 节点列表
  repeated Node nodes = 2;
}

message SignalNodeRegisterRequest {}
message SignalNodeRegisterReply {}

message SignalNodeUnregisterRequest {}
message SignalNodeUnregisterReply {}

message SignalNodeTicketRequest {}
message SignalNodeTicketReply {
  // ticket
  string ticket = 1;
}

message SignalNodeOnlineRequest {
  // ticket
  string ticket = 1;
}
message SignalNodeOnlineReply {
  // session Id
  string session_id = 1;
}

message SignalNodeOfflineRequest {
  // session ID
  string session_id = 1;
}
message SignalNodeOfflineReply {}

message SignalNodeOnlineListRequest {}
message SignalNodeOnlineListReply {}
