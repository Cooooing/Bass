syntax = "proto3";

package common.api.signal.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "common/v1/common.proto";
import "user/v1/user.proto";
import "signal/v1/model.proto";
import "signal/v1/constant.proto";

option go_package = "common/api/signal/v1;v1";

// Node 服务
service SignalNodeService {
  
  // 保存节点
  rpc Save (SignalNodeSaveRequest) returns (SignalNodeSaveReply) {
    option (google.api.http) = {
      post: "/v1/node/save"
      body: "*"
    };
  }

  // 注册节点
  rpc Register (SignalNodeRegisterRequest) returns (SignalNodeRegisterReply) {
    option (google.api.http) = {
      post: "/v1/node/register"
      body: "*"
    };
  }

  // 用户上线
  rpc Online (SignalNodeOnlineRequest) returns (SignalNodeOnlineReply) {
    option (google.api.http) = {
      post: "/v1/node/online"
      body: "*"
    };
  }

  // 用户下线
  rpc Offline (SignalNodeOfflineRequest) returns (SignalNodeOfflineReply) {
    option (google.api.http) = {
      post: "/v1/node/offline"
      body: "*"
    };
  }

  // 在线用户列表
  rpc OnlineList (SignalNodeOnlineListRequest) returns (SignalNodeOnlineListReply) {
    option (google.api.http) = {
      post: "/v1/node/online/list"
      body: "*"
    };
  }

}

// 查询参数定义



// 请求/响应结构定义

message SignalNodeSaveRequest {}
message SignalNodeSaveReply {}

message SignalNodeRegisterRequest {}
message SignalNodeRegisterReply {}

message SignalNodeOnlineRequest {}
message SignalNodeOnlineReply {}

message SignalNodeOfflineRequest {}
message SignalNodeOfflineReply {}

message SignalNodeOnlineListRequest {}
message SignalNodeOnlineListReply {}