version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: common/api/gen

plugins:
  # 生成标准 Go 代码
  - local: protoc-gen-go
    out: api/gen
    opt: paths=source_relative
  # 生成 gRPC Go 代码
  - local: protoc-gen-go-grpc
    out: api/gen
    opt: paths=source_relative
  # 生成 Validate 校验代码
  - local: protoc-gen-validate
    out: api/gen
    opt:
      - lang=go
      - paths=source_relative
  # 生成 Kratos HTTP 代码 (如果你本地安装了 protoc-gen-go-http)
  - local: protoc-gen-go-http
    out: api/gen
    opt: paths=source_relative
  # 生成 Kratos Errors 代码 (如果你本地安装了 protoc-gen-go-errors)
  - local: protoc-gen-go-errors
    out: api/gen
    opt: paths=source_relative