name: bass-infra

# 创建 bass 容器网络
networks:
  bass:
    driver: bridge
    external: true

services:
  postgres:
    image: postgres:18.4
    restart: on-failure:3
    env_file:
      - .test.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql18/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8.8.1
    restart: on-failure:3
    env_file:
      - .test.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  consul:
    image: hashicorp/consul:2.0.0
    restart: on-failure:3
    env_file:
      - .test.env
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_HTTP_TOKEN=${CONSUL_ACL_MASTER_TOKEN}
    command: >
      consul agent
      -server
      -bootstrap-expect=1
      -ui
      -client=0.0.0.0
      -data-dir=/consul/data
      -hcl '
      disable_update_check = true
      acl {
        enabled = true
        default_policy = "deny"
        enable_token_persistence = true
        tokens {
          initial_management = "${CONSUL_ACL_MASTER_TOKEN}"
          agent = "${CONSUL_ACL_MASTER_TOKEN}"
        }
      }'
    ports:
      - "${CONSUL_PORT:-8500}:8500"
    volumes:
      - consul_data:/consul/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD", "consul", "info", "-token=${CONSUL_ACL_MASTER_TOKEN}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14.2
    restart: on-failure:3
    env_file:
      - .test.env
    environment:
      - TZ=Asia/Shanghai
      - MAX_PAYLOAD=1048576  # 1MB，可选，默认也是 1MB
    command: >
      --js
      --sd /data/jetstream
      -m 8222
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
      - "${NATS_CLUSTER_PORT:-6222}:6222"
    volumes:
      - nats_data:/data/jetstream
    networks:
      - bass

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: on-failure:3
    env_file:
      - .test.env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5


  dtm-init:
    image: postgres:18.4
    restart: "no"
    env_file:
      - .test.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../sql/dtm/postgres/v1.19.0-init.sql:/sql/init.sql:ro
    command: >
      sh -c "psql -h postgres -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /sql/init.sql"
    networks:
      - bass

  dtm:
    image: yedf/dtm:1.19.0
    restart: on-failure:3
    env_file:
      - .test.env
    depends_on:
      postgres:
        condition: service_healthy
      dtm-init:
        condition: service_completed_successfully
    environment:
      STORE_DRIVER: postgres
      STORE_HOST: postgres
      STORE_PORT: 5432
      STORE_USER: ${POSTGRES_USER}
      STORE_PASSWORD: ${POSTGRES_PASSWORD}
      STORE_DB: ${POSTGRES_DB}
      STORE_SCHEMA: dtm
    ports:
      - "${DTM_HTTP_PORT:-36789}:36789"
      - "${DTM_GRPC_PORT:-36790}:36790"
    networks:
      - bass
volumes:
  postgres_data:
  redis_data:
  consul_data:
  nats_data:
  minio_data:
