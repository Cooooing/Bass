# alloy.yaml
# Grafana Alloy：负责收集 k8s 集群内的日志/指标，转发给 Loki/Tempo

alloy:
  configMap:
    create: true
    content: |
      // ============================================================
      // Alloy 配置：收集 k8s Pod 日志 → Loki
      // ============================================================

      // 发现集群内所有 Pod
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 过滤并重新标记
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "__host__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      // 采集 Pod 日志
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.loki.receiver]
      }

      // 写入 Loki（集群内 Service 地址）
      loki.write "loki" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

      // ============================================================
      // （可选）采集 k8s 节点指标 → Prometheus remote_write
      // 如果你没有 Prometheus，可以删除以下 prometheus 相关块
      // ============================================================

      // prometheus.scrape "kubelet" {
      //   targets = discovery.kubernetes.pods.targets
      //   forward_to = [prometheus.remote_write.default.receiver]
      // }

      // prometheus.remote_write "default" {
      //   endpoint {
      //     url = "http://<prometheus-svc>:9090/api/v1/write"
      //   }
      // }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# 以 DaemonSet 方式部署，确保每个节点都能采集日志
controller:
  type: daemonset

# 需要访问 k8s API 以发现 Pod
rbac:
  create: true

serviceAccount:
  create: true

# Alloy 自身不需要 NodePort（它是主动推送，不被外部调用）
service:
  type: ClusterIP