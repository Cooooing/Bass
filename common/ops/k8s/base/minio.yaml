fullnameOverride: bass-minio

existingSecret: bass-minio-secret

mode: standalone
replicas: 1

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m

# ClusterIP，S3 API 仅集群内访问
service:
  type: ClusterIP

# Console 通过 Ingress 暴露
consoleService:
  type: ClusterIP
