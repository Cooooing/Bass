fullnameOverride: bass-postgresql

image:
  registry: registry-1.docker.io
  repository: bitnami/postgresql
  tag: ""
  digest: sha256:db2312d9b243afa8c3b3f5496e478d17d0dff9791d06f3b93b9567abd86ae92f

auth:
  enablePostgresUser: true
  existingSecret: bass-postgres-secret
  secretKeys:
    adminPasswordKey: password
  username: "admin"
  password: ""
  database: "bass"

primary:
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # 仅集群内访问
readReplicas:
  replicaCount: 0

architecture: standalone
