# clickhouse.yaml
# ClickHouse：存储日志和链路数据，替代 Loki + Tempo
# 使用官方镜像，手写 K8s 清单（bitnami chart 与官方镜像不兼容）

---
# ConfigMap：ClickHouse 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: bass-test
data:
  # 允许从集群内任意地址连接（用于 OTel Collector 和 Grafana）
  allowed_hosts.xml: |
    <clickhouse>
        <networks>
            <ip>::</ip>
        </networks>
    </clickhouse>

---
# Secret：数据库凭据
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secret
  namespace: bass-test
type: Opaque
stringData:
  username: "admin"
  password: "123456"

---
# StatefulSet：单节点 ClickHouse
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: bass-test
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/allowed_hosts.xml
              subPath: allowed_hosts.xml
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# Service：ClusterIP（集群内访问）+ NodePort（Grafana 外部访问）
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: bass-test
  labels:
    app: clickhouse
spec:
  type: NodePort
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30090
    - name: native
      port: 9000
      targetPort: 9000

# 部署命令：
# kubectl apply -f ./clickhouse.yaml -n bass-test
#
# 等待 ClickHouse 就绪后，创建 otel 数据库（OTel Collector 的 exporter 会自动建表）：
# kubectl exec -n bass-test clickhouse-0 -- clickhouse-client --password "123456" --query "CREATE DATABASE IF NOT EXISTS otel"
#
# 删除命令：
# kubectl delete -f ./clickhouse.yaml -n bass-test