apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkit-config
  namespace: cicd
data:
  buildkitd.toml: |-
    debug = false

    [worker.oci]
      enabled = true
      gc = true
      reservedSpace = "2GB"
      maxUsedSpace = "18GB"
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: cicd
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/component: image-builder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/component: image-builder
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd
  namespace: cicd
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/component: image-builder
spec:
  serviceName: buildkitd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      app.kubernetes.io/component: image-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        app.kubernetes.io/component: image-builder
    spec:
      imagePullSecrets:
        - name: aliyun-registry-secret
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.24.0
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --config
            - /etc/buildkit/buildkitd.toml
          ports:
            - name: buildkit
              containerPort: 1234
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: buildkit-data
              mountPath: /var/lib/buildkit
            - name: buildkit-config
              mountPath: /etc/buildkit/buildkitd.toml
              subPath: buildkitd.toml
      volumes:
        - name: buildkit-config
          configMap:
            name: buildkit-config
  volumeClaimTemplates:
    - metadata:
        name: buildkit-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: microk8s-hostpath
        resources:
          requests:
            storage: 20Gi
