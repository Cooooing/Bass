apiVersion: v1
kind: ConfigMap
metadata:
  name: git-cache-scripts
  namespace: cicd
data:
  update.sh: |-
    #!/bin/sh
    set -eu

    repo_dir="/git-cache/Bass.git"
    repo_url="${REPO_URL:-https://github.com/Cooooing/Bass.git}"

    mkdir -p /git-cache

    update_repo() {
      if [ ! -d "${repo_dir}/objects" ]; then
        rm -rf "${repo_dir}"
        git clone --mirror "${repo_url}" "${repo_dir}"
      else
        git -C "${repo_dir}" remote set-url origin "${repo_url}"
        git -C "${repo_dir}" remote update --prune
      fi
    }

    attempt=1
    while [ "${attempt}" -le 3 ]; do
      if update_repo; then
        touch /git-cache/.ready
        exit 0
      fi
      echo "[git-cache] update attempt ${attempt} failed, retrying..." >&2
      attempt=$((attempt + 1))
      sleep 10
    done

    if [ -d "${repo_dir}/objects" ]; then
      echo "[git-cache] update failed, using existing cached repository." >&2
      touch /git-cache/.ready
      exit 0
    fi

    echo "[git-cache] update failed and no cached repository exists." >&2
    exit 1
  run.sh: |-
    #!/bin/sh
    set -eu

    sh /scripts/update.sh

    while true; do
      sh /scripts/update.sh || true
      sleep "${SYNC_INTERVAL_SECONDS:-300}"
    done &

    exec git daemon \
      --verbose \
      --export-all \
      --reuseaddr \
      --base-path=/git-cache \
      /git-cache
---
apiVersion: v1
kind: Service
metadata:
  name: git-cache
  namespace: cicd
  labels:
    app.kubernetes.io/name: git-cache
    app.kubernetes.io/component: source-cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-cache
    app.kubernetes.io/component: source-cache
  ports:
    - name: git
      port: 9418
      targetPort: git
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: git-cache
  namespace: cicd
  labels:
    app.kubernetes.io/name: git-cache
    app.kubernetes.io/component: source-cache
spec:
  serviceName: git-cache
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-cache
      app.kubernetes.io/component: source-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-cache
        app.kubernetes.io/component: source-cache
    spec:
      imagePullSecrets:
        - name: aliyun-registry-secret
      containers:
        - name: git-cache
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "apk add --no-cache git git-daemon && exec /bin/sh /scripts/run.sh"]
          ports:
            - name: git
              containerPort: 9418
          env:
            - name: REPO_URL
              value: "https://github.com/Cooooing/Bass.git"
            - name: SYNC_INTERVAL_SECONDS
              value: "300"
          readinessProbe:
            exec:
              command: ["test", "-f", "/git-cache/.ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: git-cache-data
              mountPath: /git-cache
            - name: git-cache-scripts
              mountPath: /scripts
      volumes:
        - name: git-cache-scripts
          configMap:
            name: git-cache-scripts
  volumeClaimTemplates:
    - metadata:
        name: git-cache-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: microk8s-hostpath
        resources:
          requests:
            storage: 5Gi
