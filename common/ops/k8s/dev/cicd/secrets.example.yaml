apiVersion: v1
kind: Secret
metadata:
  name: jenkins-credentials-example
  namespace: cicd
type: Opaque
stringData:
  # Optional placeholders for future Jenkins credentials import.
  # For now, configure Git/ACR/kubeconfig credentials in Jenkins UI.
  GIT_TOKEN: "replace-with-git-token"
  ACR_USERNAME: "replace-with-acr-username"
  ACR_PASSWORD: "replace-with-acr-password"
