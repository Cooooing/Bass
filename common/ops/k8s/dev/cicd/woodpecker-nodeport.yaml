apiVersion: v1
kind: Service
metadata:
  name: woodpecker-server-nodeport
  namespace: cicd
  labels:
    app.kubernetes.io/name: woodpecker
    app.kubernetes.io/component: ci-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: woodpecker
    app.kubernetes.io/managed-by: Helm
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 31980