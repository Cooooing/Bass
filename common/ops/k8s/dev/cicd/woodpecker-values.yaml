server:
  enabled: true
  statefulSet:
    replicaCount: 1
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    tag: v3.9.0
    pullPolicy: IfNotPresent
  env:
    WOODPECKER_HOST: "http://127.0.0.1:31980"
    WOODPECKER_OPEN: "false"
    WOODPECKER_LOG_LEVEL: "info"
    WOODPECKER_ADMIN: "Cooooing"
  extraSecretNamesForEnvFrom:
    - woodpecker-forge-secret
  createAgentSecret: true
  persistentVolume:
    enabled: true
    size: 2Gi
    storageClass: microk8s-hostpath
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

agent:
  enabled: true
  replicaCount: 1
  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: v3.9.0
    pullPolicy: IfNotPresent
  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: cicd
    WOODPECKER_BACKEND_K8S_NAMESPACE_PER_ORGANIZATION: false
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: microk8s-hostpath
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 5G
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
    WOODPECKER_CONNECT_RETRY_COUNT: "3"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: microk8s-hostpath
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
