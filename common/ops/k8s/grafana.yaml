# grafana.yaml
# Grafana：可视化面板，通过 NodePort 30104 暴露给开发环境
# 数据源：ClickHouse（日志 + 链路）、Prometheus（指标）

adminUser: admin
adminPassword: admin123

service:
  type: NodePort
  nodePort: 30104

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

persistence:
  enabled: true
  size: 2Gi

# 安装 ClickHouse Grafana 插件
env:
  GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"

# 预配置数据源
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Prometheus：应用指标 + K8s 集群指标
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true

      # ClickHouse：日志 + 链路
      - name: ClickHouse
        type: grafana-clickhouse-datasource
        uid: clickhouse
        jsonData:
          host: clickhouse
          port: 8123
          protocol: http
          defaultDatabase: otel
          username: admin
        secureJsonData:
          password: "123456"

grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s:30104"
  auth.anonymous:
    enabled: false

