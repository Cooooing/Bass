# Traefik Helm 配置
# 安装命令: helm upgrade --install traefik traefik/traefik -n traefik --create-namespace -f ./traefik-values.yaml

# 部署方式：DaemonSet + hostNetwork
deployment:
  kind: DaemonSet

image:
  registry: docker.io
  repository: traefik
  tag: v3.7.5

hostNetwork: true

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

tolerations:
  - operator: Exists

# 使用 hostNetwork 时，容器端口直接绑定宿主机端口
ports:
  web:
    port: 80
    exposedPort: 80
    hostPort: 80
    protocol: TCP
  websecure:
    port: 443
    exposedPort: 443
    hostPort: 443
    protocol: TCP
  traefik:
    port: 8080
    exposedPort: 8080
    hostPort: 8080
    protocol: TCP
    expose:
      default: false
  metrics:
    port: 9101
    exposedPort: 9101
    hostPort: 9101
    protocol: TCP
    expose:
      default: false
  # TCP 入口使用标准端口
  postgresql:
    port: 5432
    exposedPort: 5432
    hostPort: 5432
    protocol: TCP
  redis:
    port: 6379
    exposedPort: 6379
    hostPort: 6379
    protocol: TCP
  nats:
    port: 4222
    exposedPort: 4222
    hostPort: 4222
    protocol: TCP
  nats-monitor:
    port: 8222
    exposedPort: 8222
    hostPort: 8222
    protocol: TCP

# 资源限制
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# 安全上下文：绑定 80/443 需要 root 权限
securityContext:
  capabilities:
    drop: [ ALL ]
    add: [ NET_BIND_SERVICE ]
  runAsGroup: 0
  runAsUser: 0
  runAsNonRoot: false

# 附加参数
additionalArguments:
  - "--log.level=INFO"
  - "--api.insecure=true"
  - "--ping=true"
  - "--metrics.prometheus=true"
  - "--metrics.prometheus.entrypoint=metrics"
  - "--entryPoints.metrics.address=:9101"

# Service
service:
  enabled: true
  type: ClusterIP
