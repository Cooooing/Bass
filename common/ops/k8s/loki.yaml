# loki.yaml
# 开发环境用 Loki（单体模式，资源占用小）

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # 修复1：禁用所有缓存（开发环境不需要 memcached）
  # 避免 loki-chunks-cache Pending 导致主容器 CrashLoopBackOff
  storage_config:
    boltdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/index_cache
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache

  chunk_store_config:
    chunk_cache_config:
      embedded_cache:
        enabled: true
        max_size_mb: 100

  query_range:
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

# 单体部署模式（开发环境足够）
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

chunksCache:
  enabled: false

resultsCache:
  enabled: false

sidecar:
  enabled: false

# 禁用其他模式的组件
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Alloy 在集群内推送，不需要 NodePort
service:
  type: ClusterIP

gateway:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

test:
  enabled: false

