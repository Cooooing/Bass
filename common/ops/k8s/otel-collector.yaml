# otel-collector.yaml
# OpenTelemetry Collector（contrib）
# - 链路 + 日志 → ClickHouse
# - 应用指标 + K8s 集群指标 → Prometheus

mode: daemonset

# 使用 contrib 发行版（包含 ClickHouse exporter）
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.120.0"

command:
  name: otelcol-contrib

# presets 自动配置 RBAC、volume mounts、receiver
presets:
  # Pod 日志采集（filelog receiver + /var/log/pods 挂载）
  logsCollection:
    enabled: true
    storeCheckpoints: true
  # K8s 集群指标（kubeletstats receiver + RBAC + kubelet TLS 证书挂载）
  kubeletMetrics:
    enabled: true

# 追加自定义配置（与 preset 深度合并）
config:
  receivers:
    # Prometheus scrape：采集应用 /metrics 端点
    # 应用需添加 label: app.kubernetes.io/metrics: "true"
    prometheus:
      config:
        scrape_configs:
          - job_name: "bass-apps"
            scrape_interval: 15s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # 只采集带 metrics 标签的 Pod
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_metrics]
                action: keep
                regex: "true"
              # 使用 Pod IP 作为采集地址（Pod IP 在集群内可直接路由）
              - source_labels: [__meta_kubernetes_pod_ip]
                action: replace
                target_label: __address__
              # 保留 k8s 元数据标签
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                target_label: app

  processors:
    # 手动配置 k8sattributes（preset 的 otel_annotations 键与 v0.120 不兼容）
    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.node.name
          - k8s.deployment.name
          - k8s.container.name
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip

  exporters:
    clickhouse:
      endpoint: http://clickhouse:8123
      database: otel
      username: admin
      password: "123456"
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      sending_queue:
        enabled: true
      retry_on_failure:
        enabled: true
    # 指标写入 Prometheus
    prometheusremotewrite:
      endpoint: http://prometheus:9090/api/v1/write

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [clickhouse]
      logs:
        receivers: [otlp, filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [clickhouse]
      metrics:
        receivers: [prometheus, kubeletstats]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]

# DaemonSet 资源
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ClusterIP（集群内访问）
service:
  enabled: true
  type: ClusterIP

# helm upgrade --install otel-collector open-telemetry/opentelemetry-collector -n bass-test --create-namespace -f ./otel-collector.yaml
