# otel-nodeport.yaml
# OTel Collector NodePort：供本地开发应用发送链路数据到 K8s 集群内的 Collector

apiVersion: v1
kind: Service
metadata:
  name: otel-collector-nodeport
  namespace: bass-test
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: opentelemetry-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30110
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30111

# 部署命令：
# kubectl apply -f ./otel-nodeport.yaml -n bass-test
# 删除命令：
# kubectl delete -f ./otel-nodeport.yaml -n bass-test
