# HTTP 璺敱 - Consul UI, MinIO Console, NATS Monitor
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: consul-ui
  namespace: bass
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`consul.bass.com`)
      kind: Rule
      services:
        - name: bass-consul-ui
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console
  namespace: bass
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`minio.bass.com`)
      kind: Rule
      services:
        - name: bass-minio-console
          port: 9001
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nats-monitor
  namespace: bass
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nats.bass.com`)
      kind: Rule
      services:
        - name: bass-nats-headless
          port: 8222
