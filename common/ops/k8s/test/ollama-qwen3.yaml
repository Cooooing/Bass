apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434

          resources:
            requests:
              cpu: "9"
              memory: "12Gi"
            limits:
              cpu: "10"
              memory: "12Gi"

          volumeMounts:
            - name: models
              mountPath: /root/.ollama

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-agent

spec:
  type: NodePort

  selector:
    app: ollama

  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 31434

