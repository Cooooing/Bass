syntax = "proto3";

package common.api.app.badge.v1;

import "badge/enum/v1/badge.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/badge/v1;v1";

// BadgeService 仅向集群内部提供徽章定义、授予和 SVG 渲染能力。
service BadgeService {
  // 供已登录用户预览完整渲染参数。
  rpc RenderMakerBadge(RenderMakerBadge.Req) returns (RenderMakerBadge.Resp) {}
  // 按已发布徽章编码生成主站 SVG。
  rpc RenderPublishedBadge(RenderPublishedBadge.Req) returns (RenderPublishedBadge.Resp) {}
  // 创建或修改设计者自己的草稿。
  rpc UpsertBadgeDraft(UpsertBadgeDraft.Req) returns (UpsertBadgeDraft.Resp) {}
  // 删除草稿徽章。
  rpc DeleteBadgeDraft(DeleteBadgeDraft.Req) returns (DeleteBadgeDraft.Resp) {}
  // 将草稿发布为可被主站渲染的徽章。
  rpc PublishBadgeDraft(PublishBadgeDraft.Req) returns (PublishBadgeDraft.Resp) {}
  // 查询设计者草稿。
  rpc ListDesignerBadgeDrafts(ListDesignerBadgeDrafts.Req) returns (ListDesignerBadgeDrafts.Resp) {}
  // 批量向用户授予已发布徽章。
  rpc GrantBadge(GrantBadge.Req) returns (GrantBadge.Resp) {}
  // 批量撤销用户徽章。
  rpc RevokeBadge(RevokeBadge.Req) returns (RevokeBadge.Resp) {}
  // 修改用户自己的展示设置。
  rpc UpdateUserBadgePresentation(UpdateUserBadgePresentation.Req) returns (UpdateUserBadgePresentation.Resp) {}
  // 查询用户获得的徽章。
  rpc ListUserBadges(ListUserBadges.Req) returns (ListUserBadges.Resp) {}
}

// RenderSpec 是 SVG 渲染需要的完整强类型参数。
message RenderSpec {
  // Platform 已确认可用的徽章图标资源 ID。
  int64 image_asset_id = 1;
  // 文字条内容，空值表示无文字条。
  string text = 2;
  // 背景颜色，多个颜色生成渐变。
  repeated string background_colors = 3;
  // 文字颜色，空列表按渲染器规则计算。
  repeated string text_colors = 4;
  // 背景渐变方向或角度。
  string background_direction = 5;
  // 文字渐变方向或角度。
  string text_direction = 6;
  // 图标边长，零值采用默认值。
  uint32 size = 7;
  // 图标边距，零值采用默认值。
  uint32 border = 8;
  // 文字条长度，零值自动计算。
  uint32 text_bar_length = 9;
  // 文字字号，零值采用默认值。
  uint32 text_size = 10;
  // 文字条圆角，零值自动计算。
  uint32 text_bar_radius = 11;
  // 整体缩放比例，零值采用默认值。
  double scale = 12;
  // 阴影强度，零值采用默认值。
  double shadow = 13;
  // 动画时长，零值采用默认值。
  double animation_seconds = 14;
  // Platform 已确认可用的自定义字体资源 ID。
  int64 font_asset_id = 15;
}

// Badge 是服务拥有的设计和发布事实。
message Badge {
  // 徽章主键。
  int64 id = 1;
  // 发布后的唯一稳定编码。
  string code = 2;
  // 展示名称。
  string name = 3;
  // 支持变量替换的说明模板。
  string description = 4;
  // 设计者设置的渲染参数。
  RenderSpec render_spec = 5;
  // 设计者账户 ID。
  int64 designer_user_id = 6;
  // 草稿或已发布状态。
  .common.api.app.badge.enum.v1.BadgeStatus status = 7;
  // 创建时间，缺失表示历史数据未记录。
  optional google.protobuf.Timestamp created_at = 1000;
  // 最近修改时间，缺失表示历史数据未记录。
  optional google.protobuf.Timestamp updated_at = 1001;
  // 发布时间，草稿缺失。
  optional google.protobuf.Timestamp published_at = 1002;
}

// UserBadge 是用户获得徽章的事实及展示设置。
message UserBadge {
  // 用户徽章主键。
  int64 id = 1;
  // 获得者用户 ID。
  int64 user_id = 2;
  // 已发布徽章稳定编码。
  string badge_code = 3;
  // 模板变量 JSON 对象。
  string variables_json = 4;
  // 获得或刷新时间。
  google.protobuf.Timestamp obtained_at = 5;
  // 缺失表示永久有效。
  optional google.protobuf.Timestamp expires_at = 6;
  // 是否公开展示。
  bool displayed = 7;
  // 用户内展示排序。
  int32 display_order = 8;
  // 创建时间，缺失表示历史数据未记录。
  optional google.protobuf.Timestamp created_at = 1000;
  // 最近修改时间，缺失表示历史数据未记录。
  optional google.protobuf.Timestamp updated_at = 1001;
}

// RenderMakerBadge 表示登录用户提交参数的 Maker 预览。
message RenderMakerBadge {
  // Req 指定认证后的设计者和预览参数。
  message Req {
    // 已由 BFF 认证的设计者 ID。
    int64 designer_user_id = 1;
    // 待预览的完整渲染参数。
    RenderSpec render_spec = 2;
  }
  // Resp 返回渲染完成的 SVG。
  message Resp {
    // SVG 文本。
    string svg = 1;
  }
}

// RenderPublishedBadge 表示主站按已发布徽章编码渲染。
message RenderPublishedBadge {
  // Req 指定已发布徽章编码。
  message Req {
    // 已发布徽章稳定编码。
    string badge_code = 1;
  }
  // Resp 返回渲染完成的 SVG。
  message Resp {
    // SVG 文本。
    string svg = 1;
  }
}

// UpsertBadgeDraft 表示设计者创建或保存草稿徽章。
message UpsertBadgeDraft {
  // Req 未传 badge_id 时创建草稿；传入时仅能修改自己的草稿。
  message Req {
    // 设计者 ID。
    int64 designer_user_id = 1;
    // 待修改草稿 ID；缺失表示新建。
    optional int64 badge_id = 2;
    // 草稿名称。
    string name = 3;
    // 草稿说明模板。
    string description = 4;
    // 草稿渲染参数。
    RenderSpec render_spec = 5;
  }
  // Resp 返回新建或保存后的草稿。
  message Resp {
    // 已保存草稿。
    Badge badge = 1;
  }
}

// DeleteBadgeDraft 表示删除一个未发布的草稿徽章。
message DeleteBadgeDraft {
  // Req 指定待删除的草稿主键。
  message Req {
    // 待删除草稿 ID。
    int64 badge_id = 1;
    // 已由 BFF 认证的草稿设计者 ID。
    int64 designer_user_id = 2;
  }
  // Resp 表示删除完成。
  message Resp {}
}

// PublishBadgeDraft 表示管理业务发布草稿。
message PublishBadgeDraft {
  // Req 指定待发布草稿及稳定编码。
  message Req {
    // 待发布草稿 ID。
    int64 badge_id = 1;
    // 发布后的稳定编码。
    string code = 2;
  }
  // Resp 返回已发布定义。
  message Resp {
    // 已发布徽章。
    Badge badge = 1;
  }
}

// ListDesignerBadgeDrafts 表示设计者草稿查询。
message ListDesignerBadgeDrafts {
  // Req 指定设计者。
  message Req {
    // 设计者 ID。
    int64 designer_user_id = 1;
  }
  // Resp 返回最多五条草稿。
  message Resp {
    // 草稿列表。
    repeated Badge rows = 1;
  }
}

// GrantBadge 表示管理业务批量授予已发布徽章。
message GrantBadge {
  // Req 的每项独立承载用户、徽章和有效期，避免多个数组形成不明确的组合关系。
  message Req {
    // 待原子授予的徽章事实。
    repeated Item items = 1;
    // Item 是一条用户徽章授予事实。
    message Item {
      // 获得者用户 ID。
      int64 user_id = 1;
      // 已发布徽章稳定编码。
      string badge_code = 2;
      // 变量 JSON 对象。
      string variables_json = 3;
      // 到期时间，缺失表示长期有效。
      optional google.protobuf.Timestamp expires_at = 4;
    }
  }
  // Resp 返回所有已保存的用户徽章。
  message Resp {
    // 已授予或刷新的用户徽章。
    repeated UserBadge rows = 1;
  }
}

// RevokeBadge 表示管理业务批量撤销用户徽章。
message RevokeBadge {
  // Req 的每项精确指定一条待撤销的用户徽章关系。
  message Req {
    // 待原子撤销的用户徽章关系。
    repeated Item items = 1;
    // Item 是一条待撤销的用户徽章关系。
    message Item {
      // 用户 ID。
      int64 user_id = 1;
      // 已发布徽章稳定编码。
      string badge_code = 2;
    }
  }
  // Resp 返回实际撤销的关系数量；不存在的关系不计入数量。
  message Resp {
    // 实际删除的用户徽章关系数。
    int64 count = 1;
  }
}

// UpdateUserBadgePresentation 表示用户修改自身展示设置。
message UpdateUserBadgePresentation {
  // Req 指定展示设置。
  message Req {
    // 用户 ID。
    int64 user_id = 1;
    // 已发布徽章稳定编码。
    string badge_code = 2;
    // 是否展示。
    bool displayed = 3;
    // 展示排序。
    int32 display_order = 4;
  }
  // Resp 返回保存后的用户徽章。
  message Resp {
    // 已保存用户徽章。
    UserBadge user_badge = 1;
  }
}

// ListUserBadges 表示用户徽章查询。
message ListUserBadges {
  // Req 指定用户和展示过滤条件。
  message Req {
    // 用户 ID。
    int64 user_id = 1;
    // 是否仅查询展示项。
    bool displayed_only = 2;
  }
  // Resp 返回用户有效徽章。
  message Resp {
    // 用户徽章列表。
    repeated UserBadge rows = 1;
  }
}
