syntax = "proto3";

package common.api.app.bbs.v1.content;

import "bbs/v1/content/enum.proto";
import "common/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "bbs/v1/user/enum.proto";
import "common/enums/language.proto";

option go_package = "common/proto/gen/bbs/v1/content;content";

// 文章接口。
service ArticleService {
  // 创建文章草稿。
  rpc Create(CreateArticle.Request) returns (CreateArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/create"
      body: "*"
    };
  }

  // 更新文章内容。
  rpc Update(UpdateArticle.Request) returns (UpdateArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/update"
      body: "*"
    };
  }

  // 更新文章内容。兼容旧草稿更新接口。
  rpc UpdateDraft(UpdateDraftArticle.Request) returns (UpdateDraftArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/update-draft"
      body: "*"
    };
  }

  // 发布文章。
  rpc Publish(PublishArticle.Request) returns (PublishArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/publish"
      body: "*"
    };
  }

  // 丢弃草稿。
  rpc DiscardDraft(DiscardDraftArticle.Request) returns (DiscardDraftArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/discard-draft"
      body: "*"
    };
  }

  // 分页查询文章列表。
  rpc List(ListArticles.Request) returns (ListArticles.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/list"
      body: "*"
    };
  }

  // 获取文章详情。
  rpc Get(GetArticle.Request) returns (GetArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/get"
      body: "*"
    };
  }

  // 点赞或取消点赞文章。
  rpc Like(LikeArticle.Request) returns (LikeArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/like"
      body: "*"
    };
  }

  // 感谢或取消感谢文章。
  rpc Thank(ThankArticle.Request) returns (ThankArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/thank"
      body: "*"
    };
  }

  // 收藏或取消收藏文章。
  rpc Collect(CollectArticle.Request) returns (CollectArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/collect"
      body: "*"
    };
  }

  // 关注或取消关注文章。
  rpc Watch(WatchArticle.Request) returns (WatchArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/watch"
      body: "*"
    };
  }

  // 打赏文章。
  rpc Reward(RewardArticle.Request) returns (RewardArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/reward"
      body: "*"
    };
  }

  // 采纳文章评论为答案。
  rpc AcceptAnswer(AcceptAnswerArticle.Request) returns (AcceptAnswerArticle.Response) {
    option (google.api.http) = {
      post: "/v1/content/article/accept-answer"
      body: "*"
    };
  }
}

// 创建文章草稿。
message CreateArticle {
  message Request {
      Article article = 1; // 文章保存内容
      option (gnostic.openapi.v3.schema) = {required: "article"};

      message Article {

        string title = 1; // 标题
        string content = 2; // 原始内容
        optional string reward_content = 4; // 打赏后可见内容
        optional int32 reward_points = 5; // 打赏所需积分
        ArticleType type = 7; // 文章类型
        optional int32 bounty_points = 8; // 悬赏积分
        optional string statement = 9; // 文章声明
        optional bool commentable = 10; // 是否允许评论
        optional bool anonymous = 11; // 是否匿名展示
        repeated int64 tag_ids = 100; // 绑定标签 ID
        option (gnostic.openapi.v3.schema) = {
          required: "title"
          required: "content"
          required: "type"
        };
      }
    }
  message Response {

    message ArticleDetail {

        int64 id = 1; // 文章 ID
        string title = 2; // 标题
        string content = 3; // 原始内容
        string content_render = 4; // 渲染后的内容
        bool has_postscript = 5; // 是否有附言
        bool has_reward = 6; // 是否有打赏内容
        optional string reward_content = 7; // 打赏后可见内容
        optional string reward_content_render = 8; // 渲染后的打赏内容
        optional int32 reward_points = 9; // 打赏所需积分
        ArticleType type = 11; // 文章类型
        optional string statement = 12; // 文章声明
        bool commentable = 13; // 是否允许评论
        bool anonymous = 14; // 是否匿名展示
        int32 view_count = 16; // 浏览数量
        int32 thank_count = 17; // 感谢数量
        int32 like_count = 18; // 点赞数量
        int32 collect_count = 19; // 收藏数量
        int32 watch_count = 20; // 关注数量
        int32 reply_count = 21; // 回复数量
        optional int32 bounty_points = 22; // 悬赏积分
        optional int64 accepted_answer_id = 23; // 已采纳答案评论 ID
        AccountProfile author_user = 24; // 作者展示资料
        AccountProfile last_reply_user = 25; // 最后回复账号展示资料
        string last_reply_at = 26; // 最后回复时间
        optional string cover_image_url = 27; // 封面图片 URL
        ArticleViewerActionState viewer_action_state = 28; // 当前查看账号的文章行为状态
        string published_at = 29; // 发布时间
        repeated ArticlePostscript postscripts = 30; // 附言列表
        ArticlePublishStatus publish_status = 31; // 发布状态
        ArticleVisibility visibility = 32; // 可见范围
        ContentRestriction restriction = 33; // 管理限制
        string edited_at = 34; // 内容编辑时间
        optional int64 created_by = 1002; // 创建账号 ID
        optional int64 updated_by = 1003; // 更新账号 ID
        string created_at = 1000; // 创建时间
        string updated_at = 1001; // 更新时间
      }

    message ArticlePostscript {
        int64 id = 1; // 附言 ID
        int64 article_id = 2; // 文章 ID
        string content = 3; // 原始内容
        string content_render = 4; // 渲染后的内容
        ContentRestriction restriction = 5; // 管理限制
        optional int64 created_by = 1002; // 创建账号 ID
        optional int64 updated_by = 1003; // 更新账号 ID
        string created_at = 1000; // 创建时间
        string updated_at = 1001; // 更新时间
      }

    message AccountProfile {
        // 账号 ID。
        int64 id = 1;
        // 账号名。
        string name = 2;
        // 昵称。
        optional string nickname = 3;
        // 个人主页 URL。
        optional string url = 4;
        // 头像 URL。
        optional string avatar_url = 5;
        // 个人简介。
        optional string introduction = 6;
        // MBTI 类型。
        .common.api.app.bbs.v1.user.MBTI mbti = 7;
        // 账号状态。
        .common.api.app.bbs.v1.user.AccountStatus status = 8;
        // 关注数量。
        optional int32 follow_count = 10;
        // 粉丝数量。
        optional int32 follower_count = 11;
        // 创建时间。
        string created_at = 1000;
        // 更新时间。
        string updated_at = 1001;
      }

    message ArticleViewerActionState {
        bool liked = 1; // 是否已点赞
        bool thanked = 2; // 是否已感谢
        bool collected = 3; // 是否已收藏
        bool watched = 4; // 是否已关注
      }
      ArticleDetail article = 1; // 创建后的文章
    }
}

