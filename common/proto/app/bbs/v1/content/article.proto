// 发布文章。
message PublishArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      ArticleVisibility visibility = 2; // 发布后的可见范围
      option (gnostic.openapi.v3.schema) = {required: "article_id"};
    }
  message Response {}
}

// 丢弃草稿。
message DiscardDraftArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      option (gnostic.openapi.v3.schema) = {required: "article_id"};
    }
  message Response {}
}

// 分页查询文章列表。
message ListArticles {
  message Request {

    message ArticleQuery {

        optional int64 tag_id = 1; // 标签 ID
        optional int64 domain_id = 2; // 板块 ID
        optional ArticleType type = 4; // 文章类型
        optional ArticleOrder order = 5; // 排序方式
        optional string keyword = 6; // 搜索关键词
        optional int64 author_id = 7; // 作者账号 ID
        optional ArticlePublishStatus publish_status = 9; // 发布状态
        repeated ArticlePublishStatus publish_statuses = 10; // 发布状态列表
        optional ArticleVisibility visibility = 11; // 可见范围
        repeated ArticleVisibility visibilities = 12; // 可见范围列表
        optional ContentRestriction restriction = 13; // 管理限制
        repeated ContentRestriction restrictions = 14; // 管理限制列表
      }
      .common.api.app.common.PageRequest page = 1; // 分页参数
      ArticleQuery query = 2; // 查询条件
    }
  message Response {

    message ArticleListItem {

        int64 id = 1; // 文章 ID
        string title = 2; // 标题
        string content = 3; // 摘要原始内容
        string content_render = 4; // 摘要渲染内容
        bool has_postscript = 5; // 是否有附言
        bool has_reward = 6; // 是否有打赏内容
        ArticleType type = 11; // 文章类型
        optional string statement = 12; // 文章声明
        bool commentable = 13; // 是否允许评论
        bool anonymous = 14; // 是否匿名展示
        int32 view_count = 16; // 浏览数量
        int32 thank_count = 17; // 感谢数量
        int32 like_count = 18; // 点赞数量
        int32 collect_count = 19; // 收藏数量
        int32 watch_count = 20; // 关注数量
        int32 reply_count = 21; // 回复数量
        optional int32 bounty_points = 22; // 悬赏积分
        optional int64 accepted_answer_id = 23; // 已采纳答案评论 ID
        AccountProfile author_user = 24; // 作者展示资料
        AccountProfile last_reply_user = 25; // 最后回复账号展示资料
        string last_reply_at = 26; // 最后回复时间
        optional string cover_image_url = 27; // 封面图片 URL
        ArticleViewerActionState viewer_action_state = 28; // 当前查看账号的文章行为状态
        string published_at = 29; // 发布时间
        ArticlePublishStatus publish_status = 30; // 发布状态
        ArticleVisibility visibility = 31; // 可见范围
        ContentRestriction restriction = 32; // 管理限制
        string edited_at = 33; // 内容编辑时间
        optional int64 created_by = 1002; // 创建账号 ID
        optional int64 updated_by = 1003; // 更新账号 ID
        string created_at = 1000; // 创建时间
        string updated_at = 1001; // 更新时间
      }

    message AccountProfile {
        // 账号 ID。
        int64 id = 1;
        // 账号名。
        string name = 2;
        // 昵称。
        optional string nickname = 3;
        // 个人主页 URL。
        optional string url = 4;
        // 头像 URL。
        optional string avatar_url = 5;
        // 个人简介。
        optional string introduction = 6;
        // MBTI 类型。
        .common.api.app.bbs.v1.user.MBTI mbti = 7;
        // 账号状态。
        .common.api.app.bbs.v1.user.AccountStatus status = 8;
        // 关注数量。
        optional int32 follow_count = 10;
        // 粉丝数量。
        optional int32 follower_count = 11;
        // 创建时间。
        string created_at = 1000;
        // 更新时间。
        string updated_at = 1001;
      }

    message ArticleViewerActionState {
        bool liked = 1; // 是否已点赞
        bool thanked = 2; // 是否已感谢
        bool collected = 3; // 是否已收藏
        bool watched = 4; // 是否已关注
      }
      .common.api.app.common.PageResponse page = 1; // 分页结果
      repeated ArticleListItem rows = 2; // 文章列表
    }
}

