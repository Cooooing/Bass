        bool anonymous = 14; // 是否匿名展示
        int32 view_count = 16; // 浏览数量
        int32 thank_count = 17; // 感谢数量
        int32 like_count = 18; // 点赞数量
        int32 collect_count = 19; // 收藏数量
        int32 watch_count = 20; // 关注数量
        int32 reply_count = 21; // 回复数量
        optional int32 bounty_points = 22; // 悬赏积分
        optional int64 accepted_answer_id = 23; // 已采纳答案评论 ID
        AccountProfile author_user = 24; // 作者展示资料
        AccountProfile last_reply_user = 25; // 最后回复账号展示资料
        string last_reply_at = 26; // 最后回复时间
        optional string cover_image_url = 27; // 封面图片 URL
        ArticleViewerActionState viewer_action_state = 28; // 当前查看账号的文章行为状态
        string published_at = 29; // 发布时间
        repeated ArticlePostscript postscripts = 30; // 附言列表
        ArticlePublishStatus publish_status = 31; // 发布状态
        ArticleVisibility visibility = 32; // 可见范围
        ContentRestriction restriction = 33; // 管理限制
        string edited_at = 34; // 内容编辑时间
        optional int64 created_by = 1002; // 创建账号 ID
        optional int64 updated_by = 1003; // 更新账号 ID
        string created_at = 1000; // 创建时间
        string updated_at = 1001; // 更新时间
      }

    message ArticlePostscript {
        int64 id = 1; // 附言 ID
        int64 article_id = 2; // 文章 ID
        string content = 3; // 原始内容
        string content_render = 4; // 渲染后的内容
        ContentRestriction restriction = 5; // 管理限制
        optional int64 created_by = 1002; // 创建账号 ID
        optional int64 updated_by = 1003; // 更新账号 ID
        string created_at = 1000; // 创建时间
        string updated_at = 1001; // 更新时间
      }

    message AccountProfile {
        // 账号 ID。
        int64 id = 1;
        // 账号名。
        string name = 2;
        // 昵称。
        optional string nickname = 3;
        // 个人主页 URL。
        optional string url = 4;
        // 头像 URL。
        optional string avatar_url = 5;
        // 个人简介。
        optional string introduction = 6;
        // MBTI 类型。
        .common.api.app.bbs.v1.user.MBTI mbti = 7;
        // 账号状态。
        .common.api.app.bbs.v1.user.AccountStatus status = 8;
        // 关注数量。
        optional int32 follow_count = 10;
        // 粉丝数量。
        optional int32 follower_count = 11;
        // 创建时间。
        string created_at = 1000;
        // 更新时间。
        string updated_at = 1001;
      }

    message ArticleViewerActionState {
        bool liked = 1; // 是否已点赞
        bool thanked = 2; // 是否已感谢
        bool collected = 3; // 是否已收藏
        bool watched = 4; // 是否已关注
      }
      ArticleDetail article = 1; // 文章详情
    }
}

// 点赞或取消点赞文章。
message LikeArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      bool active = 2; // 是否点赞
      option (gnostic.openapi.v3.schema) = {
        required: "article_id"
        required: "active"
      };
    }
  message Response {
      bool liked = 1; // 是否已点赞
    }
}

// 感谢或取消感谢文章。
message ThankArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      bool active = 2; // 是否感谢
      option (gnostic.openapi.v3.schema) = {
        required: "article_id"
        required: "active"
      };
    }
  message Response {
      bool thanked = 1; // 是否已感谢
    }
}

// 收藏或取消收藏文章。
message CollectArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      bool active = 2; // 是否收藏
      option (gnostic.openapi.v3.schema) = {
        required: "article_id"
        required: "active"
      };
    }
  message Response {
      bool collected = 1; // 是否已收藏
    }
}

// 关注或取消关注文章。
message WatchArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      bool active = 2; // 是否关注
      option (gnostic.openapi.v3.schema) = {
        required: "article_id"
        required: "active"
      };
    }
  message Response {
      bool watched = 1; // 是否已关注
    }
}

// 打赏文章。
message RewardArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      int32 points = 2; // 积分
      option (gnostic.openapi.v3.schema) = {required: "article_id"};
    }
  message Response {}
}

// 采纳文章评论为答案。
message AcceptAnswerArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      int64 comment_id = 2; // 评论 ID
      option (gnostic.openapi.v3.schema) = {
        required: "article_id"
        required: "comment_id"
      };
    }
  message Response {}
}

