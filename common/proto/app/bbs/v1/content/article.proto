syntax = "proto3";

package common.api.app.bbs.v1.content;

import "bbs/v1/content/enum.proto";
import "bbs/v1/content/model.proto";
import "common/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "common/proto/gen/bbs/v1/content;content";

// 文章接口。
service ArticleService {
  // 创建文章草稿。
  rpc Create(CreateArticle.Request) returns (CreateArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/create"
      body: "*"
    };
  }

  // 更新文章内容。
  rpc Update(UpdateArticle.Request) returns (UpdateArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/update"
      body: "*"
    };
  }

  // 更新文章内容。兼容旧草稿更新接口。
  rpc UpdateDraft(UpdateDraftArticle.Request) returns (UpdateDraftArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/update-draft"
      body: "*"
    };
  }

  // 发布文章。
  rpc Publish(PublishArticle.Request) returns (PublishArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/publish"
      body: "*"
    };
  }

  // 丢弃草稿。
  rpc DiscardDraft(DiscardDraftArticle.Request) returns (DiscardDraftArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/discard-draft"
      body: "*"
    };
  }

  // 分页查询文章列表。
  rpc List(ListArticles.Request) returns (ListArticles.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/list"
      body: "*"
    };
  }

  // 获取文章详情。
  rpc Get(GetArticle.Request) returns (GetArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/get"
      body: "*"
    };
  }

  // 点赞或取消点赞文章。
  rpc Like(LikeArticle.Request) returns (LikeArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/like"
      body: "*"
    };
  }

  // 感谢或取消感谢文章。
  rpc Thank(ThankArticle.Request) returns (ThankArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/thank"
      body: "*"
    };
  }

  // 收藏或取消收藏文章。
  rpc Collect(CollectArticle.Request) returns (CollectArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/collect"
      body: "*"
    };
  }

  // 关注或取消关注文章。
  rpc Watch(WatchArticle.Request) returns (WatchArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/watch"
      body: "*"
    };
  }

  // 打赏文章。
  rpc Reward(RewardArticle.Request) returns (RewardArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/reward"
      body: "*"
    };
  }

  // 采纳文章评论为答案。
  rpc AcceptAnswer(AcceptAnswerArticle.Request) returns (AcceptAnswerArticle.Reply) {
    option (google.api.http) = {
      post: "/v1/content/article/accept-answer"
      body: "*"
    };
  }
}

// 创建文章草稿。
message CreateArticle {
  message Request {
    Article article = 1; // 文章保存内容
    option (gnostic.openapi.v3.schema) = {required: "article"};

    message Article {
      reserved 6, 12;

      string title = 1; // 标题
      string content = 2; // 原始内容
      optional string reward_content = 4; // 打赏后可见内容
      optional int32 reward_points = 5; // 打赏所需积分
      ArticleType type = 7; // 文章类型
      optional int32 bounty_points = 8; // 悬赏积分
      optional string statement = 9; // 文章声明
      optional bool commentable = 10; // 是否允许评论
      optional bool anonymous = 11; // 是否匿名展示
      repeated int64 tag_ids = 100; // 绑定标签 ID
      option (gnostic.openapi.v3.schema) = {
        required: "title"
        required: "content"
        required: "type"
      };
    }
  }
  message Reply {
    ArticleDetail article = 1; // 创建后的文章
  }
}

// 更新文章内容。
message UpdateArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    Article article = 2; // 文章保存内容
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "article"
    };

    message Article {
      reserved 6, 12;

      string title = 1; // 标题
      string content = 2; // 原始内容
      optional string reward_content = 4; // 打赏后可见内容
      optional int32 reward_points = 5; // 打赏所需积分
      ArticleType type = 7; // 文章类型
      optional int32 bounty_points = 8; // 悬赏积分
      optional string statement = 9; // 文章声明
      optional bool commentable = 10; // 是否允许评论
      optional bool anonymous = 11; // 是否匿名展示
      repeated int64 tag_ids = 100; // 绑定标签 ID
      option (gnostic.openapi.v3.schema) = {
        required: "title"
        required: "content"
        required: "type"
      };
    }
  }
  message Reply {
    ArticleDetail article = 1; // 更新后的文章
  }
}

// 更新文章内容。兼容旧草稿更新接口。
message UpdateDraftArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    Article article = 2; // 文章保存内容
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "article"
    };

    message Article {
      reserved 6, 12;

      string title = 1; // 标题
      string content = 2; // 原始内容
      optional string reward_content = 4; // 打赏后可见内容
      optional int32 reward_points = 5; // 打赏所需积分
      ArticleType type = 7; // 文章类型
      optional int32 bounty_points = 8; // 悬赏积分
      optional string statement = 9; // 文章声明
      optional bool commentable = 10; // 是否允许评论
      optional bool anonymous = 11; // 是否匿名展示
      repeated int64 tag_ids = 100; // 绑定标签 ID
      option (gnostic.openapi.v3.schema) = {
        required: "title"
        required: "content"
        required: "type"
      };
    }
  }
  message Reply {
    ArticleDetail article = 1; // 更新后的文章
  }
}

// 发布文章。
message PublishArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    ArticleVisibility visibility = 2; // 发布后的可见范围
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  message Reply {}
}

// 丢弃草稿。
message DiscardDraftArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  message Reply {}
}

// 分页查询文章列表。
message ListArticles {
  message Request {
    common.PageRequest page = 1; // 分页参数
    ArticleQuery query = 2; // 查询条件
  }
  message Reply {
    common.PageReply page = 1; // 分页结果
    repeated ArticleListItem rows = 2; // 文章列表
  }
}

// 获取文章详情。
message GetArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  message Reply {
    ArticleDetail article = 1; // 文章详情
  }
}

// 点赞或取消点赞文章。
message LikeArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    bool active = 2; // 是否点赞
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  message Reply {
    bool liked = 1; // 是否已点赞
  }
}

// 感谢或取消感谢文章。
message ThankArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    bool active = 2; // 是否感谢
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  message Reply {
    bool thanked = 1; // 是否已感谢
  }
}

// 收藏或取消收藏文章。
message CollectArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    bool active = 2; // 是否收藏
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  message Reply {
    bool collected = 1; // 是否已收藏
  }
}

// 关注或取消关注文章。
message WatchArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    bool active = 2; // 是否关注
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  message Reply {
    bool watched = 1; // 是否已关注
  }
}

// 打赏文章。
message RewardArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    int32 points = 2; // 积分
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  message Reply {}
}

// 采纳文章评论为答案。
message AcceptAnswerArticle {
  message Request {
    int64 article_id = 1; // 文章 ID
    int64 comment_id = 2; // 评论 ID
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "comment_id"
    };
  }
  message Reply {}
}

// 文章查询条件。
message ArticleQuery {
  reserved 3, 8;

  optional int64 tag_id = 1; // 标签 ID
  optional int64 domain_id = 2; // 板块 ID
  optional ArticleType type = 4; // 文章类型
  optional ArticleOrder order = 5; // 排序方式
  optional string keyword = 6; // 搜索关键词
  optional int64 author_id = 7; // 作者账号 ID
  optional ArticlePublishStatus publish_status = 9; // 发布状态
  repeated ArticlePublishStatus publish_statuses = 10; // 发布状态列表
  optional ArticleVisibility visibility = 11; // 可见范围
  repeated ArticleVisibility visibilities = 12; // 可见范围列表
  optional ContentRestriction restriction = 13; // 管理限制
  repeated ContentRestriction restrictions = 14; // 管理限制列表
}
