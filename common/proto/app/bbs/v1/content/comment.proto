// 点赞或取消点赞评论。
message LikeComment {
  message Req {
    int64 id = 1; // 评论 ID
    bool active = 2; // 是否点赞
    option (gnostic.openapi.v3.schema) = {
      required: "id"
      required: "active"
    };
  }
  message Resp {
    bool liked = 1; // 是否已点赞
  }
}

// 感谢或取消感谢评论。
message ThankComment {
  message Req {
    int64 id = 1; // 评论 ID
    bool active = 2; // 是否感谢
    option (gnostic.openapi.v3.schema) = {
      required: "id"
      required: "active"
    };
  }
  message Resp {
    bool thanked = 1; // 是否已感谢
  }
}

// 评论查询条件。
