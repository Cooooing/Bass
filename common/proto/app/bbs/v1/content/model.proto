syntax = "proto3";

package common.api.app.bbs.v1.content;

import "bbs/v1/content/enum.proto";
import "bbs/v1/user/model.proto";

option go_package = "common/proto/gen/bbs/v1/content;content";

// 文章摘要。
message ArticleBrief {
  reserved 3;

  int64 id = 1; // 文章 ID
  string title = 2; // 标题
  ArticleType type = 4; // 文章类型
  bool anonymous = 5; // 是否匿名展示
  common.api.app.bbs.v1.user.AccountProfile author_user = 6; // 作者展示资料
  optional string cover_image_url = 7; // 封面图片 URL
  ArticlePublishStatus publish_status = 8; // 发布状态
  ArticleVisibility visibility = 9; // 可见范围
  ContentRestriction restriction = 10; // 管理限制
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 文章列表项。
message ArticleListItem {
  reserved 10, 15;

  int64 id = 1; // 文章 ID
  string title = 2; // 标题
  string content = 3; // 摘要原始内容
  string content_render = 4; // 摘要渲染内容
  bool has_postscript = 5; // 是否有附言
  bool has_reward = 6; // 是否有打赏内容
  ArticleType type = 11; // 文章类型
  optional string statement = 12; // 文章声明
  bool commentable = 13; // 是否允许评论
  bool anonymous = 14; // 是否匿名展示
  int32 view_count = 16; // 浏览数量
  int32 thank_count = 17; // 感谢数量
  int32 like_count = 18; // 点赞数量
  int32 collect_count = 19; // 收藏数量
  int32 watch_count = 20; // 关注数量
  int32 reply_count = 21; // 回复数量
  optional int32 bounty_points = 22; // 悬赏积分
  optional int64 accepted_answer_id = 23; // 已采纳答案评论 ID
  common.api.app.bbs.v1.user.AccountProfile author_user = 24; // 作者展示资料
  common.api.app.bbs.v1.user.AccountProfile last_reply_user = 25; // 最后回复账号展示资料
  string last_reply_at = 26; // 最后回复时间
  optional string cover_image_url = 27; // 封面图片 URL
  ArticleViewerActionState viewer_action_state = 28; // 当前查看账号的文章行为状态
  string published_at = 29; // 发布时间
  ArticlePublishStatus publish_status = 30; // 发布状态
  ArticleVisibility visibility = 31; // 可见范围
  ContentRestriction restriction = 32; // 管理限制
  string edited_at = 33; // 内容编辑时间
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 文章详情。
message ArticleDetail {
  reserved 10, 15;

  int64 id = 1; // 文章 ID
  string title = 2; // 标题
  string content = 3; // 原始内容
  string content_render = 4; // 渲染后的内容
  bool has_postscript = 5; // 是否有附言
  bool has_reward = 6; // 是否有打赏内容
  optional string reward_content = 7; // 打赏后可见内容
  optional string reward_content_render = 8; // 渲染后的打赏内容
  optional int32 reward_points = 9; // 打赏所需积分
  ArticleType type = 11; // 文章类型
  optional string statement = 12; // 文章声明
  bool commentable = 13; // 是否允许评论
  bool anonymous = 14; // 是否匿名展示
  int32 view_count = 16; // 浏览数量
  int32 thank_count = 17; // 感谢数量
  int32 like_count = 18; // 点赞数量
  int32 collect_count = 19; // 收藏数量
  int32 watch_count = 20; // 关注数量
  int32 reply_count = 21; // 回复数量
  optional int32 bounty_points = 22; // 悬赏积分
  optional int64 accepted_answer_id = 23; // 已采纳答案评论 ID
  common.api.app.bbs.v1.user.AccountProfile author_user = 24; // 作者展示资料
  common.api.app.bbs.v1.user.AccountProfile last_reply_user = 25; // 最后回复账号展示资料
  string last_reply_at = 26; // 最后回复时间
  optional string cover_image_url = 27; // 封面图片 URL
  ArticleViewerActionState viewer_action_state = 28; // 当前查看账号的文章行为状态
  string published_at = 29; // 发布时间
  repeated ArticlePostscript postscripts = 30; // 附言列表
  ArticlePublishStatus publish_status = 31; // 发布状态
  ArticleVisibility visibility = 32; // 可见范围
  ContentRestriction restriction = 33; // 管理限制
  string edited_at = 34; // 内容编辑时间
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 当前查看账号的文章行为状态。
message ArticleViewerActionState {
  bool liked = 1; // 是否已点赞
  bool thanked = 2; // 是否已感谢
  bool collected = 3; // 是否已收藏
  bool watched = 4; // 是否已关注
}

// 文章附言。
message ArticlePostscript {
  int64 id = 1; // 附言 ID
  int64 article_id = 2; // 文章 ID
  string content = 3; // 原始内容
  string content_render = 4; // 渲染后的内容
  ContentRestriction restriction = 5; // 管理限制
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 评论列表项。
message CommentListItem {
  reserved 8;

  int64 id = 1; // 评论 ID
  int64 article_id = 2; // 文章 ID
  string content = 3; // 原始内容
  string content_render = 4; // 渲染后的内容
  int32 level = 5; // 评论层级
  optional int64 parent_id = 6; // 父评论 ID
  optional int64 reply_id = 7; // 回复的评论 ID
  int32 reply_count = 9; // 回复数量
  int32 like_count = 10; // 点赞数量
  int32 thank_count = 11; // 感谢数量
  common.api.app.bbs.v1.user.AccountProfile user = 12; // 评论账号展示资料
  common.api.app.bbs.v1.user.AccountProfile reply_user = 13; // 被回复账号展示资料
  ArticleBrief article = 14; // 所属文章摘要
  CommentViewerActionState viewer_action_state = 15; // 当前查看账号的评论行为状态
  ContentRestriction restriction = 16; // 管理限制
  string deleted_at = 17; // 逻辑删除时间
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 评论楼层项。
message CommentThread {
  CommentListItem root = 1; // 顶层评论
  repeated CommentListItem preview_replies = 2; // 回复预览列表
  int32 reply_count = 3; // 回复数量
  bool has_more_replies = 4; // 是否还有更多回复
}

// 评论详情。
message CommentDetail {
  reserved 8;

  int64 id = 1; // 评论 ID
  int64 article_id = 2; // 文章 ID
  string content = 3; // 原始内容
  string content_render = 4; // 渲染后的内容
  int32 level = 5; // 评论层级
  optional int64 parent_id = 6; // 父评论 ID
  optional int64 reply_id = 7; // 回复的评论 ID
  int32 reply_count = 9; // 回复数量
  int32 like_count = 10; // 点赞数量
  int32 thank_count = 11; // 感谢数量
  common.api.app.bbs.v1.user.AccountProfile user = 12; // 评论账号展示资料
  common.api.app.bbs.v1.user.AccountProfile reply_user = 13; // 被回复账号展示资料
  ArticleBrief article = 14; // 所属文章摘要
  CommentViewerActionState viewer_action_state = 15; // 当前查看账号的评论行为状态
  ContentRestriction restriction = 16; // 管理限制
  string deleted_at = 17; // 逻辑删除时间
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 当前查看账号的评论行为状态。
message CommentViewerActionState {
  bool liked = 1; // 是否已点赞
  bool thanked = 2; // 是否已感谢
}

// 标签。
message Tag {
  int64 id = 1; // 标签 ID
  string name = 2; // 标签名称
  optional string description = 3; // 标签描述
  optional int64 domain_id = 4; // 所属板块 ID
  optional TagStatus status = 5; // 标签启停状态
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}

// 内容板块。
message Domain {
  int64 id = 1; // 板块 ID
  string name = 2; // 板块名称
  optional string description = 3; // 板块描述
  DomainStatus status = 4; // 板块启停状态
  optional string url = 5; // 板块 URL
  optional string icon = 6; // 板块图标
  bool is_nav = 7; // 是否在导航中展示
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  string created_at = 1000; // 创建时间
  string updated_at = 1001; // 更新时间
}
