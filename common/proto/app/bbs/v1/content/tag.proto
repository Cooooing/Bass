syntax = "proto3";

package common.api.app.bbs.v1.content;

import "bbs/v1/content/enum/tag.proto";
import "common/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bbs/v1/content;content";

// 标签 HTTP 接口。
service TagService {
  // 创建标签。
  rpc Create(CreateTag.Req) returns (CreateTag.Resp) {
    option (google.api.http) = {
      post: "/v1/content/tag/create"
      body: "*"
    };
  }

  // 更新标签。
  rpc Update(UpdateTag.Req) returns (UpdateTag.Resp) {
    option (google.api.http) = {
      post: "/v1/content/tag/update"
      body: "*"
    };
  }

  // 绑定文章标签。
  rpc BindArticle(BindArticleTags.Req) returns (BindArticleTags.Resp) {
    option (google.api.http) = {
      post: "/v1/content/tag/bind-article"
      body: "*"
    };
  }

  // 解绑文章标签。
  rpc UnbindArticle(UnbindArticleTags.Req) returns (UnbindArticleTags.Resp) {
    option (google.api.http) = {
      post: "/v1/content/tag/unbind-article"
      body: "*"
    };
  }

  // 查询文章标签列表。
  rpc ListArticleTags(ListArticleTags.Req) returns (ListArticleTags.Resp) {
    option (google.api.http) = {
      post: "/v1/content/tag/list-article-tags"
      body: "*"
    };
  }

  // 查询标签列表。
  rpc List(ListTags.Req) returns (ListTags.Resp) {
    option (google.api.http) = {
      post: "/v1/content/tag/list"
      body: "*"
    };
  }
}

// 创建标签。
message CreateTag {
  message Req {
    Tag tag = 1; // 标签信息
    option (gnostic.openapi.v3.schema) = {required: "tag"};

    message Tag {
      string code = 1; // 稳定编码
      string name = 2; // 标签名称
      optional string description = 3; // 描述
      int64 domain_id = 4; // 领域 ID
      optional TagStatus status = 5; // 启停状态
      optional string icon = 6; // 图标
      int32 sort = 7; // 排序值，越小越靠前
      option (gnostic.openapi.v3.schema) = {required: "code"
        required: "name"
        required: "domain_id"};
    }
  }

  message Resp {
    Tag tag = 1; // 标签信息

    message Tag {
      int64 id = 1; // 标签 ID
      string code = 2; // 稳定编码
      string name = 3; // 标签名称
      optional string description = 4; // 描述
      optional int64 domain_id = 5; // 领域 ID
      optional TagStatus status = 6; // 启停状态
      optional string icon = 7; // 图标
      int32 sort = 8; // 排序值，越小越靠前
      int32 article_count = 9; // 文章数量
      optional int64 created_by = 1002; // 创建用户 ID
      optional int64 updated_by = 1003; // 更新用户 ID
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
  }
}

// 更新标签。
message UpdateTag {
  message Req {
    int64 tag_id = 1; // 标签 ID
    Tag tag = 2; // 标签信息
    option (gnostic.openapi.v3.schema) = {required: "tag_id"
      required: "tag"};

    message Tag {
      string code = 1; // 稳定编码
      string name = 2; // 标签名称
      optional string description = 3; // 描述
      int64 domain_id = 4; // 领域 ID
      optional TagStatus status = 5; // 启停状态
      optional string icon = 6; // 图标
      int32 sort = 7; // 排序值，越小越靠前
      option (gnostic.openapi.v3.schema) = {required: "code"
        required: "name"
        required: "domain_id"};
    }
  }

  message Resp {
    Tag tag = 1; // 标签信息

    message Tag {
      int64 id = 1; // 标签 ID
      string code = 2; // 稳定编码
      string name = 3; // 标签名称
      optional string description = 4; // 描述
      optional int64 domain_id = 5; // 领域 ID
      optional TagStatus status = 6; // 启停状态
      optional string icon = 7; // 图标
      int32 sort = 8; // 排序值，越小越靠前
      int32 article_count = 9; // 文章数量
      optional int64 created_by = 1002; // 创建用户 ID
      optional int64 updated_by = 1003; // 更新用户 ID
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
  }
}

// 绑定文章标签。
message BindArticleTags {
  message Req {
    int64 article_id = 1; // 文章 ID
    repeated int64 tag_ids = 2; // 标签 ID 列表
    option (gnostic.openapi.v3.schema) = {required: "article_id"
      required: "tag_ids"};
  }

  message Resp {}
}

// 解绑文章标签。
message UnbindArticleTags {
  message Req {
    int64 article_id = 1; // 文章 ID
    repeated int64 tag_ids = 2; // 标签 ID 列表
    option (gnostic.openapi.v3.schema) = {required: "article_id"
      required: "tag_ids"};
  }

  message Resp {}
}

// 查询文章标签列表。
message ListArticleTags {
  message Req {
    int64 article_id = 1; // 文章 ID
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }

  message Resp {
    repeated Tag rows = 1; // 标签列表

    message Tag {
      int64 id = 1; // 标签 ID
      string code = 2; // 稳定编码
      string name = 3; // 标签名称
      optional string description = 4; // 描述
      optional int64 domain_id = 5; // 领域 ID
      optional TagStatus status = 6; // 启停状态
      optional string icon = 7; // 图标
      int32 sort = 8; // 排序值，越小越靠前
      int32 article_count = 9; // 文章数量
      optional int64 created_by = 1002; // 创建用户 ID
      optional int64 updated_by = 1003; // 更新用户 ID
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
  }
}

// 查询标签列表。
message ListTags {
  message Req {
    .common.api.app.common.PageReq page = 1; // 分页参数
    TagQuery query = 2; // 查询条件

    message TagQuery {
      repeated int64 ids = 1; // 标签 ID 列表
      optional string code = 2; // 稳定编码
      optional string name = 3; // 标签名称
      repeated string names = 4; // 标签名称列表
      optional string description = 5; // 描述
      optional TagStatus status = 6; // 启停状态
      optional int64 domain_id = 7; // 领域 ID
    }
  }

  message Resp {
    .common.api.app.common.PageResp page = 1; // 分页结果
    repeated Tag rows = 2; // 标签列表

    message Tag {
      int64 id = 1; // 标签 ID
      string code = 2; // 稳定编码
      string name = 3; // 标签名称
      optional string description = 4; // 描述
      optional int64 domain_id = 5; // 领域 ID
      optional TagStatus status = 6; // 启停状态
      optional string icon = 7; // 图标
      int32 sort = 8; // 排序值，越小越靠前
      int32 article_count = 9; // 文章数量
      optional int64 created_by = 1002; // 创建用户 ID
      optional int64 updated_by = 1003; // 更新用户 ID
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
  }
}
