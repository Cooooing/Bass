syntax = "proto3";

package common.api.app.bbs.v1.notify;

import "common/common.proto";
import "common/enums/event.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bbs/v1/notify;notify";

// 通知接口。
service NotificationService {
  // 分页查询通知列表。
  rpc List(ListNotifications.Req) returns (ListNotifications.Resp) {
    option (google.api.http) = {
      post: "/v1/notify/notification/list"
      body: "*"
    };
  }

  // 标记通知为已读。
  rpc MarkRead(MarkReadNotification.Req) returns (MarkReadNotification.Resp) {
    option (google.api.http) = {
      post: "/v1/notify/notification/mark-read"
      body: "*"
    };
  }

  // 统计未读通知数量。
  rpc CountUnread(CountUnreadNotifications.Req) returns (CountUnreadNotifications.Resp) {
    option (google.api.http) = {
      post: "/v1/notify/notification/count-unread"
      body: "*"
    };
  }
}

// 分页查询通知列表。
message ListNotifications {
  message Req {
    .common.api.app.common.PageReq page = 1; // 分页参数
  }
  message Resp {
    message Notification {
      int64 id = 1; // 通知 ID
      string event_id = 2; // 来源事件 ID
      int64 receiver_id = 3; // 接收账号 ID
      common.enums.EventType event_type = 4; // 来源事件类型
      string title = 5; // 通知标题
      string content = 6; // 通知内容
      google.protobuf.Timestamp read_at = 7; // 已读时间
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
    .common.api.app.common.PageResp page = 1; // 分页结果
    repeated Notification rows = 2; // 通知列表
  }
}

// 标记通知为已读。
message MarkReadNotification {
  message Req {
    repeated int64 ids = 1; // 通知 ID 列表
    option (gnostic.openapi.v3.schema) = {
      required: "ids"
    };
  }
  message Resp {
    int32 count = 1; // 成功标记的通知数量
  }
}

// 统计未读通知数量。
message CountUnreadNotifications {
  message Req {}
  message Resp {
    int64 count = 1; // 未读通知数量
  }
}
