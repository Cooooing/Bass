syntax = "proto3";

package common.api.app.bbs.v1.user;

import "bbs/v1/user/enum.proto";
import "common/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "common/enums/language.proto";

option go_package = "common/proto/gen/bbs/v1/user;user";

// 账号接口。
service AccountService {
  // 获取当前账号的完整资料。
  rpc GetCurrent(GetCurrentAccount.Request) returns (GetCurrentAccount.Response) {
    option (google.api.http) = {
      post: "/v1/user/account/get-current"
      body: "*"
    };
  }

  // 按账号 ID 获取账号展示资料。
  rpc GetProfile(GetProfileAccount.Request) returns (GetProfileAccount.Response) {
    option (google.api.http) = {
      post: "/v1/user/account/get-profile"
      body: "*"
    };
  }

  // 更新当前账号的展示资料。
  rpc UpdateProfile(UpdateProfileAccount.Request) returns (UpdateProfileAccount.Response) {
    option (google.api.http) = {
      post: "/v1/user/account/update-profile"
      body: "*"
    };
  }

  // 生成默认账号头像。
  rpc Avatar(AvatarAccount.Request) returns (.common.api.app.common.ImageResponse) {
    option (google.api.http) = {get: "/v1/user/account/avatar"};
  }
}

// 获取当前账号的完整资料。
message GetCurrentAccount {
  message Request {}
  message Response {

    message Account {
      // 账号展示资料。
      AccountProfile profile = 1;
      // 账号联系方式。
      AccountContact contact = 2;
    }

    message AccountContact {
      // 账号 ID。
      int64 user_id = 1;
      // 邮箱地址。
      optional string email = 2;
      // 手机号。
      optional string phone = 3;
    }

    message AccountProfile {
      // 账号 ID。
      int64 id = 1;
      // 账号名。
      string name = 2;
      // 昵称。
      optional string nickname = 3;
      // 个人主页 URL。
      optional string url = 4;
      // 头像 URL。
      optional string avatar_url = 5;
      // 个人简介。
      optional string introduction = 6;
      // MBTI 类型。
      MBTI mbti = 7;
      // 账号状态。
      AccountStatus status = 8;
      // 关注数量。
      optional int32 follow_count = 10;
      // 粉丝数量。
      optional int32 follower_count = 11;
      // 创建时间。
      string created_at = 1000;
      // 更新时间。
      string updated_at = 1001;
    }
    // 当前账号完整资料。
    Account account = 1;
  }
}

// 按账号 ID 获取账号展示资料。
message GetProfileAccount {
  message Request {
    // 账号 ID。
    int64 user_id = 1;
    option (gnostic.openapi.v3.schema) = {required: "user_id"};
  }
  message Response {

    message AccountProfile {
      // 账号 ID。
      int64 id = 1;
      // 账号名。
      string name = 2;
      // 昵称。
      optional string nickname = 3;
      // 个人主页 URL。
      optional string url = 4;
      // 头像 URL。
      optional string avatar_url = 5;
      // 个人简介。
      optional string introduction = 6;
      // MBTI 类型。
      MBTI mbti = 7;
      // 账号状态。
      AccountStatus status = 8;
      // 关注数量。
      optional int32 follow_count = 10;
      // 粉丝数量。
      optional int32 follower_count = 11;
      // 创建时间。
      string created_at = 1000;
      // 更新时间。
      string updated_at = 1001;
    }
    // 账号展示资料。
    AccountProfile profile = 1;
  }
}

// 更新当前账号的展示资料。
message UpdateProfileAccount {
  message Request {
    // 头像 URL。
    optional string avatar_url = 1;
    // 昵称。
    optional string nickname = 2;
    // 个人主页 URL。
    optional string url = 3;
    // 个人简介。
    optional string introduction = 4;
    // MBTI 类型。
    optional MBTI mbti = 5;
  }
  message Response {

    message AccountProfile {
      // 账号 ID。
      int64 id = 1;
      // 账号名。
      string name = 2;
      // 昵称。
      optional string nickname = 3;
      // 个人主页 URL。
      optional string url = 4;
      // 头像 URL。
      optional string avatar_url = 5;
      // 个人简介。
      optional string introduction = 6;
      // MBTI 类型。
      MBTI mbti = 7;
      // 账号状态。
      AccountStatus status = 8;
      // 关注数量。
      optional int32 follow_count = 10;
      // 粉丝数量。
      optional int32 follower_count = 11;
      // 创建时间。
      string created_at = 1000;
      // 更新时间。
      string updated_at = 1001;
    }
    // 更新后的账号展示资料。
    AccountProfile profile = 1;
  }
}

// 生成默认账号头像。
message AvatarAccount {
  message Request {
    // 用于生成头像的账号名。
    string name = 1;
    option (gnostic.openapi.v3.schema) = {required: "name"};
  }
}
