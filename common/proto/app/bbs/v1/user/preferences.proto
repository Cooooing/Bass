syntax = "proto3";

package common.api.app.bbs.v1.user;

import "common/enums/language.proto";
import "google/api/annotations.proto";
import "bbs/v1/user/enum.proto";

option go_package = "common/proto/gen/bbs/v1/user;user";

// 账号偏好设置接口。
service PreferencesService {
  // 获取当前账号的偏好设置。
  rpc GetCurrent(GetCurrentPreferences.Request) returns (GetCurrentPreferences.Response) {
    option (google.api.http) = {
      post: "/v1/user/preference/get-current"
      body: "*"
    };
  }

  // 更新当前账号的偏好设置。
  rpc UpdateCurrent(UpdateCurrentPreferences.Request) returns (UpdateCurrentPreferences.Response) {
    option (google.api.http) = {
      post: "/v1/user/preference/update-current"
      body: "*"
    };
  }
}

// 获取当前账号的偏好设置。
message GetCurrentPreferences {
  message Request {}
  message Response {

    message Preference {
      // 账号 ID。
      int64 user_id = 1;
      // 时区。
      optional string timezone = 3;
      // 桌面端主题。
      optional string theme = 4;
      // 移动端主题。
      optional string mobile_theme = 5;
      // 界面语言。
      common.enums.Language language = 8;
    }
    // 当前账号偏好设置。
    Preference preference = 1;
  }
}

// 更新当前账号的偏好设置。
message UpdateCurrentPreferences {
  message Request {
    // 时区。
    optional string timezone = 2;
    // 桌面端主题。
    optional string theme = 3;
    // 移动端主题。
    optional string mobile_theme = 4;
    // 界面语言。
    optional common.enums.Language language = 7;
  }
  message Response {

    message Preference {
      // 账号 ID。
      int64 user_id = 1;
      // 时区。
      optional string timezone = 3;
      // 桌面端主题。
      optional string theme = 4;
      // 移动端主题。
      optional string mobile_theme = 5;
      // 界面语言。
      common.enums.Language language = 8;
    }
    // 更新后的账号偏好设置。
    Preference preference = 1;
  }
}
