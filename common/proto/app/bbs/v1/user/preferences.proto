syntax = "proto3";

package common.api.app.bbs.v1.user;

import "common/enums/language.proto";
import "google/api/annotations.proto";

option go_package = "common/proto/gen/bbs/v1/user;user";

// 账号偏好设置接口。
service PreferencesService {
  // 获取当前账号的偏好设置。
  rpc GetCurrent(GetCurrentPreferences.Req) returns (GetCurrentPreferences.Resp) {
    option (google.api.http) = {
      post: "/v1/user/preference/get-current"
      body: "*"};
  }

  // 更新当前账号的偏好设置。
  rpc UpdateCurrent(UpdateCurrentPreferences.Req) returns (UpdateCurrentPreferences.Resp) {
    option (google.api.http) = {
      post: "/v1/user/preference/update-current"
      body: "*"};
  }
}

// 获取当前账号的偏好设置。
message GetCurrentPreferences {
  message Req {}
  message Resp {
    message Preference {
      int64 user_id = 1; // 账号 ID
      optional string timezone = 3; // 时区
      optional string theme = 4; // 桌面端主题
      optional string mobile_theme = 5; // 移动端主题
      common.enums.Language language = 8; // 界面语言
    }
    Preference preference = 1; // 当前账号偏好设置
  }
}

// 更新当前账号的偏好设置。
message UpdateCurrentPreferences {
  message Req {
    optional string timezone = 2; // 时区
    optional string theme = 3; // 桌面端主题
    optional string mobile_theme = 4; // 移动端主题
    optional common.enums.Language language = 7; // 界面语言
  }
  message Resp {
    message Preference {
      int64 user_id = 1; // 账号 ID
      optional string timezone = 3; // 时区
      optional string theme = 4; // 桌面端主题
      optional string mobile_theme = 5; // 移动端主题
      common.enums.Language language = 8; // 界面语言
    }
    Preference preference = 1; // 更新后的账号偏好设置
  }
}
