syntax = "proto3";

package common.api.app.bbs.v1.user;

import "bbs/v1/user/enum.proto";
import "common/enums/language.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "common/proto/gen/bbs/v1/user;user";

// TOTP 认证接口。
service TotpService {
  // 开始启用 TOTP。
  rpc BeginEnable(BeginEnableTotp.Req) returns (BeginEnableTotp.Resp) {
    option (google.api.http) = {
      post: "/v1/user/totp/begin-enable"
      body: "*"
    };
  }

  // 确认 TOTP 验证码并正式启用 TOTP。
  rpc ConfirmEnable(ConfirmEnableTotp.Req) returns (ConfirmEnableTotp.Resp) {
    option (google.api.http) = {
      post: "/v1/user/totp/confirm-enable"
      body: "*"
    };
  }

  // 校验 TOTP 验证码并关闭 TOTP。
  rpc Disable(DisableTotp.Req) returns (DisableTotp.Resp) {
    option (google.api.http) = {
      post: "/v1/user/totp/disable"
      body: "*"
    };
  }

  // 获取当前账号的 TOTP 状态。
  rpc GetCurrent(GetCurrentTotp.Req) returns (GetCurrentTotp.Resp) {
    option (google.api.http) = {
      post: "/v1/user/totp/get-current"
      body: "*"
    };
  }
}

// 开始启用 TOTP。
message BeginEnableTotp {
  message Req {}
  message Resp {
    // TOTP 绑定 URL。
    string url = 1;
    // TOTP 二维码图片数据。
    bytes qr_code = 2;
  }
}

// 确认 TOTP 验证码并正式启用 TOTP。
message ConfirmEnableTotp {
  message Req {
    // TOTP 验证码。
    string code = 1;
    option (gnostic.openapi.v3.schema) = {required: "code"};
  }
  message Resp {}
}

// 校验 TOTP 验证码并关闭 TOTP。
message DisableTotp {
  message Req {
    // TOTP 验证码。
    string code = 1;
    option (gnostic.openapi.v3.schema) = {required: "code"};
  }
  message Resp {}
}

// 获取当前账号的 TOTP 状态。
message GetCurrentTotp {
  message Req {}
  message Resp {
    message Totp {
      // 账号 ID。
      int64 user_id = 1;
      // 是否启用 TOTP。
      bool enable = 2;
      // 启用时间。
      string enable_time = 3;
    }
    // TOTP 认证状态。
    Totp totp = 1;
  }
}
