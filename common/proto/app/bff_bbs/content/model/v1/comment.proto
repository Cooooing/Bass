syntax = "proto3";

package common.api.app.bff_bbs.content.model.v1;

import "bff_bbs/user/v1/account.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_bbs/content/model/v1;model";

// 枚举定义。
enum ContentRestriction {
  // 未指定
  CONTENT_RESTRICTION_UNSPECIFIED = 0;
  // 无限制
  CONTENT_RESTRICTION_NONE = 1;
  // 已隐藏
  CONTENT_RESTRICTION_HIDDEN = 2;
  // 已锁定
  CONTENT_RESTRICTION_LOCKED = 3;
}

// 协议消息。
message CommentViewerActionState {
  // 是否已点赞
  bool liked = 1;
  // 是否已感谢
  bool thanked = 2;
}

// 协议消息。
message CommentListItem {
  // 评论 ID
  int64 id = 1;
  // 文章 ID
  int64 article_id = 2;
  // 原始内容
  string content = 3;
  // 渲染后的内容
  string content_render = 4;
  // 评论层级
  int32 level = 5;
  // 父评论 ID
  optional int64 parent_id = 6;
  // 回复的评论 ID
  optional int64 reply_id = 7;
  // 回复数量
  int32 reply_count = 9;
  // 点赞数量
  int32 like_count = 10;
  // 感谢数量
  int32 thank_count = 11;
  // 评论账号展示资料
  .common.api.app.bff_bbs.user.v1.AccountProfile user = 12;
  // 被回复账号展示资料
  .common.api.app.bff_bbs.user.v1.AccountProfile reply_user = 13;
  // 当前查看账号的评论行为状态
  CommentViewerActionState viewer_action_state = 15;
  // 管理限制
  ContentRestriction restriction = 16;
  // 创建账号 ID
  optional int64 created_by = 1002;
  // 更新账号 ID
  optional int64 updated_by = 1003;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}
