syntax = "proto3";

package common.api.app.bff_bbs.content.v1;

import "bff_bbs/content/enum/v1/article.proto";
import "bff_bbs/user/enum/v1/account.proto";
import "common/v1/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_bbs/content/v1;content";

// ArticleService 提供 BBS 文章接口
service ArticleService {
  // 创建文章草稿
  rpc CreateDraftArticle(CreateDraftArticle.Req) returns (CreateDraftArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/draft/create"
      body: "*"
    };
  }

  // 编辑文章草稿
  rpc UpdateDraftArticle(UpdateDraftArticle.Req) returns (UpdateDraftArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/draft/update"
      body: "*"
    };
  }

  // 发布文章
  rpc PublishArticle(PublishArticle.Req) returns (PublishArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/publish"
      body: "*"
    };
  }

  // 取消定时发布
  rpc CancelPublishArticle(CancelPublishArticle.Req) returns (CancelPublishArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/publish/cancel"
      body: "*"
    };
  }

  // 丢弃文章草稿
  rpc DiscardDraftArticle(DiscardDraftArticle.Req) returns (DiscardDraftArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/draft/discard"
      body: "*"
    };
  }

  // 归档文章
  rpc ArchiveArticle(ArchiveArticle.Req) returns (ArchiveArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/archive"
      body: "*"
    };
  }

  // 设置或取消当前账号文章的置顶评论。
  rpc SetPinnedArticleComment(SetPinnedArticleComment.Req) returns (SetPinnedArticleComment.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/comment/pin"
      body: "*"
    };
  }

  // 采纳文章回答
  rpc AcceptArticleAnswer(AcceptArticleAnswer.Req) returns (AcceptArticleAnswer.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/answer/accept"
      body: "*"
    };
  }

  // 提交一次不可修改的文章投票。
  rpc VoteArticlePoll(VoteArticlePoll.Req) returns (VoteArticlePoll.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/poll/vote"
      body: "*"
    };
  }

  // 报名或撤销抽奖报名。
  rpc EnterArticleLottery(EnterArticleLottery.Req) returns (EnterArticleLottery.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/lottery/entry"
      body: "*"
    };
  }

  // 查询文章列表
  rpc ListArticles(ListArticles.Req) returns (ListArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/list"
      body: "*"
    };
  }

  // 查询当前账号所在城市发布的文章。
  rpc ListNearbyArticles(ListNearbyArticles.Req) returns (ListNearbyArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/nearby/list"
      body: "*"
    };
  }

  // 查询当前账号关注作者发布的文章。
  rpc ListFollowingArticles(ListFollowingArticles.Req) returns (ListFollowingArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/following/list"
      body: "*"
    };
  }

  // 查询当前账号收藏的文章。
  rpc PageCollectedArticles(PageCollectedArticles.Req) returns (PageCollectedArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/collected/page"
      body: "*"
    };
  }

  // 查询当前账号关注的文章。
  rpc PageWatchedArticles(PageWatchedArticles.Req) returns (PageWatchedArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/watched/page"
      body: "*"
    };
  }

  // 查询文章详情
  rpc GetArticle(GetArticle.Req) returns (GetArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/get"
      body: "*"
    };
  }

  // 查询当前账号的浏览历史。
  rpc PageArticleViewHistory(PageArticleViewHistory.Req) returns (PageArticleViewHistory.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/view-history/page"
      body: "*"
    };
  }
  // 统计当前账号收藏的文章数量。
  rpc CountCollectedArticles(CountCollectedArticles.Req) returns (CountCollectedArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/collect/count"
      body: "*"
    };
  }

  // 点赞文章
  rpc LikeArticle(LikeArticle.Req) returns (LikeArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/like"
      body: "*"
    };
  }

  // 感谢文章，确认后不可撤销。
  rpc ThankArticle(ThankArticle.Req) returns (ThankArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/thank"
      body: "*"
    };
  }

  // 收藏文章
  rpc CollectArticle(CollectArticle.Req) returns (CollectArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/collect"
      body: "*"
    };
  }

  // 关注文章
  rpc WatchArticle(WatchArticle.Req) returns (WatchArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/watch"
      body: "*"
    };
  }

  // 打赏文章
  rpc RewardArticle(RewardArticle.Req) returns (RewardArticle.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/reward"
      body: "*"
    };
  }
}

// 协议消息。
message CreateDraftArticle {
  // 请求参数。
  message Req {
    // 必填，草稿内容
    Article article = 1;
    option (gnostic.openapi.v3.schema) = {required: "article"};

    // 协议消息。
    message Article {
      // 必填，标题
      string title = 1;
      // 必填，正文
      string content = 2;
      // 可选，打赏区内容
      optional string reward_content = 3;
      // 可选，打赏积分
      optional int32 reward_points = 4;
      // 必填，文章类型
      .common.api.app.bff_bbs.content.enum.v1.ArticleType type = 5;
      // 可选，创作声明
      optional string statement = 6;
      // 可选，是否允许评论
      optional bool commentable = 7;
      // 可选，投票文章的草稿配置
      ArticlePollDraft poll = 8;
      // 可选，抽奖文章的草稿配置
      ArticleLotteryDraft lottery = 9;
      option (gnostic.openapi.v3.schema) = {
        required: "title"
        required: "content"
        required: "type"
      };
    }
  }
  // 响应结果。
  message Resp {
    // 已创建草稿的文章 ID
    int64 article_id = 1;
  }
}

// 协议消息。
message UpdateDraftArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 必填，草稿内容
    Article article = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "article"
    };

    // 协议消息。
    message Article {
      // 必填，标题
      string title = 1;
      // 必填，正文
      string content = 2;
      // 可选，打赏区内容
      optional string reward_content = 3;
      // 可选，打赏积分
      optional int32 reward_points = 4;
      // 必填，文章类型
      .common.api.app.bff_bbs.content.enum.v1.ArticleType type = 5;
      // 可选，创作声明
      optional string statement = 6;
      // 可选，是否允许评论
      optional bool commentable = 7;
      // 可选，投票文章的草稿配置
      ArticlePollDraft poll = 8;
      // 可选，抽奖文章的草稿配置
      ArticleLotteryDraft lottery = 9;
      option (gnostic.openapi.v3.schema) = {
        required: "title"
        required: "content"
        required: "type"
      };
    }
  }
  // 响应结果。
  message Resp {
    // 已保存草稿的文章 ID
    int64 article_id = 1;
  }
}

// 协议消息。
message PublishArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 可选，定时发布时间
    optional google.protobuf.Timestamp scheduled_at = 2;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message CancelPublishArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message DiscardDraftArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message ArchiveArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 可选，归档原因
    optional string reason = 2;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {}
}

// SetPinnedArticleComment 定义设置或取消文章置顶评论的请求。
message SetPinnedArticleComment {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 置顶的一级评论，未传表示取消
    optional int64 comment_id = 2;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message AcceptArticleAnswer {
  // 请求参数。
  message Req {
    // 问答文章 ID
    int64 article_id = 1;
    // 采纳的一级回答 ID
    int64 comment_id = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "comment_id"
    };
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message ListArticles {
  // 请求参数。
  message Req {
    // 可选，分页参数
    .common.api.app.common.v1.PageReq page = 1;
    // 可选，查询条件
    ArticleQuery query = 2;

    // 协议消息。
    message ArticleQuery {
      // 可选，标签 ID
      optional int64 tag_id = 1;
      // 可选，领域 ID
      optional int64 domain_id = 2;
      // 可选，文章类型
      optional .common.api.app.bff_bbs.content.enum.v1.ArticleType type = 4;
      // 可选，排序方式
      optional .common.api.app.bff_bbs.content.enum.v1.ArticleOrder order = 5;
      // 可选，作者账号 ID
      optional int64 author_id = 7;
      // 可选，发布状态
      optional .common.api.app.bff_bbs.content.enum.v1.ArticlePublishStatus publish_status = 10;
      // 可选，发布状态列表
      repeated .common.api.app.bff_bbs.content.enum.v1.ArticlePublishStatus publish_statuses = 11;
      // 可选，可见范围
      optional .common.api.app.bff_bbs.content.enum.v1.ArticleVisibility visibility = 12;
      // 可选，可见范围列表
      repeated .common.api.app.bff_bbs.content.enum.v1.ArticleVisibility visibilities = 13;
      // 可选，治理限制
      optional .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restriction = 14;
      // 可选，治理限制列表
      repeated .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restrictions = 15;
      // 可选，仅本人草稿：是否已设置发布时间
      optional bool scheduled = 16;
    }
  }
  // 响应结果。
  message Resp {
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 文章列表
    repeated ArticleListItem rows = 2;
  }
}

// 协议消息。
message GetArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 可选，预期发布状态；未传按已发布查询
    optional .common.api.app.bff_bbs.content.enum.v1.ArticlePublishStatus publish_status = 2;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {
    // 文章详情
    ArticleDetail article = 1;
  }
}

// 协议消息。
message ListNearbyArticles {
  // 请求参数。
  message Req {
    // 可选，分页参数
    .common.api.app.common.v1.PageReq page = 1;
  }
  // 响应结果。
  message Resp {
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 文章列表
    repeated ArticleListItem rows = 2;
  }
}

// 协议消息。
message ListFollowingArticles {
  // 请求参数。
  message Req {
    // 可选，分页参数
    .common.api.app.common.v1.PageReq page = 1;
  }
  // 响应结果。
  message Resp {
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 文章列表
    repeated ArticleListItem rows = 2;
  }
}

// PageCollectedArticles 分页读取当前账号收藏的文章。
message PageCollectedArticles {
  // 请求参数。
  message Req {
    // 可选，分页参数
    .common.api.app.common.v1.PageReq page = 1;
  }
  // 响应结果。
  message Resp {
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 收藏文章列表
    repeated ArticleListItem rows = 2;
  }
}

// PageWatchedArticles 分页读取当前账号关注的文章。
message PageWatchedArticles {
  // 请求参数。
  message Req {
    // 可选，分页参数
    .common.api.app.common.v1.PageReq page = 1;
  }
  // 响应结果。
  message Resp {
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 关注文章列表
    repeated ArticleListItem rows = 2;
  }
}

// 协议消息。
message PageArticleViewHistory {
  // 请求参数。
  message Req {
    // 可选，分页参数
    .common.api.app.common.v1.PageReq page = 1;
  }
  // 响应结果。
  message Resp {
    // 协议字段。
    repeated ArticleViewHistoryItem rows = 1;
    // 协议字段。
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// CountCollectedArticles 统计当前账号收藏的文章数量。
message CountCollectedArticles {
  // 请求参数。
  message Req {}
  // 响应结果。
  message Resp {
    // 当前收藏文章数量。
    int32 count = 1;
  }
}

// 协议消息。
message ArticleViewHistoryItem {
  // 当前仍可展示的文章
  ArticleListItem article = 1;
  // 最近浏览时间
  google.protobuf.Timestamp viewed_at = 2;
}

// 协议消息。
message LikeArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 必填，是否点赞
    bool active = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  // 响应结果。
  message Resp {
    // 是否已点赞
    bool liked = 1;
  }
}

// 协议消息。
message ThankArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {
    // 是否已感谢
    bool thanked = 1;
  }
}

// 协议消息。
message CollectArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 必填，是否收藏
    bool active = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  // 响应结果。
  message Resp {
    // 是否已收藏
    bool collected = 1;
  }
}

// 协议消息。
message WatchArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 必填，是否关注
    bool active = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "active"
    };
  }
  // 响应结果。
  message Resp {
    // 是否已关注
    bool watched = 1;
  }
}

// 协议消息。
message RewardArticle {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {
    // 是否已完成打赏
    bool rewarded = 1;
  }
}

// 协议消息。
message ArticleViewerActionState {
  // 是否已点赞
  bool liked = 1;
  // 是否已感谢
  bool thanked = 2;
  // 是否已收藏
  bool collected = 3;
  // 是否已打赏
  bool rewarded = 4;
  // 是否已关注
  bool watched = 5;
}

// 协议消息。
message ArticlePostscript {
  // 附言 ID
  int64 id = 1;
  // 文章 ID
  int64 article_id = 2;
  // 原始内容
  string content = 3;
  // 渲染内容
  string content_render = 4;
  // 治理限制
  .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restriction = 5;
  // 创建账号 ID
  optional int64 created_by = 1002;
  // 更新账号 ID
  optional int64 updated_by = 1003;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message AccountProfile {
  // 账号 ID
  int64 id = 1;
  // 账号名
  string name = 2;
  // 昵称
  optional string nickname = 3;
  // 个人主页
  optional string url = 4;
  // 头像 URL
  optional string avatar_url = 5;
  // 个人简介
  optional string introduction = 6;
  // MBTI 类型，规范化为大写
  optional string mbti = 7;
  // 账号状态
  .common.api.app.bff_bbs.user.enum.v1.AccountStatus status = 8;
  // 关注数
  optional int32 follow_count = 10;
  // 粉丝数
  optional int32 follower_count = 11;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message ArticleListItem {
  // 文章 ID
  int64 id = 1;
  // 标题
  string title = 2;
  // 摘要原文
  string content = 3;
  // 摘要渲染内容
  string content_render = 4;
  // 是否有附言
  bool has_postscript = 5;
  // 是否有打赏区
  bool has_reward = 6;
  // 文章类型
  .common.api.app.bff_bbs.content.enum.v1.ArticleType type = 7;
  // 创作声明
  optional string statement = 8;
  // 是否允许评论
  bool commentable = 9;
  // 浏览数
  int32 view_count = 16;
  // 感谢数
  int32 thank_count = 17;
  // 点赞数
  int32 like_count = 18;
  // 收藏数
  int32 collect_count = 19;
  // 关注数
  int32 watch_count = 22;
  // 打赏数
  int32 reward_count = 20;
  // 回复数
  int32 reply_count = 21;
  // 作者资料
  AccountProfile author_user = 24;
  // 最后回复用户
  AccountProfile last_reply_user = 25;
  // 最后回复时间
  google.protobuf.Timestamp last_reply_at = 26;
  // 封面图片 URL
  optional string cover_image_url = 27;
  // 当前用户互动状态
  ArticleViewerActionState viewer_action_state = 28;
  // 发布时间
  google.protobuf.Timestamp published_at = 29;
  // 发布状态
  .common.api.app.bff_bbs.content.enum.v1.ArticlePublishStatus publish_status = 31;
  // 可见范围
  .common.api.app.bff_bbs.content.enum.v1.ArticleVisibility visibility = 32;
  // 治理限制
  .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restriction = 33;
  // 编辑时间
  google.protobuf.Timestamp edited_at = 34;
  // 文章标签
  repeated ArticleTag tags = 35;
  // 文章所属领域
  repeated ArticleDomain domains = 36;
  // 创建账号 ID
  optional int64 created_by = 1002;
  // 更新账号 ID
  optional int64 updated_by = 1003;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message ArticleDetail {
  // 文章 ID
  int64 id = 1;
  // 标题
  string title = 2;
  // 原始内容
  string content = 3;
  // 渲染内容
  string content_render = 4;
  // 是否有附言
  bool has_postscript = 5;
  // 是否有打赏区
  bool has_reward = 6;
  // 打赏后可见内容
  optional string reward_content = 7;
  // 渲染打赏内容
  optional string reward_content_render = 8;
  // 打赏积分
  optional int32 reward_points = 9;
  // 文章类型
  .common.api.app.bff_bbs.content.enum.v1.ArticleType type = 11;
  // 创作声明
  optional string statement = 12;
  // 是否允许评论
  bool commentable = 13;
  // 浏览数
  int32 view_count = 16;
  // 感谢数
  int32 thank_count = 17;
  // 点赞数
  int32 like_count = 18;
  // 收藏数
  int32 collect_count = 19;
  // 关注数
  int32 watch_count = 22;
  // 打赏数
  int32 reward_count = 20;
  // 回复数
  int32 reply_count = 21;
  // 作者资料
  AccountProfile author_user = 24;
  // 最后回复用户
  AccountProfile last_reply_user = 25;
  // 最后回复时间
  google.protobuf.Timestamp last_reply_at = 26;
  // 封面图片 URL
  optional string cover_image_url = 27;
  // 当前用户互动状态
  ArticleViewerActionState viewer_action_state = 28;
  // 发布时间
  google.protobuf.Timestamp published_at = 29;
  // 附言列表
  repeated ArticlePostscript postscripts = 30;
  // 发布状态
  .common.api.app.bff_bbs.content.enum.v1.ArticlePublishStatus publish_status = 31;
  // 可见范围
  .common.api.app.bff_bbs.content.enum.v1.ArticleVisibility visibility = 32;
  // 治理限制
  .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restriction = 33;
  // 编辑时间
  google.protobuf.Timestamp edited_at = 34;
  // 文章标签
  repeated ArticleTag tags = 35;
  // 文章所属领域
  repeated ArticleDomain domains = 36;
  // 发布时城市快照
  optional string city = 37;
  // 问答已采纳评论 ID
  optional int64 accepted_comment_id = 38;
  // 投票详情
  ArticlePoll poll = 39;
  // 抽奖详情
  ArticleLottery lottery = 40;
  // 创建账号 ID
  optional int64 created_by = 1002;
  // 更新账号 ID
  optional int64 updated_by = 1003;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message ArticlePollDraft {
  // 投票选项
  repeated string options = 1;
  // 截止时间
  google.protobuf.Timestamp ends_at = 2;
  // 每人最多选择数
  int32 max_choices = 3;
}

// 协议消息。
message ArticlePoll {
  // 截止时间
  google.protobuf.Timestamp ends_at = 1;
  // 每人最多选择数
  int32 max_choices = 2;
  // 投票选项
  repeated ArticlePollOption options = 3;
  // 当前账号已选选项 ID
  repeated int64 selected_option_ids = 4;
  // 当前账号是否可查看实时结果
  bool result_visible = 5;
  // 已投票账号数
  int64 participant_count = 6;
  // 所有选项累计票数
  int64 total_vote_count = 7;
}

// 协议消息。
message ArticlePollOption {
  // 选项 ID
  int64 id = 1;
  // 选项内容
  string content = 2;
  // 可见时的票数
  int32 vote_count = 3;
}

// 协议消息。
message VoteArticlePoll {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // 必填，所选选项 ID
    repeated int64 option_ids = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "article_id"
      required: "option_ids"
    };
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message ArticleLotteryDraft {
  // 奖项配置
  repeated ArticleLotteryPrizeDraft prizes = 1;
  // 开奖时间
  google.protobuf.Timestamp draw_at = 2;
}

// 协议消息。
message ArticleLotteryPrizeDraft {
  // 奖项名称
  string name = 1;
  // 奖项说明
  optional string description = 2;
  // 中奖名额
  int32 winner_limit = 3;
}

// 协议消息。
message ArticleLottery {
  // 开奖时间
  google.protobuf.Timestamp draw_at = 1;
  // 实际开奖时间
  google.protobuf.Timestamp drawn_at = 2;
  // 有效报名人数
  int64 entry_count = 3;
  // 当前账号是否已报名
  bool entered = 4;
  // 奖项和中奖结果
  repeated ArticleLotteryPrize prizes = 5;
}

// 协议消息。
message ArticleLotteryPrize {
  // 奖项 ID
  int64 id = 1;
  // 奖项名称
  string name = 2;
  // 奖项说明
  optional string description = 3;
  // 中奖名额
  int32 winner_limit = 4;
  // 按抽取顺序的中奖账号资料
  repeated AccountProfile winner_users = 5;
}

// 协议消息。
message EnterArticleLottery {
  // 请求参数。
  message Req {
    // 必填，文章 ID
    int64 article_id = 1;
    // true 报名，false 撤销报名
    bool entered = 2;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message ArticleTag {
  // 标签 ID
  int64 id = 1;
  // 稳定编码
  string code = 2;
  // 标签名称
  string name = 3;
  // 图标
  optional string icon = 4;
  // 所属领域 ID
  optional int64 domain_id = 5;
}

// 协议消息。
message ArticleDomain {
  // 领域 ID
  int64 id = 1;
  // 稳定编码
  string code = 2;
  // 领域名称
  string name = 3;
  // 图标
  optional string icon = 4;
  // 链接
  optional string url = 5;
}
