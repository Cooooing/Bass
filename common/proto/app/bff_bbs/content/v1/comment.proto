syntax = "proto3";

package common.api.app.bff_bbs.content.v1;

import "bff_bbs/content/enum/v1/article.proto";
import "bff_bbs/content/enum/v1/comment.proto";
import "bff_bbs/content/model/v1/comment.proto";
import "bff_bbs/user/enum/v1/account.proto";
import "common/v1/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_bbs/content/v1;content";

// 评论接口。
service CommentService {
  // 创建评论。
  rpc CreateComment(CreateComment.Req) returns (CreateComment.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/create"
      body: "*"
    };
  }

  // 分页查询评论列表。
  rpc ListComments(ListComments.Req) returns (ListComments.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/list"
      body: "*"
    };
  }

  // 分页查询评论楼层。
  rpc ListCommentThreads(ListCommentThreads.Req) returns (ListCommentThreads.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/list-threads"
      body: "*"
    };
  }

  // 分页查询评论回复。
  rpc ListCommentReplies(ListCommentReplies.Req) returns (ListCommentReplies.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/list-replies"
      body: "*"
    };
  }

  // 分页查询评论时间线。
  rpc ListCommentTimeline(ListCommentTimeline.Req) returns (ListCommentTimeline.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/list-timeline"
      body: "*"
    };
  }

  // 点赞或取消点赞评论。
  rpc LikeComment(LikeComment.Req) returns (LikeComment.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/like"
      body: "*"
    };
  }

  // 感谢或取消感谢评论。
  rpc ThankComment(ThankComment.Req) returns (ThankComment.Resp) {
    option (google.api.http) = {
      post: "/v1/content/comment/thank"
      body: "*"
    };
  }
}

// 分页查询评论楼层。
message ListCommentThreads {
  // 请求参数。
  message Req {
    // 分页参数
    .common.api.app.common.v1.PageReq page = 1;
    // 文章 ID
    int64 article_id = 2;
    // 顶层评论排序方式
    optional .common.api.app.bff_bbs.content.enum.v1.CommentOrder order = 3;
    // 每个楼层返回的回复预览数量
    optional int32 reply_preview_limit = 4;
    option (gnostic.openapi.v3.schema) = {required: "article_id"};
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message PinnedComment {
      // 独立置顶评论线程
      CommentThread thread = 1;
    }
    // 协议消息。
    message CommentThread {
      // 顶层评论
      CommentListItem root = 1;
      // 回复预览列表
      repeated CommentListItem preview_replies = 2;
      // 回复数量
      int32 reply_count = 3;
      // 是否还有更多回复
      bool has_more_replies = 4;
    }

    // 协议消息。
    message CommentListItem {
      // 评论 ID
      int64 id = 1;
      // 文章 ID
      int64 article_id = 2;
      // 原始内容
      string content = 3;
      // 渲染后的内容
      string content_render = 4;
      // 评论层级
      int32 level = 5;
      // 父评论 ID
      optional int64 parent_id = 6;
      // 回复的评论 ID
      optional int64 reply_id = 7;
      // 回复数量
      int32 reply_count = 9;
      // 点赞数量
      int32 like_count = 10;
      // 感谢数量
      int32 thank_count = 11;
      // 评论账号展示资料
      AccountProfile user = 12;
      // 被回复账号展示资料
      AccountProfile reply_user = 13;
      // 所属文章摘要
      ArticleBrief article = 14;
      // 当前查看账号的评论行为状态
      CommentViewerActionState viewer_action_state = 15;
      // 管理限制
      .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restriction = 16;
      // 逻辑删除时间
      google.protobuf.Timestamp deleted_at = 17;
      // 创建账号 ID
      optional int64 created_by = 1002;
      // 更新账号 ID
      optional int64 updated_by = 1003;
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
    }

    // 协议消息。
    message AccountProfile {
      // 账号 ID
      int64 id = 1;
      // 账号名
      string name = 2;
      // 昵称
      optional string nickname = 3;
      // 个人主页 URL
      optional string url = 4;
      // 头像 URL
      optional string avatar_url = 5;
      // 个人简介
      optional string introduction = 6;
      // MBTI 类型，规范化为大写
      optional string mbti = 7;
      // 账号状态
      .common.api.app.bff_bbs.user.enum.v1.AccountStatus status = 8;
      // 关注数量
      optional int32 follow_count = 10;
      // 粉丝数量
      optional int32 follower_count = 11;
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
    }

    // 协议消息。
    message CommentViewerActionState {
      // 是否已点赞
      bool liked = 1;
      // 是否已感谢
      bool thanked = 2;
    }

    // 协议消息。
    message ArticleBrief {
      // 文章 ID
      int64 id = 1;
      // 标题
      string title = 2;
      // 文章类型
      .common.api.app.bff_bbs.content.enum.v1.ArticleType type = 4;
      // 作者展示资料
      AccountProfile author_user = 6;
      // 封面图片 URL
      optional string cover_image_url = 7;
      // 发布状态
      .common.api.app.bff_bbs.content.enum.v1.ArticlePublishStatus publish_status = 8;
      // 可见范围
      .common.api.app.bff_bbs.content.enum.v1.ArticleVisibility visibility = 9;
      // 管理限制
      .common.api.app.bff_bbs.content.enum.v1.ContentRestriction restriction = 10;
      // 创建账号 ID
      optional int64 created_by = 1002;
      // 更新账号 ID
      optional int64 updated_by = 1003;
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
    }
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 评论楼层列表
    repeated CommentThread rows = 2;
    // 问答已采纳回答；不可见时不返回
    optional PinnedComment accepted_answer = 3;
    // 作者手动置顶评论；不可见时不返回
    optional PinnedComment pinned_comment = 4;
  }
}

