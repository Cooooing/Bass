syntax = "proto3";

package common.api.app.bff_bbs.content.v1;

import "bff_bbs/content/enum/v1/domain.proto";
import "common/v1/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_bbs/content/v1;content";

// 领域 HTTP 接口。
service DomainService {
  // 创建领域。
  rpc CreateDomain(CreateDomain.Req) returns (CreateDomain.Resp) {
    option (google.api.http) = {
      post: "/v1/content/domain/create"
      body: "*"
    };
  }

  // 更新领域。
  rpc UpdateDomain(UpdateDomain.Req) returns (UpdateDomain.Resp) {
    option (google.api.http) = {
      post: "/v1/content/domain/update"
      body: "*"
    };
  }

  // 查询领域列表。
  rpc ListDomains(ListDomains.Req) returns (ListDomains.Resp) {
    option (google.api.http) = {
      post: "/v1/content/domain/list"
      body: "*"
    };
  }
}

// 创建领域。
message CreateDomain {
  // 请求参数。
  message Req {
    // 领域信息
    Domain domain = 1;
    option (gnostic.openapi.v3.schema) = {required: "domain"};

    // 协议消息。
    message Domain {
      // 稳定编码
      string code = 1;
      // 领域名称
      string name = 2;
      // 描述
      optional string description = 3;
      // 启停状态
      optional .common.api.app.bff_bbs.content.enum.v1.DomainStatus status = 4;
      // 链接
      optional string url = 5;
      // 图标
      optional string icon = 6;
      // 是否在导航中展示
      bool is_nav = 7;
      // 排序值，越小越靠前
      int32 sort = 8;
      option (gnostic.openapi.v3.schema) = {
        required: "code"
        required: "name"
      };
    }
  }

  // 响应结果。
  message Resp {
    // 领域信息
    Domain domain = 1;

    // 协议消息。
    message Domain {
      // 领域 ID
      int64 id = 1;
      // 稳定编码
      string code = 2;
      // 领域名称
      string name = 3;
      // 描述
      optional string description = 4;
      // 启停状态
      .common.api.app.bff_bbs.content.enum.v1.DomainStatus status = 5;
      // 链接
      optional string url = 6;
      // 图标
      optional string icon = 7;
      // 是否在导航中展示
      bool is_nav = 8;
      // 排序值，越小越靠前
      int32 sort = 9;
      // 创建用户 ID
      optional int64 created_by = 1002;
      // 更新用户 ID
      optional int64 updated_by = 1003;
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
    }
  }
}

// 更新领域。
message UpdateDomain {
  // 请求参数。
  message Req {
    // 领域 ID
    int64 domain_id = 1;
    // 领域信息
    Domain domain = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "domain_id"
      required: "domain"
    };

    // 协议消息。
    message Domain {
      // 稳定编码
      string code = 1;
      // 领域名称
      string name = 2;
      // 描述
      optional string description = 3;
      // 启停状态
      optional .common.api.app.bff_bbs.content.enum.v1.DomainStatus status = 4;
      // 链接
      optional string url = 5;
      // 图标
      optional string icon = 6;
      // 是否在导航中展示
      bool is_nav = 7;
      // 排序值，越小越靠前
      int32 sort = 8;
      option (gnostic.openapi.v3.schema) = {
        required: "code"
        required: "name"
      };
    }
  }

  // 响应结果。
  message Resp {
    // 领域信息
    Domain domain = 1;

    // 协议消息。
    message Domain {
      // 领域 ID
      int64 id = 1;
      // 稳定编码
      string code = 2;
      // 领域名称
      string name = 3;
      // 描述
      optional string description = 4;
      // 启停状态
      .common.api.app.bff_bbs.content.enum.v1.DomainStatus status = 5;
      // 链接
      optional string url = 6;
      // 图标
      optional string icon = 7;
      // 是否在导航中展示
      bool is_nav = 8;
      // 排序值，越小越靠前
      int32 sort = 9;
      // 创建用户 ID
      optional int64 created_by = 1002;
      // 更新用户 ID
      optional int64 updated_by = 1003;
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
    }
  }
}

// 查询领域列表。
message ListDomains {
  // 请求参数。
  message Req {
    // 分页参数
    .common.api.app.common.v1.PageReq page = 1;
    // 查询条件
    DomainQuery query = 2;

    // 协议消息。
    message DomainQuery {
      // 领域 ID 列表
      repeated int64 ids = 1;
      // 稳定编码
      optional string code = 2;
      // 领域名称
      optional string name = 3;
      // 描述
      optional string description = 4;
      // 启停状态
      optional .common.api.app.bff_bbs.content.enum.v1.DomainStatus status = 5;
      // 链接
      optional string url = 6;
      // 图标
      optional string icon = 7;
      // 是否在导航中展示
      optional bool is_nav = 8;
    }
  }

  // 响应结果。
  message Resp {
    // 分页结果
    .common.api.app.common.v1.PageResp page = 1;
    // 领域列表
    repeated Domain rows = 2;

    // 协议消息。
    message Domain {
      // 领域 ID
      int64 id = 1;
      // 稳定编码
      string code = 2;
      // 领域名称
      string name = 3;
      // 描述
      optional string description = 4;
      // 启停状态
      .common.api.app.bff_bbs.content.enum.v1.DomainStatus status = 5;
      // 链接
      optional string url = 6;
      // 图标
      optional string icon = 7;
      // 是否在导航中展示
      bool is_nav = 8;
      // 排序值，越小越靠前
      int32 sort = 9;
      // 创建用户 ID
      optional int64 created_by = 1002;
      // 更新用户 ID
      optional int64 updated_by = 1003;
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
    }
  }
}
