syntax = "proto3";

package common.api.app.bff_bbs.v1.content;

import "bff_bbs/v1/content/article.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "common/proto/gen/bff_bbs/v1/content;content";

// ArticleSearchService provides public article keyword search for BBS clients.
service ArticleSearchService {
  rpc Search(SearchArticles.Req) returns (SearchArticles.Resp) {
    option (google.api.http) = {
      post: "/v1/content/article/search"
      body: "*"
    };
  }
}

message SearchArticles {
  message Req {
    string query = 1; // 必填，搜索词
    optional string cursor = 2; // 可选，不透明续页游标
    uint32 size = 3; // 可选，返回条数
    option (gnostic.openapi.v3.schema) = {
      required: "query"
    };
  }
  message Resp {
    repeated ArticleListItem rows = 1; // 文章列表
    optional string next_cursor = 2; // 下一页游标
  }
}
