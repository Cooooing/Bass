syntax = "proto3";

package common.api.app.bff_bbs.v1.user;

import "bff_bbs/v1/user/enum/account.proto";
import "common/common.proto";
import "economy/v1/enum/economy.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_bbs/v1/user;user";

// AccountService 提供 BBS 账号接口
service AccountService {
  // 获取当前账号完整资料
  rpc GetCurrent(GetCurrentAccount.Req) returns (GetCurrentAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/get-current"
      body: "*"
    };
  }
  // 按账号名获取个人主页资料。
  rpc GetProfile(GetProfile.Req) returns (GetProfile.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/get-profile"
      body: "*"
    };
  }
  // 查询账号公开的关注列表。
  rpc ListFollowing(ListFollowing.Req) returns (ListFollowing.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/list-following"
      body: "*"
    };
  }
  // 查询账号公开的粉丝列表。
  rpc ListFollowers(ListFollowers.Req) returns (ListFollowers.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/list-followers"
      body: "*"
    };
  }
  // 更新当前账号展示资料
  rpc UpdateProfile(UpdateProfileAccount.Req) returns (UpdateProfileAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/update-profile"
      body: "*"
    };
  }
  // 申请当前账号资料图片的内容寻址直传能力。
  rpc PrepareProfileImageUpload(PrepareProfileImageUploadAccount.Req) returns (PrepareProfileImageUploadAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/prepare-profile-image-upload"
      body: "*"
    };
  }
  // 将已由 MinIO 回调确认的资源绑定到当前账号资料。
  rpc CompleteProfileImageUpload(CompleteProfileImageUploadAccount.Req) returns (CompleteProfileImageUploadAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/complete-profile-image-upload"
      body: "*"
    };
  }
  // 更新当前账号密码
  rpc UpdatePassword(UpdatePasswordAccount.Req) returns (UpdatePasswordAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/update-password"
      body: "*"
    };
  }
  // 更新当前账号邮箱
  rpc UpdateEmail(UpdateEmailAccount.Req) returns (UpdateEmailAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/update-email"
      body: "*"
    };
  }
  // 更新当前账号手机号
  rpc UpdatePhone(UpdatePhoneAccount.Req) returns (UpdatePhoneAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/user/account/update-phone"
      body: "*"
    };
  }
  // 生成默认账号头像
  rpc Avatar(AvatarAccount.Req) returns (.common.api.app.common.ImageResp) {
    option (google.api.http) = {
      get: "/v1/user/account/avatar"
    };
  }
}

message AccountProfile {
  int64 id = 1; // 账号 ID
  string name = 2; // 账号名
  optional string nickname = 3; // 昵称
  optional string url = 4; // 个人主页 URL
  optional string avatar_url = 5; // 头像 URL
  optional int64 background_asset_id = 6; // 个人主页背景图资源 ID
  optional string introduction = 7; // 个人简介
  optional string mbti = 8; // MBTI 类型，规范化为大写
  AccountStatus status = 9; // 账号状态
  optional int32 follow_count = 10; // 关注数量
  optional int32 follower_count = 11; // 粉丝数量
  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
}

message ProfileVisibility {
  bool article_list = 1;
  bool comment_list = 2;
  bool follower_list = 3;
  bool following_list = 4;
  bool moonbreeze_list = 5;
}

message ProfileRelation {
  bool following = 1;
  bool followed_by = 2;
  bool blocking = 3;
  bool blocked_by = 4;
}

message ProfileLocation {
  optional string country = 1;
  optional string province = 2;
  optional string city = 3;
}

message Profile {
  AccountProfile account = 1;
  optional string background_url = 2;
  ProfileLocation location = 3;
  google.protobuf.Timestamp last_success_login_at = 4;
  ProfileVisibility visibility = 5;
  ProfileRelation viewer_relation = 6;
}

message AccountProfileListItem {
  AccountProfile account = 1;
  ProfileRelation viewer_relation = 2;
}

message AccountContact {
  int64 user_id = 1; // 账号 ID
  optional string email = 2; // 邮箱地址
  optional string phone = 3; // 手机号
}

message GetCurrentAccount {
  message Req {}
  message Resp {
    message CurrentAccount {
      AccountProfile profile = 1; // 账号展示资料
      AccountContact contact = 2; // 账号联系方式
    }
    CurrentAccount account = 1; // 当前账号完整资料
  }
}

message GetProfile {
  message Req {
    string name = 1; // 账号名，必填
    option (gnostic.openapi.v3.schema) = { required: "name" };
  }
  message Resp {
    Profile profile = 1;
  }
}

message ListFollowing {
  message Req {
    string name = 1;
    .common.api.app.common.PageReq page = 2;
    option (gnostic.openapi.v3.schema) = { required: "name" };
  }
  message Resp {
    .common.api.app.common.PageResp page = 1;
    repeated AccountProfileListItem rows = 2;
  }
}

message ListFollowers {
  message Req {
    string name = 1;
    .common.api.app.common.PageReq page = 2;
    option (gnostic.openapi.v3.schema) = { required: "name" };
  }
  message Resp {
    .common.api.app.common.PageResp page = 1;
    repeated AccountProfileListItem rows = 2;
  }
}

message UpdateProfileAccount {
  message Req {
    optional string nickname = 1; // 昵称，选填
    optional string url = 2; // 个人主页 URL，选填
    optional string introduction = 3; // 个人简介，选填
    optional string mbti = 4; // MBTI 类型，选填；空字符串表示清除
  }
  message Resp {
    AccountProfile profile = 1; // 更新后的账号资料
  }
}

enum ProfileImagePurpose {
  PROFILE_IMAGE_PURPOSE_UNSPECIFIED = 0;
  PROFILE_IMAGE_PURPOSE_AVATAR = 1;
  PROFILE_IMAGE_PURPOSE_BACKGROUND = 2;
}

message PrepareProfileImageUploadAccount {
  message Req {
    ProfileImagePurpose purpose = 1; // 图片用途，必填；仅用于 BFF 业务校验
    string hash = 2; // 文件 SHA-256，小写十六进制
    string mime_type = 3; // 上传 MIME 类型
    int64 size = 4; // 文件大小，最大 2 MiB
    option (gnostic.openapi.v3.schema) = { required: "purpose" required: "hash" required: "mime_type" required: "size" };
  }
  message Resp {
    optional int64 asset_id = 1; // 已存在时直接返回
    string upload_url = 2; // 新资源的 MinIO multipart POST 地址
    map<string, string> form_fields = 3;
  }
}

message CompleteProfileImageUploadAccount {
  message Req {
    ProfileImagePurpose purpose = 1;
    string hash = 2; // 文件 SHA-256；回调尚未入库时返回可重试错误
    option (gnostic.openapi.v3.schema) = { required: "purpose" required: "hash" };
  }
  message Resp {
    AccountProfile profile = 1;
    string image_url = 2;
  }
}

message UpdatePasswordAccount {
  message Req {
    string old_password = 1; // 旧密码，必填
    string new_password = 2; // 新密码，必填
    option (gnostic.openapi.v3.schema) = {
      required: "old_password"
      required: "new_password"
    };
  }
  message Resp {}
}

message UpdateEmailAccount {
  message Req {
    string email = 1; // 新邮箱地址，必填
    string code = 2; // 邮箱 OTP，必填
    option (gnostic.openapi.v3.schema) = {
      required: "email"
      required: "code"
    };
  }
  message Resp {}
}

message UpdatePhoneAccount {
  message Req {
    string phone = 1; // 新手机号，必填
    string code = 2; // 手机 OTP，必填
    option (gnostic.openapi.v3.schema) = {
      required: "phone"
      required: "code"
    };
  }
  message Resp {}
}

message GetAccountEconomy {
  message Req {}
  message Resp {
    int64 balance = 1; // 当前积分
    int64 total_income = 2; // 累计获得
    int64 total_expense = 3; // 累计消耗
  }
}

message ListAccountEconomyRecords {
  message Req {
    .common.api.app.common.PageReq page = 1; // 分页参数
    optional .common.api.app.economy.v1.enum.EconomyRecordDirection direction = 2; // 流水方向
    optional .common.api.app.economy.v1.enum.EconomyRecordType record_type = 3; // 流水类型
  }
  message Resp {
    message Record {
      int64 id = 1; // 流水 ID
      string transaction_no = 2; // 交易号
      .common.api.app.economy.v1.enum.EconomyRecordType record_type = 3; // 流水类型
      .common.api.app.economy.v1.enum.EconomyRecordDirection direction = 4; // 流水方向
      int64 amount = 5; // 积分数量
      int64 balance_before = 6; // 变动前积分
      int64 balance_after = 7; // 变动后积分
      optional string remark = 8; // 备注
      google.protobuf.Timestamp created_at = 1000; // 创建时间
    }
    repeated Record rows = 1; // 流水列表
    .common.api.app.common.PageResp page = 2; // 分页信息
  }
}

message AvatarAccount {
  message Req {
    string name = 1; // 账号名，必填
    option (gnostic.openapi.v3.schema) = {
      required: "name"
    };
  }
}
