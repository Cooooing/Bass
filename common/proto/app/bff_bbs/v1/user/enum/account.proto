syntax = "proto3";

package common.api.app.bff_bbs.v1.user;

option go_package = "common/proto/gen/bff_bbs/v1/user/enum;enum";

// 账号状态。
enum AccountStatus {
  // 未指定。
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // 正常。
  ACCOUNT_STATUS_NORMAL = 1;
  // 封禁。
  ACCOUNT_STATUS_BANNED = 2;
  // 注销。
  ACCOUNT_STATUS_CANCELLED = 3;
}
