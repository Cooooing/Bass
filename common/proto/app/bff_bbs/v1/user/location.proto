syntax = "proto3";

package common.api.app.bff_bbs.v1.user;

import "common/enums/language.proto";
import "google/api/annotations.proto";

option go_package = "common/proto/gen/bff_bbs/v1/user;user";

// 账号地理资料接口。
service LocationService {
  // 获取当前账号的地理资料。
  rpc GetCurrent(GetCurrentLocation.Req) returns (GetCurrentLocation.Resp) {
    option (google.api.http) = {
      post: "/v1/user/location/get-current"
      body: "*"
    };
  }

  // 按当前请求 IP 解析并更新当前账号的地理资料。
  rpc DetectCurrent(DetectCurrentLocation.Req) returns (DetectCurrentLocation.Resp) {
    option (google.api.http) = {
      post: "/v1/user/location/detect-current"
      body: "*"
    };
  }

  // 更新当前账号的地理资料。
  rpc UpsertCurrent(UpsertCurrentLocation.Req) returns (UpsertCurrentLocation.Resp) {
    option (google.api.http) = {
      post: "/v1/user/location/upsert-current"
      body: "*"
    };
  }
}

// 获取当前账号的地理资料。
message GetCurrentLocation {
  message Req {}
  message Resp {
    message Location {
      int64 user_id = 1; // 账号 ID
      optional string country = 2; // 国家或地区
      optional string province = 3; // 省份或州
      optional string city = 4; // 城市
    }
    Location location = 1; // 当前账号地理资料
  }
}

// 按当前请求 IP 自动定位当前账号。
message DetectCurrentLocation {
  message Req {}
  message Resp {
    message Location {
      int64 user_id = 1; // 账号 ID
      optional string country = 2; // 国家或地区
      optional string province = 3; // 省份或州
      optional string city = 4; // 城市
    }
    Location location = 1; // 自动定位后的地理资料
  }
}

// 更新当前账号的地理资料。
message UpsertCurrentLocation {
  message Req {
    optional string country = 1; // 国家或地区
    optional string province = 2; // 省份或州
    optional string city = 3; // 城市
  }
  message Resp {
    message Location {
      int64 user_id = 1; // 账号 ID
      optional string country = 2; // 国家或地区
      optional string province = 3; // 省份或州
      optional string city = 4; // 城市
    }
    Location location = 1; // 更新后的账号地理资料
  }
}
