syntax = "proto3";

package common.api.app.bff_game_idle.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_game_idle/v1;v1";

// AuthService 提供摸鱼放置前台认证入口。
service AuthService {
  // 注册账号。
  rpc RegisterAccount(RegisterAccount.Req) returns (RegisterAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/game-idle/auth/register"
      body: "*"
    };
  }

  // 登录账号。
  rpc LoginAccount(LoginAccount.Req) returns (LoginAccount.Resp) {
    option (google.api.http) = {
      post: "/v1/game-idle/auth/login"
      body: "*"
    };
  }
}

// 协议消息。
message RegisterAccount {
  // 请求参数。
  message Req {
    // 邮箱
    string email = 1;
    // 账号密码
    string password = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "email"
      required: "password"
    };
  }

  // 响应结果。
  message Resp {}
}

// 协议消息。
message LoginAccount {
  // 请求参数。
  message Req {
    // 邮箱
    string email = 1;
    // 账号密码
    string password = 2;
    option (gnostic.openapi.v3.schema) = {
      required: "email"
      required: "password"
    };
  }

  // 响应结果。
  message Resp {
    // 访问令牌
    string access_token = 1;
    // 刷新令牌
    string refresh_token = 2;
    // 访问令牌过期时间
    google.protobuf.Timestamp access_token_expires_at = 3;
    // 刷新令牌过期时间
    google.protobuf.Timestamp refresh_token_expires_at = 4;
    // session 过期时间
    google.protobuf.Timestamp session_expires_at = 5;
    // 当前账号 ID
    int64 user_id = 6;
    // 账号名
    string name = 7;
    // 昵称
    string nickname = 8;
  }
}
