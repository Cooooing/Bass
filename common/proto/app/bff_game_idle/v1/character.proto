syntax = "proto3";

package common.api.app.bff_game_idle.v1;

import "game_idle/enum/v1/character.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/bff_game_idle/v1;v1";

// CharacterService 提供摸鱼放置角色入口。
service CharacterService {
  // 创建角色。
  rpc CreateCharacter(CreateCharacter.Req) returns (CreateCharacter.Resp) {
    option (google.api.http) = {
      post: "/v1/game-idle/character/create"
      body: "*"
    };
  }

  // 查询当前账号角色列表。
  rpc ListCharacter(ListCharacter.Req) returns (ListCharacter.Resp) {
    option (google.api.http) = {
      post: "/v1/game-idle/character/list"
      body: "*"
    };
  }
}

// 协议消息。
message CreateCharacter {
  // 请求参数。
  message Req {
    // 角色名称
    string name = 1;
  }

  // 响应结果。
  message Resp {
    // 角色
    Character row = 1;
  }
}

// 协议消息。
message ListCharacter {
  // 请求参数。
  message Req {}

  // 响应结果。
  message Resp {
    // 角色列表
    repeated Character rows = 1;
  }
}

// 协议消息。
message Character {
  // 角色 ID
  int64 id = 1;
  // 角色名称
  string name = 2;
  // 角色状态
  common.api.app.game_idle.enum.v1.CharacterStatus status = 3;
  // 角色槽位
  int32 slot = 4;
  // 行动队列容量上限
  int32 action_queue_capacity = 5;
  // 最大离线收益结算秒数
  int64 max_offline_seconds = 6;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
  // 最近离线时间
  google.protobuf.Timestamp last_offline_at = 1002;
}
