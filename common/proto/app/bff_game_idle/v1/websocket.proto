syntax = "proto3";

package common.api.app.bff_game_idle.v1;

import "google/api/annotations.proto";
option go_package = "common/proto/gen/bff_game_idle/v1;v1";

enum WebSocketMessageType {
  WEB_SOCKET_MESSAGE_TYPE_UNSPECIFIED = 0;
  WEB_SOCKET_MESSAGE_TYPE_SESSION_CLOSE = 1;
  WEB_SOCKET_MESSAGE_TYPE_COMMAND_FAILED = 2;
  WEB_SOCKET_MESSAGE_TYPE_CHAT_MESSAGE_RECEIVED = 3;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_COMPLETED = 4;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_QUEUE_UPDATED = 5;
  WEB_SOCKET_MESSAGE_TYPE_ABILITY_LEVELED_UP = 6;
  WEB_SOCKET_MESSAGE_TYPE_INIT_COMPLETED = 7;
  WEB_SOCKET_MESSAGE_TYPE_CONFIG_COMPLETED = 8;
  WEB_SOCKET_MESSAGE_TYPE_CONFIG_VERSION_COMPLETED = 9;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_DETAIL_COMPLETED = 10;
  WEB_SOCKET_MESSAGE_TYPE_CHARACTER_ONLINE_COMPLETED = 11;
  WEB_SOCKET_MESSAGE_TYPE_INIT_GET = 12;
  WEB_SOCKET_MESSAGE_TYPE_CONFIG_GET = 13;
  WEB_SOCKET_MESSAGE_TYPE_CONFIG_VERSION = 14;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_DETAIL_GET = 15;
  WEB_SOCKET_MESSAGE_TYPE_CHARACTER_ONLINE = 16;
  WEB_SOCKET_MESSAGE_TYPE_CHAT_MESSAGE_SEND = 17;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_ADD = 18;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_MOVE = 19;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_REMOVE = 20;
  WEB_SOCKET_MESSAGE_TYPE_ACTION_CLEAR = 21;
}

// WebSocketService 提供摸鱼放置 WS 辅助入口。
service WebSocketService {
  // 创建角色 WS 连接凭证。
  rpc CreateTicket(CreateWebSocketTicket.Req) returns (CreateWebSocketTicket.Resp) {
    option (google.api.http) = {
      post: "/v1/game-idle/ws/create-ticket"
      body: "*"
    };
  }
}

message CreateWebSocketTicket {
  message Req {
    int64 character_id = 1; // 角色 ID
  }

  message Resp {
    int64 character_id = 1; // 角色 ID
    string ticket = 2; // WS 连接凭证
    int64 expires_in_seconds = 3; // 剩余有效秒数
    string path = 4; // WS 连接路径
  }
}

// WebSocketCommand 是客户端上行命令。
message WebSocketCommand {
  string type = 1; // 命令类型
  WebSocketCommandPayload payload = 2; // 命令参数
}

// WebSocketCommandPayload 是客户端上行命令参数。
message WebSocketCommandPayload {
  oneof data {
    ChatMessageSendWebSocketPayload chat_message_send = 1;
    ActionAddWebSocketPayload action_add = 4;
    ActionMoveWebSocketPayload action_move = 5;
    ActionRemoveWebSocketPayload action_remove = 6;
    ActionDetailGetWebSocketPayload action_detail_get = 7;
  }
}

message ChatMessageSendWebSocketPayload {
  string channel_type = 1; // 频道类型
  string channel_id = 2; // 频道标识
  int64 receiver_character_id = 3; // 接收角色 ID，非私聊为 0
  string content = 4; // 消息内容
}

message ActionAddWebSocketPayload {
  string action_id = 1; // 行动编码
  int64 times = 2; // 执行次数，-1 表示无限
  optional int32 position = 3; // 插入位置，从 0 开始；空值表示追加到队尾
}

message ActionMoveWebSocketPayload {
  int32 current_position = 1; // 当前位置，从 0 开始
  int32 target_position = 2; // 目标位置，从 0 开始
}

message ActionRemoveWebSocketPayload {
  int32 position = 1; // 移除位置，从 0 开始
}

message ActionDetailGetWebSocketPayload {
  string action_id = 1; // 行动编码
}
