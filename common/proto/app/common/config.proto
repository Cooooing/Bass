syntax = "proto3";

package common.api.app.common;

import "google/protobuf/duration.proto";

option go_package = "common/proto/gen/common;common";

message Server {
  string name = 1; // 服务名称
  string version = 2; // 服务版本
  string mode = 3; // 运行模式: dev, prod
}

message Bootstrap {
  Server server = 1; // 服务基本信息
  message Config {
    Consul consul = 1; // 用于从 Consul KV 加载配置
    message Consul {
      string address = 1; // Consul 地址，格式 host:port
      string token = 2; // Consul ACL Token
      string path = 3; // Consul KV 中的配置路径
      google.protobuf.Duration timeout = 4; // 连接超时
    }
  }
  Config config = 2; // 配置加载来源
  message Log {
    string level = 1; // 日志级别: debug, info, warn, error, fatal, panic
  }
  Log log = 3; // 日志配置
}

message Trace {
  bool enable_otel = 1; // 是否导出链路数据
  string endpoint = 2; // OTLP gRPC 地址，格式 host:port
  bool insecure = 3; // 是否使用非 TLS 连接
  double sampler = 4; // 采样率，范围 0-1
}

message Observability {
  bool enable_metrics = 1; // 是否暴露 Prometheus 指标
}

message HTTP {
  string network = 1; // 网络类型: tcp
  string host = 2; // 监听地址
  int32 port = 3; // 监听端口
  google.protobuf.Duration timeout = 4; // 请求超时
}

message GRPC {
  string network = 1; // 网络类型: tcp
  string host = 2; // 监听地址
  int32 port = 3; // 监听端口
  google.protobuf.Duration timeout = 4; // 请求超时
}

message Database {
  string driver = 1; // 数据库驱动: postgres, mysql
  string source = 2; // 连接字符串
  bool merge = 3; // 是否自动同步表结构
  bool debug = 4; // 是否开启 SQL 调试日志
  google.protobuf.Duration slow_sql_threshold = 5; // 慢查询阈值
  double sample_rate = 6; // SQL 日志采样率，0-1
}

message Redis {
  string addr = 1; // 地址，格式 host:port
  string password = 2; // 密码
  google.protobuf.Duration dial_timeout = 3; // 连接超时
  int32 db = 4; // 数据库编号
  google.protobuf.Duration read_timeout = 5; // 读超时
  google.protobuf.Duration write_timeout = 6; // 写超时
  int32 pool_size = 7; // 连接池大小
  int32 min_idle_conns = 8; // 最小空闲连接数
  google.protobuf.Duration pool_timeout = 9; // 连接池获取超时
  google.protobuf.Duration conn_max_idle_time = 10; // 连接最大空闲时间
  google.protobuf.Duration conn_max_life_time = 11; // 连接最大存活时间
}

message Consul {
  string address = 1; // 地址，格式 host:port
  string datacenter = 2; // 数据中心
  string token = 3; // ACL Token
  google.protobuf.Duration dial_timeout = 4; // 连接超时
}

message Nats {
  string host = 1; // 连接主机
  int32 port = 2; // 连接端口
  string user = 3; // 认证用户名
  string password = 4; // 认证密码
  string name = 5; // 客户端名称，用于连接标识和日志
  google.protobuf.Duration timeout = 6; // 连接超时，同时用作 Flush 超时
  int32 max_reconnects = 7; // 最大重连次数，-1 为无限重连
  google.protobuf.Duration reconnect_wait = 8; // 重连间隔
  google.protobuf.Duration ping_interval = 9; // 心跳间隔，用于检测连接是否存活
  google.protobuf.Duration flusher_timeout = 10; // 内部 flusher 超时，发布积压时触发
  bool enable_jet_stream = 11; // 是否启用 JetStream 持久化
  string stream_name = 12; // JetStream 流名称，启用后发布和订阅均走 JetStream
  string jet_stream_domain = 13; // JetStream 域名，用于多域隔离
}

message DTM {
  string grpc_endpoint = 1; // gRPC 接入地址
  google.protobuf.Duration timeout = 2; // 请求超时
  int32 max_retry_times = 3; // 最大重试次数
  google.protobuf.Duration retry_interval = 4; // 重试间隔
}

message Alert {
  LarkWebhook lark_webhook = 1; // Lark Webhook 告警通道配置

  message LarkWebhook {
    string base_url = 1; // Lark Webhook 基础地址
    string token = 2; // Lark Webhook token
    string secret = 3; // Lark Webhook 签名密钥
    google.protobuf.Duration timeout = 4; // HTTP 调用超时
  }
}

message Event {
  Outbox outbox = 1; // 生产者 outbox 投递配置
  Inbox inbox = 2; // 消费者 inbox 处理配置
  DeadLetter dead_letter = 3; // 死信告警配置

  message Outbox {
    int32 max_retry = 1; // 最大投递重试次数
    google.protobuf.Duration publish_timeout = 2; // publishing 状态超时时间
    google.protobuf.Duration poll_lock_ttl = 3; // 单轮投递 Redis 锁有效期
    int32 publish_limit = 4; // 单批投递数量
    google.protobuf.Duration min_poll_interval = 5; // 空闲轮询最小间隔
    google.protobuf.Duration max_poll_interval = 6; // 空闲轮询最大间隔
  }

  message Inbox {
    int32 max_retry = 1; // 最大处理尝试次数
    google.protobuf.Duration processing_timeout = 2; // processing 状态超时时间
  }

  message DeadLetter {
    bool enable_alert = 1; // 是否启用死信告警
    google.protobuf.Duration scan_interval = 2; // 死信扫描间隔
    google.protobuf.Duration alert_dedup_window = 3; // 同一死信告警去重窗口
  }
}
