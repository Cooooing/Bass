syntax = "proto3";

package common.api.app.common.enums.event.v1;

import "common/enums/event/v1/event_payload_content.proto";
import "common/enums/event/v1/event_payload_game_idle.proto";
import "common/enums/event/v1/event_payload_im.proto";
import "common/enums/event/v1/event_payload_notify.proto";
import "common/enums/event/v1/event_payload_user.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/common/enums/event/v1;event";

// 事件主题 — 内部映射为实际 MQ subject。
enum EventSubject {
  // 枚举值。
  EVENT_SUBJECT_UNSPECIFIED = 0;

  // 用户事件（1000-1999）
  // 事件主题：user.follow。
  EVENT_SUBJECT_USER_FOLLOW = 1001;
  // 事件主题：user.unfollow。
  EVENT_SUBJECT_USER_UNFOLLOW = 1002;
  // 事件主题：user.register。
  EVENT_SUBJECT_USER_REGISTER = 1003;
  // 事件主题：user.login。
  EVENT_SUBJECT_USER_LOGIN = 1004;
  // 事件主题：user.logout。
  EVENT_SUBJECT_USER_LOGOUT = 1005;
  // 事件主题：user.email.verification_code。
  EVENT_SUBJECT_USER_EMAIL_VERIFICATION_CODE = 1006;
  // 事件主题：user.phone.verification_code。
  EVENT_SUBJECT_USER_PHONE_VERIFICATION_CODE = 1007;
  // 事件主题：user.block。
  EVENT_SUBJECT_USER_BLOCK = 1010;
  // 事件主题：user.unblock。
  EVENT_SUBJECT_USER_UNBLOCK = 1011;
  // 事件主题：user.totp.enable。
  EVENT_SUBJECT_USER_TOTP_ENABLE = 1012;
  // 事件主题：user.totp.disable。
  EVENT_SUBJECT_USER_TOTP_DISABLE = 1013;
  // 事件主题：user.account.cancelled。
  EVENT_SUBJECT_USER_ACCOUNT_CANCELLED = 1014;
  // 事件主题：user.account.banned。
  EVENT_SUBJECT_USER_ACCOUNT_BANNED = 1015;
  // 事件主题：user.account.unbanned。
  EVENT_SUBJECT_USER_ACCOUNT_UNBANNED = 1016;
  // 事件主题：user.checkin.completed。
  EVENT_SUBJECT_USER_CHECKIN_COMPLETED = 1017;

  // 内容文章事件（2000-2099）
  // 事件主题：content.article.published。
  EVENT_SUBJECT_ARTICLE_PUBLISHED = 2001;
  // 事件主题：content.article.liked。
  EVENT_SUBJECT_ARTICLE_LIKED = 2002;
  // 事件主题：content.article.thanked。
  EVENT_SUBJECT_ARTICLE_THANKED = 2003;
  // 事件主题：content.article.collected。
  EVENT_SUBJECT_ARTICLE_COLLECTED = 2004;
  // 事件主题：content.article.watched。
  EVENT_SUBJECT_ARTICLE_WATCHED = 2005;
  // 事件主题：content.article.accepted_answer。
  EVENT_SUBJECT_ARTICLE_ACCEPTED_ANSWER = 2006;
  // 事件主题：content.article.postscript_added。
  EVENT_SUBJECT_ARTICLE_POSTSCRIPT_ADDED = 2007;
  // 事件主题：content.article.status_updated。
  EVENT_SUBJECT_ARTICLE_STATUS_UPDATED = 2008;
  // 事件主题：content.article.lottery_won。
  EVENT_SUBJECT_ARTICLE_LOTTERY_WON = 2009;
  // 事件主题：content.article.poll_ended。
  EVENT_SUBJECT_ARTICLE_POLL_ENDED = 2010;
  // 事件主题：content.article.lottery_drawn。
  EVENT_SUBJECT_ARTICLE_LOTTERY_DRAWN = 2011;
  // 事件主题：content.article.rewarded。
  EVENT_SUBJECT_ARTICLE_REWARDED = 2019;

  // 内容评论事件（2100-2199）
  // 事件主题：content.comment.published。
  EVENT_SUBJECT_COMMENT_PUBLISHED = 2101;
  // 事件主题：content.comment.liked。
  EVENT_SUBJECT_COMMENT_LIKED = 2102;
  // 事件主题：content.comment.thanked。
  EVENT_SUBJECT_COMMENT_THANKED = 2103;
  // 事件主题：content.comment.status_updated。
  EVENT_SUBJECT_COMMENT_STATUS_UPDATED = 2104;

  // 即时通讯事件（3000-3999）
  // 事件主题：im.private_chat.message_created。
  EVENT_SUBJECT_IM_PRIVATE_CHAT_MESSAGE_CREATED = 3001;
  // 事件主题：im.global_chat.message_created。
  EVENT_SUBJECT_IM_GLOBAL_CHAT_MESSAGE_CREATED = 3002;
  // 事件主题：im.global_chat.barrage_created。
  EVENT_SUBJECT_IM_GLOBAL_CHAT_BARRAGE_CREATED = 3004;
  // 事件主题：im.global_chat.topic_updated。
  EVENT_SUBJECT_IM_GLOBAL_CHAT_TOPIC_UPDATED = 3005;

  // 挂机游戏事件（5000-5999）
  // 事件主题：game_idle。
  EVENT_SUBJECT_GAME_IDLE = 5000;
  // 事件主题：game_idle.chat_message。
  EVENT_SUBJECT_GAME_IDLE_CHAT_MESSAGE = 5001;
  // 事件主题：game_idle.close_session。
  EVENT_SUBJECT_GAME_IDLE_CLOSE_SESSION = 5002;
  // 事件主题：game_idle.action_completed。
