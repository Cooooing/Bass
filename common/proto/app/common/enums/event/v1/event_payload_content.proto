syntax = "proto3";

package common.api.app.common.enums.event.v1;

option go_package = "common/proto/gen/common/enums/event/v1;event";

// 协议消息。
message ArticlePublishedPayload {
  // 协议字段。
  int64 article_id = 3;
}

// 协议消息。
message ArticleLikedPayload {
  // 协议字段。
  int64 sender_id = 1;
  // 协议字段。
  int64 article_id = 3;
}

