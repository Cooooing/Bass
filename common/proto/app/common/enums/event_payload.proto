syntax = "proto3";

package common.api.app.common.enums;

option go_package = "common/proto/gen/common/enums;enums";

// ==================== user ====================

message UserEmailVerificationCodePayload {
  string email = 1;
  string code = 2;
  int64 expires_seconds = 3;
}

message UserPhoneVerificationCodePayload {
  string phone = 1;
  string code = 2;
  int64 expires_seconds = 3;
}

message UserRegisterPayload {
  int64 user_id = 1;
}

message UserLoginPayload {
  int64 user_id = 1;
  string name = 2;
  string account = 3;
  string ip = 4;
  string user_agent = 5;
  string device_id = 6 [deprecated = true];
  string platform = 7 [deprecated = true];
  string request_id = 8 [deprecated = true];
  string realm = 9;
  string login_type = 10;
  string session_id = 11;
  string app_name = 12;
  string app_version = 13;
  string client_type = 14;
  string device_type = 15;
}

message UserLogoutPayload {
  int64 user_id = 1;
  string name = 2;
  string session_id = 3;
  string realm = 4;
}

message UserFollowPayload {
  int64 sender_id = 1;
  int64 followed_id = 3;
}

message UserUnfollowPayload {
  int64 sender_id = 1;
  int64 followed_id = 3;
}

message UserBlockPayload {
  int64 sender_id = 1;
  int64 blocked_id = 3;
}

message UserUnblockPayload {
  int64 sender_id = 1;
  int64 unblocked_id = 3;
}

message UserTotpEnablePayload {
  int64 user_id = 1;
}

message UserTotpDisablePayload {
  int64 user_id = 1;
}

message UserAccountCancelledPayload {
  int64 user_id = 1;
}

message UserAccountBannedPayload {
  int64 user_id = 1;
  int64 operator_id = 2;
  string operator_realm = 3;
  int64 ban_record_id = 4;
  string reason = 5;
  int64 banned_until_unix_seconds = 6;
}

message UserAccountUnbannedPayload {
  int64 user_id = 1;
  int64 ban_record_id = 2;
}

// ==================== article ====================

message ArticlePublishedPayload {
  int64 article_id = 3;
}

message ArticleLikedPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
}

message ArticleThankedPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
}

message ArticleCollectedPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
}

message ArticleWatchedPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
}

message ArticleAcceptedAnswerPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
  int64 comment_id = 4;
}

message ArticlePostscriptAddedPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
  int64 postscript_id = 4;
}

message ArticleStatusUpdatedPayload {
  int64 sender_id = 1;
  int64 article_id = 3;
  string status = 4 [deprecated = true];
  string action = 5;
  string publish_status = 6;
  string visibility = 7;
  string restriction = 8;
  optional string reason = 9;
}

// ==================== comment ====================

message CommentPublishedPayload {
  int64 comment_id = 3;
}

message CommentLikedPayload {
  int64 sender_id = 1;
  int64 comment_id = 3;
}

message CommentThankedPayload {
  int64 sender_id = 1;
  int64 comment_id = 3;
}

message CommentStatusUpdatedPayload {
  int64 sender_id = 1;
  int64 comment_id = 3;
  string status = 4 [deprecated = true];
  string action = 5;
  string restriction = 6;
  optional string reason = 7;
}
