syntax = "proto3";

package common.api.app.common.enums;

import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/common/enums;enums";

message GameIdleChatMessagePayload {
  int64 message_id = 1;
  string channel_type = 2;
  string channel_id = 3;
  int64 sender_character_id = 4;
  int64 receiver_character_id = 5;
  string content = 6;
  string sender_name = 7;
  google.protobuf.Timestamp created_at = 8;
}

enum GameIdleCloseSessionReason {
  GAME_IDLE_CLOSE_SESSION_REASON_UNSPECIFIED = 0; // 未指定
  GAME_IDLE_CLOSE_SESSION_REASON_OCCUPIED = 1; // 被其他连接挤占
  GAME_IDLE_CLOSE_SESSION_REASON_TIMEOUT = 2; // 心跳超时
}

message GameIdleCloseSessionPayload {
  string session_id = 1; // 会话 ID
  GameIdleCloseSessionReason reason = 2; // 关闭原因
  string message = 3; // 客户端提示
  bool should_reconnect = 4; // 是否建议自动重连
}

message GameIdleActionCompletedPayload {
  int64 character_id = 1;
  GameIdleActionCompletedAction action = 2;
  repeated GameIdleItemChange item_changes = 3;
  repeated GameIdleAbilityChange ability_changes = 4;
}

message GameIdleActionCompletedAction {
  string action_id = 1;
  int64 times_finished = 2;
  int64 times_remaining = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message GameIdleItemChange {
  string item_id = 1;
  int64 quantity_delta = 2;
  int64 quantity_after = 3;
}

message GameIdleAbilityChange {
  string ability_id = 1;
  int64 exp_delta = 2;
  int64 exp_after = 3;
}

message GameIdleAbilityLeveledUpPayload {
  int64 character_id = 1;
  string ability_id = 2;
  int32 level = 3;
  int64 exp = 4;
  int64 next_level_exp = 5;
}

message GameIdleActionQueueUpdatedPayload {
  int64 character_id = 1;
  repeated GameIdleActionQueueItem items = 2;
  string reason = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GameIdleActionQueueItem {
  string action_id = 1;
  int64 times = 2;
  google.protobuf.Timestamp created_at = 3;
}
