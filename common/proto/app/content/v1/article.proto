syntax = "proto3";

package common.api.app.content.v1;

import "common/common.proto";
import "content/v1/access.proto";
import "content/v1/enum/article.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// ContentArticleService 提供文章草稿、发布、查询与互动能力
service ContentArticleService {
  rpc CreateDraft(CreateDraftArticle.Req) returns (CreateDraftArticle.Resp) {} // 创建文章草稿
  rpc UpdateDraft(UpdateDraftArticle.Req) returns (UpdateDraftArticle.Resp) {} // 编辑文章草稿
  rpc Publish(PublishArticle.Req) returns (PublishArticle.Resp) {} // 发布文章
  rpc CancelPublish(CancelPublishArticle.Req) returns (CancelPublishArticle.Resp) {} // 取消定时发布
  rpc DiscardDraft(DiscardDraftArticle.Req) returns (DiscardDraftArticle.Resp) {} // 丢弃草稿
  rpc MakePrivate(MakePrivateArticle.Req) returns (MakePrivateArticle.Resp) {} // 设为私有
  rpc MakePublic(MakePublicArticle.Req) returns (MakePublicArticle.Resp) {} // 设为公开
  rpc Archive(ArchiveArticle.Req) returns (ArchiveArticle.Resp) {} // 归档文章
  rpc SetPinnedComment(SetPinnedArticleComment.Req) returns (SetPinnedArticleComment.Resp) {} // 设置文章置顶评论
  rpc AcceptAnswer(AcceptArticleAnswer.Req) returns (AcceptArticleAnswer.Resp) {} // 采纳问答回答
  rpc VotePoll(VoteArticlePoll.Req) returns (VoteArticlePoll.Resp) {} // 投票
  rpc FinishPoll(FinishArticlePoll.Req) returns (FinishArticlePoll.Resp) {} // 完成投票
  rpc EnterLottery(EnterArticleLottery.Req) returns (EnterArticleLottery.Resp) {} // 报名或撤销抽奖报名
  rpc DrawLottery(DrawArticleLottery.Req) returns (DrawArticleLottery.Resp) {} // 执行抽奖开奖
  rpc Unarchive(UnarchiveArticle.Req) returns (UnarchiveArticle.Resp) {} // 取消归档
  rpc Hide(HideArticle.Req) returns (HideArticle.Resp) {} // 隐藏文章
  rpc Unhide(UnhideArticle.Req) returns (UnhideArticle.Resp) {} // 取消隐藏
  rpc Lock(LockArticle.Req) returns (LockArticle.Resp) {} // 锁定文章
  rpc Unlock(UnlockArticle.Req) returns (UnlockArticle.Resp) {} // 取消锁定
  rpc Like(LikeArticle.Req) returns (LikeArticle.Resp) {} // 点赞文章
  rpc Thank(ThankArticle.Req) returns (ThankArticle.Resp) {} // 感谢文章
  rpc Collect(CollectArticle.Req) returns (CollectArticle.Resp) {} // 收藏文章
  rpc Watch(WatchArticle.Req) returns (WatchArticle.Resp) {} // 关注文章
  rpc Reward(RewardArticle.Req) returns (RewardArticle.Resp) {} // 打赏文章
  rpc View(ViewArticle.Req) returns (ViewArticle.Resp) {} // 浏览文章
  rpc PageViewHistory(PageArticleViewHistory.Req) returns (PageArticleViewHistory.Resp) {} // 分页查询当前用户浏览历史
  rpc FlushViews(FlushArticleViews.Req) returns (FlushArticleViews.Resp) {} // 刷新浏览量
  rpc MapViewerActionStates(MapArticleViewerActionStates.Req) returns (MapArticleViewerActionStates.Resp) {} // 查询互动状态
  rpc ListWatchers(ListArticleWatchers.Req) returns (ListArticleWatchers.Resp) {} // 查询文章关注账号
  rpc ListPollParticipants(ListArticlePollParticipants.Req) returns (ListArticlePollParticipants.Resp) {} // 查询投票参与账号
  rpc ListLotteryParticipants(ListArticleLotteryParticipants.Req) returns (ListArticleLotteryParticipants.Resp) {} // 查询抽奖参与账号
  rpc Get(GetArticle.Req) returns (GetArticle.Resp) {} // 查询文章详情
  rpc List(ListArticles.Req) returns (ListArticles.Resp) {} // 查询文章列表
  rpc Page(PageArticles.Req) returns (PageArticles.Resp) {} // 分页查询文章
}

message CreateDraftArticle {
  message Req {
    Article article = 1; // 草稿内容
    ContentAccess access = 2; // 访问上下文

    message Article {
      string title = 1; // 标题
      string content = 2; // 正文
      optional string reward_content = 3; // 打赏区内容
      optional int32 reward_points = 4; // 打赏积分
      ArticleType type = 5; // 文章类型
      optional string statement = 6; // 创作声明
      optional bool commentable = 7; // 是否允许评论
      ArticlePollDraft poll = 8; // 投票文章的草稿配置
      ArticleLotteryDraft lottery = 9; // 抽奖文章的草稿配置
    }
  }
  message Resp {
    int64 article_id = 1; // 已创建草稿的文章 ID
  }
}

message UpdateDraftArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    Article article = 2; // 草稿内容
    ContentAccess access = 3; // 访问上下文

    message Article {
      string title = 1; // 标题
      string content = 2; // 正文
      optional string reward_content = 3; // 打赏区内容
      optional int32 reward_points = 4; // 打赏积分
      ArticleType type = 5; // 文章类型
      optional string statement = 6; // 创作声明
      optional bool commentable = 7; // 是否允许评论
      ArticlePollDraft poll = 8; // 投票文章的草稿配置
      ArticleLotteryDraft lottery = 9; // 抽奖文章的草稿配置
    }
  }
  message Resp {
    int64 article_id = 1; // 已保存草稿的文章 ID
  }
}

message PublishArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    optional ContentAccess access = 2; // 访问上下文
    optional google.protobuf.Timestamp scheduled_at = 3; // 定时发布时间；未来时间会注册延迟任务
    optional string city = 4; // 作者发布或设置定时时的城市快照
  }
  message Resp {}
}

message CancelPublishArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
  }
  message Resp {}
}


message DiscardDraftArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
  }
  message Resp {}
}

message MakePrivateArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
  }
  message Resp {}
}

message MakePublicArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
  }
  message Resp {}
}

message ArchiveArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string reason = 3; // 操作原因
  }
  message Resp {}
}

// SetPinnedArticleComment 定义作者设置或取消文章置顶评论的命令。
message SetPinnedArticleComment {
  message Req {
    int64 article_id = 1; // 文章 ID
    optional int64 comment_id = 2; // 置顶的一级评论，未传表示取消
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {}
}

message AcceptArticleAnswer {
  message Req { int64 article_id = 1; int64 comment_id = 2; ContentAccess access = 3; }
  message Resp {}
}

message UnarchiveArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string reason = 3; // 操作原因
  }
  message Resp {}
}

message HideArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string reason = 3; // 操作原因
  }
  message Resp {}
}

message UnhideArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string reason = 3; // 操作原因
  }
  message Resp {}
}

message LockArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string reason = 3; // 操作原因
  }
  message Resp {}
}

message UnlockArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string reason = 3; // 操作原因
  }
  message Resp {}
}

message LikeArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool liked = 2; // 是否点赞
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {
    bool liked = 1; // 是否已点赞
  }
}

message ThankArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool thanked = 2; // 是否感谢
    ContentAccess access = 3; // 访问上下文
    string client_request_id = 4; // 客户端幂等请求 ID
  }
  message Resp {
    bool thanked = 1; // 是否已感谢
  }
}

message CollectArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool collected = 2; // 是否收藏
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {
    bool collected = 1; // 是否已收藏
  }
}

message WatchArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool watched = 2; // 是否关注
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {
    bool watched = 1; // 是否已关注
  }
}

message RewardArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    int32 points = 2; // 打赏积分
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {}
}

message ViewArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
    optional string ip = 3; // 浏览 IP
    optional string user_agent = 4; // 浏览 UA
    optional string browser_fingerprint = 5; // 浏览器指纹
  }
  message Resp {}
}

message PageArticleViewHistory {
  message Req {
    .common.api.app.common.PageReq page = 1; // 分页参数
    ContentAccess access = 2; // 当前用户访问上下文
    repeated int64 excluded_author_ids = 3; // 读取侧排除的作者账号 ID
  }
  message Resp {
    repeated ArticleViewHistoryItem rows = 1;
    .common.api.app.common.PageResp page = 2;
  }
}

message ArticleViewHistoryItem {
  Article article = 1; // 当前仍可展示的文章
  google.protobuf.Timestamp viewed_at = 2; // 最近浏览时间
}

message FlushArticleViews {
  message Req {
    int32 limit = 1; // 刷新数量上限
  }
  message Resp {
    int32 flushed = 1; // 已刷新文章数
  }
}

message MapArticleViewerActionStates {
  message Req {
    repeated int64 article_ids = 1; // 文章 ID 列表
    int64 user_id = 2; // 用户账号 ID
  }
  message Resp {
    map<int64, ArticleViewerActionState> states = 1; // 互动状态映射
    message ArticleViewerActionState {
      bool liked = 1; // 是否已点赞
      bool thanked = 2; // 是否已感谢
      bool collected = 3; // 是否已收藏
      bool rewarded = 4; // 是否已打赏
      bool watched = 5; // 是否已关注
    }
  }
}

message ListArticleWatchers {
  message Req {
    int64 article_id = 1; // 文章 ID
  }
  message Resp {
    repeated int64 user_ids = 1; // 当前关注文章的账号 ID
  }
}

message ListArticlePollParticipants {
  message Req {
    int64 article_id = 1; // 文章 ID
  }
  message Resp {
    repeated int64 user_ids = 1; // 投票参与账号 ID
  }
}

message ListArticleLotteryParticipants {
  message Req {
    int64 article_id = 1; // 文章 ID
  }
  message Resp {
    repeated int64 user_ids = 1; // 抽奖参与账号 ID
  }
}

message GetArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    ContentAccess access = 2; // 访问上下文
  }
  message Resp {
    Article article = 1; // 文章详情
  }
}

message ListArticles {
  message Req {
    ArticleQueryParams query = 1; // 查询参数
    ContentAccess access = 2; // 访问上下文
  }
  message Resp {
    repeated Article rows = 1; // 文章列表
  }
}

message PageArticles {
  message Req {
    ArticleQueryParams query = 1; // 查询参数
    .common.api.app.common.PageReq page = 2; // 分页参数
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {
    repeated Article rows = 1; // 文章列表
    .common.api.app.common.PageResp page = 2; // 分页信息
  }
}

message ArticleQueryParams {
  optional int64 tag_id = 1; // 标签 ID
  optional int64 domain_id = 2; // 领域 ID
  repeated int64 article_ids = 3; // 文章 ID 列表
  optional ArticleType type = 4; // 文章类型
  optional ArticleOrder order = 5; // 排序方式
  optional int64 author_id = 7; // 作者账号 ID
  repeated int64 author_ids = 8; // 作者账号 ID 列表
  optional ArticlePublishStatus publish_status = 10; // 发布状态
  repeated ArticlePublishStatus publish_statuses = 11; // 发布状态列表
  optional ArticleVisibility visibility = 12; // 可见范围
  repeated ArticleVisibility visibilities = 13; // 可见范围列表
  optional ContentRestriction restriction = 14; // 治理限制
  repeated ContentRestriction restrictions = 15; // 治理限制列表
  optional bool scheduled = 16; // 仅作者：草稿是否已设置发布时间
  optional google.protobuf.Timestamp created_at_start = 20; // 创建时间起点
  optional google.protobuf.Timestamp created_at_end = 21; // 创建时间终点
  optional google.protobuf.Timestamp published_at_start = 22; // 发布时间起点
  optional google.protobuf.Timestamp published_at_end = 23; // 发布时间终点
  repeated int64 excluded_author_ids = 24; // 读取侧排除的作者账号 ID
  optional string published_city = 25; // 发布时城市快照
}

message Article {
  int64 id = 1; // 文章 ID
  string title = 2; // 标题
  string content = 3; // 正文
  optional string reward_content = 4; // 打赏区内容
  optional int32 reward_points = 5; // 打赏积分
  bool has_postscript = 6; // 是否有附言
  bool has_reward = 7; // 是否有打赏区
  ArticleType type = 8; // 文章类型
  optional string statement = 9; // 创作声明
  bool commentable = 10; // 是否允许评论
  ArticlePublishStatus publish_status = 11; // 发布状态
  ArticleVisibility visibility = 12; // 可见范围
  ContentRestriction restriction = 13; // 治理限制
  int32 view_count = 20; // 浏览数
  int32 thank_count = 21; // 感谢数
  int32 like_count = 22; // 点赞数
  int32 collect_count = 23; // 收藏数
  int32 watch_count = 26; // 关注数
  int32 reward_count = 24; // 打赏数
  int32 reply_count = 25; // 回复数
  google.protobuf.Timestamp published_at = 30; // 发布时间
  google.protobuf.Timestamp edited_at = 31; // 编辑时间
  optional string published_city = 32; // 发布时城市快照
  optional int64 pinned_comment_id = 36; // 作者手动置顶的评论 ID
  optional int64 accepted_comment_id = 37; // 问答已采纳评论 ID
  ArticlePoll poll = 38; // 投票详情
  ArticleLottery lottery = 39; // 抽奖详情
  optional int64 created_by = 1002; // 创建账号 ID
  optional int64 updated_by = 1003; // 更新账号 ID
  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
}

message ArticlePollDraft {
  repeated string options = 1; // 投票选项
  google.protobuf.Timestamp ends_at = 2; // 截止时间
  int32 max_choices = 3; // 每人最多选择数
}

message ArticlePoll {
  google.protobuf.Timestamp ends_at = 1; // 截止时间
  int32 max_choices = 2; // 每人最多选择数
  repeated ArticlePollOption options = 3; // 投票选项
  repeated int64 selected_option_ids = 4; // 当前账号已选选项 ID
  bool result_visible = 5; // 当前账号是否可查看实时结果
  int64 participant_count = 6; // 已投票账号数
  int64 total_vote_count = 7; // 所有选项累计票数
}

message ArticlePollOption {
  int64 id = 1; // 选项 ID
  string content = 2; // 选项内容
  int32 vote_count = 3; // 可见时的票数
}

message VoteArticlePoll {
  message Req {
    int64 article_id = 1; // 文章 ID
    repeated int64 option_ids = 2; // 所选选项 ID
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {}
}

message FinishArticlePoll {
  message Req {
    int64 article_id = 1; // 文章 ID
    google.protobuf.Timestamp ends_at = 2; // 原计划截止时间
  }
  message Resp {}
}

message ArticleLotteryDraft {
  repeated ArticleLotteryPrizeDraft prizes = 1; // 奖项配置
  google.protobuf.Timestamp draw_at = 2; // 开奖时间
}

message ArticleLotteryPrizeDraft {
  string name = 1; // 奖项名称
  optional string description = 2; // 奖项说明
  int32 winner_limit = 3; // 中奖名额
}

message ArticleLottery {
  google.protobuf.Timestamp draw_at = 1; // 开奖时间
  google.protobuf.Timestamp drawn_at = 2; // 实际开奖时间
  int64 entry_count = 3; // 有效报名人数
  bool entered = 4; // 当前账号是否已报名
  repeated ArticleLotteryPrize prizes = 5; // 奖项和中奖结果
}

message ArticleLotteryPrize {
  int64 id = 1; // 奖项 ID
  string name = 2; // 奖项名称
  optional string description = 3; // 奖项说明
  int32 winner_limit = 4; // 中奖名额
  repeated int64 winner_user_ids = 5; // 按抽取顺序的中奖账号 ID
}

message EnterArticleLottery {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool entered = 2; // true 报名，false 撤销报名
    ContentAccess access = 3; // 访问上下文
  }
  message Resp {}
}

message DrawArticleLottery {
  message Req {
    int64 article_id = 1; // 文章 ID
    google.protobuf.Timestamp draw_at = 2; // 原计划开奖时间
  }
  message Resp {}
}
