    optional string user_agent = 4;
    // 浏览器指纹
    optional string browser_fingerprint = 5;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message PageArticleViewHistory {
  // 请求参数。
  message Req {
    // 分页参数
    .common.api.app.common.v1.PageReq page = 1;
    // 当前用户访问上下文
    ContentAccess access = 2;
    // 读取侧排除的作者账号 ID
    repeated int64 excluded_author_ids = 3;
  }
  // 响应结果。
  message Resp {
    // 协议字段。
    repeated ArticleViewHistoryItem rows = 1;
    // 协议字段。
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// PageCollectedArticles 分页读取当前账号仍可公开展示的收藏文章。
message PageCollectedArticles {
  // 请求参数。
  message Req {
    // 分页参数
    .common.api.app.common.v1.PageReq page = 1;
    // 当前用户访问上下文
    ContentAccess access = 2;
    // 读取侧排除的作者账号 ID
    repeated int64 excluded_author_ids = 3;
  }
  // 响应结果。
  message Resp {
    // 按收藏时间倒序的文章
    repeated Article rows = 1;
    // 分页结果
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// PageWatchedArticles 分页读取当前账号仍可公开展示的关注文章。
message PageWatchedArticles {
  // 请求参数。
  message Req {
    // 分页参数
    .common.api.app.common.v1.PageReq page = 1;
    // 当前用户访问上下文
    ContentAccess access = 2;
    // 读取侧排除的作者账号 ID
