syntax = "proto3";

package common.api.app.content.v1;

import "common/v1/common.proto";
import "content/enum/v1/article.proto";
import "content/v1/access.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// ContentArticleService 提供文章草稿、发布、查询与互动能力
service ContentArticleService {
  // 创建文章草稿
  rpc CreateDraftArticle(CreateDraftArticle.Req) returns (CreateDraftArticle.Resp) {}
  // 编辑文章草稿
  rpc UpdateDraftArticle(UpdateDraftArticle.Req) returns (UpdateDraftArticle.Resp) {}
  // 发布文章
  rpc PublishArticle(PublishArticle.Req) returns (PublishArticle.Resp) {}
  // 取消定时发布
  rpc CancelPublishArticle(CancelPublishArticle.Req) returns (CancelPublishArticle.Resp) {}
  // 丢弃草稿
  rpc DiscardDraftArticle(DiscardDraftArticle.Req) returns (DiscardDraftArticle.Resp) {}
  // 设为私有
  rpc MakePrivateArticle(MakePrivateArticle.Req) returns (MakePrivateArticle.Resp) {}
  // 设为公开
  rpc MakePublicArticle(MakePublicArticle.Req) returns (MakePublicArticle.Resp) {}
  // 归档文章
  rpc ArchiveArticle(ArchiveArticle.Req) returns (ArchiveArticle.Resp) {}
  // 设置文章置顶评论
  rpc SetPinnedArticleComment(SetPinnedArticleComment.Req) returns (SetPinnedArticleComment.Resp) {}
  // 采纳问答回答
  rpc AcceptArticleAnswer(AcceptArticleAnswer.Req) returns (AcceptArticleAnswer.Resp) {}
  // 投票
  rpc VoteArticlePoll(VoteArticlePoll.Req) returns (VoteArticlePoll.Resp) {}
  // 完成投票
  rpc FinishArticlePoll(FinishArticlePoll.Req) returns (FinishArticlePoll.Resp) {}
  // 报名或撤销抽奖报名
  rpc EnterArticleLottery(EnterArticleLottery.Req) returns (EnterArticleLottery.Resp) {}
  // 执行抽奖开奖
  rpc DrawArticleLottery(DrawArticleLottery.Req) returns (DrawArticleLottery.Resp) {}
  // 取消归档
  rpc UnarchiveArticle(UnarchiveArticle.Req) returns (UnarchiveArticle.Resp) {}
  // 隐藏文章
  rpc HideArticle(HideArticle.Req) returns (HideArticle.Resp) {}
  // 取消隐藏
  rpc UnhideArticle(UnhideArticle.Req) returns (UnhideArticle.Resp) {}
  // 锁定文章
  rpc LockArticle(LockArticle.Req) returns (LockArticle.Resp) {}
  // 取消锁定
  rpc UnlockArticle(UnlockArticle.Req) returns (UnlockArticle.Resp) {}
  // 点赞文章
  rpc LikeArticle(LikeArticle.Req) returns (LikeArticle.Resp) {}
  // 感谢文章
  rpc ThankArticle(ThankArticle.Req) returns (ThankArticle.Resp) {}
  // 收藏文章
  rpc CollectArticle(CollectArticle.Req) returns (CollectArticle.Resp) {}
  // 关注文章
  rpc WatchArticle(WatchArticle.Req) returns (WatchArticle.Resp) {}
  // 打赏文章
  rpc RewardArticle(RewardArticle.Req) returns (RewardArticle.Resp) {}
  // 浏览文章
  rpc ViewArticle(ViewArticle.Req) returns (ViewArticle.Resp) {}
  // 分页查询当前用户浏览历史
  rpc PageArticleViewHistory(PageArticleViewHistory.Req) returns (PageArticleViewHistory.Resp) {}
  // 分页查询当前用户收藏的公开文章
  rpc PageCollectedArticles(PageCollectedArticles.Req) returns (PageCollectedArticles.Resp) {}
  // 分页查询当前用户关注的公开文章
  rpc PageWatchedArticles(PageWatchedArticles.Req) returns (PageWatchedArticles.Resp) {}
  // 统计账号当前收藏的文章数量。
  rpc CountCollectedArticles(CountCollectedArticles.Req) returns (CountCollectedArticles.Resp) {}
  // 刷新浏览量
  rpc FlushArticleViews(FlushArticleViews.Req) returns (FlushArticleViews.Resp) {}
  // 查询互动状态
  rpc MapArticleViewerActionStates(MapArticleViewerActionStates.Req) returns (MapArticleViewerActionStates.Resp) {}
  // 查询文章关注账号
  rpc ListArticleWatchers(ListArticleWatchers.Req) returns (ListArticleWatchers.Resp) {}
  // 查询投票参与账号
  rpc ListArticlePollParticipants(ListArticlePollParticipants.Req) returns (ListArticlePollParticipants.Resp) {}
  // 查询抽奖参与账号
  rpc ListArticleLotteryParticipants(ListArticleLotteryParticipants.Req) returns (ListArticleLotteryParticipants.Resp) {}
  // 查询文章详情
  rpc GetArticle(GetArticle.Req) returns (GetArticle.Resp) {}
  // 查询文章列表
  rpc ListArticles(ListArticles.Req) returns (ListArticles.Resp) {}
  // 分页查询文章
  rpc PageArticles(PageArticles.Req) returns (PageArticles.Resp) {}
}

// 协议消息。
message CreateDraftArticle {
  // 请求参数。
  message Req {
    // 草稿内容
    Article article = 1;
    // 访问上下文
    ContentAccess access = 2;

    // 协议消息。
    message Article {
      // 标题
      string title = 1;
      // 正文
      string content = 2;
      // 打赏区内容
      optional string reward_content = 3;
      // 打赏积分
      optional int32 reward_points = 4;
      // 文章类型
      .common.api.app.content.enum.v1.ArticleType type = 5;
      // 创作声明
      optional string statement = 6;
      // 是否允许评论
      optional bool commentable = 7;
      // 投票文章的草稿配置
      ArticlePollDraft poll = 8;
      // 抽奖文章的草稿配置
      ArticleLotteryDraft lottery = 9;
    }
  }
  // 响应结果。
  message Resp {
    // 已创建草稿的文章 ID
    int64 article_id = 1;
  }
}

// 协议消息。
message UpdateDraftArticle {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 草稿内容
    Article article = 2;
    // 访问上下文
    ContentAccess access = 3;

    // 协议消息。
    message Article {
      // 标题
      string title = 1;
      // 正文
      string content = 2;
      // 打赏区内容
      optional string reward_content = 3;
      // 打赏积分
      optional int32 reward_points = 4;
      // 文章类型
      .common.api.app.content.enum.v1.ArticleType type = 5;
      // 创作声明
      optional string statement = 6;
      // 是否允许评论
      optional bool commentable = 7;
      // 投票文章的草稿配置
      ArticlePollDraft poll = 8;
      // 抽奖文章的草稿配置
      ArticleLotteryDraft lottery = 9;
    }
  }
  // 响应结果。
  message Resp {
    // 已保存草稿的文章 ID
    int64 article_id = 1;
  }
}

// 协议消息。
message PublishArticle {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 访问上下文
    optional ContentAccess access = 2;
    // 定时发布时间；未来时间会注册延迟任务
    optional google.protobuf.Timestamp scheduled_at = 3;
    // 作者发布或设置定时时的城市快照
    optional string city = 4;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message CancelPublishArticle {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 访问上下文
    ContentAccess access = 2;
  }
  // 响应结果。
  message Resp {}
}

