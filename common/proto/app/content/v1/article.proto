syntax = "proto3";

package common.api.app.content.v1;

import "common/common.proto";
import "content/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// Article 服务
service ContentArticleService {
  rpc Create(CreateArticle.Req) returns (CreateArticle.Resp) {} // 创建文章草稿
  rpc AddPostscript(AddPostscriptArticle.Req) returns (AddPostscriptArticle.Resp) {} // 添加附言
  rpc ListPostscripts(ListArticlePostscripts.Req) returns (ListArticlePostscripts.Resp) {} // 查询附言列表

  rpc Publish(PublishArticle.Req) returns (PublishArticle.Resp) {} // 发布文章
  rpc Update(UpdateArticle.Req) returns (UpdateArticle.Resp) {} // 修改文章内容
  rpc DiscardDraft(DiscardDraftArticle.Req) returns (DiscardDraftArticle.Resp) {} // 丢弃草稿
  rpc MakePrivate(MakePrivateArticle.Req) returns (MakePrivateArticle.Resp) {} // 设为私有
  rpc MakePublic(MakePublicArticle.Req) returns (MakePublicArticle.Resp) {} // 设为公开
  rpc Archive(ArchiveArticle.Req) returns (ArchiveArticle.Resp) {} // 归档文章
  rpc Unarchive(UnarchiveArticle.Req) returns (UnarchiveArticle.Resp) {} // 取消归档
  rpc Hide(HideArticle.Req) returns (HideArticle.Resp) {} // 管理隐藏文章
  rpc Unhide(UnhideArticle.Req) returns (UnhideArticle.Resp) {} // 取消管理隐藏
  rpc Lock(LockArticle.Req) returns (LockArticle.Resp) {} // 管理锁定文章
  rpc Unlock(UnlockArticle.Req) returns (UnlockArticle.Resp) {} // 管理解锁文章

  rpc Like(LikeArticle.Req) returns (LikeArticle.Resp) {} // 点赞文章
  rpc Thank(ThankArticle.Req) returns (ThankArticle.Resp) {} // 感谢文章
  rpc Collect(CollectArticle.Req) returns (CollectArticle.Resp) {} // 收藏文章
  rpc Watch(WatchArticle.Req) returns (WatchArticle.Resp) {} // 关注文章
  rpc Reward(RewardArticle.Req) returns (RewardArticle.Resp) {} // 打赏文章
  rpc AcceptAnswer(AcceptAnswerArticle.Req) returns (AcceptAnswerArticle.Resp) {} // 采纳评论
  rpc View(ViewArticle.Req) returns (ViewArticle.Resp) {} // 浏览文章

  rpc MapViewerActionStates(MapArticleViewerActionStates.Req) returns (MapArticleViewerActionStates.Resp) {} // 查询用户的文章行为状态
  rpc Get(GetArticle.Req) returns (GetArticle.Resp) {} // 查询单篇文章
  rpc List(ListArticles.Req) returns (ListArticles.Resp) {} // 查询文章列表
  rpc Page(PageArticles.Req) returns (PageArticles.Resp) {} // 分页查询文章
}

message CreateArticle {
  message Req {Article article = 1; // 文章信息
    int64 user_id = 2; // 用户 ID

    message Article {

      string title = 1; // 标题
      string content = 2; // 内容
      ArticleType type = 5; // 类型

      optional string reward_content = 6; // 打赏内容
      optional int32 reward_points = 7; // 打赏积分

      optional string statement = 10; // 创作声明
      optional bool commentable = 11; // 是否允许评论
      optional bool anonymous = 12; // 是否匿名
      repeated int64 tag_ids = 20; // 绑定标签 ID

      oneof type_params {
        QA qa = 100; // 问答参数
      }

      message QA {
        int32 bounty_points = 101; // 悬赏积分
      }
    }
  }
  message Resp {

    message Article {

      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 唯一 ID
      string title = 2; // 标题
      string content = 3; // 正文内容
      ArticleType type = 7; // 类型

      optional string reward_content = 8; // 打赏区内容
      optional int32 reward_points = 10; // 打赏积分

      bool has_postscript = 20; // 是否有附言
      bool has_reward = 21; // 是否有打赏区
      optional string statement = 22; // 创作声明
      bool commentable = 23; // 是否允许评论
      bool anonymous = 24; // 是否匿名
      google.protobuf.Timestamp published_at = 26; // 发布时间
      google.protobuf.Timestamp edited_at = 27; // 内容编辑时间
      ArticlePublishStatus publish_status = 28; // 发布状态
      ArticleVisibility visibility = 29; // 可见范围
      ContentRestriction restriction = 30; // 管理限制

      int32 view_count = 50; // 浏览数
      int32 thank_count = 51; // 感谢数
      int32 like_count = 52; // 点赞数
      int32 collect_count = 53; // 收藏数
      int32 watch_count = 54; // 关注数
      int32 reply_count = 55; // 回复数

      oneof type_params {
        QA qa = 100;
      }

      message QA {
        optional int32 bounty_points = 101; // 悬赏积分
        optional int64 accepted_answer_id = 102; // 采纳评论 ID
      }
    }
    Article article = 1; // 文章信息
  }
}

message AddPostscriptArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    string content = 2; // 附言内容
    int64 user_id = 3; // 用户 ID
  }
  message Resp {

    message ArticlePostscript {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 主键 ID
      int64 article_id = 2; // 所属文章 ID
      string content = 3; // 附言内容
      ContentRestriction restriction = 4; // 管理限制
    }
    ArticlePostscript article_postscript = 1; // 附言信息
  }
}

message ListArticlePostscripts {
  message Req {

    int64 article_id = 1; // 文章 ID
  }
  message Resp {

    message ArticlePostscript {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 主键 ID
      int64 article_id = 2; // 所属文章 ID
      string content = 3; // 附言内容
      ContentRestriction restriction = 4; // 管理限制
    }
    repeated ArticlePostscript rows = 1; // 附言列表
  }
}

message PublishArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    int64 user_id = 2; // 用户 ID
    ArticleVisibility visibility = 3; // 发布后的可见范围
  }
  message Resp {}
}

