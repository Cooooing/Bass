    // 查询参数
    ArticleQueryParams query = 1;
    // 访问上下文
    ContentAccess access = 2;
  }
  // 响应结果。
  message Resp {
    // 文章列表
    repeated Article rows = 1;
  }
}

// 协议消息。
message PageArticles {
  // 请求参数。
  message Req {
    // 查询参数
    ArticleQueryParams query = 1;
    // 分页参数
    .common.api.app.common.v1.PageReq page = 2;
    // 访问上下文
    ContentAccess access = 3;
  }
  // 响应结果。
  message Resp {
    // 文章列表
    repeated Article rows = 1;
    // 分页信息
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// 协议消息。
message ArticleQueryParams {
  // 标签 ID
  optional int64 tag_id = 1;
  // 领域 ID
  optional int64 domain_id = 2;
  // 文章 ID 列表
  repeated int64 article_ids = 3;
  // 文章类型
  optional .common.api.app.content.enum.v1.ArticleType type = 4;
  // 排序方式
  optional .common.api.app.content.enum.v1.ArticleOrder order = 5;
  // 作者账号 ID
  optional int64 author_id = 7;
  // 作者账号 ID 列表
  repeated int64 author_ids = 8;
  // 发布状态
  optional .common.api.app.content.enum.v1.ArticlePublishStatus publish_status = 10;
  // 发布状态列表
  repeated .common.api.app.content.enum.v1.ArticlePublishStatus publish_statuses = 11;
  // 可见范围
  optional .common.api.app.content.enum.v1.ArticleVisibility visibility = 12;
  // 可见范围列表
  repeated .common.api.app.content.enum.v1.ArticleVisibility visibilities = 13;
  // 治理限制
  optional .common.api.app.content.enum.v1.ContentRestriction restriction = 14;
  // 治理限制列表
  repeated .common.api.app.content.enum.v1.ContentRestriction restrictions = 15;
  // 仅作者：草稿是否已设置发布时间
  optional bool scheduled = 16;
  // 创建时间起点
  optional google.protobuf.Timestamp created_at_start = 20;
  // 创建时间终点
  optional google.protobuf.Timestamp created_at_end = 21;
  // 发布时间起点
  optional google.protobuf.Timestamp published_at_start = 22;
  // 发布时间终点
  optional google.protobuf.Timestamp published_at_end = 23;
  // 读取侧排除的作者账号 ID
  repeated int64 excluded_author_ids = 24;
  // 发布时城市快照
  optional string published_city = 25;
}

// 协议消息。
message Article {
  // 文章 ID
  int64 id = 1;
  // 标题
  string title = 2;
  // 正文
  string content = 3;
  // 打赏区内容
  optional string reward_content = 4;
  // 打赏积分
  optional int32 reward_points = 5;
  // 是否有附言
  bool has_postscript = 6;
  // 是否有打赏区
  bool has_reward = 7;
  // 文章类型
  .common.api.app.content.enum.v1.ArticleType type = 8;
  // 创作声明
  optional string statement = 9;
  // 是否允许评论
  bool commentable = 10;
  // 发布状态
  .common.api.app.content.enum.v1.ArticlePublishStatus publish_status = 11;
  // 可见范围
  .common.api.app.content.enum.v1.ArticleVisibility visibility = 12;
  // 治理限制
  .common.api.app.content.enum.v1.ContentRestriction restriction = 13;
  // 浏览数
  int32 view_count = 20;
  // 感谢数
  int32 thank_count = 21;
  // 点赞数
  int32 like_count = 22;
  // 收藏数
  int32 collect_count = 23;
  // 关注数
  int32 watch_count = 26;
  // 打赏数
  int32 reward_count = 24;
  // 回复数
  int32 reply_count = 25;
  // 发布时间
  google.protobuf.Timestamp published_at = 30;
  // 编辑时间
  google.protobuf.Timestamp edited_at = 31;
  // 发布时城市快照
  optional string published_city = 32;
  // 作者手动置顶的评论 ID
  optional int64 pinned_comment_id = 36;
  // 问答已采纳评论 ID
  optional int64 accepted_comment_id = 37;
  // 投票详情
  ArticlePoll poll = 38;
  // 抽奖详情
  ArticleLottery lottery = 39;
  // 创建账号 ID
  optional int64 created_by = 1002;
  // 更新账号 ID
  optional int64 updated_by = 1003;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message ArticlePollDraft {
  // 投票选项
  repeated string options = 1;
  // 截止时间
  google.protobuf.Timestamp ends_at = 2;
  // 每人最多选择数
  int32 max_choices = 3;
}

// 协议消息。
message ArticlePoll {
  // 截止时间
  google.protobuf.Timestamp ends_at = 1;
  // 每人最多选择数
  int32 max_choices = 2;
  // 投票选项
  repeated ArticlePollOption options = 3;
  // 当前账号已选选项 ID
  repeated int64 selected_option_ids = 4;
  // 当前账号是否可查看实时结果
  bool result_visible = 5;
  // 已投票账号数
  int64 participant_count = 6;
  // 所有选项累计票数
  int64 total_vote_count = 7;
}

// 协议消息。
message ArticlePollOption {
  // 选项 ID
  int64 id = 1;
  // 选项内容
  string content = 2;
  // 可见时的票数
  int32 vote_count = 3;
}

// 协议消息。
message VoteArticlePoll {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 所选选项 ID
    repeated int64 option_ids = 2;
    // 访问上下文
    ContentAccess access = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message FinishArticlePoll {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 原计划截止时间
    google.protobuf.Timestamp ends_at = 2;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message ArticleLotteryDraft {
  // 奖项配置
  repeated ArticleLotteryPrizeDraft prizes = 1;
  // 开奖时间
  google.protobuf.Timestamp draw_at = 2;
}

// 协议消息。
message ArticleLotteryPrizeDraft {
  // 奖项名称
  string name = 1;
  // 奖项说明
  optional string description = 2;
  // 中奖名额
  int32 winner_limit = 3;
}

// 协议消息。
message ArticleLottery {
  // 开奖时间
  google.protobuf.Timestamp draw_at = 1;
  // 实际开奖时间
  google.protobuf.Timestamp drawn_at = 2;
  // 有效报名人数
  int64 entry_count = 3;
  // 当前账号是否已报名
  bool entered = 4;
  // 奖项和中奖结果
  repeated ArticleLotteryPrize prizes = 5;
}

// 协议消息。
message ArticleLotteryPrize {
  // 奖项 ID
  int64 id = 1;
  // 奖项名称
  string name = 2;
  // 奖项说明
  optional string description = 3;
  // 中奖名额
  int32 winner_limit = 4;
  // 按抽取顺序的中奖账号 ID
  repeated int64 winner_user_ids = 5;
}

// 协议消息。
message EnterArticleLottery {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // true 报名，false 撤销报名
    bool entered = 2;
    // 访问上下文
    ContentAccess access = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message DrawArticleLottery {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 原计划开奖时间
    google.protobuf.Timestamp draw_at = 2;
  }
  // 响应结果。
  message Resp {}
}
