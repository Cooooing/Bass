syntax = "proto3";

package common.api.app.content.v1;

import "common/common.proto";
import "content/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// Article 服务
service ContentArticleService {
  rpc Create(CreateArticle.Request) returns (CreateArticle.Response) {} // 创建文章草稿
  rpc AddPostscript(AddPostscriptArticle.Request) returns (AddPostscriptArticle.Response) {} // 添加附言
  rpc ListPostscripts(ListArticlePostscripts.Request) returns (ListArticlePostscripts.Response) {} // 查询附言列表

  rpc Publish(PublishArticle.Request) returns (PublishArticle.Response) {} // 发布文章
  rpc Update(UpdateArticle.Request) returns (UpdateArticle.Response) {} // 修改文章内容
  rpc DiscardDraft(DiscardDraftArticle.Request) returns (DiscardDraftArticle.Response) {} // 丢弃草稿
  rpc MakePrivate(MakePrivateArticle.Request) returns (MakePrivateArticle.Response) {} // 设为私有
  rpc MakePublic(MakePublicArticle.Request) returns (MakePublicArticle.Response) {} // 设为公开
  rpc Archive(ArchiveArticle.Request) returns (ArchiveArticle.Response) {} // 归档文章
  rpc Unarchive(UnarchiveArticle.Request) returns (UnarchiveArticle.Response) {} // 取消归档
  rpc Hide(HideArticle.Request) returns (HideArticle.Response) {} // 管理隐藏文章
  rpc Unhide(UnhideArticle.Request) returns (UnhideArticle.Response) {} // 取消管理隐藏
  rpc Lock(LockArticle.Request) returns (LockArticle.Response) {} // 管理锁定文章
  rpc Unlock(UnlockArticle.Request) returns (UnlockArticle.Response) {} // 管理解锁文章

  rpc Like(LikeArticle.Request) returns (LikeArticle.Response) {} // 点赞文章
  rpc Thank(ThankArticle.Request) returns (ThankArticle.Response) {} // 感谢文章
  rpc Collect(CollectArticle.Request) returns (CollectArticle.Response) {} // 收藏文章
  rpc Watch(WatchArticle.Request) returns (WatchArticle.Response) {} // 关注文章
  rpc Reward(RewardArticle.Request) returns (RewardArticle.Response) {} // 打赏文章
  rpc AcceptAnswer(AcceptAnswerArticle.Request) returns (AcceptAnswerArticle.Response) {} // 采纳评论
  rpc View(ViewArticle.Request) returns (ViewArticle.Response) {} // 浏览文章

  rpc MapViewerActionStates(MapArticleViewerActionStates.Request) returns (MapArticleViewerActionStates.Response) {} // 查询用户的文章行为状态
  rpc Get(GetArticle.Request) returns (GetArticle.Response) {} // 查询单篇文章
  rpc List(ListArticles.Request) returns (ListArticles.Response) {} // 查询文章列表
  rpc Page(PageArticles.Request) returns (PageArticles.Response) {} // 分页查询文章
}

message CreateArticle {
  message Request {      Article article = 1; // 文章信息
      int64 user_id = 2; // 用户 ID

      message Article {

        string title = 1; // 标题
        string content = 2; // 内容
        ArticleType type = 5; // 类型

        optional string reward_content = 6; // 打赏内容
        optional int32 reward_points = 7; // 打赏积分

        optional string statement = 10; // 创作声明
        optional bool commentable = 11; // 是否允许评论
        optional bool anonymous = 12; // 是否匿名
        repeated int64 tag_ids = 20; // 绑定标签 ID

        oneof type_params {
          QA qa = 100; // 问答参数
        }

        message QA {
          int32 bounty_points = 101; // 悬赏积分
        }
      }
    }
  message Response {

    message Article {

        google.protobuf.Timestamp created_at = 1000; // 创建时间
        google.protobuf.Timestamp updated_at = 1001; // 更新时间
        optional int64 created_by = 1002; // 创建人
        optional int64 updated_by = 1003; // 更新人

        int64 id = 1; // 唯一 ID
        string title = 2; // 标题
        string content = 3; // 正文内容
        ArticleType type = 7; // 类型

        optional string reward_content = 8; // 打赏区内容
        optional int32 reward_points = 10; // 打赏积分

        bool has_postscript = 20; // 是否有附言
        bool has_reward = 21; // 是否有打赏区
        optional string statement = 22; // 创作声明
        bool commentable = 23; // 是否允许评论
        bool anonymous = 24; // 是否匿名
        google.protobuf.Timestamp published_at = 26; // 发布时间
        google.protobuf.Timestamp edited_at = 27; // 内容编辑时间
        ArticlePublishStatus publish_status = 28; // 发布状态
        ArticleVisibility visibility = 29; // 可见范围
        ContentRestriction restriction = 30; // 管理限制

        int32 view_count = 50; // 浏览数
        int32 thank_count = 51; // 感谢数
        int32 like_count = 52; // 点赞数
        int32 collect_count = 53; // 收藏数
        int32 watch_count = 54; // 关注数
        int32 reply_count = 55; // 回复数

        oneof type_params {
          QA qa = 100;
        }

        message QA {
          optional int32 bounty_points = 101; // 悬赏积分
          optional int64 accepted_answer_id = 102; // 采纳评论 ID
        }
      }
      Article article = 1; // 文章信息
    }
}

message AddPostscriptArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      string content = 2; // 附言内容
      int64 user_id = 3; // 用户 ID
    }
  message Response {

    message ArticlePostscript {
        google.protobuf.Timestamp created_at = 1000; // 创建时间
        google.protobuf.Timestamp updated_at = 1001; // 更新时间
        optional int64 created_by = 1002; // 创建人
        optional int64 updated_by = 1003; // 更新人

        int64 id = 1; // 主键 ID
        int64 article_id = 2; // 所属文章 ID
        string content = 3; // 附言内容
        ContentRestriction restriction = 4; // 管理限制
      }
      ArticlePostscript article_postscript = 1; // 附言信息
    }
}

message ListArticlePostscripts {
  message Request {

      int64 article_id = 1; // 文章 ID
    }
  message Response {

    message ArticlePostscript {
        google.protobuf.Timestamp created_at = 1000; // 创建时间
        google.protobuf.Timestamp updated_at = 1001; // 更新时间
        optional int64 created_by = 1002; // 创建人
        optional int64 updated_by = 1003; // 更新人

        int64 id = 1; // 主键 ID
        int64 article_id = 2; // 所属文章 ID
        string content = 3; // 附言内容
        ContentRestriction restriction = 4; // 管理限制
      }
      repeated ArticlePostscript rows = 1; // 附言列表
    }
}

message PublishArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      int64 user_id = 2; // 用户 ID
      ArticleVisibility visibility = 3; // 发布后的可见范围
    }
  message Response {}
}

