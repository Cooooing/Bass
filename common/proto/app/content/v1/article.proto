  message Response {
      bool watched = 1; // 是否关注
    }
}

message RewardArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      int32 points = 2; // 积分
      int64 user_id = 3; // 用户 ID
    }
  message Response {}
}

message AcceptAnswerArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      int64 comment_id = 2; // 评论 ID
      int64 user_id = 3; // 用户 ID
    }
  message Response {}
}

message ViewArticle {
  message Request {
      int64 article_id = 1; // 文章 ID
      optional int64 viewer_user_id = 2; // 查看用户 ID
    }
  message Response {}
}

message MapArticleViewerActionStates {
  message Request {
      repeated int64 article_ids = 1; // 文章 ID 列表
      int64 user_id = 2; // 用户 ID
    }
  message Response {

    message ArticleViewerActionState {
        bool liked = 1; // 是否已点赞
        bool thanked = 2; // 是否已感谢
        bool collected = 3; // 是否已收藏
        bool watched = 4; // 是否已关注
      }
      map<int64, ArticleViewerActionState> states = 1; // 文章行为状态映射
    }
}

