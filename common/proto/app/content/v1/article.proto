message LikeArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool liked = 2; // 是否点赞
    int64 user_id = 3; // 用户 ID
  }
  message Resp {
    bool liked = 1; // 是否点赞
  }
}

message ThankArticle {
  message Req {
    int64 article_id = 1; // 文章 ID
    bool thanked = 2; // 是否感谢
    int64 user_id = 3; // 用户 ID
