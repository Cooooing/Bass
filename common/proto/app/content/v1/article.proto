    // 按关注时间倒序的文章
    repeated Article rows = 1;
    // 分页结果
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// 协议消息。
message ArticleViewHistoryItem {
  // 当前仍可展示的文章
  Article article = 1;
  // 最近浏览时间
  google.protobuf.Timestamp viewed_at = 2;
}

// 协议消息。
message FlushArticleViews {
  // 请求参数。
  message Req {
    // 刷新数量上限
    int32 limit = 1;
  }
  // 响应结果。
  message Resp {
    // 已刷新文章数
    int32 flushed = 1;
  }
}

// CountCollectedArticles 统计账号当前有效的文章收藏数量。
message CountCollectedArticles {
  // 请求参数。
  message Req {
    // 待统计账号 ID。
    int64 user_id = 1;
  }
  // 响应结果。
  message Resp {
    // 当前有效收藏数量。
    int32 count = 1;
  }
}

// 协议消息。
message MapArticleViewerActionStates {
  // 请求参数。
  message Req {
    // 文章 ID 列表
    repeated int64 article_ids = 1;
    // 用户账号 ID
    int64 user_id = 2;
  }
  // 响应结果。
  message Resp {
    // 互动状态映射
    map<int64, ArticleViewerActionState> states = 1;
    // 协议消息。
    message ArticleViewerActionState {
      // 是否已点赞
      bool liked = 1;
      // 是否已感谢
      bool thanked = 2;
      // 是否已收藏
      bool collected = 3;
      // 是否已打赏
      bool rewarded = 4;
      // 是否已关注
      bool watched = 5;
    }
  }
}

// 协议消息。
message ListArticleWatchers {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
  }
  // 响应结果。
  message Resp {
    // 当前关注文章的账号 ID
    repeated int64 user_ids = 1;
  }
}

// 协议消息。
message ListArticlePollParticipants {
