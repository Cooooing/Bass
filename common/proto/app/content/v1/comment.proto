syntax = "proto3";

package common.api.app.content.v1;

import "common/v1/common.proto";
import "content/enum/v1/article.proto";
import "content/enum/v1/comment.proto";
import "content/v1/access.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// 评论服务
service ContentCommentService {
  // 创建评论
  rpc CreateComment(CreateComment.Req) returns (CreateComment.Resp) {}
  // 管理隐藏评论
  rpc HideComment(HideComment.Req) returns (HideComment.Resp) {}
  // 取消管理隐藏
  rpc UnhideComment(UnhideComment.Req) returns (UnhideComment.Resp) {}
  // 管理锁定评论
  rpc LockComment(LockComment.Req) returns (LockComment.Resp) {}
  // 管理解锁评论
  rpc UnlockComment(UnlockComment.Req) returns (UnlockComment.Resp) {}
  // 点赞评论
  rpc LikeComment(LikeComment.Req) returns (LikeComment.Resp) {}
  // 感谢评论
  rpc ThankComment(ThankComment.Req) returns (ThankComment.Resp) {}

  // 查询评论列表
  rpc ListComments(ListComments.Req) returns (ListComments.Resp) {}
  // 分页查询评论
  rpc PageComments(PageComments.Req) returns (PageComments.Resp) {}
  // 查询用户的评论行为状态
  rpc MapCommentViewerActionStates(MapCommentViewerActionStates.Req) returns (MapCommentViewerActionStates.Resp) {}
  // 查询评论回复预览
  rpc ListCommentReplyPreviews(ListCommentReplyPreviews.Req) returns (ListCommentReplyPreviews.Resp) {}
  // 查询文章最后正常评论映射
  rpc MapArticleLastComments(MapArticleLastComments.Req) returns (MapArticleLastComments.Resp) {}
}

// 协议消息。
message CreateComment {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 评论内容
    string content = 2;
    // 回复评论 ID
    optional int64 reply_id = 3;
    // 访问上下文
    ContentAccess access = 4;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message Comment {
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
      // 创建人
      optional int64 created_by = 1002;
      // 更新人
      optional int64 updated_by = 1003;

      // 评论 ID
      int64 id = 1;
      // 文章 ID
      int64 article_id = 2;
      // 评论内容
      string content = 3;
      // 评论层级
      int32 level = 5;
      // 父级评论 ID
      optional int64 parent_id = 6;
      // 回复评论 ID
      optional int64 reply_id = 7;
      // 感谢数量
      int32 thank_count = 9;
      // 点赞数量
      int32 like_count = 10;
      // 子评论数量
      int32 reply_count = 11;
      // 被回复用户 ID
      optional int64 reply_user_id = 12;
      // 管理限制
      .common.api.app.content.enum.v1.ContentRestriction restriction = 13;
      // 逻辑删除时间
      google.protobuf.Timestamp deleted_at = 14;
    }
    // 评论信息
    Comment comment = 1;
  }
}

// 协议消息。
message HideComment {
  // 请求参数。
  message Req {
    // 评论 ID
    int64 id = 1;
    // 访问上下文
    ContentAccess access = 2;
    // 操作原因
    optional string reason = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message UnhideComment {
  // 请求参数。
  message Req {
    // 评论 ID
    int64 id = 1;
    // 访问上下文
    ContentAccess access = 2;
    // 操作原因
    optional string reason = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message LockComment {
  // 请求参数。
  message Req {
    // 评论 ID
    int64 id = 1;
    // 访问上下文
    ContentAccess access = 2;
    // 操作原因
    optional string reason = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message UnlockComment {
  // 请求参数。
  message Req {
    // 评论 ID
    int64 id = 1;
    // 访问上下文
    ContentAccess access = 2;
    // 操作原因
    optional string reason = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message LikeComment {
  // 请求参数。
  message Req {
    // 评论 ID
    int64 id = 1;
    // 是否点赞
    bool liked = 2;
    // 访问上下文
    ContentAccess access = 3;
  }
