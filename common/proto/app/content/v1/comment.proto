// 协议消息。
message ThankComment {
  // 请求参数。
  message Req {
    // 评论 ID
    int64 id = 1;
    // 是否感谢
    bool thanked = 2;
    // 访问上下文
    ContentAccess access = 3;
  }
  // 响应结果。
  message Resp {
    // 是否感谢
    bool thanked = 1;
  }
