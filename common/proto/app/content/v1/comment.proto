// 协议消息。
message ListComments {
  // 请求参数。
  message Req {
    // 协议消息。
    message CommentQueryParams {
      // 评论 ID
      optional int64 comment_id = 1;
      // 文章 ID
      optional int64 article_id = 2;
      // 父级评论 ID
      optional int64 parent_id = 3;
      // 回复评论 ID
      optional int64 reply_id = 4;
      // 排序
      optional .common.api.app.content.enum.v1.CommentOrder order = 5;
      // 层级
      optional int32 level = 6;
      // 评论用户 ID
      optional int64 user_id = 9;
      // 管理限制
      optional .common.api.app.content.enum.v1.ContentRestriction restriction = 10;
      // 管理限制列表
      repeated .common.api.app.content.enum.v1.ContentRestriction restrictions = 11;
      // 读取侧排除的作者账号 ID
      repeated int64 excluded_user_ids = 12;
      // 当前查询中排除的评论 ID
      repeated int64 excluded_comment_ids = 13;
    }
    // 查询参数
    CommentQueryParams query = 1;
    // 访问上下文
    ContentAccess access = 2;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message Comment {
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
      // 创建人
      optional int64 created_by = 1002;
      // 更新人
      optional int64 updated_by = 1003;

      // 评论 ID
      int64 id = 1;
      // 文章 ID
      int64 article_id = 2;
      // 评论内容
      string content = 3;
      // 评论层级
      int32 level = 5;
      // 父级评论 ID
      optional int64 parent_id = 6;
      // 回复评论 ID
      optional int64 reply_id = 7;
      // 感谢数量
      int32 thank_count = 9;
      // 点赞数量
      int32 like_count = 10;
      // 子评论数量
      int32 reply_count = 11;
      // 被回复用户 ID
      optional int64 reply_user_id = 12;
      // 管理限制
      .common.api.app.content.enum.v1.ContentRestriction restriction = 13;
      // 逻辑删除时间
      google.protobuf.Timestamp deleted_at = 14;
    }
    // 评论列表
    repeated Comment rows = 1;
  }
}

// 协议消息。
message PageComments {
  // 请求参数。
  message Req {
    // 协议消息。
    message CommentQueryParams {
      // 评论 ID
      optional int64 comment_id = 1;
      // 文章 ID
      optional int64 article_id = 2;
      // 父级评论 ID
      optional int64 parent_id = 3;
      // 回复评论 ID
      optional int64 reply_id = 4;
      // 排序
      optional .common.api.app.content.enum.v1.CommentOrder order = 5;
      // 层级
      optional int32 level = 6;
      // 评论用户 ID
      optional int64 user_id = 9;
      // 管理限制
      optional .common.api.app.content.enum.v1.ContentRestriction restriction = 10;
      // 管理限制列表
      repeated .common.api.app.content.enum.v1.ContentRestriction restrictions = 11;
      // 读取侧排除的作者账号 ID
      repeated int64 excluded_user_ids = 12;
      // 当前查询中排除的评论 ID
      repeated int64 excluded_comment_ids = 13;
    }
    // 查询参数
    CommentQueryParams query = 1;
    // 分页参数
    optional .common.api.app.common.v1.PageReq page = 2;
    // 访问上下文
    ContentAccess access = 3;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message Comment {
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
      // 创建人
      optional int64 created_by = 1002;
      // 更新人
      optional int64 updated_by = 1003;

      // 评论 ID
      int64 id = 1;
      // 文章 ID
      int64 article_id = 2;
      // 评论内容
      string content = 3;
      // 评论层级
      int32 level = 5;
      // 父级评论 ID
      optional int64 parent_id = 6;
      // 回复评论 ID
      optional int64 reply_id = 7;
      // 感谢数量
      int32 thank_count = 9;
      // 点赞数量
      int32 like_count = 10;
      // 子评论数量
      int32 reply_count = 11;
      // 被回复用户 ID
      optional int64 reply_user_id = 12;
      // 管理限制
      .common.api.app.content.enum.v1.ContentRestriction restriction = 13;
      // 逻辑删除时间
      google.protobuf.Timestamp deleted_at = 14;
    }
    // 评论列表
    repeated Comment rows = 1;
    // 分页信息
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// 协议消息。
message MapCommentViewerActionStates {
  // 请求参数。
  message Req {
    // 评论 ID 列表
    repeated int64 comment_ids = 1;
    // 用户 ID
    int64 user_id = 2;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message State {
      // 是否点赞
      bool liked = 1;
      // 是否感谢
      bool thanked = 2;
    }
    // 评论行为状态映射
    map<int64, State> states = 1;
  }
}

// 协议消息。
message ListCommentReplyPreviews {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 父级评论 ID
    repeated int64 parent_ids = 2;
    // 每条父级评论返回的回复数量
    int32 limit_per_parent = 3;
    // 排序
    optional .common.api.app.content.enum.v1.CommentOrder order = 4;
    // 管理限制
    optional .common.api.app.content.enum.v1.ContentRestriction restriction = 7;
    // 管理限制列表
    repeated .common.api.app.content.enum.v1.ContentRestriction restrictions = 8;
    // 访问上下文
    ContentAccess access = 9;
    // 读取侧排除的作者账号 ID
    repeated int64 excluded_user_ids = 10;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message CommentReplyPreview {
      // 父级评论 ID
      int64 parent_id = 1;
      // 回复列表
      repeated Comment rows = 2;
    }

    // 协议消息。
    message Comment {
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
      // 创建人
      optional int64 created_by = 1002;
      // 更新人
      optional int64 updated_by = 1003;

      // 评论 ID
      int64 id = 1;
      // 文章 ID
      int64 article_id = 2;
      // 评论内容
      string content = 3;
      // 评论层级
      int32 level = 5;
      // 父级评论 ID
      optional int64 parent_id = 6;
      // 回复评论 ID
      optional int64 reply_id = 7;
      // 感谢数量
      int32 thank_count = 9;
      // 点赞数量
      int32 like_count = 10;
      // 子评论数量
      int32 reply_count = 11;
      // 被回复用户 ID
      optional int64 reply_user_id = 12;
      // 管理限制
      .common.api.app.content.enum.v1.ContentRestriction restriction = 13;
      // 逻辑删除时间
      google.protobuf.Timestamp deleted_at = 14;
    }
    // 回复预览列表
    repeated CommentReplyPreview rows = 1;
  }
}

// 协议消息。
message MapArticleLastComments {
  // 请求参数。
  message Req {
    // 文章 ID
    repeated int64 article_ids = 1;
    // 读取侧排除的作者账号 ID
    repeated int64 excluded_user_ids = 2;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message Comment {
      // 创建时间
      google.protobuf.Timestamp created_at = 1000;
      // 更新时间
      google.protobuf.Timestamp updated_at = 1001;
      // 创建人
      optional int64 created_by = 1002;
      // 更新人
      optional int64 updated_by = 1003;

      // 评论 ID
      int64 id = 1;
      // 文章 ID
      int64 article_id = 2;
      // 评论内容
      string content = 3;
      // 评论层级
      int32 level = 5;
      // 父级评论 ID
      optional int64 parent_id = 6;
      // 回复评论 ID
      optional int64 reply_id = 7;
      // 感谢数量
      int32 thank_count = 9;
      // 点赞数量
      int32 like_count = 10;
      // 子评论数量
      int32 reply_count = 11;
      // 被回复用户 ID
      optional int64 reply_user_id = 12;
      // 管理限制
      .common.api.app.content.enum.v1.ContentRestriction restriction = 13;
      // 逻辑删除时间
      google.protobuf.Timestamp deleted_at = 14;
    }
    // 文章最后正常评论映射
    map<int64, Comment> comments = 1;
  }
}
