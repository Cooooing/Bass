syntax = "proto3";

package common.api.app.content.v1;

import "common/common.proto";
import "content/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// 领域服务
service ContentDomainService {
  rpc BatchCreate(BatchCreateDomains.Req) returns (BatchCreateDomains.Resp) {} // 批量创建领域

  rpc Update(UpdateDomain.Req) returns (UpdateDomain.Resp) {} // 修改领域信息

  rpc List(ListDomains.Req) returns (ListDomains.Resp) {} // 查询领域列表
  rpc Page(PageDomains.Req) returns (PageDomains.Resp) {} // 分页查询领域
}

message BatchCreateDomains {
  message Req {repeated Domain domains = 1; // 领域信息列表
    int64 user_id = 2; // 用户 ID

    message Domain {
      string name = 2; // 领域名称
      optional string description = 3; // 描述
      optional DomainStatus status = 4; // 启停状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      bool is_nav = 7; // 是否导航
    }
  }
  message Resp {

    message Domain {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 主键
      string name = 2; // 领域名称
      optional string description = 3; // 描述
      DomainStatus status = 4; // 启停状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      bool is_nav = 7; // 是否导航
    }
    repeated Domain rows = 1; // 领域信息列表
  }
}

message UpdateDomain {
  message Req {
    Domain domain = 1; // 领域信息
    int64 user_id = 2; // 用户 ID

    message Domain {
      int64 id = 1; // 主键
      string name = 2; // 领域名称
      optional string description = 3; // 描述
      optional DomainStatus status = 4; // 启停状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      bool is_nav = 7; // 是否导航
    }
  }
  message Resp {

    message Domain {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 主键
      string name = 2; // 领域名称
      optional string description = 3; // 描述
      DomainStatus status = 4; // 启停状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      bool is_nav = 7; // 是否导航
    }
    Domain domain = 1; // 领域信息
  }
}

message ListDomains {
  message Req {

    message DomainQueryParams {
      repeated int64 ids = 1; // 主键列表
      optional string name = 2; // 领域名称
      optional string description = 3; // 描述
      optional DomainStatus status = 4; // 状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      optional bool is_nav = 7; // 是否导航
    }
    DomainQueryParams query = 1; // 查询参数
  }
  message Resp {

    message Domain {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 主键
      string name = 2; // 领域名称
      optional string description = 3; // 描述
      DomainStatus status = 4; // 启停状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      bool is_nav = 7; // 是否导航
    }
    repeated Domain rows = 1; // 领域列表
  }
}

message PageDomains {
  message Req {

    message DomainQueryParams {
      repeated int64 ids = 1; // 主键列表
      optional string name = 2; // 领域名称
      optional string description = 3; // 描述
      optional DomainStatus status = 4; // 状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      optional bool is_nav = 7; // 是否导航
    }
    DomainQueryParams query = 1; // 查询参数
    optional .common.api.app.common.PageReq page = 2; // 分页参数
  }
  message Resp {

    message Domain {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      optional int64 created_by = 1002; // 创建人
      optional int64 updated_by = 1003; // 更新人

      int64 id = 1; // 主键
      string name = 2; // 领域名称
      optional string description = 3; // 描述
      DomainStatus status = 4; // 启停状态
      optional string url = 5; // 链接
      optional string icon = 6; // 图标
      bool is_nav = 7; // 是否导航
    }
    repeated Domain rows = 1; // 领域列表
    optional .common.api.app.common.PageResp page = 2; // 分页信息
  }
}
