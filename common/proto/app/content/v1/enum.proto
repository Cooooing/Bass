syntax = "proto3";

package common.api.app.content.v1;

option go_package = "common/proto/gen/content/v1;v1";

// DomainStatus 表示领域状态。
enum DomainStatus {
  DOMAIN_STATUS_UNSPECIFIED = 0; // 未指定
  DOMAIN_STATUS_ENABLED = 1; // 启用
  DOMAIN_STATUS_DISABLED = 2; // 禁用
}

// TagStatus 表示标签状态。
enum TagStatus {
  TAG_STATUS_UNSPECIFIED = 0; // 未指定
  TAG_STATUS_ENABLED = 1; // 启用
  TAG_STATUS_DISABLED = 2; // 禁用
}

// ArticlePublishStatus 表示文章发布生命周期状态。
enum ArticlePublishStatus {
  ARTICLE_PUBLISH_STATUS_UNSPECIFIED = 0; // 未指定
  ARTICLE_PUBLISH_STATUS_DRAFT = 1; // 草稿
  ARTICLE_PUBLISH_STATUS_PUBLISHED = 2; // 已发布
  ARTICLE_PUBLISH_STATUS_ARCHIVED = 3; // 已归档
}

// ArticleVisibility 表示已发布文章的可见范围。
enum ArticleVisibility {
  ARTICLE_VISIBILITY_UNSPECIFIED = 0; // 未指定
  ARTICLE_VISIBILITY_PUBLIC = 1; // 公开
  ARTICLE_VISIBILITY_PRIVATE = 2; // 私有
}

// ContentRestriction 表示内容的管理限制状态。
enum ContentRestriction {
  CONTENT_RESTRICTION_UNSPECIFIED = 0; // 未指定
  CONTENT_RESTRICTION_NONE = 1; // 无管理限制
  CONTENT_RESTRICTION_HIDDEN = 2; // 管理隐藏
  CONTENT_RESTRICTION_LOCKED = 3; // 管理锁定
}

// ContentModerationTarget 表示内容管理处置目标类型。
enum ContentModerationTarget {
  CONTENT_MODERATION_TARGET_UNSPECIFIED = 0; // 未指定
  CONTENT_MODERATION_TARGET_ARTICLE = 1; // 文章
  CONTENT_MODERATION_TARGET_COMMENT = 2; // 评论
  CONTENT_MODERATION_TARGET_POSTSCRIPT = 3; // 附言
}

// ContentModerationAction 表示内容管理处置动作。
enum ContentModerationAction {
  CONTENT_MODERATION_ACTION_UNSPECIFIED = 0; // 未指定
  CONTENT_MODERATION_ACTION_HIDE = 1; // 隐藏
  CONTENT_MODERATION_ACTION_UNHIDE = 2; // 取消隐藏
  CONTENT_MODERATION_ACTION_LOCK = 3; // 锁定
  CONTENT_MODERATION_ACTION_UNLOCK = 4; // 解锁
  CONTENT_MODERATION_ACTION_DELETE = 5; // 删除
  CONTENT_MODERATION_ACTION_RESTORE = 6; // 恢复
}

// ArticleType 表示文章业务类型。
enum ArticleType {
  ARTICLE_TYPE_UNSPECIFIED = 0; // 未指定
  ARTICLE_TYPE_NORMAL = 1; // 普通文章
  ARTICLE_TYPE_QA = 2; // 问答文章
}

// ArticleAction 表示文章互动行为类型。
enum ArticleAction {
  ARTICLE_ACTION_UNSPECIFIED = 0; // 未指定
  ARTICLE_ACTION_LIKE = 1; // 点赞
  ARTICLE_ACTION_THANK = 2; // 感谢
  ARTICLE_ACTION_COLLECT = 3; // 收藏
  ARTICLE_ACTION_WATCH = 4; // 关注
  ARTICLE_ACTION_REWARD = 5; // 打赏
  ARTICLE_ACTION_REPLY = 6; // 回复
}

// ArticleOrder 表示文章列表排序方式。
enum ArticleOrder {
  ARTICLE_ORDER_UNSPECIFIED = 0; // 未指定
  ARTICLE_ORDER_NEWEST = 1; // 最新
  ARTICLE_ORDER_HOTTEST = 2; // 最热
}

// CommentAction 表示评论互动行为类型。
enum CommentAction {
  COMMENT_ACTION_UNSPECIFIED = 0; // 未指定
  COMMENT_ACTION_LIKE = 1; // 点赞
  COMMENT_ACTION_REPLY = 3; // 回复
  COMMENT_ACTION_THANK = 4; // 感谢
}

// CommentOrder 表示评论列表排序方式。
enum CommentOrder {
  COMMENT_ORDER_UNSPECIFIED = 0; // 未指定
  COMMENT_ORDER_NEWEST = 1; // 最新
  COMMENT_ORDER_HOTTEST = 2; // 最热
  COMMENT_ORDER_OLDEST = 3; // 最早
}
