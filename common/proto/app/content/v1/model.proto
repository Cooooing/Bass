syntax = "proto3";

package common.api.app.content.v1;

import "content/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

message Article {
  reserved 6, 25;

  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
  optional int64 created_by = 1002; // 创建人
  optional int64 updated_by = 1003; // 更新人

  int64 id = 1; // 唯一 ID
  string title = 2; // 标题
  string content = 3; // 正文内容
  ArticleType type = 7; // 类型

  optional string reward_content = 8; // 打赏区内容
  optional int32 reward_points = 10; // 打赏积分

  bool has_postscript = 20; // 是否有附言
  bool has_reward = 21; // 是否有打赏区
  optional string statement = 22; // 创作声明
  bool commentable = 23; // 是否允许评论
  bool anonymous = 24; // 是否匿名
  google.protobuf.Timestamp published_at = 26; // 发布时间
  google.protobuf.Timestamp edited_at = 27; // 内容编辑时间
  ArticlePublishStatus publish_status = 28; // 发布状态
  ArticleVisibility visibility = 29; // 可见范围
  ContentRestriction restriction = 30; // 管理限制

  int32 view_count = 50; // 浏览数
  int32 thank_count = 51; // 感谢数
  int32 like_count = 52; // 点赞数
  int32 collect_count = 53; // 收藏数
  int32 watch_count = 54; // 关注数
  int32 reply_count = 55; // 回复数

  oneof type_params {
    QA qa = 100;
  }

  message QA {
    optional int32 bounty_points = 101; // 悬赏积分
    optional int64 accepted_answer_id = 102; // 采纳评论 ID
  }
}

message ArticlePostscript {
  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
  optional int64 created_by = 1002; // 创建人
  optional int64 updated_by = 1003; // 更新人

  int64 id = 1; // 主键 ID
  int64 article_id = 2; // 所属文章 ID
  string content = 3; // 附言内容
  ContentRestriction restriction = 4; // 管理限制
}

message Comment {
  reserved 8;

  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
  optional int64 created_by = 1002; // 创建人
  optional int64 updated_by = 1003; // 更新人

  int64 id = 1; // 评论 ID
  int64 article_id = 2; // 文章 ID
  string content = 3; // 评论内容
  int32 level = 5; // 评论层级
  optional int64 parent_id = 6; // 父级评论 ID
  optional int64 reply_id = 7; // 回复评论 ID
  int32 thank_count = 9; // 感谢数量
  int32 like_count = 10; // 点赞数量
  int32 reply_count = 11; // 子评论数量
  optional int64 reply_user_id = 12; // 被回复用户 ID
  ContentRestriction restriction = 13; // 管理限制
  google.protobuf.Timestamp deleted_at = 14; // 逻辑删除时间
}

message ArticleActionRecord {
  int64 article_id = 1; // 文章 ID
  ArticleAction action = 2; // 行为类型
}

message ArticleViewerActionState {
  bool liked = 1; // 是否已点赞
  bool thanked = 2; // 是否已感谢
  bool collected = 3; // 是否已收藏
  bool watched = 4; // 是否已关注
}

message Tag {
  optional google.protobuf.Timestamp created_at = 1000; // 创建时间
  optional google.protobuf.Timestamp updated_at = 1001; // 更新时间
  optional int64 created_by = 1002; // 创建人
  optional int64 updated_by = 1003; // 更新人

  int64 id = 1; // 主键
  string name = 3; // 标签名称
  optional string description = 4; // 描述
  optional int64 domain_id = 5; // 所属领域 ID
  optional TagStatus status = 6; // 标签启停状态
}

message Domain {
  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
  optional int64 created_by = 1002; // 创建人
  optional int64 updated_by = 1003; // 更新人

  int64 id = 1; // 主键
  string name = 2; // 领域名称
  optional string description = 3; // 描述
  DomainStatus status = 4; // 启停状态
  optional string url = 5; // 链接
  optional string icon = 6; // 图标
  bool is_nav = 7; // 是否导航
}
