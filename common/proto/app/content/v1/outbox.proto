syntax = "proto3";

package common.api.app.content.v1;

import "google/protobuf/duration.proto";

option go_package = "common/proto/gen/content/v1;v1";

// OutboxService 提供 content 本地 outbox 事件投递能力。
service OutboxService {
  // 投递单条 outbox 事件。
  rpc PublishOutboxEvent(PublishOutboxEvent.Req) returns (PublishOutboxEvent.Resp) {}
  // 批量投递可抢占的 outbox 事件。
  rpc PublishOutboxEvents(PublishOutboxEvents.Req) returns (PublishOutboxEvents.Resp) {}
}

// 协议消息。
message PublishOutboxEvent {
  // 请求参数。
  message Req {
    // Outbox 事件 ID。
    int64 id = 1;
    // publishing 状态超时后允许重新抢占的时间。
    google.protobuf.Duration publish_timeout = 2;
    // 最大投递重试次数。
    int32 max_retry = 3;
  }
  // 响应结果。
  message Resp {
    // 是否投递成功。
    bool published = 1;
    // 是否因不可抢占被跳过。
    bool skipped = 2;
  }
}

// 协议消息。
message PublishOutboxEvents {
  // 请求参数。
  message Req {
    // 本批次最大投递数量。
    int32 limit = 1;
    // publishing 状态超时后允许重新抢占的时间。
    google.protobuf.Duration publish_timeout = 2;
    // 最大投递重试次数。
    int32 max_retry = 3;
  }
  // 响应结果。
  message Resp {
    // 已抢占事件数量。
    int32 claimed = 1;
    // 已投递事件数量。
    int32 published = 2;
    // 投递失败事件数量。
    int32 failed = 3;
    // 跳过事件数量。
    int32 skipped = 4;
  }
}
