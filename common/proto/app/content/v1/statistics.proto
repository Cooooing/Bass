syntax = "proto3";

package common.api.app.content.v1;

import "content/enum/v1/content_action_status.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// ContentStatisticsService 提供内容领域的内部批量事实统计能力。
service ContentStatisticsService {
  // 批量统计账号的内容行为数量。
  rpc BatchCountContentUserBehaviors(BatchCountContentUserBehaviors.Req) returns (BatchCountContentUserBehaviors.Resp) {}
}

// BatchCountContentUserBehaviors 批量统计内容领域内的原始行为数量。
message BatchCountContentUserBehaviors {
  // 请求参数。
  message Req {
    // 待统计的账号 ID。
    repeated int64 user_ids = 1;
    // 统计起点，含。
    google.protobuf.Timestamp start = 2;
    // 统计终点，不含。
    google.protobuf.Timestamp end = 3;
    // 纳入统计的互动状态。
    repeated .common.api.app.content.enum.v1.ContentActionStatus action_statuses = 4;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message UserBehaviorCount {
      // 账号 ID。
      int64 user_id = 1;
      // 已发布文章数量。
      int32 article_count = 2;
      // 有效评论数量。
      int32 comment_count = 3;
      // 文章点赞数量。
      int32 article_like_count = 4;
      // 评论点赞数量。
      int32 comment_like_count = 5;
      // 文章感谢数量。
      int32 article_thank_count = 6;
      // 评论感谢数量。
      int32 comment_thank_count = 7;
      // 文章打赏数量。
      int32 article_reward_count = 8;
      // 登录浏览记录数量。
      int32 view_count = 9;
    }
    // 各账号的内容行为数量。
    repeated UserBehaviorCount rows = 1;
  }
}
