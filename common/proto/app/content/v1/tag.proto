syntax = "proto3";

package common.api.app.content.v1;

import "common/v1/common.proto";
import "content/enum/v1/tag.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/content/v1;v1";

// 标签服务。
service ContentTagService {
  // 批量创建标签。
  rpc BatchCreateTags(BatchCreateTags.Req) returns (BatchCreateTags.Resp) {}
  // 更新标签。
  rpc UpdateTag(UpdateTag.Req) returns (UpdateTag.Resp) {}
  // 绑定文章标签。
  rpc BindArticleTags(BindArticleTags.Req) returns (BindArticleTags.Resp) {}
  // 解绑文章标签。
  rpc UnbindArticleTags(UnbindArticleTags.Req) returns (UnbindArticleTags.Resp) {}
  // 查询文章标签列表。
  rpc ListArticleTags(ListArticleTags.Req) returns (ListArticleTags.Resp) {}
  // 批量查询标签映射。
  rpc MapTags(MapTags.Req) returns (MapTags.Resp) {}
  // 批量查询文章标签映射。
  rpc MapArticleTags(MapArticleTags.Req) returns (MapArticleTags.Resp) {}
  // 查询标签列表。
  rpc ListTags(ListTags.Req) returns (ListTags.Resp) {}
  // 分页查询标签。
  rpc PageTags(PageTags.Req) returns (PageTags.Resp) {}
}

// 协议消息。
message BatchCreateTags {
  // 请求参数。
  message Req {
    // 标签列表。
    repeated Tag tags = 1;
    // 操作用户 ID。
    int64 user_id = 2;

    // 协议消息。
    message Tag {
      // 领域 ID。
      optional int64 domain_id = 1;
      // 启停状态。
      optional .common.api.app.content.enum.v1.TagStatus status = 2;
      // 标签名称。
      string name = 3;
      // 描述。
      optional string description = 4;
      // 稳定编码。
      string code = 5;
      // 图标。
      optional string icon = 6;
      // 排序值，越小越靠前。
      int32 sort = 7;
    }
  }

  // 响应结果。
  message Resp {
    // 协议消息。
    message Tag {
      // 标签 ID。
      int64 id = 1;
      // 领域 ID。
      optional int64 domain_id = 2;
      // 启停状态。
      optional .common.api.app.content.enum.v1.TagStatus status = 3;
      // 标签名称。
      string name = 4;
      // 描述。
      optional string description = 5;
      // 稳定编码。
      string code = 6;
      // 图标。
      optional string icon = 7;
      // 排序值，越小越靠前。
      int32 sort = 8;
      // 文章数量。
      int32 article_count = 9;
      // 创建用户 ID。
      optional int64 created_by = 1002;
      // 更新用户 ID。
      optional int64 updated_by = 1003;
      // 创建时间。
      optional google.protobuf.Timestamp created_at = 1000;
      // 更新时间。
      optional google.protobuf.Timestamp updated_at = 1001;
    }

    // 标签列表。
    repeated Tag rows = 1;
  }
}

// 协议消息。
message UpdateTag {
  // 请求参数。
  message Req {
    // 标签 ID。
    int64 tag_id = 1;
    // 标签信息。
    Tag tag = 2;
    // 操作用户 ID。
    int64 user_id = 3;

    // 协议消息。
    message Tag {
      // 领域 ID。
      optional int64 domain_id = 1;
      // 启停状态。
      optional .common.api.app.content.enum.v1.TagStatus status = 2;
      // 标签名称。
      string name = 3;
      // 描述。
      optional string description = 4;
      // 稳定编码。
      string code = 5;
      // 图标。
      optional string icon = 6;
      // 排序值，越小越靠前。
      int32 sort = 7;
    }
  }

  // 响应结果。
  message Resp {
    // 协议消息。
    message Tag {
      // 标签 ID。
      int64 id = 1;
      // 领域 ID。
      optional int64 domain_id = 2;
      // 启停状态。
      optional .common.api.app.content.enum.v1.TagStatus status = 3;
      // 标签名称。
      string name = 4;
      // 描述。
      optional string description = 5;
      // 稳定编码。
      string code = 6;
      // 图标。
      optional string icon = 7;
      // 排序值，越小越靠前。
      int32 sort = 8;
      // 文章数量。
      int32 article_count = 9;
      // 创建用户 ID。
      optional int64 created_by = 1002;
      // 更新用户 ID。
      optional int64 updated_by = 1003;
      // 创建时间。
      optional google.protobuf.Timestamp created_at = 1000;
      // 更新时间。
      optional google.protobuf.Timestamp updated_at = 1001;
    }

    // 标签信息。
    Tag tag = 1;
  }
}

// 协议消息。
message BindArticleTags {
  // 请求参数。
  message Req {
    // 文章 ID。
    int64 article_id = 1;
    // 标签 ID 列表。
    repeated int64 tag_ids = 2;
    // 操作用户 ID。
    int64 user_id = 3;
    // 是否管理端操作。
    bool manager = 4;
  }

  // 响应结果。
  message Resp {}
}

// 协议消息。
message UnbindArticleTags {
  // 请求参数。
  message Req {
    // 文章 ID。
    int64 article_id = 1;
    // 标签 ID 列表。
    repeated int64 tag_ids = 2;
    // 操作用户 ID。
    int64 user_id = 3;
    // 是否管理端操作。
    bool manager = 4;
  }

  // 响应结果。
  message Resp {}
}

