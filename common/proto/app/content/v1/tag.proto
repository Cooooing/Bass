      // 创建用户 ID。
      optional int64 created_by = 1002;
      // 更新用户 ID。
      optional int64 updated_by = 1003;
      // 创建时间。
      optional google.protobuf.Timestamp created_at = 1000;
      // 更新时间。
      optional google.protobuf.Timestamp updated_at = 1001;
    }

    // 标签列表。
    repeated Tag rows = 1;
  }
}

// 协议消息。
message MapTags {
  // 请求参数。
  message Req {
    // 标签 ID 列表。
    repeated int64 tag_ids = 1;
    // 标签状态过滤。
    optional .common.api.app.content.enum.v1.TagStatus status = 2;
  }
  // 响应结果。
  message Resp {
    // 标签 ID 到标签的映射。
    map<int64, Tag> tags = 1;

    // 协议消息。
    message Tag {
      // 标签 ID。
      int64 id = 1;
      // 所属领域 ID。
      optional int64 domain_id = 2;
      // 标签状态。
      .common.api.app.content.enum.v1.TagStatus status = 3;
      // 标签名称。
      string name = 4;
      // 稳定编码。
      string code = 5;
      // 图标。
      optional string icon = 6;
