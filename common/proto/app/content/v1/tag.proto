  message Req {
    // 文章 ID 列表。
    repeated int64 article_ids = 1;
    // 标签状态过滤。
    optional .common.api.app.content.enum.v1.TagStatus status = 2;
  }
  // 响应结果。
  message Resp {
    // 文章 ID 到标签列表的映射。
    map<int64, Tags> article_tags = 1;

    // 协议消息。
    message Tags {
      // 标签列表。
      repeated Tag rows = 1;
    }

    // 协议消息。
    message Tag {
      // 标签 ID。
      int64 id = 1;
      // 所属领域 ID。
      optional int64 domain_id = 2;
      // 标签状态。
      .common.api.app.content.enum.v1.TagStatus status = 3;
      // 标签名称。
      string name = 4;
      // 稳定编码。
      string code = 5;
      // 图标。
      optional string icon = 6;
      // 排序值，越小越靠前。
      int32 sort = 7;
