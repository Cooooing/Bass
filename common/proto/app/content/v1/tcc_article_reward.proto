syntax = "proto3";

package common.api.app.content.v1;

option go_package = "common/proto/gen/content/v1;v1";

// TCCArticleRewardService 提供文章打赏的 TCC 分支操作。
service TCCArticleRewardService {
  // 校验并受理文章打赏
  rpc Try(TCCArticleReward.Req) returns (TCCArticleReward.Resp) {}
  // 确认文章打赏
  rpc Confirm(TCCArticleReward.Req) returns (TCCArticleReward.Resp) {}
  // 取消待确认文章打赏
  rpc Cancel(TCCArticleReward.Req) returns (TCCArticleReward.Resp) {}
}

// TCCArticleReward 表示文章打赏的 TCC 分支请求与响应。
message TCCArticleReward {
  // 请求参数。
  message Req {
    // 文章 ID
    int64 article_id = 1;
    // 打赏者账号 ID
    int64 sender_user_id = 2;
    // 收款文章作者账号 ID
    int64 receiver_user_id = 3;
    // 成交积分价格快照
    int64 points = 4;
  }
  // 响应结果。
  message Resp {}
}
