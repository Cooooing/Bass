syntax = "proto3";

package common.api.app.content.v1;

option go_package = "common/proto/gen/content/v1;v1";

// TCCCommentThankService 提供评论感谢的 TCC 分支操作。
service TCCCommentThankService {
  // 校验并受理评论感谢
  rpc Try(TCCCommentThank.Req) returns (TCCCommentThank.Resp) {}
  // 确认评论感谢
  rpc Confirm(TCCCommentThank.Req) returns (TCCCommentThank.Resp) {}
  // 取消待确认评论感谢
  rpc Cancel(TCCCommentThank.Req) returns (TCCCommentThank.Resp) {}
}

// TCCCommentThank 表示评论感谢 TCC 分支请求与响应。
message TCCCommentThank {
  // 请求参数。
  message Req {
    // 被感谢评论 ID
    int64 comment_id = 1;
    // 感谢者账号 ID
    int64 sender_user_id = 2;
    // 收款评论作者账号 ID
    int64 receiver_user_id = 3;
    // 本次转赠积分数量
    int64 points = 4;
  }
  // 响应结果。
  message Resp {}
}
