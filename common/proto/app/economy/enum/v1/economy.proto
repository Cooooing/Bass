syntax = "proto3";

package common.api.app.economy.enum.v1;

option go_package = "common/proto/gen/economy/enum/v1;enum";

// EconomyRecordDirection 表示积分流水方向
enum EconomyRecordDirection {
  // 枚举值。
  ECONOMY_RECORD_DIRECTION_UNSPECIFIED = 0;
  // 收入
  ECONOMY_RECORD_DIRECTION_INCOME = 1;
  // 支出
  ECONOMY_RECORD_DIRECTION_EXPENSE = 2;
}

// EconomyRecordType 表示积分流水类型
enum EconomyRecordType {
  // 枚举值。
  ECONOMY_RECORD_TYPE_UNSPECIFIED = 0;
  // 签到奖励
  ECONOMY_RECORD_TYPE_SIGN_IN_REWARD = 1;
  // 文章感谢奖励
  ECONOMY_RECORD_TYPE_ARTICLE_THANK_REWARD = 2;
  // 评论感谢奖励
  ECONOMY_RECORD_TYPE_COMMENT_THANK_REWARD = 3;
  // 文章打赏支出
  ECONOMY_RECORD_TYPE_ARTICLE_REWARD_OUT = 4;
  // 文章打赏收入
  ECONOMY_RECORD_TYPE_ARTICLE_REWARD_IN = 5;
  // 后台增加
  ECONOMY_RECORD_TYPE_ADMIN_ADD = 6;
  // 后台扣减
  ECONOMY_RECORD_TYPE_ADMIN_DEDUCT = 7;
  // 设置全局聊天室话题支出
  ECONOMY_RECORD_TYPE_GLOBAL_CHAT_TOPIC_EXPENSE = 8;
  // 发送全局聊天室弹幕支出
  ECONOMY_RECORD_TYPE_GLOBAL_CHAT_BARRAGE_EXPENSE = 9;
  // 文章感谢支出
  ECONOMY_RECORD_TYPE_ARTICLE_THANK_EXPENSE = 10;
  // 评论感谢支出
  ECONOMY_RECORD_TYPE_COMMENT_THANK_EXPENSE = 11;
  // 启用文章打赏区支出
  ECONOMY_RECORD_TYPE_ARTICLE_REWARD_SETUP_EXPENSE = 12;
  // 连续签到奖励
  ECONOMY_RECORD_TYPE_CHECKIN_STREAK_REWARD = 13;
  // 活跃度奖励
  ECONOMY_RECORD_TYPE_LIVENESS_REWARD = 14;
  // 用户转账支出
  ECONOMY_RECORD_TYPE_ACCOUNT_TRANSFER_OUT = 15;
  // 用户转账收入
  ECONOMY_RECORD_TYPE_ACCOUNT_TRANSFER_IN = 16;
}
