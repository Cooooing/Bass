syntax = "proto3";

package common.api.app.economy.v1;

import "common/enums/v1/language.proto";
import "common/v1/common.proto";
import "economy/enum/v1/economy.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/economy/v1;v1";

// EconomyService 提供积分账户与流水能力
service EconomyService {
  // 查询积分账户
  rpc GetEconomyAccount(GetEconomyAccount.Req) returns (GetEconomyAccount.Resp) {}
  // 批量查询积分账户
  rpc MapEconomyAccounts(MapEconomyAccounts.Req) returns (MapEconomyAccounts.Resp) {}
  // 增加积分
  rpc AddEconomyPoints(AddEconomyPoints.Req) returns (AddEconomyPoints.Resp) {}
  // 扣减积分
  rpc DeductEconomyPoints(DeductEconomyPoints.Req) returns (DeductEconomyPoints.Resp) {}
  // 转移积分
  rpc TransferEconomyPoints(TransferEconomyPoints.Req) returns (TransferEconomyPoints.Resp) {}
  // 查询积分流水
  rpc ListEconomyRecords(ListEconomyRecords.Req) returns (ListEconomyRecords.Resp) {}
}

// EconomyAccount 表示用户积分账户
message EconomyAccount {
  // 账户 ID
  int64 id = 1;
  // 用户 ID
  int64 user_id = 2;
  // 当前积分
  int64 balance = 3;
  // 冻结积分
  int64 frozen_balance = 4;
  // 累计获得
  int64 total_income = 5;
  // 累计消耗
  int64 total_expense = 6;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// EconomyRecord 表示积分流水
message EconomyRecord {
  // 流水 ID
  int64 id = 1;
  // 交易号
  string transaction_no = 2;
  // 用户 ID
  int64 user_id = 3;
  // 流水类型
  .common.api.app.economy.enum.v1.EconomyRecordType record_type = 4;
  // 流水方向
  .common.api.app.economy.enum.v1.EconomyRecordDirection direction = 5;
  // 积分数量
  int64 amount = 6;
  // 变动前积分
  int64 balance_before = 7;
  // 变动后积分
  int64 balance_after = 8;
  // 备注
  optional string remark = 9;
  // 按查询语言生成的流水类型文案
  string type_label = 10;
  // 账户范围内的幂等键
  optional string idempotency_key = 11;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
}

// 协议消息。
message GetEconomyAccount {
  // 请求参数。
  message Req {
    // 用户 ID
    int64 user_id = 1;
  }
  // 响应结果。
  message Resp {
    // 积分账户
    EconomyAccount account = 1;
  }
}

// 协议消息。
message MapEconomyAccounts {
  // 请求参数。
  message Req {
    // 用户 ID 列表
    repeated int64 user_ids = 1;
  }
  // 响应结果。
  message Resp {
    // 积分账户映射
    map<int64, EconomyAccount> accounts = 1;
  }
}

// 协议消息。
message AddEconomyPoints {
  // 请求参数。
  message Req {
    // 用户 ID
    int64 user_id = 1;
    // 积分数量
    int64 amount = 2;
    // 流水类型
    .common.api.app.economy.enum.v1.EconomyRecordType record_type = 3;
    // 备注
    optional string remark = 4;
    // 账户范围内的幂等键
    optional string idempotency_key = 5;
  }
  // 响应结果。
  message Resp {
    // 最新账户
    EconomyAccount account = 1;
    // 积分流水
    EconomyRecord record = 2;
  }
}

// 协议消息。
message DeductEconomyPoints {
  // 请求参数。
  message Req {
    // 用户 ID
    int64 user_id = 1;
    // 积分数量
    int64 amount = 2;
    // 流水类型
    .common.api.app.economy.enum.v1.EconomyRecordType record_type = 3;
    // 备注
    optional string remark = 4;
    // 账户范围内的幂等键
    optional string idempotency_key = 5;
  }
  // 响应结果。
  message Resp {
    // 最新账户
    EconomyAccount account = 1;
    // 积分流水
    EconomyRecord record = 2;
  }
}

// 协议消息。
message TransferEconomyPoints {
  // 请求参数。
  message Req {
    // 转出用户 ID
    int64 from_user_id = 1;
    // 接收用户 ID
    int64 to_user_id = 2;
    // 积分数量
    int64 amount = 3;
    // 转出流水类型
    .common.api.app.economy.enum.v1.EconomyRecordType out_record_type = 4;
    // 转入流水类型
    .common.api.app.economy.enum.v1.EconomyRecordType in_record_type = 5;
    // 备注
    optional string remark = 6;
    // 转出与转入账户的幂等键
    optional string idempotency_key = 7;
  }
  // 响应结果。
  message Resp {
    // 转出账户
    EconomyAccount from_account = 1;
    // 接收账户
    EconomyAccount to_account = 2;
    // 转出流水
    EconomyRecord out_record = 3;
    // 转入流水
    EconomyRecord in_record = 4;
  }
}

// 协议消息。
message ListEconomyRecords {
  // 请求参数。
  message Req {
    // 用户 ID
    int64 user_id = 1;
    // 分页参数
    .common.api.app.common.v1.PageReq page = 2;
    // 流水方向
    optional .common.api.app.economy.enum.v1.EconomyRecordDirection direction = 3;
    // 流水类型
    optional .common.api.app.economy.enum.v1.EconomyRecordType record_type = 4;
    // 流水类型文案的展示语言
    .common.api.app.common.enums.v1.Language language = 5;
  }
  // 响应结果。
  message Resp {
    // 流水列表
    repeated EconomyRecord rows = 1;
    // 分页信息
    .common.api.app.common.v1.PageResp page = 2;
  }
}
