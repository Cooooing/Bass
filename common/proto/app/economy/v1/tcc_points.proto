syntax = "proto3";

package common.api.app.economy.v1;

import "economy/enum/v1/economy.proto";
import "economy/v1/economy.proto";

option go_package = "common/proto/gen/economy/v1;v1";

// TCCPointsService 提供积分变动的 TCC 分支操作。
service TCCPointsService {
  // 预留积分变动所需资源
  rpc Try(TCCPoints.Req) returns (TCCPoints.Resp) {}
  // 确认积分变动
  rpc Confirm(TCCPoints.Req) returns (TCCPoints.Resp) {}
  // 取消积分变动并释放资源
  rpc Cancel(TCCPoints.Req) returns (TCCPoints.Resp) {}
}

// TCCPoints 表示积分变动的 TCC 分支请求与响应。
message TCCPoints {
  // 请求参数。
  message Req {
    // 用户 ID
    int64 user_id = 1;
    // 积分数量
    int64 amount = 2;
    // 积分流水类型
    .common.api.app.economy.enum.v1.EconomyRecordType record_type = 3;
    // 流水备注
    optional string remark = 4;
    // 账户范围内的幂等键
    optional string idempotency_key = 5;
  }

  // 响应结果。
  message Resp {
    // 当前积分账户
    EconomyAccount account = 1;
    // 确认阶段产生的积分流水
    EconomyRecord record = 2;
  }
}
