syntax = "proto3";

package common.api.app.game_idle.v1;

option go_package = "common/proto/gen/game_idle/v1;v1";

// 服务定义。
service ActionService {
  // 服务方法。
  rpc ListActions(ListActions.Req) returns (ListActions.Resp) {}
  // 服务方法。
  rpc GetActionDetail(GetActionDetail.Req) returns (GetActionDetail.Resp) {}
  // 服务方法。
  rpc RefreshActions(RefreshActions.Req) returns (RefreshActions.Resp) {}
}

// 协议消息。
message ListActions {
  // 请求参数。
  message Req {}

  // 响应结果。
  message Resp {
    // 行动列表
    repeated Action rows = 1;
  }
}

// 协议消息。
message GetActionDetail {
  // 请求参数。
  message Req {
    // 行动编码
    string action_id = 1;
  }

  // 响应结果。
  message Resp {
    // 行动详情
    ActionDetail row = 1;
  }
}

// 协议消息。
message RefreshActions {
  // 请求参数。
  message Req {}

  // 响应结果。
  message Resp {}
}

// 协议消息。
message Action {
  // 行动编码
  string action_id = 1;
  // 行动名称
  string name = 2;
  // 行动描述
  string description = 3;
  // 展示区域编码
  string region_id = 4;
  // 行动类型
  string action_kind = 5;
  // 对应能力编码
  string ability_id = 6;
  // 要求能力等级
  int32 required_ability_level = 7;
  // 基础耗时秒数
  int64 duration_seconds = 8;
  // 完成经验
  int64 exp_reward = 9;
  // 是否启用
  bool enabled = 10;
  // 排序值
  int32 sort = 11;
}

// 协议消息。
message ActionDetail {
  // 行动基础信息
  Action action = 1;
  // 行动绑定配方
  repeated ActionRecipeDetail recipes = 2;
}

// 协议消息。
message ActionRecipeDetail {
  // 配方编码
  string recipe_id = 1;
  // 配方名称
  string name = 2;
  // 配方描述
  string description = 3;
  // 配方类型
  string recipe_type = 4;
  // 产出生成次数
  int32 generation_times = 5;
  // 消耗物品
  repeated RecipeInputDetail inputs = 6;
  // 产出物品
  repeated RecipeOutputDetail outputs = 7;
}

// 协议消息。
message RecipeInputDetail {
  // 物品编码
  string item_id = 1;
  // 物品名称
  string item_name = 2;
  // 物品类型
  string item_type = 3;
  // 消耗数量
  int64 quantity = 4;
}

// 协议消息。
message RecipeOutputDetail {
  // 物品编码
  string item_id = 1;
  // 物品名称
  string item_name = 2;
  // 物品类型
  string item_type = 3;
  // 最小数量
  int64 min_quantity = 4;
  // 最大数量
  int64 max_quantity = 5;
  // 权重
  int32 weight = 6;
  // 单次命中概率
  double probability = 7;
}
