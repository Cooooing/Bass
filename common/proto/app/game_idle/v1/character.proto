syntax = "proto3";

package common.api.app.game_idle.v1;

import "game_idle/v1/enum/character.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_idle/v1;v1";

service CharacterService {
  rpc Create(CreateCharacter.Request) returns (CreateCharacter.Resp) {}
  rpc Get(GetCharacter.Request) returns (GetCharacter.Resp) {}
  rpc Online(OnlineCharacter.Request) returns (OnlineCharacter.Resp) {}
  rpc Offline(OfflineCharacter.Request) returns (OfflineCharacter.Resp) {}
  rpc Ping(PingCharacter.Request) returns (PingCharacter.Resp) {}
}

message CreateCharacter {
  message Request {
    int64 user_id = 1; // 用户 ID
    string name = 2; // 角色名称
  }

  message Resp {
    Character row = 1; // 角色
  }
}

message GetCharacter {
  message Request {
    int64 user_id = 1; // 用户 ID
    int64 character_id = 2; // 角色 ID
  }

  message Resp {
    repeated Character rows = 1; // 角色列表
  }
}

message OnlineCharacter {
  message Request {
    int64 user_id = 1; // 用户 ID
    int64 character_id = 2; // 角色 ID
  }

  message Resp {
    string session_id = 1; // 角色在线会话 ID
    int64 expires_in_seconds = 2; // 剩余有效秒数
  }
}

message OfflineCharacter {
  message Request {
    int64 character_id = 1; // 角色 ID
    string session_id = 2; // 角色在线会话 ID
    bool timeout = 3; // 是否心跳超时下线
  }

  message Resp {}
}

message PingCharacter {
  message Request {
    int64 character_id = 1; // 角色 ID
    string session_id = 2; // 角色在线会话 ID
  }

  message Resp {
    int64 expires_in_seconds = 1; // 剩余有效秒数
  }
}

message Character {
  int64 id = 1; // 角色 ID
  int64 user_id = 2; // 用户 ID
  string name = 3; // 角色名称
  common.api.app.game_idle.v1.enum.CharacterStatus status = 4; // 角色状态
  int32 slot = 5; // 角色槽位
  int32 action_queue_capacity = 6; // 行动队列容量上限
  int64 max_offline_seconds = 7; // 最大离线收益结算秒数
  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
}
