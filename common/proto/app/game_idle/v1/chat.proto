syntax = "proto3";

package common.api.app.game_idle.v1;

import "game_idle/v1/enum/chat.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_idle/v1;v1";

service GameIdleChatService {
  rpc SendWorldMessage(SendGameIdleWorldMessage.Request) returns (SendGameIdleWorldMessage.Resp) {}
  rpc ListWorldMessages(ListGameIdleWorldMessages.Request) returns (ListGameIdleWorldMessages.Resp) {}
}

message SendGameIdleWorldMessage {
  message Request {
    int64 character_id = 1; // 发送角色 ID
    string content = 2; // 消息内容
  }

  message Resp {
    ChatMessage row = 1; // 消息
  }
}

message ListGameIdleWorldMessages {
  message Request {
    int64 before_id = 1; // 查询该 ID 之前的消息，为 0 时从最新开始
    int32 size = 2; // 查询数量
  }

  message Resp {
    repeated ChatMessage rows = 1; // 消息列表
  }
}

message ChatMessage {
  int64 id = 1; // 自增 ID
  common.api.app.game_idle.v1.enum.GameIdleChatChannelType channel_type = 2; // 频道类型
  string channel_id = 3; // 频道标识
  int64 sender_character_id = 4; // 发送角色 ID
  int64 receiver_character_id = 5; // 接收角色 ID，非私聊为 0
  string content = 6; // 消息内容
  common.api.app.game_idle.v1.enum.GameIdleChatMessageStatus status = 7; // 消息状态
  google.protobuf.Timestamp created_at = 1000; // 创建时间
}
