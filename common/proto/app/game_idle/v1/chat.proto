syntax = "proto3";

package common.api.app.game_idle.v1;

import "game_idle/enum/v1/chat.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_idle/v1;v1";

// 服务定义。
service ChatService {
  // 服务方法。
  rpc SendChatMessage(SendChatMessage.Req) returns (SendChatMessage.Resp) {}
  // 服务方法。
  rpc ListChatMessages(ListChatMessages.Req) returns (ListChatMessages.Resp) {}
}

// 协议消息。
message SendChatMessage {
  // 请求参数。
  message Req {
    // 发送角色 ID
    int64 character_id = 1;
    // 频道类型
    common.api.app.game_idle.enum.v1.ChatChannelType channel_type = 2;
    // 频道标识
    string channel_id = 3;
    // 接收角色 ID，非私聊为 0
    int64 receiver_character_id = 4;
    // 消息内容
    string content = 5;
  }

  // 响应结果。
  message Resp {
    // 消息
    ChatMessage row = 1;
  }
}

// 协议消息。
message ListChatMessages {
  // 请求参数。
  message Req {
    // 频道类型
    common.api.app.game_idle.enum.v1.ChatChannelType channel_type = 1;
    // 频道标识
    string channel_id = 2;
    // 查询该 ID 之前的消息，为 0 时从最新开始
    int64 before_id = 3;
    // 查询数量
    int32 size = 4;
  }

  // 响应结果。
  message Resp {
    // 消息列表
    repeated ChatMessage rows = 1;
  }
}

// 协议消息。
message ChatMessage {
  // 自增 ID
  int64 id = 1;
  // 频道类型
  common.api.app.game_idle.enum.v1.ChatChannelType channel_type = 2;
  // 频道标识
  string channel_id = 3;
  // 发送角色 ID
  int64 sender_character_id = 4;
  // 接收角色 ID，非私聊为 0
  int64 receiver_character_id = 5;
  // 消息内容
  string content = 6;
  // 消息状态
  common.api.app.game_idle.enum.v1.ChatMessageStatus status = 7;
  // 发送角色名称
  string sender_name = 8;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
}
