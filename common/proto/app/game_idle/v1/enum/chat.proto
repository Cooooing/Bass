syntax = "proto3";

package common.api.app.game_idle.v1.enum;

option go_package = "common/proto/gen/game_idle/v1/enum;enum";

// ChatChannelType 表示挂机游戏聊天频道类型。
enum ChatChannelType {
  CHAT_CHANNEL_TYPE_UNSPECIFIED = 0; // 未指定
  CHAT_CHANNEL_TYPE_WORLD = 1; // 世界频道
}

// ChatMessageStatus 表示挂机游戏聊天消息状态。
enum ChatMessageStatus {
  CHAT_MESSAGE_STATUS_UNSPECIFIED = 0; // 未指定
  CHAT_MESSAGE_STATUS_NORMAL = 1; // 正常
  CHAT_MESSAGE_STATUS_DELETED = 2; // 已删除
}
