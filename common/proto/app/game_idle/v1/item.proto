syntax = "proto3";

package common.api.app.game_idle.v1;

option go_package = "common/proto/gen/game_idle/v1;v1";

// 服务定义。
service ItemService {
  // 服务方法。
  rpc ListItems(ListItems.Req) returns (ListItems.Resp) {}
  // 服务方法。
  rpc RefreshItems(RefreshItems.Req) returns (RefreshItems.Resp) {}
}

// 协议消息。
message ListItems {
  // 请求参数。
  message Req {}

  // 响应结果。
  message Resp {
    // 物品列表
    repeated Item rows = 1;
  }
}

// 协议消息。
message RefreshItems {
  // 请求参数。
  message Req {}

  // 响应结果。
  message Resp {}
}

// 协议消息。
message Item {
  // 物品编码
  string item_id = 1;
  // 物品名称
  string name = 2;
  // 物品类型
  string item_type = 3;
  // 物品描述
  string description = 4;
  // 是否启用
  bool enabled = 5;
  // 排序值
  int32 sort = 6;
}
