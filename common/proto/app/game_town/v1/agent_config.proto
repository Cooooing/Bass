syntax = "proto3";

package common.api.app.game_town.v1;

import "common/common.proto";
import "game_town/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownAgentConfigService {
  rpc Create(CreateGameTownAgentConfig.Request) returns (CreateGameTownAgentConfig.Resp) {}
  rpc Get(GetGameTownAgentConfig.Request) returns (GetGameTownAgentConfig.Resp) {}
  rpc List(ListGameTownAgentConfigs.Request) returns (ListGameTownAgentConfigs.Resp) {}
}

message CreateGameTownAgentConfig {
  message Request {
    string name = 1; // 配置名称
    GameTownAgentProvider provider = 2; // 模型协议
    string base_url = 3; // 接口地址
    string model = 4; // 模型名称
    string secret_env = 5; // 密钥环境变量名
    int32 timeout_seconds = 6; // 单次调用超时秒数
  }

  message Resp {
    message Row {
      int64 id = 1; // 配置 ID
      string name = 2; // 配置名称
      GameTownAgentProvider provider = 3; // 模型协议
      string base_url = 4; // 接口地址
      string model = 5; // 模型名称
      string secret_env = 6; // 密钥环境变量名
      int32 timeout_seconds = 7; // 单次调用超时秒数
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    Row row = 1; // Agent 配置
  }
}

message GetGameTownAgentConfig {
  message Request {
    int64 id = 1; // 配置 ID
  }

  message Resp {
    message Row {
      int64 id = 1; // 配置 ID
      string name = 2; // 配置名称
      GameTownAgentProvider provider = 3; // 模型协议
      string base_url = 4; // 接口地址
      string model = 5; // 模型名称
      string secret_env = 6; // 密钥环境变量名
      int32 timeout_seconds = 7; // 单次调用超时秒数
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    Row row = 1; // Agent 配置
  }
}

message ListGameTownAgentConfigs {
  message Request {
    .common.api.app.common.PageReq page = 1; // 分页参数
  }

  message Resp {
    message Row {
      int64 id = 1; // 配置 ID
      string name = 2; // 配置名称
      GameTownAgentProvider provider = 3; // 模型协议
      string base_url = 4; // 接口地址
      string model = 5; // 模型名称
      string secret_env = 6; // 密钥环境变量名
      int32 timeout_seconds = 7; // 单次调用超时秒数
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    .common.api.app.common.PageResp page = 1; // 分页结果
    repeated Row rows = 2; // 配置列表
  }
}
