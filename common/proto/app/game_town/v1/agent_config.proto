syntax = "proto3";

package common.api.app.game_town.v1;

import "game_town/v1/enum.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownAgentConfigService {
  rpc Create(CreateGameTownAgentConfig.Request) returns (CreateGameTownAgentConfig.Response) {} // 创建 Agent 配置。
  rpc Get(GetGameTownAgentConfig.Request) returns (GetGameTownAgentConfig.Response) {} // 获取 Agent 配置。
  rpc List(ListGameTownAgentConfigs.Request) returns (ListGameTownAgentConfigs.Response) {} // 查询玩家 Agent 配置。
}

message CreateGameTownAgentConfig {
  message Request {
    int64 player_id = 1; // 玩家 ID
    string name = 2; // 配置名称
    string provider = 3; // 供应商
    string model = 4; // 模型名称
    string base_url = 5; // 接口地址
    string api_key = 6; // 接口密钥
    int32 timeout_seconds = 7; // 超时秒数
    bool is_default = 8; // 是否默认配置
  }
  message Response {

    message GameTownAgentConfig {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // 配置 ID
      int64 player_id = 2; // 玩家 ID
      string name = 3; // 配置名称
      string provider = 4; // 供应商
      string model = 5; // 模型名称
      string base_url = 6; // 接口地址
      bool has_api_key = 7; // 是否已配置密钥
      int32 timeout_seconds = 8; // 超时秒数
      bool is_default = 9; // 是否默认配置
      GameTownAgentConfigStatus status = 10; // 配置状态
    }
    GameTownAgentConfig row = 1; // Agent 配置
  }
}

message GetGameTownAgentConfig {
  message Request {
    int64 id = 1; // 配置 ID
    int64 player_id = 2; // 玩家 ID
  }
  message Response {

    message GameTownAgentConfig {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // 配置 ID
      int64 player_id = 2; // 玩家 ID
      string name = 3; // 配置名称
      string provider = 4; // 供应商
      string model = 5; // 模型名称
      string base_url = 6; // 接口地址
      bool has_api_key = 7; // 是否已配置密钥
      int32 timeout_seconds = 8; // 超时秒数
      bool is_default = 9; // 是否默认配置
      GameTownAgentConfigStatus status = 10; // 配置状态
    }
    GameTownAgentConfig row = 1; // Agent 配置
  }
}

message ListGameTownAgentConfigs {
  message Request {
    int64 player_id = 1; // 玩家 ID
    optional GameTownAgentConfigStatus status = 2; // 配置状态
  }
  message Response {

    message GameTownAgentConfig {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // 配置 ID
      int64 player_id = 2; // 玩家 ID
      string name = 3; // 配置名称
      string provider = 4; // 供应商
      string model = 5; // 模型名称
      string base_url = 6; // 接口地址
      bool has_api_key = 7; // 是否已配置密钥
      int32 timeout_seconds = 8; // 超时秒数
      bool is_default = 9; // 是否默认配置
      GameTownAgentConfigStatus status = 10; // 配置状态
    }
    repeated GameTownAgentConfig rows = 1; // Agent 配置列表
  }
}
