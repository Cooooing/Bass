syntax = "proto3";

package common.api.app.game_town.v1;

import "common/common.proto";
import "game_town/v1/enum.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownCommandService {
  rpc Execute(ExecuteGameTownCommand.Request) returns (ExecuteGameTownCommand.Response) {} // 执行文字命令。
  rpc Page(PageGameTownCommands.Request) returns (PageGameTownCommands.Response) {} // 分页查询命令。
  rpc Replay(ReplayGameTownCommands.Request) returns (ReplayGameTownCommands.Response) {} // 回放命令。
}

message ExecuteGameTownCommand {
  message Request {
    int64 session_id = 1; // 会话 ID
    int64 player_id = 2; // 玩家 ID
    string raw_text = 3; // 原始命令
  }
  message Response {

    message GameTownNpc {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // NPC ID
      int64 world_id = 2; // 世界 ID
      string code = 3; // NPC 编码
      string name = 4; // NPC 名称
      string role = 5; // 角色职责
      string personality = 6; // 性格
      string goal = 7; // 目标
      string background = 8; // 背景
      int64 current_location_id = 9; // 当前地点 ID
      GameTownNpcState state = 10; // NPC 状态
      string system_prompt = 11; // 系统提示词
      google.protobuf.Struct generated_profile = 12; // 生成画像
      bool enabled = 13; // 是否启用
    }

    message GameTownLocation {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // 地点 ID
      int64 world_id = 2; // 世界 ID
      string code = 3; // 地点编码
      string name = 4; // 地点名称
      string description = 5; // 地点描述
      google.protobuf.Struct tags = 6; // 标签
      int32 sort = 7; // 排序
      bool enabled = 8; // 是否启用
    }

    message GameTownEvent {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      int64 id = 1; // 事件 ID
      int64 world_id = 2; // 世界 ID
      GameTownEventType type = 3; // 事件类型
      optional int64 actor_player_id = 4; // 玩家 ID
      optional int64 target_npc_id = 5; // 目标 NPC ID
      optional int64 location_id = 6; // 地点 ID
      optional int64 command_id = 7; // 命令 ID
      string summary = 8; // 事件摘要
      string content = 9; // 事件内容
      google.protobuf.Struct effects = 10; // 影响
      google.protobuf.Struct metadata = 11; // 元数据
      google.protobuf.Timestamp occurred_at = 12; // 发生时间
    }

    message GameTownWorld {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // 世界 ID
      string code = 2; // 世界短码
      string name = 3; // 世界名称
      string description = 4; // 创建描述
      GameTownWorldScale scale = 5; // 世界规模
      GameTownWorldStatus status = 6; // 世界状态
      int64 creator_player_id = 7; // 创建玩家 ID
      optional int64 default_location_id = 8; // 默认地点 ID
      int64 seed = 9; // 生成种子
      google.protobuf.Struct generation_params = 10; // 生成参数
      string generation_summary = 11; // 生成摘要
      optional int64 agent_config_id = 12; // Agent 配置 ID
    }

    message GameTownCommand {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      optional google.protobuf.Timestamp handled_at = 1001; // 处理时间
      int64 id = 1; // 命令 ID
      optional int64 world_id = 2; // 世界 ID
      int64 session_id = 3; // 会话 ID
      optional int64 player_id = 4; // 玩家 ID
      string raw_text = 5; // 原始命令
      GameTownCommandType type = 6; // 命令类型
      google.protobuf.Struct parsed_payload = 7; // 解析结果
      GameTownCommandStatus status = 8; // 命令状态
      optional int32 error_code = 9; // 错误码
      string result_summary = 10; // 执行摘要
    }

    message GameTownWorldStateSnapshot {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      int64 id = 1; // 快照 ID
      int64 world_id = 2; // 世界 ID
      int64 tick_count = 3; // 演化次数
      string current_arc = 4; // 当前阶段
      google.protobuf.Struct metrics = 5; // 当前指标值
      string summary = 6; // 状态摘要
      optional int64 reason_event_id = 7; // 原因事件 ID
    }
    GameTownCommand command = 1; // 命令
    repeated string feedback_lines = 2; // 文字反馈
    GameTownWorld current_world = 3; // 当前世界
    GameTownLocation current_location = 4; // 当前地点
    repeated GameTownNpc visible_npcs = 5; // 可见 NPC
    GameTownWorldStateSnapshot world_state = 6; // 世界状态
    repeated GameTownEvent events = 7; // 相关事件
  }
}

message PageGameTownCommands {
  message Request {
    .common.api.app.common.PageRequest page = 1; // 分页参数
    optional int64 world_id = 2; // 世界 ID
    optional int64 session_id = 3; // 会话 ID
    optional int64 player_id = 4; // 玩家 ID
  }
  message Response {

    message GameTownCommand {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      optional google.protobuf.Timestamp handled_at = 1001; // 处理时间
      int64 id = 1; // 命令 ID
      optional int64 world_id = 2; // 世界 ID
      int64 session_id = 3; // 会话 ID
      optional int64 player_id = 4; // 玩家 ID
      string raw_text = 5; // 原始命令
      GameTownCommandType type = 6; // 命令类型
      google.protobuf.Struct parsed_payload = 7; // 解析结果
      GameTownCommandStatus status = 8; // 命令状态
      optional int32 error_code = 9; // 错误码
      string result_summary = 10; // 执行摘要
    }
    .common.api.app.common.PageResponse page = 1; // 分页结果
    repeated GameTownCommand rows = 2; // 命令列表
  }
}

message ReplayGameTownCommands {
  message Request {
    int64 session_id = 1; // 会话 ID
    int64 player_id = 2; // 玩家 ID
  }
  message Response {

    message GameTownCommand {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      optional google.protobuf.Timestamp handled_at = 1001; // 处理时间
      int64 id = 1; // 命令 ID
      optional int64 world_id = 2; // 世界 ID
      int64 session_id = 3; // 会话 ID
      optional int64 player_id = 4; // 玩家 ID
      string raw_text = 5; // 原始命令
      GameTownCommandType type = 6; // 命令类型
      google.protobuf.Struct parsed_payload = 7; // 解析结果
      GameTownCommandStatus status = 8; // 命令状态
      optional int32 error_code = 9; // 错误码
      string result_summary = 10; // 执行摘要
    }

    message GameTownEvent {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      int64 id = 1; // 事件 ID
      int64 world_id = 2; // 世界 ID
      GameTownEventType type = 3; // 事件类型
      optional int64 actor_player_id = 4; // 玩家 ID
      optional int64 target_npc_id = 5; // 目标 NPC ID
      optional int64 location_id = 6; // 地点 ID
      optional int64 command_id = 7; // 命令 ID
      string summary = 8; // 事件摘要
      string content = 9; // 事件内容
      google.protobuf.Struct effects = 10; // 影响
      google.protobuf.Struct metadata = 11; // 元数据
      google.protobuf.Timestamp occurred_at = 12; // 发生时间
    }
    repeated GameTownCommand commands = 1; // 命令列表
    repeated GameTownEvent events = 2; // 事件列表
  }
}
