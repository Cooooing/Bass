  GAME_TOWN_COMMAND_TYPE_AGENT_CONFIG_LIST = 16; // 查询 Agent 配置
}

enum GameTownCommandStatus {
  GAME_TOWN_COMMAND_STATUS_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_COMMAND_STATUS_RECEIVED = 1; // 已接收
