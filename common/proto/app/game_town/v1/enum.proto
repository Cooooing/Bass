syntax = "proto3";

package common.api.app.game_town.v1;

option go_package = "common/proto/gen/game_town/v1;v1";

enum GameTownWorldScale {
  GAME_TOWN_WORLD_SCALE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_WORLD_SCALE_SMALL = 1; // 小型世界
  GAME_TOWN_WORLD_SCALE_MEDIUM = 2; // 中型世界
  GAME_TOWN_WORLD_SCALE_LARGE = 3; // 大型世界
}

enum GameTownWorldStatus {
  GAME_TOWN_WORLD_STATUS_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_WORLD_STATUS_GENERATING = 1; // 生成中
  GAME_TOWN_WORLD_STATUS_ACTIVE = 2; // 可进入
  GAME_TOWN_WORLD_STATUS_FAILED = 3; // 生成失败
  GAME_TOWN_WORLD_STATUS_ARCHIVED = 4; // 已归档
}

enum GameTownPlayerStatus {
  GAME_TOWN_PLAYER_STATUS_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_PLAYER_STATUS_ACTIVE = 1; // 正常
  GAME_TOWN_PLAYER_STATUS_DISABLED = 2; // 已禁用
}

enum GameTownWorldMemberRole {
  GAME_TOWN_WORLD_MEMBER_ROLE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_WORLD_MEMBER_ROLE_OWNER = 1; // 创建者
  GAME_TOWN_WORLD_MEMBER_ROLE_MEMBER = 2; // 成员
}

enum GameTownNpcState {
  GAME_TOWN_NPC_STATE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_NPC_STATE_IDLE = 1; // 空闲
