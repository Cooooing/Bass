  GAME_TOWN_NPC_STATE_THINKING = 3; // 思考中
  GAME_TOWN_NPC_STATE_BUSY = 4; // 忙碌
}

enum GameTownMemoryType {
  GAME_TOWN_MEMORY_TYPE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_MEMORY_TYPE_SHORT_TERM = 1; // 短期记忆
  GAME_TOWN_MEMORY_TYPE_LONG_TERM = 2; // 长期记忆
}

enum GameTownEventType {
  GAME_TOWN_EVENT_TYPE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_EVENT_TYPE_WORLD_CREATED = 1; // 世界已创建
