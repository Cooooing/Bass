  GAME_TOWN_COMMAND_TYPE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_COMMAND_TYPE_HELP = 1; // 帮助
  GAME_TOWN_COMMAND_TYPE_REGISTER = 2; // 注册玩家
  GAME_TOWN_COMMAND_TYPE_WORLD_CREATE = 3; // 创建世界
  GAME_TOWN_COMMAND_TYPE_WORLD_JOIN = 4; // 加入世界
  GAME_TOWN_COMMAND_TYPE_WORLD_LIST = 5; // 查询世界
  GAME_TOWN_COMMAND_TYPE_LOOK = 6; // 查看当前位置
  GAME_TOWN_COMMAND_TYPE_MOVE = 7; // 移动
  GAME_TOWN_COMMAND_TYPE_TALK = 8; // 对话
  GAME_TOWN_COMMAND_TYPE_DO = 9; // 行动
  GAME_TOWN_COMMAND_TYPE_STATUS = 10; // 查看状态
  GAME_TOWN_COMMAND_TYPE_EVENTS = 11; // 查询事件
  GAME_TOWN_COMMAND_TYPE_NPCS = 12; // 查询 NPC
  GAME_TOWN_COMMAND_TYPE_MEMORY = 13; // 查询记忆
