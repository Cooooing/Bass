}

enum GameTownAgentRunStatus {
  GAME_TOWN_AGENT_RUN_STATUS_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_AGENT_RUN_STATUS_SUCCEEDED = 1; // 执行成功
  GAME_TOWN_AGENT_RUN_STATUS_FAILED = 2; // 执行失败
}
