syntax = "proto3";

package common.api.app.game_town.v1;

option go_package = "common/proto/gen/game_town/v1/enum;enum";

enum GameTownAgentJobType {
  reserved 7 to 10;

  GAME_TOWN_AGENT_JOB_TYPE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_AGENT_JOB_TYPE_WORLD_GENERATE = 1; // 生成世界
  GAME_TOWN_AGENT_JOB_TYPE_NPC_TALK = 2; // NPC 对话
  GAME_TOWN_AGENT_JOB_TYPE_PLAYER_ACT = 3; // 玩家行动，兼容旧任务
  GAME_TOWN_AGENT_JOB_TYPE_WORLD_TICK = 4; // 世界演进
  GAME_TOWN_AGENT_JOB_TYPE_PLAYER_ACTION_INTERPRET = 5; // 解释自由行动
  GAME_TOWN_AGENT_JOB_TYPE_NPC_PLAN = 6; // NPC 日常计划
  GAME_TOWN_AGENT_JOB_TYPE_MEMORY_EMBED = 11; // 记忆向量化
  GAME_TOWN_AGENT_JOB_TYPE_PLAYER_CHARACTER_GENERATE = 12; // 生成玩家世界角色
}

enum GameTownAgentJobPriority {
  GAME_TOWN_AGENT_JOB_PRIORITY_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_AGENT_JOB_PRIORITY_LOW = 1; // 低优先级
  GAME_TOWN_AGENT_JOB_PRIORITY_HIGH = 2; // 高优先级
}

enum GameTownAgentJobStatus {
  GAME_TOWN_AGENT_JOB_STATUS_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_AGENT_JOB_STATUS_QUEUED = 1; // 排队中
  GAME_TOWN_AGENT_JOB_STATUS_RUNNING = 2; // 执行中
  GAME_TOWN_AGENT_JOB_STATUS_SUCCEEDED = 3; // 成功
  GAME_TOWN_AGENT_JOB_STATUS_FAILED = 4; // 失败
}
