syntax = "proto3";

package common.api.app.game_town.v1;

option go_package = "common/proto/gen/game_town/v1/enum;enum";

enum GameTownEventType {
  GAME_TOWN_EVENT_TYPE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_EVENT_TYPE_WORLD_GENERATION_REQUESTED = 1; // 请求生成世界
  GAME_TOWN_EVENT_TYPE_WORLD_READY = 2; // 世界生成完成
  GAME_TOWN_EVENT_TYPE_WORLD_GENERATION_FAILED = 3; // 世界生成失败
  GAME_TOWN_EVENT_TYPE_PLAYER_JOINED = 4; // 玩家加入
  GAME_TOWN_EVENT_TYPE_PLAYER_MOVED = 5; // 玩家移动
  GAME_TOWN_EVENT_TYPE_PLAYER_TALKED = 6; // 玩家发起对话，兼容旧事件
  GAME_TOWN_EVENT_TYPE_NPC_THINKING = 7; // NPC 正在思考
  GAME_TOWN_EVENT_TYPE_NPC_REPLIED = 8; // NPC 已回复
  GAME_TOWN_EVENT_TYPE_PLAYER_ACTED = 9; // 玩家行动，兼容旧事件
  GAME_TOWN_EVENT_TYPE_ACTION_RESOLVED = 10; // 行动已处理
  GAME_TOWN_EVENT_TYPE_WORLD_TICK_REQUESTED = 11; // 请求世界演进
  GAME_TOWN_EVENT_TYPE_WORLD_EVOLVED = 12; // 世界已演进
  GAME_TOWN_EVENT_TYPE_AGENT_JOB_FAILED = 13; // Agent 任务失败
  GAME_TOWN_EVENT_TYPE_PLAYER_ACTION_SUBMITTED = 14; // 玩家提交自由行动
  GAME_TOWN_EVENT_TYPE_ACTION_REJECTED = 15; // 行动被规则拒绝
  GAME_TOWN_EVENT_TYPE_ACTION_CLARIFICATION_REQUIRED = 16; // 行动需要澄清
  GAME_TOWN_EVENT_TYPE_NPC_PLANNED = 17; // NPC 完成计划
  GAME_TOWN_EVENT_TYPE_NPC_MOVED = 18; // NPC 移动
  GAME_TOWN_EVENT_TYPE_NPC_STATE_CHANGED = 19; // NPC 状态变化
  GAME_TOWN_EVENT_TYPE_NPC_DIED = 20; // NPC 死亡
  GAME_TOWN_EVENT_TYPE_LOCATION_CHANGED = 21; // 地点变化
  GAME_TOWN_EVENT_TYPE_FACTION_CHANGED = 22; // 阵营变化
  GAME_TOWN_EVENT_TYPE_CLAIM_SHARED = 23; // 信息或传闻传播
  GAME_TOWN_EVENT_TYPE_NPC_PLAN_REQUESTED = 24; // 请求 NPC 自主计划
  GAME_TOWN_EVENT_TYPE_PLAYER_CHARACTER_READY = 25; // 玩家角色生成完成
  GAME_TOWN_EVENT_TYPE_PLAYER_CHARACTER_FAILED = 26; // 玩家角色生成失败
}
