syntax = "proto3";

package common.api.app.game_town.v1;

option go_package = "common/proto/gen/game_town/v1/enum;enum";

enum GameTownKnowledgeCertainty {
  GAME_TOWN_KNOWLEDGE_CERTAINTY_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_KNOWLEDGE_CERTAINTY_CONFIRMED = 1; // 已确认
  GAME_TOWN_KNOWLEDGE_CERTAINTY_LIKELY = 2; // 很可能
  GAME_TOWN_KNOWLEDGE_CERTAINTY_RUMOR = 3; // 传闻
  GAME_TOWN_KNOWLEDGE_CERTAINTY_UNKNOWN = 4; // 无法判断
}

enum GameTownObservationSource {
  GAME_TOWN_OBSERVATION_SOURCE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_OBSERVATION_SOURCE_EXPERIENCED = 1; // 亲历
  GAME_TOWN_OBSERVATION_SOURCE_WITNESSED = 2; // 目击
  GAME_TOWN_OBSERVATION_SOURCE_TOLD = 3; // 他人转述
  GAME_TOWN_OBSERVATION_SOURCE_FACTION = 4; // 阵营消息
  GAME_TOWN_OBSERVATION_SOURCE_PUBLIC = 5; // 公开消息
}

enum GameTownRelationshipAttitude {
  GAME_TOWN_RELATIONSHIP_ATTITUDE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_RELATIONSHIP_ATTITUDE_FRIENDLY = 1; // 友善
  GAME_TOWN_RELATIONSHIP_ATTITUDE_TRUSTING = 2; // 信任
  GAME_TOWN_RELATIONSHIP_ATTITUDE_NEUTRAL = 3; // 中立
  GAME_TOWN_RELATIONSHIP_ATTITUDE_WARY = 4; // 警惕
  GAME_TOWN_RELATIONSHIP_ATTITUDE_AFRAID = 5; // 畏惧
  GAME_TOWN_RELATIONSHIP_ATTITUDE_HOSTILE = 6; // 敌对
}

enum GameTownClaimTruth {
  GAME_TOWN_CLAIM_TRUTH_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_CLAIM_TRUTH_TRUE = 1; // 为真
  GAME_TOWN_CLAIM_TRUTH_FALSE = 2; // 为假
  GAME_TOWN_CLAIM_TRUTH_UNKNOWN = 3; // 未知
}

enum GameTownBeliefStance {
  GAME_TOWN_BELIEF_STANCE_UNSPECIFIED = 0; // 未指定
  GAME_TOWN_BELIEF_STANCE_BELIEVES = 1; // 相信
  GAME_TOWN_BELIEF_STANCE_DOUBTS = 2; // 怀疑
  GAME_TOWN_BELIEF_STANCE_REJECTS = 3; // 否认
}
