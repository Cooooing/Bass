syntax = "proto3";

package common.api.app.game_town.v1;

import "common/common.proto";
import "game_town/v1/enum.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownEventService {
  rpc Page(PageGameTownEvents.Request) returns (PageGameTownEvents.Resp) {}
  rpc Watch(WatchGameTownEvents.Request) returns (stream WatchGameTownEvents.Resp) {}
}

message PageGameTownEvents {
  message Request {
    .common.api.app.common.PageReq page = 1; // 分页参数
    int64 world_id = 2; // 世界 ID
    int64 player_id = 3; // 查询玩家 ID
    uint64 after_sequence = 4; // 起始事件序号
    optional GameTownEventType type = 5; // 事件类型
  }

  message Resp {
    message Row {
      message SuggestedAction {
        message EntityRef {
          GameTownEntityType type = 1; // 目标类型
          int64 id = 2; // 目标 ID
        }

        string label = 1; // 展示文案
        string content = 2; // 提交内容
        repeated EntityRef targets = 3; // 目标提示
      }

      int64 id = 1; // 事件 ID
      int64 world_id = 2; // 世界 ID
      uint64 sequence = 3; // 世界内事件序号
      GameTownEventType type = 4; // 事件类型
      optional int64 actor_player_id = 5; // 事件玩家 ID
      optional int64 npc_id = 6; // 关联 NPC ID
      optional int64 location_id = 7; // 关联地点 ID
      optional int64 causation_event_id = 8; // 原因事件 ID
      string summary = 9; // 事件摘要
      string content = 10; // 事件内容
      google.protobuf.Struct payload = 11; // 最小事件载荷
      google.protobuf.Timestamp occurred_at = 12; // 发生时间
      google.protobuf.Timestamp world_time = 13; // 世界时间
      GameTownObservationSource source = 14; // 获知方式
      GameTownKnowledgeCertainty certainty = 15; // 确定程度
      repeated SuggestedAction suggested_actions = 16; // 可选快捷回答
    }

    .common.api.app.common.PageResp page = 1; // 分页结果
    repeated Row rows = 2; // 玩家可见事件列表
  }
}

message WatchGameTownEvents {
  message Request {
    int64 world_id = 1; // 世界 ID
    int64 player_id = 2; // 查询玩家 ID
    uint64 after_sequence = 3; // 上次收到的事件序号
  }

  message Resp {
    message SuggestedAction {
      message EntityRef {
        GameTownEntityType type = 1; // 目标类型
        int64 id = 2; // 目标 ID
      }

      string label = 1; // 展示文案
      string content = 2; // 提交内容
      repeated EntityRef targets = 3; // 目标提示
    }

    int64 id = 1; // 事件 ID
    int64 world_id = 2; // 世界 ID
    uint64 sequence = 3; // 世界内事件序号
    GameTownEventType type = 4; // 事件类型
    optional int64 actor_player_id = 5; // 事件玩家 ID
    optional int64 npc_id = 6; // 关联 NPC ID
    optional int64 location_id = 7; // 关联地点 ID
    optional int64 causation_event_id = 8; // 原因事件 ID
    string summary = 9; // 事件摘要
    string content = 10; // 事件内容
    google.protobuf.Struct payload = 11; // 最小事件载荷
    google.protobuf.Timestamp occurred_at = 12; // 发生时间
    google.protobuf.Timestamp world_time = 13; // 世界时间
    GameTownObservationSource source = 14; // 获知方式
    GameTownKnowledgeCertainty certainty = 15; // 确定程度
    repeated SuggestedAction suggested_actions = 16; // 可选快捷回答
  }
}
