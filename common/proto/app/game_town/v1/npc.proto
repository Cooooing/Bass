syntax = "proto3";

package common.api.app.game_town.v1;

import "game_town/v1/enum.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";


option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownNpcService {
  rpc Get(GetGameTownNpc.Request) returns (GetGameTownNpc.Response) {} // 获取 NPC。
  rpc List(ListGameTownNpcs.Request) returns (ListGameTownNpcs.Response) {} // 查询 NPC。
}

message GetGameTownNpc {
  message Request {
    int64 id = 1; // NPC ID
  }
  message Response {

    message GameTownNpc {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // NPC ID
      int64 world_id = 2; // 世界 ID
      string code = 3; // NPC 编码
      string name = 4; // NPC 名称
      string role = 5; // 角色职责
      string personality = 6; // 性格
      string goal = 7; // 目标
      string background = 8; // 背景
      int64 current_location_id = 9; // 当前地点 ID
      GameTownNpcState state = 10; // NPC 状态
      string system_prompt = 11; // 系统提示词
      google.protobuf.Struct generated_profile = 12; // 生成画像
      bool enabled = 13; // 是否启用
    }
    GameTownNpc row = 1; // NPC
  }
}

message ListGameTownNpcs {
  message Request {
    int64 world_id = 1; // 世界 ID
    optional int64 location_id = 2; // 地点 ID
  }
  message Response {

    message GameTownNpc {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
      int64 id = 1; // NPC ID
      int64 world_id = 2; // 世界 ID
      string code = 3; // NPC 编码
      string name = 4; // NPC 名称
      string role = 5; // 角色职责
      string personality = 6; // 性格
      string goal = 7; // 目标
      string background = 8; // 背景
      int64 current_location_id = 9; // 当前地点 ID
      GameTownNpcState state = 10; // NPC 状态
      string system_prompt = 11; // 系统提示词
      google.protobuf.Struct generated_profile = 12; // 生成画像
      bool enabled = 13; // 是否启用
    }
    repeated GameTownNpc rows = 1; // NPC 列表
  }
}
