syntax = "proto3";

package common.api.app.game_town.v1;

import "game_town/v1/enum/knowledge.proto";
import "game_town/v1/enum/npc.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownNpcService {
  rpc Get(GetGameTownNpc.Request) returns (GetGameTownNpc.Resp) {}
  rpc List(ListGameTownNpcs.Request) returns (ListGameTownNpcs.Resp) {}
}

message GetGameTownNpc {
  message Request {
    int64 world_id = 1; // 世界 ID
    int64 player_id = 2; // 查询玩家 ID
    int64 id = 3; // NPC ID
  }

  message Resp {
    message Attribute {
      string code = 1; // 属性编码
      string name = 2; // 属性名称
      string value = 3; // 玩家可见值
      GameTownKnowledgeCertainty certainty = 4; // 确定程度
      google.protobuf.Timestamp known_at = 5; // 获知时间
    }

    message Row {
      int64 id = 1; // NPC ID
      int64 world_id = 2; // 世界 ID
      string code = 3; // NPC 编码
      string name = 4; // NPC 名称
      string role = 5; // 角色定位
      string species = 6; // 种族
      GameTownNpcLifeStatus life_status = 7; // 玩家已知生命状态
      optional int64 last_known_location_id = 8; // 最后已知地点 ID
      GameTownRelationshipAttitude attitude = 9; // NPC 表现出的态度
      repeated string relationship_tags = 10; // 玩家已知关系标签
      repeated int64 public_faction_ids = 11; // 玩家已知公开阵营
      repeated Attribute attributes = 12; // 玩家可观察属性
      google.protobuf.Timestamp known_at = 13; // 信息更新时间
    }

    Row row = 1; // NPC 玩家视图
  }
}

message ListGameTownNpcs {
  message Request {
    int64 world_id = 1; // 世界 ID
    int64 player_id = 2; // 查询玩家 ID
    optional int64 location_id = 3; // 限定地点
  }

  message Resp {
    message Row {
      int64 id = 1; // NPC ID
      string code = 2; // NPC 编码
      string name = 3; // NPC 名称
      string role = 4; // 角色定位
      string species = 5; // 种族
      GameTownNpcLifeStatus life_status = 6; // 玩家已知生命状态
      optional int64 last_known_location_id = 7; // 最后已知地点 ID
      GameTownRelationshipAttitude attitude = 8; // NPC 表现出的态度
      repeated string state_tags = 9; // 可观察状态标签
    }

    repeated Row rows = 1; // NPC 玩家视图列表
  }
}
