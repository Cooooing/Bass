syntax = "proto3";

package common.api.app.game_town.v1;

import "game_town/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownPlayerService {
  rpc Register(RegisterGameTownPlayer.Request) returns (RegisterGameTownPlayer.Resp) {}
  rpc Get(GetGameTownPlayer.Request) returns (GetGameTownPlayer.Resp) {}
}

message RegisterGameTownPlayer {
  message Request {
    string name = 1; // 玩家登录名
    string display_name = 2; // 展示名称
  }

  message Resp {
    message Row {
      int64 id = 1; // 玩家 ID
      string name = 2; // 玩家登录名
      string display_name = 3; // 展示名称
      GameTownPlayerStatus status = 4; // 玩家状态
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    Row row = 1; // 玩家
  }
}

message GetGameTownPlayer {
  message Request {
    int64 id = 1; // 玩家 ID
  }

  message Resp {
    message Row {
      int64 id = 1; // 玩家 ID
      string name = 2; // 玩家登录名
      string display_name = 3; // 展示名称
      GameTownPlayerStatus status = 4; // 玩家状态
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    Row row = 1; // 玩家
  }
}
