syntax = "proto3";

package common.api.app.game_town.v1;

import "common/common.proto";
import "game_town/v1/enum.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/game_town/v1;v1";

service GameTownWorldService {
  rpc Create(CreateGameTownWorld.Request) returns (CreateGameTownWorld.Resp) {}
  rpc Get(GetGameTownWorld.Request) returns (GetGameTownWorld.Resp) {}
  rpc Page(PageGameTownWorlds.Request) returns (PageGameTownWorlds.Resp) {}
}

message CreateGameTownWorld {
  message Request {
    int64 creator_player_id = 1; // 创建玩家 ID
    string description = 2; // 世界描述
    uint32 npc_count = 3; // NPC 数量
    uint32 location_count = 4; // 地点数量
    optional int64 seed = 5; // 随机种子
    int64 agent_config_id = 6; // 模型配置 ID
  }

  message Resp {
    message Row {
      int64 id = 1; // 世界 ID
      string code = 2; // 世界编码
      string name = 3; // 世界名称
      string description = 4; // 世界描述
      GameTownWorldStatus status = 5; // 世界状态
      int64 creator_player_id = 6; // 创建玩家 ID
      optional int64 default_location_id = 7; // 默认地点 ID
      int64 seed = 8; // 随机种子
      int64 agent_config_id = 9; // 模型配置 ID
      string generation_summary = 10; // 生成摘要
      google.protobuf.Timestamp world_time = 11; // 当前世界时间
      uint32 time_scale = 12; // 现实一小时对应的世界小时数
      string current_era = 13; // 当前纪元或阶段
      string public_chronicle = 14; // 公开纪事
      int64 rule_version = 15; // 世界规则版本
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    Row row = 1; // 世界
    int64 event_id = 2; // 世界生成请求事件 ID
  }
}

message GetGameTownWorld {
  message Request {
    int64 id = 1; // 世界 ID
  }

  message Resp {
    message Row {
      int64 id = 1; // 世界 ID
      string code = 2; // 世界编码
      string name = 3; // 世界名称
      string description = 4; // 世界描述
      GameTownWorldStatus status = 5; // 世界状态
      int64 creator_player_id = 6; // 创建玩家 ID
      optional int64 default_location_id = 7; // 默认地点 ID
      int64 seed = 8; // 随机种子
      int64 agent_config_id = 9; // 模型配置 ID
      string generation_summary = 10; // 生成摘要
      google.protobuf.Timestamp world_time = 11; // 当前世界时间
      uint32 time_scale = 12; // 现实一小时对应的世界小时数
      string current_era = 13; // 当前纪元或阶段
      string public_chronicle = 14; // 公开纪事
      int64 rule_version = 15; // 世界规则版本
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    Row row = 1; // 世界
  }
}

message PageGameTownWorlds {
  message Request {
    .common.api.app.common.PageReq page = 1; // 分页参数
    optional int64 creator_player_id = 2; // 创建玩家 ID
    optional GameTownWorldStatus status = 3; // 世界状态
  }

  message Resp {
    message Row {
      int64 id = 1; // 世界 ID
      string code = 2; // 世界编码
      string name = 3; // 世界名称
      string description = 4; // 世界描述
      GameTownWorldStatus status = 5; // 世界状态
      int64 creator_player_id = 6; // 创建玩家 ID
      optional int64 default_location_id = 7; // 默认地点 ID
      int64 seed = 8; // 随机种子
      int64 agent_config_id = 9; // 模型配置 ID
      string generation_summary = 10; // 生成摘要
      google.protobuf.Timestamp world_time = 11; // 当前世界时间
      string current_era = 12; // 当前纪元或阶段
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }

    .common.api.app.common.PageResp page = 1; // 分页结果
    repeated Row rows = 2; // 世界列表
  }
}
