syntax = "proto3";

package common.api.app.im.v1;

option go_package = "common/proto/gen/im/v1;v1";

// IMEmojiService 管理账号自有表情分组及短期导入分享码。
service IMEmojiService {
  rpc List(ListEmojiGroups.Req) returns (ListEmojiGroups.Resp) {} // 查询账号自有的表情分组。
  rpc CreateGroup(CreateEmojiGroup.Req) returns (CreateEmojiGroup.Resp) {} // 创建表情分组。
  rpc RenameGroup(RenameEmojiGroup.Req) returns (RenameEmojiGroup.Resp) {} // 重命名表情分组。
  rpc DeleteGroup(DeleteEmojiGroup.Req) returns (DeleteEmojiGroup.Resp) {} // 删除分组及其中表情项。
  rpc AddItem(AddEmojiItem.Req) returns (AddEmojiItem.Resp) {} // 向分组加入一个可用图片资产。
  rpc RenameItem(RenameEmojiItem.Req) returns (RenameEmojiItem.Resp) {} // 重命名表情项别名。
  rpc ReorderGroups(ReorderEmojiGroups.Req) returns (ReorderEmojiGroups.Resp) {} // 重排表情分组。
  rpc ReorderItems(ReorderEmojiItems.Req) returns (ReorderEmojiItems.Resp) {} // 重排同一分组内的表情项。
  rpc DeleteItem(DeleteEmojiItem.Req) returns (DeleteEmojiItem.Resp) {} // 从分组移除一个表情项。
  rpc MoveItem(MoveEmojiItem.Req) returns (MoveEmojiItem.Resp) {} // 移动当前账号的表情到另一个分组。
  rpc CreateShare(CreateEmojiShare.Req) returns (CreateEmojiShare.Resp) {} // 创建可短期导入的分组快照。
  rpc ImportShare(ImportEmojiShare.Req) returns (ImportEmojiShare.Resp) {} // 从分享码导入为新的表情分组。
}

// EmojiGroup 是账号拥有的表情分组。
message EmojiGroup {
  int64 id = 1; // 分组 ID。
  string name = 2; // 分组名称。
  int64 sort = 3; // 展示排序。
  repeated EmojiItem items = 4; // 该分组中的表情项。
}

// EmojiItem 是分组中引用的平台图片资产。
message EmojiItem {
  int64 id = 1; // 表情项 ID。
  int64 asset_id = 2; // 平台图片资产 ID。
  string name = 3; // 可选表情别名。
  int64 sort = 4; // 分组内展示排序。
}

// ListEmojiGroups 查询账号的全部表情分组。
message ListEmojiGroups {
  message Req {
    int64 user_id = 1; // 分组所属账号 ID。
    string query = 2; // 按表情项别名进行的模糊查询。
  }
  message Resp {
    repeated EmojiGroup rows = 1; // 表情分组列表。
  }
}

// CreateEmojiGroup 创建一个账号表情分组。
message CreateEmojiGroup {
  message Req {
    int64 user_id = 1; // 分组所属账号 ID。
    string name = 2; // 新分组名称。
  }
  message Resp {
    EmojiGroup group = 1; // 已创建分组。
  }
}

// RenameEmojiGroup 修改账号自有表情分组的名称。
message RenameEmojiGroup {
  message Req {
    int64 user_id = 1; // 分组所属账号 ID。
    int64 group_id = 2; // 待修改分组 ID。
    string name = 3; // 新分组名称。
  }
  message Resp {
    EmojiGroup group = 1; // 已重命名分组。
  }
}

// DeleteEmojiGroup 删除账号自有分组及其表情项引用。
message DeleteEmojiGroup {
  message Req {
    int64 user_id = 1; // 分组所属账号 ID。
    int64 group_id = 2; // 待删除分组 ID。
  }
  message Resp {}
}

// AddEmojiItem 向账号自有分组添加一个平台图片资产。
message AddEmojiItem {
  message Req {
    int64 user_id = 1; // 分组所属账号 ID。
    optional int64 group_id = 2; // 可选目标分组 ID；缺省时加入默认分组。
    int64 asset_id = 3; // 已可用的平台图片资产 ID。
    string name = 4; // 可选表情别名。
  }
  message Resp {
    EmojiItem item = 1; // 已添加表情项。
  }
}

// DeleteEmojiItem 从账号自有分组删除一个表情项。
message DeleteEmojiItem {
  message Req {
    int64 user_id = 1; // 表情项所属账号 ID。
    int64 item_id = 2; // 待删除表情项 ID。
  }
  message Resp {}
}

// MoveEmojiItem 将当前账号的表情项移动到同一账号的目标分组。
message MoveEmojiItem {
  message Req {
    int64 user_id = 1; // 表情项与目标分组所属账号 ID。
    int64 item_id = 2; // 待移动表情项 ID。
    int64 group_id = 3; // 目标分组 ID。
  }
  message Resp {
    EmojiItem item = 1; // 已移动表情项。
  }
}

// RenameEmojiItem 修改当前账号表情项的别名。
message RenameEmojiItem {
  message Req {
    int64 user_id = 1; // 表情项所属账号 ID。
    int64 item_id = 2; // 待重命名表情项 ID。
    string name = 3; // 新表情别名。
  }
  message Resp {
    EmojiItem item = 1; // 已重命名表情项。
  }
}

// ReorderEmojiGroups 按完整 ID 序列重排当前账号的表情分组。
message ReorderEmojiGroups {
  message Req {
    int64 user_id = 1; // 分组所属账号 ID。
    repeated int64 group_ids = 2; // 按最终展示顺序排列的完整分组 ID 序列。
  }
  message Resp {}
}

// ReorderEmojiItems 按完整 ID 序列重排一个分组内的表情项。
message ReorderEmojiItems {
  message Req {
    int64 user_id = 1; // 表情项所属账号 ID。
    optional int64 group_id = 2; // 可选目标分组 ID；为空时重排未分组表情。
    repeated int64 item_ids = 3; // 按最终展示顺序排列的完整表情项 ID 序列。
  }
  message Resp {}
}

// CreateEmojiShare 把一个表情分组快照写入短期缓存。
message CreateEmojiShare {
  message Req {
    int64 user_id = 1; // 分享者账号 ID。
    int64 group_id = 2; // 待分享分组 ID。
  }
  message Resp {
    string code = 1; // 高熵分享码。
    int64 expires_in_seconds = 2; // 从响应开始计算的剩余有效秒数。
  }
}

// ImportEmojiShare 根据分享码新建分组并复制可用表情项引用。
message ImportEmojiShare {
  message Req {
    int64 user_id = 1; // 导入者账号 ID。
    string code = 2; // 待导入分享码。
  }
  message Resp {
    EmojiGroup group = 1; // 新建的导入分组。
    uint32 skipped_count = 2; // 因资源不可用而跳过的表情数量。
  }
}
