syntax = "proto3";

package common.api.app.im.v1.enum;

option go_package = "common/proto/gen/im/v1/enum;enum";

// IMMessageType 表示即时消息的渲染语义。
enum IMMessageType {
  IM_MESSAGE_TYPE_UNSPECIFIED = 0; // 未指定消息类型。
  IM_MESSAGE_TYPE_TEXT = 1; // 普通 Markdown 文本消息。
  IM_MESSAGE_TYPE_RED_PACKET = 2; // 红包消息。
}
