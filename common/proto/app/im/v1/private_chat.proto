syntax = "proto3";

package common.api.app.im.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "im/enum/v1/im_message_type.proto";

option go_package = "common/proto/gen/im/v1;v1";

// 服务定义。
service IMPrivateChatService {
  // 发送私聊消息。
  rpc SendPrivateChatMessage(SendPrivateChatMessage.Req) returns (SendPrivateChatMessage.Resp) {}
  // 撤回自己的私聊消息。
  rpc RevokePrivateChatMessage(RevokePrivateChatMessage.Req) returns (RevokePrivateChatMessage.Resp) {}
  // 查询当前账号的私聊会话。
  rpc ListPrivateChatSessions(ListPrivateChatSessions.Req) returns (ListPrivateChatSessions.Resp) {}
  // 查询私聊历史。
  rpc ListPrivateChatMessages(ListPrivateChatMessages.Req) returns (ListPrivateChatMessages.Resp) {}
  // 统计当前账号的私聊未读数。
  rpc CountUnreadPrivateChatMessages(CountUnreadPrivateChatMessages.Req) returns (CountUnreadPrivateChatMessages.Resp) {}
  // 标记私聊会话已读。
  rpc MarkPrivateChatSessionRead(MarkPrivateChatSessionRead.Req) returns (MarkPrivateChatSessionRead.Resp) {}
  // 设置私聊会话免打扰。
  rpc SetPrivateChatSessionMuted(SetPrivateChatSessionMuted.Req) returns (SetPrivateChatSessionMuted.Resp) {}
  // 设置私聊会话置顶。
  rpc SetPrivateChatSessionPinned(SetPrivateChatSessionPinned.Req) returns (SetPrivateChatSessionPinned.Resp) {}
}

// 协议消息。
message PrivateChatMessage {
  // 消息 ID。
  int64 id = 1;
  // 发送账号 ID。
  int64 sender_id = 2;
  // 接收账号 ID。
  int64 receiver_id = 3;
  // 原始 Markdown 内容。
  string content = 4;
  // 消息类型。
  .common.api.app.im.enum.v1.IMMessageType message_type = 5;
  // 是否已撤回。
  bool revoked = 6;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
  // 撤回时间。
  google.protobuf.Timestamp revoked_at = 1001;
}

// 协议消息。
message PrivateChatSession {
  // 会话 ID。
  int64 id = 1;
  // 对端账号 ID。
  int64 peer_user_id = 2;
  // 最后已读消息 ID。
  int64 last_read_message_id = 3;
  // 未读消息数。
  uint32 unread_count = 4;
  // 是否免打扰。
  bool muted = 5;
  // 是否置顶。
  bool pinned = 6;
  // 最后一条消息。
  PrivateChatMessage last_message = 7;
  // 最后消息时间。
  google.protobuf.Timestamp last_message_at = 8;
}

// 协议消息。
message SendPrivateChatMessage {
  // 请求参数。
  message Req {
    // 发送账号 ID。
    int64 sender_id = 1;
    // 接收账号 ID。
    int64 receiver_id = 2;
    // 客户端幂等消息 ID。
    string client_message_id = 3;
    // 原始 Markdown 内容。
    string content = 4;
  }
  // 响应结果。
  message Resp {
    // 已创建或幂等返回的消息。
    PrivateChatMessage message = 1;
  }
}

// 协议消息。
message RevokePrivateChatMessage {
  // 请求参数。
  message Req {
    // 操作账号 ID。
    int64 user_id = 1;
    // 消息 ID。
    int64 message_id = 2;
  }
  // 响应结果。
  message Resp {
    // 已撤回消息。
    PrivateChatMessage message = 1;
  }
}

// 协议消息。
message ListPrivateChatSessions {
  // 请求参数。
  message Req {
    // 当前账号 ID。
    int64 user_id = 1;
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 2;
  }
  // 响应结果。
  message Resp {
    // 分页信息。
    .common.api.app.common.v1.PageResp page = 1;
    // 私聊会话。
    repeated PrivateChatSession rows = 2;
  }
}

// 协议消息。
message ListPrivateChatMessages {
  // 请求参数。
  message Req {
    // 当前账号 ID。
    int64 user_id = 1;
    // 对端账号 ID。
    int64 peer_user_id = 2;
    // 向前分页游标消息 ID，0 表示最新。
    int64 before_id = 3;
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 4;
  }
  // 响应结果。
  message Resp {
    // 分页信息。
    .common.api.app.common.v1.PageResp page = 1;
    // 私聊消息。
    repeated PrivateChatMessage rows = 2;
  }
}

// 协议消息。
message CountUnreadPrivateChatMessages {
  // 请求参数。
  message Req {
    // 当前账号 ID。
    int64 user_id = 1;
  }
  // 响应结果。
  message Resp {
    // 未读消息总数。
    uint32 count = 1;
  }
}

// 协议消息。
message MarkPrivateChatSessionRead {
  // 请求参数。
  message Req {
    // 当前账号 ID。
    int64 user_id = 1;
    // 对端账号 ID。
    int64 peer_user_id = 2;
    // 最后已读消息 ID。
    int64 message_id = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message SetPrivateChatSessionMuted {
  // 请求参数。
  message Req {
    // 当前账号 ID。
    int64 user_id = 1;
    // 对端账号 ID。
    int64 peer_user_id = 2;
    // 是否免打扰。
    bool muted = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message SetPrivateChatSessionPinned {
  // 请求参数。
  message Req {
    // 当前账号 ID。
    int64 user_id = 1;
    // 对端账号 ID。
    int64 peer_user_id = 2;
    // 是否置顶。
    bool pinned = 3;
  }
  // 响应结果。
  message Resp {}
}
