syntax = "proto3";

package common.api.app.im.v1;

option go_package = "common/proto/gen/im/v1;v1";

service TCCGlobalChatBarrageService {
  rpc Try(TCCSendGlobalChatBarrage.Req) returns (TCCSendGlobalChatBarrage.Resp) {} // 创建待确认弹幕。
  rpc Confirm(TCCSendGlobalChatBarrage.Req) returns (TCCSendGlobalChatBarrage.Resp) {} // 发布待确认弹幕。
  rpc Cancel(TCCSendGlobalChatBarrage.Req) returns (TCCSendGlobalChatBarrage.Resp) {} // 取消待确认弹幕。
}

message TCCSendGlobalChatBarrage {
  message Req {
    int64 barrage_id = 1; // IM 预分配的弹幕记录 ID，仅用于 TCC 分支关联。
    int64 user_id = 2; // 发送账号 ID。
    string content = 3; // 纯文本弹幕内容。
    int64 points_cost = 4; // 本次消耗积分。
  }
  message Resp {}
}
