syntax = "proto3";

package common.api.app.integration.v1;

option go_package = "common/proto/gen/integration/v1;v1";

// OSS 回调类型
enum OssCallbackType {
  OSS_CALLBACK_TYPE_UNKNOWN = 0;
  OSS_CALLBACK_TYPE_QINIU_UPLOAD = 1; // 七牛上传回调
  OSS_CALLBACK_TYPE_QINIU_AUDIT = 2; // 七牛内容审核回调
}

// 回调处理状态
enum OssCallbackStatus {
  OSS_CALLBACK_STATUS_UNKNOWN = 0;
  OSS_CALLBACK_STATUS_RECEIVED = 1; // 已接收
  OSS_CALLBACK_STATUS_PROCESSED = 2; // 已处理
  OSS_CALLBACK_STATUS_FAILED = 3; // 处理失败
}
