syntax = "proto3";

package common.api.app.integration.v1;

import "google/api/annotations.proto";
import "integration/v1/enum.proto";

option go_package = "common/proto/gen/integration/v1;v1";

// OSS 回调服务
service IntegrationOssCallbackService {
  // 七牛上传回调
  rpc QiniuUploadCallback(QiniuUploadCallback.Request) returns (QiniuUploadCallback.Reply) {
    option (google.api.http) = {
      post: "/integration/v1/oss/qiniu/uploadCallback"
      body: "*"
    };
  }

  // 七牛内容审核回调
  rpc QiniuIncrementAuditCallback(QiniuIncrementAuditCallback.Request) returns (QiniuIncrementAuditCallback.Reply) {
    option (google.api.http) = {
      post: "/integration/v1/oss/qiniu/incrementAuditCallback"
      body: "*"
    };
  }
}

message QiniuUploadCallback {
  message Request {
    string key = 1;
    string hash = 2;
    int64 size = 3;
    string bucket = 4;
    string name = 5;
    string mime_type = 6;
    int64 upload_by = 7;
    string upload_by_name = 8;
  }
  message Reply {}
}

message QiniuIncrementAuditCallback {
  message Request {
    string id = 1;
    string pipeline = 2;
    int32 code = 3;
    string desc = 4;
    string reqid = 5;
    string inputBucket = 6;
    string inputKey = 7;
    repeated AuditItem items = 8;
  }
  message Reply {}
  message AuditItem {
    string key = 1;
    AuditResult result = 2;
  }
  message AuditResult {
    string suggestion = 1;
  }
}
