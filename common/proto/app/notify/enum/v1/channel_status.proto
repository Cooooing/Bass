syntax = "proto3";

package common.api.app.notify.enum.v1;

option go_package = "common/proto/gen/notify/enum/v1;enum";

// 枚举定义。
enum NotificationChannelStatus {
  // 未指定
  NOTIFICATION_CHANNEL_STATUS_UNSPECIFIED = 0;
  // 正在处理
  NOTIFICATION_CHANNEL_STATUS_PROCESSING = 1;
  // 已成功
  NOTIFICATION_CHANNEL_STATUS_SUCCEEDED = 2;
  // 已跳过
  NOTIFICATION_CHANNEL_STATUS_SKIPPED = 3;
  // 明确失败
  NOTIFICATION_CHANNEL_STATUS_FAILED = 4;
  // 结果不确定
  NOTIFICATION_CHANNEL_STATUS_UNKNOWN = 5;
  // 内部错误
  NOTIFICATION_CHANNEL_STATUS_INTERNAL_ERROR = 6;
  // 已被限流
  NOTIFICATION_CHANNEL_STATUS_RATE_LIMITED = 7;
}
