  NOTIFICATION_TYPE_ARTICLE_PUBLISHED = 2001;
  // 文章点赞通知
  NOTIFICATION_TYPE_ARTICLE_LIKED = 2002;
  // 文章感谢通知
  NOTIFICATION_TYPE_ARTICLE_THANKED = 2003;
  // 文章收藏通知
  NOTIFICATION_TYPE_ARTICLE_COLLECTED = 2004;
  // 文章关注通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED = 2005;
  // 回答采纳通知
