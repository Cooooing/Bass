syntax = "proto3";

package common.api.app.notify.v1;

option go_package = "common/proto/gen/notify/v1/enum;enum";

// 通知类型标识通知规则、模板和投递记录的业务语义。
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0; // 未指定通知类型
  NOTIFICATION_TYPE_USER_FOLLOW = 1001; // 用户关注通知
  NOTIFICATION_TYPE_USER_REGISTER = 1003; // 用户注册通知
  NOTIFICATION_TYPE_USER_EMAIL_VERIFICATION_CODE = 1006; // 邮箱验证码通知
  NOTIFICATION_TYPE_USER_PHONE_VERIFICATION_CODE = 1007; // 手机验证码通知
  NOTIFICATION_TYPE_ARTICLE_PUBLISHED = 2001; // 文章发布通知
  NOTIFICATION_TYPE_ARTICLE_LIKED = 2002; // 文章点赞通知
  NOTIFICATION_TYPE_ARTICLE_THANKED = 2003; // 文章感谢通知
  NOTIFICATION_TYPE_ARTICLE_COLLECTED = 2004; // 文章收藏通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED = 2005; // 文章关注通知
  NOTIFICATION_TYPE_ARTICLE_ACCEPTED_ANSWER = 2006; // 回答采纳通知
  NOTIFICATION_TYPE_ARTICLE_LOTTERY_WON = 2009; // 抽奖中奖通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED_COMMENT_PUBLISHED = 2012; // 关注文章评论通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED_POSTSCRIPT_ADDED = 2013; // 关注文章附言通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED_ANSWER_ACCEPTED = 2014; // 关注文章采纳通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED_POLL_ENDED = 2015; // 关注文章投票结束通知
  NOTIFICATION_TYPE_ARTICLE_WATCHED_LOTTERY_DRAWN = 2016; // 关注文章开奖通知
  NOTIFICATION_TYPE_ARTICLE_MENTIONED = 2017; // 文章提及通知
  NOTIFICATION_TYPE_POSTSCRIPT_MENTIONED = 2018; // 附言提及通知
  NOTIFICATION_TYPE_ARTICLE_REWARDED = 2019; // 文章打赏通知
  NOTIFICATION_TYPE_COMMENT_PUBLISHED = 2101; // 评论发布通知
  NOTIFICATION_TYPE_COMMENT_LIKED = 2102; // 评论点赞通知
  NOTIFICATION_TYPE_COMMENT_THANKED = 2103; // 评论感谢通知
  NOTIFICATION_TYPE_COMMENT_MENTIONED = 2105; // 评论提及通知
  NOTIFICATION_TYPE_IM_GLOBAL_CHAT_MENTIONED = 3003; // 全局聊天提及通知
}
