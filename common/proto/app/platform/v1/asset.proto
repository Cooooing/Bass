syntax = "proto3";

package common.api.app.platform.v1;

import "platform/enum/v1/asset.proto";

option go_package = "common/proto/gen/platform/v1;v1";

// PlatformAssetService 管理已完成上传且按内容寻址的资源，不归属业务引用或可见性规则。
service PlatformAssetService {
  // 服务方法。
  rpc PrepareDirectAssetUpload(PrepareDirectAssetUpload.Req) returns (PrepareDirectAssetUpload.Resp) {}
  // 服务方法。
  rpc GetAvailableAssetByHash(GetAvailableAssetByHash.Req) returns (GetAvailableAssetByHash.Resp) {}
  // 服务方法。
  rpc ResolvePublicAssets(ResolvePublicAssets.Req) returns (ResolvePublicAssets.Resp) {}
  // 服务方法。
  rpc ValidateAvailableAsset(ValidateAvailableAsset.Req) returns (ValidateAvailableAsset.Resp) {}
  // 服务方法。
  rpc BlockAsset(BlockAsset.Req) returns (BlockAsset.Resp) {}
}

// 协议消息。
message Asset {
  // 协议字段。
  int64 id = 1;
  // SHA-256 小写十六进制摘要。
  string hash = 2;
  // 协议字段。
  string url = 3;
  // 协议字段。
  string mime_type = 4;
  // 协议字段。
  int64 size = 5;
  // 协议字段。
  .common.api.app.platform.enum.v1.AssetStatus status = 6;
}

// asset_id 存在时表示摘要对应资源已存在，无需上传；否则客户端将返回的 multipart 表单直接提交至 MinIO。
message PrepareDirectAssetUpload {
  // 请求参数。
  message Req {
    // SHA-256 小写十六进制摘要。
    string hash = 1;
    // 协议字段。
    string mime_type = 2;
    // 协议字段。
    int64 size = 3;
    // 认证后的上传者，用于审计和限流。
    int64 upload_by_user_id = 4;
  }
  // 响应结果。
  message Resp {
    // 协议字段。
    optional int64 asset_id = 1;
    // 协议字段。
    string upload_url = 2;
    // 协议字段。
    map<string, string> form_fields = 3;
  }
}

// 协议消息。
message GetAvailableAssetByHash {
  // 请求参数。
  message Req {
    // 协议字段。
    string hash = 1;
  }
  // 响应结果。
  message Resp {
    // 协议字段。
    Asset asset = 1;
  }
}

// 协议消息。
message ResolvePublicAssets {
  // 请求参数。
  message Req {
    // 协议字段。
    repeated int64 asset_ids = 1;
  }
  // 响应结果。
  message Resp {
    // 协议字段。
    map<int64, string> urls = 1;
  }
}

// 协议消息。
message ValidateAvailableAsset {
  // 请求参数。
  message Req {
    // 协议字段。
    int64 asset_id = 1;
  }
  // 响应结果。
  message Resp {}
}

// Block 是内部治理命令，仅变更全局资源可用性；各业务领域仍拥有自己的引用关系。
message BlockAsset {
  // 请求参数。
  message Req {
    // 协议字段。
    int64 asset_id = 1;
    // 协议字段。
    optional string reason = 2;
    // 协议字段。
    int64 operator_user_id = 3;
  }
  // 响应结果。
  message Resp {}
}
