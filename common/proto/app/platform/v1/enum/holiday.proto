syntax = "proto3";

package common.api.app.platform.v1.enum;

option go_package = "common/proto/gen/platform/v1/enum;enum";

// 节假日日期类型。
enum HolidayType {
  // 未指定。
  HOLIDAY_TYPE_UNSPECIFIED = 0;
  // 工作日。
  HOLIDAY_TYPE_WORKDAY = 1;
  // 周末。
  HOLIDAY_TYPE_WEEKEND = 2;
  // 法定节日。
  HOLIDAY_TYPE_FESTIVAL = 3;
  // 调休工作日。
  HOLIDAY_TYPE_MAKEUP_WORKDAY = 4;
}
