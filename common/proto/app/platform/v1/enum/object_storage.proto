syntax = "proto3";

package common.api.app.platform.v1;

option go_package = "common/proto/gen/platform/v1/enum;enum";

// ObjectStorageProvider 表示对象存储提供商
enum ObjectStorageProvider {
  OBJECT_STORAGE_PROVIDER_UNSPECIFIED = 0; // 未指定
  OBJECT_STORAGE_PROVIDER_MINIO = 1; // MinIO
  OBJECT_STORAGE_PROVIDER_QINIU = 2; // 七牛云
}


// ObjectStorageStatus 表示资源状态
enum ObjectStorageStatus {
  OBJECT_STORAGE_STATUS_UNSPECIFIED = 0; // 未指定
  OBJECT_STORAGE_STATUS_AVAILABLE = 1; // 可绑定
  OBJECT_STORAGE_STATUS_BLOCKED = 2; // 已拦截
  OBJECT_STORAGE_STATUS_DELETED = 3; // 已删除
}
