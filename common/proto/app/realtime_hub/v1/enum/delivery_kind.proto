syntax = "proto3";

package common.api.app.realtime_hub.v1;

option go_package = "common/proto/gen/realtime_hub/v1/enum;enum";

enum DeliveryKind {
  DELIVERY_KIND_UNSPECIFIED = 0; // 未指定
  DELIVERY_KIND_NOTIFICATION = 1; // 站内信变更
  DELIVERY_KIND_PRIVATE_CHAT_MESSAGE = 2; // 私聊消息变更
  DELIVERY_KIND_GLOBAL_CHAT_MESSAGE = 3; // 全局聊天室消息变更
}
