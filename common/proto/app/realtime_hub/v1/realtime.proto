syntax = "proto3";

package common.api.app.realtime_hub.v1;

import "google/protobuf/timestamp.proto";
import "im/enum/v1/im_message_type.proto";
import "realtime_hub/enum/v1/delivery_kind.proto";
import "realtime_hub/enum/v1/node_group.proto";

option go_package = "common/proto/gen/realtime_hub/v1;v1";

// 服务定义。
service RealtimeHubService {
  // 建立 node 与 Hub 的双向控制及下行流。
  rpc Connect(stream NodeToHub) returns (stream HubToNode) {}
  // 批量查询账号在实时域内是否存在有效连接。
  rpc QueryRealtimeOnline(QueryRealtimeOnline.Req) returns (QueryRealtimeOnline.Resp) {}
  // 列出实时域中的全部在线账号。
  rpc ListRealtimeOnlineUsers(ListRealtimeOnlineUsers.Req) returns (ListRealtimeOnlineUsers.Resp) {}
  // 签发一次性客户端建连凭证。
  rpc IssueRealtimeTicket(IssueRealtimeTicket.Req) returns (IssueRealtimeTicket.Resp) {}
  // 消费一次性客户端建连凭证。
  rpc ConsumeRealtimeTicket(ConsumeRealtimeTicket.Req) returns (ConsumeRealtimeTicket.Resp) {}
}

// 协议消息。
message NodeToHub {
  // 联合字段。
  oneof payload {
    // 注册本次 node 流会话。
    RegisterNode register_node = 1;
    // 绑定客户端连接。
    BindConnection bind_connection = 2;
    // 解绑客户端连接。
    UnbindConnection unbind_connection = 3;
    // 续期 node 在线租约。
    Heartbeat heartbeat = 4;
    // 续期客户端连接租约。
    RenewConnection renew_connection = 5;
  }
}

// 协议消息。
message RegisterNode {
  // node 运行实例标识。
  string node_id = 1;
  // 支持的实时域。
  repeated string realms = 2;
  // node 所属集群。
  .common.api.app.realtime_hub.enum.v1.NodeGroup group = 3;
}

// 协议消息。
message BindConnection {
  // 实时域。
  string realm = 1;
  // 账号 ID。
  int64 user_id = 2;
  // node 内客户端连接标识。
  string connection_id = 3;
}

// 协议消息。
message UnbindConnection {
  // 实时域。
  string realm = 1;
  // 账号 ID。
  int64 user_id = 2;
  // node 内客户端连接标识。
  string connection_id = 3;
}

// 协议消息。
message RenewConnection {
  // 实时域。
  string realm = 1;
  // 账号 ID。
  int64 user_id = 2;
  // node 内客户端连接标识。
  string connection_id = 3;
}

// 协议消息。
message Heartbeat {}

// 协议消息。
message HubToNode {
  // 联合字段。
  oneof payload {
    // 面向客户端的实时下行。
    Delivery delivery = 1;
    // Hub 对 node 的连接控制。
    Control control = 2;
  }
}

// 协议消息。
message Delivery {
  // 接收账号 ID。
  int64 user_id = 1;
  // 实时消息类别。
  .common.api.app.realtime_hub.enum.v1.DeliveryKind kind = 2;
  // 联合字段。
  oneof payload {
    // 站内信变更。
    NotificationDelivery notification = 3;
    // 私聊消息变更。
    PrivateChatMessageDelivery private_chat_message = 4;
    // 全局聊天室消息变更。
    GlobalChatMessageDelivery global_chat_message = 5;
    // 全局聊天室弹幕变更。
    GlobalChatBarrageDelivery global_chat_barrage = 6;
    // 全局聊天室话题变更。
    GlobalChatTopicDelivery global_chat_topic = 7;
  }
}

// 协议消息。
message NotificationDelivery {
  // 站内信 ID。
  int64 notification_id = 1;
}

// 协议消息。
message PrivateChatMessageDelivery {
  // 私聊消息 ID。
  int64 message_id = 1;
  // 发送账号 ID。
  int64 sender_id = 2;
  // 接收账号 ID。
  int64 receiver_id = 3;
  // 消息类型。
  .common.api.app.im.enum.v1.IMMessageType message_type = 4;
  // 原始 Markdown 内容。
  string content = 5;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
}

// 协议消息。
message GlobalChatMessageDelivery {
  // 全局聊天室消息 ID。
  int64 message_id = 1;
  // 发送账号 ID。
  int64 sender_id = 2;
  // 消息类型。
  .common.api.app.im.enum.v1.IMMessageType message_type = 3;
  // 原始 Markdown 内容。
  string content = 4;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
}

// 协议消息。
message GlobalChatBarrageDelivery {
  // 全局聊天室弹幕 ID。
  int64 barrage_id = 1;
  // 发送账号 ID。
  int64 user_id = 2;
  // 纯文本弹幕内容。
  string content = 3;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
}

// 协议消息。
message GlobalChatTopicDelivery {
  // 全局聊天室话题记录 ID。
  int64 topic_id = 1;
  // 设置话题的账号 ID。
  int64 user_id = 2;
  // 话题内容。
  string content = 3;
  // 话题设置时间。
  google.protobuf.Timestamp created_at = 1000;
}

// 协议消息。
message Control {
  // 联合字段。
  oneof payload {
    // 关闭指定客户端连接。
    CloseConnection close_connection = 1;
    // 确认客户端连接已绑定到 Hub 路由。
    ConnectionBound connection_bound = 2;
  }
}

// 协议消息。
message CloseConnection {
  // 要关闭的 node 内连接标识。
  string connection_id = 1;
  // 关闭原因。
  string reason = 2;
}

// 协议消息。
message ConnectionBound {
  // 已绑定的 node 内客户端连接标识。
  string connection_id = 1;
}

// 协议消息。
message HubControl {
  // 实时域。
  string realm = 1;
  // 控制目标 node。
  string node_id = 2;
  // 下发控制内容。
  Control control = 3;
}

// 协议消息。
message QueryRealtimeOnline {
  // 请求参数。
  message Req {
    // 实时域。
    string realm = 1;
    // 待查询的账号 ID 列表。
    repeated int64 user_ids = 2;
  }
  // 响应结果。
  message Resp {
    // 账号 ID 到是否至少存在一条有效实时连接的映射。
    map<int64, bool> online_statuses = 1;
  }
}

// 协议消息。
message ListRealtimeOnlineUsers {
  // 请求参数。
  message Req {
    // 实时域。
    string realm = 1;
  }
  // 响应结果。
  message Resp {
    // 全部在线账号 ID。
    repeated int64 user_ids = 1;
  }
}

// 协议消息。
message IssueRealtimeTicket {
  // 请求参数。
  message Req {
    // 账号 ID。
    int64 user_id = 1;
    // 实时域。
    string realm = 2;
  }
  // 响应结果。
  message Resp {
    // 一次性建连凭证。
    string ticket = 1;
    // 有效期秒数。
    int64 expires_in_seconds = 2;
  }
}

// 协议消息。
message ConsumeRealtimeTicket {
  // 请求参数。
  message Req {
    // 实时域。
    string realm = 1;
    // 一次性建连凭证。
    string ticket = 2;
  }
  // 响应结果。
  message Resp {
    // 已认证账号 ID。
    int64 user_id = 1;
  }
}
