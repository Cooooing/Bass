syntax = "proto3";

package common.api.app.scheduler.enum.v1;

option go_package = "common/proto/gen/scheduler/enum/v1;enum";

// 枚举定义。
enum SchedulerTaskHandlerName {
  // 未指定
  SCHEDULER_TASK_HANDLER_NAME_UNSPECIFIED = 0;

  // 公共任务 10000-10999
  // 空任务
  SCHEDULER_TASK_HANDLER_NAME_NOOP = 10000;

  // user 任务 11000-11999
  // 用户 Outbox 批量投递
  SCHEDULER_TASK_HANDLER_NAME_USER_OUTBOX_PUBLISH_BATCH = 11000;
  // 用户批量解封
  SCHEDULER_TASK_HANDLER_NAME_USER_UNBAN_ACCOUNTS = 11001;
  // 结算每日活跃度并自动签到
  SCHEDULER_TASK_HANDLER_NAME_USER_SETTLE_LIVENESS = 11002;

  // content 任务 12000-12999
  // 内容 Outbox 批量投递
  SCHEDULER_TASK_HANDLER_NAME_CONTENT_OUTBOX_PUBLISH_BATCH = 12000;
  // 发布到期定时文章
  SCHEDULER_TASK_HANDLER_NAME_CONTENT_PUBLISH_SCHEDULED_ARTICLES = 12001;
  // 刷新文章浏览量
  SCHEDULER_TASK_HANDLER_NAME_CONTENT_FLUSH_ARTICLE_VIEWS = 12002;
  // 文章抽奖开奖
  SCHEDULER_TASK_HANDLER_NAME_CONTENT_DRAW_ARTICLE_LOTTERIES = 12003;
  // 文章投票截止
  SCHEDULER_TASK_HANDLER_NAME_CONTENT_FINISH_ARTICLE_POLLS = 12004;

  // platform 任务 13000-13999
  // 刷新节假日缓存
  SCHEDULER_TASK_HANDLER_NAME_PLATFORM_REFRESH_HOLIDAY = 13000;
  // 刷新 IP 地理数据
  SCHEDULER_TASK_HANDLER_NAME_PLATFORM_REFRESH_IP_DATA = 13001;
}
