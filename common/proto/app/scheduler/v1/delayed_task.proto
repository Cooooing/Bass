syntax = "proto3";

package common.api.app.scheduler.v1;

import "common/common.proto";
import "google/protobuf/timestamp.proto";
import "scheduler/v1/enum/task_execution_status.proto";
import "scheduler/v1/enum/task_misfire_policy.proto";
import "scheduler/v1/enum/task_trigger_type.proto";

option go_package = "common/proto/gen/scheduler/v1;v1";

service SchedulerDelayedTaskService {
  rpc Upsert(UpsertSchedulerDelayedTask.Req) returns (UpsertSchedulerDelayedTask.Resp) {} // 创建或更新延迟任务配置。
  rpc Get(GetSchedulerDelayedTask.Req) returns (GetSchedulerDelayedTask.Resp) {} // 获取延迟任务配置。
  rpc Page(PageSchedulerDelayedTasks.Req) returns (PageSchedulerDelayedTasks.Resp) {} // 分页查询延迟任务配置。
  rpc ListAvailableTasks(ListSchedulerAvailableDelayedTasks.Req) returns (ListSchedulerAvailableDelayedTasks.Resp) {} // 查询代码中可用任务。
  rpc Schedule(ScheduleSchedulerDelayedTask.Req) returns (ScheduleSchedulerDelayedTask.Resp) {} // 注册一次延迟执行。
  rpc Trigger(TriggerSchedulerDelayedTask.Req) returns (TriggerSchedulerDelayedTask.Resp) {} // 手动立即触发一次延迟任务。
  rpc CancelExecution(CancelSchedulerDelayedTaskExecution.Req) returns (CancelSchedulerDelayedTaskExecution.Resp) {} // 取消延迟任务执行记录。
  rpc PageExecutionRecords(PageSchedulerDelayedTaskExecutionRecords.Req) returns (PageSchedulerDelayedTaskExecutionRecords.Resp) {} // 分页查询延迟任务执行记录。
}

message UpsertSchedulerDelayedTask {
  message Req {
    int64 id = 1; // 延迟任务 ID，创建时为空。
    string name = 2; // 代码内任务名称。
    string title = 3; // 展示标题。
    string description = 4; // 任务说明。
    bool enabled = 5; // 是否启用。
    int32 timeout_seconds = 6; // 单次执行超时秒数。
    int32 max_attempts = 7; // 最大尝试次数，默认 3。
    SchedulerTaskMisfirePolicy misfire_policy = 8; // 错过计划时间后的处理策略。
    optional int32 stale_after_seconds = 9; // 过期判断秒数，空值表示不过期。
  }
  message Resp {
    message DelayedTask {
      int64 id = 1; // 延迟任务 ID。
      string name = 2; // 代码内任务名称。
      string title = 3; // 展示标题。
      string description = 4; // 任务说明。
      bool enabled = 5; // 是否启用。
      int32 timeout_seconds = 6; // 单次执行超时秒数。
      int32 max_attempts = 7; // 最大尝试次数。
      int64 version = 8; // 配置版本。
      SchedulerTaskMisfirePolicy misfire_policy = 9; // 错过计划时间后的处理策略。
      optional int32 stale_after_seconds = 10; // 过期判断秒数，空值表示不过期。
      google.protobuf.Timestamp created_at = 1000; // 创建时间。
      google.protobuf.Timestamp updated_at = 1001; // 更新时间。
    }
    DelayedTask row = 1; // 延迟任务配置。
  }
}

message GetSchedulerDelayedTask {
  message Req {
    int64 id = 1; // 延迟任务 ID。
  }
  message Resp {
    message DelayedTask {
      int64 id = 1; // 延迟任务 ID。
      string name = 2; // 代码内任务名称。
      string title = 3; // 展示标题。
      string description = 4; // 任务说明。
      bool enabled = 5; // 是否启用。
      int32 timeout_seconds = 6; // 单次执行超时秒数。
      int32 max_attempts = 7; // 最大尝试次数。
      int64 version = 8; // 配置版本。
      SchedulerTaskMisfirePolicy misfire_policy = 9; // 错过计划时间后的处理策略。
      optional int32 stale_after_seconds = 10; // 过期判断秒数，空值表示不过期。
      google.protobuf.Timestamp created_at = 1000; // 创建时间。
      google.protobuf.Timestamp updated_at = 1001; // 更新时间。
    }
    DelayedTask row = 1; // 延迟任务配置。
  }
}

message PageSchedulerDelayedTasks {
  message Req {
    message Query {
      repeated int64 ids = 1; // 延迟任务 ID 列表。
      optional string name = 2; // 代码内任务名称。
      optional string title = 3; // 展示标题。
      optional bool enabled = 4; // 是否启用。
    }
    .common.api.app.common.PageReq page = 1; // 分页参数。
    Query query = 2; // 查询条件。
  }
  message Resp {
    message DelayedTask {
      int64 id = 1; // 延迟任务 ID。
      string name = 2; // 代码内任务名称。
      string title = 3; // 展示标题。
      string description = 4; // 任务说明。
      bool enabled = 5; // 是否启用。
      int32 timeout_seconds = 6; // 单次执行超时秒数。
      int32 max_attempts = 7; // 最大尝试次数。
      int64 version = 8; // 配置版本。
      SchedulerTaskMisfirePolicy misfire_policy = 9; // 错过计划时间后的处理策略。
      optional int32 stale_after_seconds = 10; // 过期判断秒数，空值表示不过期。
      google.protobuf.Timestamp created_at = 1000; // 创建时间。
      google.protobuf.Timestamp updated_at = 1001; // 更新时间。
    }
    .common.api.app.common.PageResp page = 1; // 分页结果。
    repeated DelayedTask rows = 2; // 延迟任务配置列表。
  }
}

message ListSchedulerAvailableDelayedTasks {
  message Req {
    message Query {
      optional string keyword = 1; // 搜索关键字。
    }
    Query query = 1; // 查询条件。
  }
  message Resp {
    message AvailableTask {
      string name = 1; // 代码内任务名称。
      string title = 2; // 展示标题。
      string description = 3; // 任务说明。
    }
    repeated AvailableTask rows = 1; // 可用任务列表。
  }
}

message ScheduleSchedulerDelayedTask {
  message Req {
    int64 id = 1; // 延迟任务 ID。
    string title = 2; // 展示标题，未传 ID 时使用。
    string idempotency_key = 3; // 本次延迟执行幂等键。
    string payload = 4; // 本次执行参数，JSON 字符串。
    google.protobuf.Timestamp scheduled_at = 5; // 计划执行时间。
  }
  message Resp {
    message ExecutionRecord {
      int64 id = 1; // 执行记录 ID。
      int64 delayed_task_id = 2; // 延迟任务 ID。
      int64 delayed_task_version = 3; // 延迟任务配置版本。
      string idempotency_key = 4; // 本次延迟执行幂等键。
      SchedulerTaskTriggerType trigger_type = 5; // 触发类型。
      string schedule_key = 6; // 调度消息唯一键。
      google.protobuf.Timestamp scheduled_at = 7; // 计划执行时间。
      optional google.protobuf.Timestamp started_at = 8; // 开始时间。
      optional google.protobuf.Timestamp finished_at = 9; // 结束时间。
      optional int64 duration_ms = 10; // 执行耗时毫秒。
      SchedulerTaskExecutionStatus status = 11; // 执行状态。
      int32 attempt = 12; // 当前尝试次数。
      int32 max_attempts = 13; // 最大尝试次数。
      int32 timeout_seconds = 14; // 执行超时秒数。
      SchedulerTaskMisfirePolicy misfire_policy = 19; // 错过计划时间后的处理策略。
      optional int32 stale_after_seconds = 20; // 过期判断秒数，空值表示不过期。
      string worker_id = 15; // 执行节点标识。
      string payload = 16; // 执行参数快照。
      string last_error = 17; // 最近错误摘要。
      string trace_id = 18; // 链路追踪标识。
      google.protobuf.Timestamp created_at = 1000; // 创建时间。
      google.protobuf.Timestamp updated_at = 1001; // 更新时间。
    }
    ExecutionRecord row = 1; // 执行记录。
  }
}

