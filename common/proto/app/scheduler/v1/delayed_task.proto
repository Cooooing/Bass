syntax = "proto3";

package common.api.app.scheduler.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "scheduler/enum/v1/task_execution_status.proto";
import "scheduler/enum/v1/task_handler_name.proto";
import "scheduler/enum/v1/task_misfire_policy.proto";
import "scheduler/enum/v1/task_trigger_type.proto";

option go_package = "common/proto/gen/scheduler/v1;v1";

// 服务定义。
service SchedulerDelayedTaskService {
  // 创建或更新延迟任务配置。
  rpc UpsertSchedulerDelayedTask(UpsertSchedulerDelayedTask.Req) returns (UpsertSchedulerDelayedTask.Resp) {}
  // 获取延迟任务配置。
  rpc GetSchedulerDelayedTask(GetSchedulerDelayedTask.Req) returns (GetSchedulerDelayedTask.Resp) {}
  // 分页查询延迟任务配置。
  rpc PageSchedulerDelayedTasks(PageSchedulerDelayedTasks.Req) returns (PageSchedulerDelayedTasks.Resp) {}
  // 查询代码中可用任务。
  rpc ListSchedulerAvailableDelayedTasks(ListSchedulerAvailableDelayedTasks.Req) returns (ListSchedulerAvailableDelayedTasks.Resp) {}
  // 注册一次延迟执行。
  rpc ScheduleSchedulerDelayedTask(ScheduleSchedulerDelayedTask.Req) returns (ScheduleSchedulerDelayedTask.Resp) {}
  // 手动立即触发一次延迟任务。
  rpc TriggerSchedulerDelayedTask(TriggerSchedulerDelayedTask.Req) returns (TriggerSchedulerDelayedTask.Resp) {}
  // 取消延迟任务执行记录。
  rpc CancelSchedulerDelayedTaskExecution(CancelSchedulerDelayedTaskExecution.Req) returns (CancelSchedulerDelayedTaskExecution.Resp) {}
  // 分页查询延迟任务执行记录。
  rpc PageSchedulerDelayedTaskExecutionRecords(PageSchedulerDelayedTaskExecutionRecords.Req) returns (PageSchedulerDelayedTaskExecutionRecords.Resp) {}
}

// 协议消息。
message UpsertSchedulerDelayedTask {
  // 请求参数。
  message Req {
    // 延迟任务 ID，创建时为空。
    int64 id = 1;
    // 代码内任务处理器。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
    // 展示标题。
    string title = 3;
    // 任务说明。
    string description = 4;
    // 是否启用。
    bool enabled = 5;
    // 单次执行超时秒数。
    int32 timeout_seconds = 6;
    // 最大尝试次数，默认 3。
    int32 max_attempts = 7;
    // 错过计划时间后的处理策略。
    .common.api.app.scheduler.enum.v1.SchedulerTaskMisfirePolicy misfire_policy = 8;
    // 过期判断秒数；空值表示不过期。
    optional int32 stale_after_seconds = 9;
  }
  // 响应结果。
  message Resp {
    // 延迟任务配置。
    DelayedTask row = 1;
  }
}

// 协议消息。
message GetSchedulerDelayedTask {
  // 请求参数。
  message Req {
    // 延迟任务 ID。
    int64 id = 1;
    // 代码内任务处理器，未传 ID 时使用。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
  }
  // 响应结果。
  message Resp {
    // 延迟任务配置。
    DelayedTask row = 1;
  }
}

// 协议消息。
message PageSchedulerDelayedTasks {
  // 请求参数。
  message Req {
    // 协议消息。
    message Query {
      // 延迟任务 ID 列表。
      repeated int64 ids = 1;
      // 代码内任务处理器。
      optional .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
      // 展示标题。
      optional string title = 3;
      // 是否启用。
      optional bool enabled = 4;
    }
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 1;
    // 查询条件。
    Query query = 2;
  }
  // 响应结果。
  message Resp {
    // 分页结果。
    .common.api.app.common.v1.PageResp page = 1;
    // 延迟任务配置列表。
    repeated DelayedTask rows = 2;
  }
}

// 协议消息。
message ListSchedulerAvailableDelayedTasks {
  // 请求参数。
  message Req {
    // 协议消息。
    message Query {
      // 搜索关键字。
      optional string keyword = 1;
    }
    // 查询条件。
    Query query = 1;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message AvailableTask {
      // 代码内任务处理器。
      .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 1;
      // 展示标题。
      string title = 2;
      // 任务说明。
      string description = 3;
    }
    // 可用任务列表。
    repeated AvailableTask rows = 1;
  }
}

// 协议消息。
message ScheduleSchedulerDelayedTask {
  // 请求参数。
  message Req {
    // 代码内任务处理器。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 1;
    // 本次执行参数，JSON 字符串。
    string payload = 2;
    // 计划执行时间
    google.protobuf.Timestamp scheduled_at = 3;
    // 本次延迟执行幂等键
    string idempotency_key = 4;
    // 业务对象关联键，用于替换未完成执行
    string business_key = 5;
  }
  // 响应结果。
  message Resp {
    // 执行记录。
    DelayedTaskExecutionRecord row = 1;
  }
}

// 协议消息。
message TriggerSchedulerDelayedTask {
  // 请求参数。
  message Req {
    // 代码内任务处理器。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 1;
    // 手动触发参数，空值使用空对象。
    string payload = 2;
  }
  // 响应结果。
  message Resp {
    // 执行记录。
    DelayedTaskExecutionRecord row = 1;
  }
}

// 协议消息。
message CancelSchedulerDelayedTaskExecution {
  // 请求参数。
  message Req {
    // 执行记录 ID。
    int64 id = 1;
    // 本次延迟执行幂等键。
    string idempotency_key = 2;
    // 业务对象关联键，取消其未完成执行。
    string business_key = 3;
  }
  // 响应结果。
  message Resp {
    // 执行记录。
    DelayedTaskExecutionRecord row = 1;
  }
}

// 协议消息。
message PageSchedulerDelayedTaskExecutionRecords {
  // 请求参数。
  message Req {
    // 协议消息。
    message Query {
      // 延迟任务 ID。
      optional int64 delayed_task_id = 1;
      // 本次延迟执行幂等键。
      optional string idempotency_key = 2;
      // 执行状态。
      optional .common.api.app.scheduler.enum.v1.SchedulerTaskExecutionStatus status = 3;
      // 触发类型。
      optional .common.api.app.scheduler.enum.v1.SchedulerTaskTriggerType trigger_type = 4;
    }
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 1;
    // 查询条件。
    Query query = 2;
  }
  // 响应结果。
  message Resp {
    // 分页结果。
    .common.api.app.common.v1.PageResp page = 1;
    // 执行记录列表。
    repeated DelayedTaskExecutionRecord rows = 2;
  }
}

// 协议消息。
message DelayedTask {
  // 延迟任务 ID。
  int64 id = 1;
  // 代码内任务处理器。
  .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
  // 展示标题。
  string title = 3;
  // 任务说明。
  string description = 4;
  // 是否启用。
  bool enabled = 5;
  // 单次执行超时秒数。
  int32 timeout_seconds = 6;
  // 最大尝试次数。
  int32 max_attempts = 7;
  // 配置版本。
  int64 version = 8;
  // 错过计划时间后的处理策略。
  .common.api.app.scheduler.enum.v1.SchedulerTaskMisfirePolicy misfire_policy = 9;
  // 过期判断秒数；空值表示不过期。
  optional int32 stale_after_seconds = 10;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message DelayedTaskExecutionRecord {
  // 执行记录 ID。
  int64 id = 1;
  // 延迟任务 ID。
  int64 delayed_task_id = 2;
  // 延迟任务配置版本。
  int64 delayed_task_version = 3;
  // 本次延迟执行幂等键。
  string idempotency_key = 4;
  // 触发类型。
  .common.api.app.scheduler.enum.v1.SchedulerTaskTriggerType trigger_type = 5;
  // 调度消息唯一键。
  string schedule_key = 6;
  // 计划执行时间。
  google.protobuf.Timestamp scheduled_at = 7;
  // 开始时间。
  optional google.protobuf.Timestamp started_at = 8;
  // 结束时间。
  optional google.protobuf.Timestamp finished_at = 9;
  // 执行耗时毫秒。
  optional int64 duration_ms = 10;
  // 执行状态。
  .common.api.app.scheduler.enum.v1.SchedulerTaskExecutionStatus status = 11;
  // 当前尝试次数。
  int32 attempt = 12;
  // 最大尝试次数。
  int32 max_attempts = 13;
  // 执行超时秒数。
  int32 timeout_seconds = 14;
  // 执行节点标识。
  string worker_id = 15;
  // 执行参数快照。
  string payload = 16;
  // 最近错误摘要。
  string last_error = 17;
  // 链路追踪标识。
  string trace_id = 18;
  // 业务对象关联键。
  string business_key = 21;
  // 错过计划时间后的处理策略。
  .common.api.app.scheduler.enum.v1.SchedulerTaskMisfirePolicy misfire_policy = 19;
  // 过期判断秒数；空值表示不过期。
  optional int32 stale_after_seconds = 20;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 1001;
}
