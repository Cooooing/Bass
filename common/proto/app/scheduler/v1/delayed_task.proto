syntax = "proto3";

package common.api.app.scheduler.v1;

import "common/common.proto";
import "google/protobuf/timestamp.proto";
import "scheduler/v1/enum/delayed_task_status.proto";

option go_package = "common/proto/gen/scheduler/v1;v1";

service SchedulerDelayedTaskService {
  rpc Register(RegisterSchedulerDelayedTask.Req) returns (RegisterSchedulerDelayedTask.Resp) {} // 注册延迟任务。
  rpc Cancel(CancelSchedulerDelayedTask.Req) returns (CancelSchedulerDelayedTask.Resp) {} // 取消延迟任务。
  rpc Get(GetSchedulerDelayedTask.Req) returns (GetSchedulerDelayedTask.Resp) {} // 获取延迟任务。
  rpc Page(PageSchedulerDelayedTasks.Req) returns (PageSchedulerDelayedTasks.Resp) {} // 分页查询延迟任务。
  rpc Trigger(TriggerSchedulerDelayedTask.Req) returns (TriggerSchedulerDelayedTask.Resp) {} // 手动触发延迟任务。
}

message RegisterSchedulerDelayedTask {
  message Req {
    string idempotency_key = 1; // 幂等键
    string task_name = 2; // 代码内任务名称
    string payload = 3; // JSON 编码后的执行参数
    google.protobuf.Timestamp execute_at = 4; // 期望执行时间
    int32 max_attempts = 5; // 最大尝试次数
    int32 timeout_seconds = 6; // 单次执行超时秒数
  }
  message Resp {
    message DelayedTask {
      int64 id = 1; // 延迟任务 ID
      string idempotency_key = 2; // 幂等键
      string task_name = 3; // 代码内任务名称
      string payload = 4; // JSON 编码后的执行参数
      google.protobuf.Timestamp execute_at = 5; // 期望执行时间
      google.protobuf.Timestamp next_run_at = 6; // 下次执行时间
      SchedulerDelayedTaskStatus status = 7; // 任务状态
      int32 attempt = 8; // 已尝试次数
      int32 max_attempts = 9; // 最大尝试次数
      int32 timeout_seconds = 10; // 单次执行超时秒数
      optional google.protobuf.Timestamp started_at = 11; // 开始时间
      optional google.protobuf.Timestamp finished_at = 12; // 结束时间
      string last_error = 13; // 最近错误摘要
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
    DelayedTask row = 1; // 延迟任务
  }
}

message CancelSchedulerDelayedTask {
  message Req {
    int64 id = 1; // 延迟任务 ID
    string idempotency_key = 2; // 幂等键，与 id 二选一
  }
  message Resp {}
}

message GetSchedulerDelayedTask {
  message Req {
    int64 id = 1; // 延迟任务 ID
    string idempotency_key = 2; // 幂等键，与 id 二选一
  }
  message Resp {
    message DelayedTask {
      int64 id = 1; // 延迟任务 ID
      string idempotency_key = 2; // 幂等键
      string task_name = 3; // 代码内任务名称
      string payload = 4; // JSON 编码后的执行参数
      google.protobuf.Timestamp execute_at = 5; // 期望执行时间
      google.protobuf.Timestamp next_run_at = 6; // 下次执行时间
      SchedulerDelayedTaskStatus status = 7; // 任务状态
      int32 attempt = 8; // 已尝试次数
      int32 max_attempts = 9; // 最大尝试次数
      int32 timeout_seconds = 10; // 单次执行超时秒数
      optional google.protobuf.Timestamp started_at = 11; // 开始时间
      optional google.protobuf.Timestamp finished_at = 12; // 结束时间
      string last_error = 13; // 最近错误摘要
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
    DelayedTask row = 1; // 延迟任务
  }
}

message PageSchedulerDelayedTasks {
  message Req {
    message Query {
      optional string task_name = 1; // 代码内任务名称
      optional SchedulerDelayedTaskStatus status = 2; // 任务状态
    }
    .common.api.app.common.PageReq page = 1; // 分页参数
    Query query = 2; // 查询条件
  }
  message Resp {
    message DelayedTask {
      int64 id = 1; // 延迟任务 ID
      string idempotency_key = 2; // 幂等键
      string task_name = 3; // 代码内任务名称
      string payload = 4; // JSON 编码后的执行参数
      google.protobuf.Timestamp execute_at = 5; // 期望执行时间
      google.protobuf.Timestamp next_run_at = 6; // 下次执行时间
      SchedulerDelayedTaskStatus status = 7; // 任务状态
      int32 attempt = 8; // 已尝试次数
      int32 max_attempts = 9; // 最大尝试次数
      int32 timeout_seconds = 10; // 单次执行超时秒数
      optional google.protobuf.Timestamp started_at = 11; // 开始时间
      optional google.protobuf.Timestamp finished_at = 12; // 结束时间
      string last_error = 13; // 最近错误摘要
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间
    }
    .common.api.app.common.PageResp page = 1; // 分页结果
    repeated DelayedTask rows = 2; // 延迟任务列表
  }
}

message TriggerSchedulerDelayedTask {
  message Req {
    int64 id = 1; // 延迟任务 ID
  }
  message Resp {}
}