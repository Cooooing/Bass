      optional int64 duration_ms = 10; // 执行耗时毫秒。
      SchedulerTaskExecutionStatus status = 11; // 执行状态。
      int32 attempt = 12; // 当前尝试次数。
      int32 max_attempts = 13; // 最大尝试次数。
      int32 timeout_seconds = 14; // 执行超时秒数。
      SchedulerTaskMisfirePolicy misfire_policy = 19; // 错过计划时间后的处理策略。
      optional int32 stale_after_seconds = 20; // 过期判断秒数，空值表示不过期。
      string worker_id = 15; // 执行节点标识。
      string payload = 16; // 执行参数快照。
