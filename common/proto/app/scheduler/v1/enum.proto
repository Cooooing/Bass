syntax = "proto3";

package common.api.app.scheduler.v1;

option go_package = "common/proto/gen/scheduler/v1;v1";

enum SchedulerTaskExecutionStatus {
  SCHEDULER_TASK_EXECUTION_STATUS_UNSPECIFIED = 0; // 未指定
  SCHEDULER_TASK_EXECUTION_STATUS_RUNNING = 1; // 正在运行
  SCHEDULER_TASK_EXECUTION_STATUS_SUCCESS = 2; // 执行成功
  SCHEDULER_TASK_EXECUTION_STATUS_FAILED = 3; // 执行失败
  SCHEDULER_TASK_EXECUTION_STATUS_TIMEOUT = 4; // 等待目标响应超时
  SCHEDULER_TASK_EXECUTION_STATUS_CANCELED = 5; // 已取消
  SCHEDULER_TASK_EXECUTION_STATUS_OVERLAP_SKIPPED = 6; // 因运行重叠跳过
  SCHEDULER_TASK_EXECUTION_STATUS_UNKNOWN = 7; // 执行结果未知
}

enum SchedulerTaskTriggerType {
  SCHEDULER_TASK_TRIGGER_TYPE_UNSPECIFIED = 0; // 未指定
  SCHEDULER_TASK_TRIGGER_TYPE_SCHEDULE = 1; // 定时触发
  SCHEDULER_TASK_TRIGGER_TYPE_MANUAL = 2; // 手动触发
}

enum SchedulerTaskExecutionRuntimeState {
  SCHEDULER_TASK_EXECUTION_RUNTIME_STATE_UNSPECIFIED = 0; // 未指定
  SCHEDULER_TASK_EXECUTION_RUNTIME_STATE_ACTIVE = 1; // Redis 心跳仍存在
  SCHEDULER_TASK_EXECUTION_RUNTIME_STATE_STALE = 2; // Redis 心跳已丢失且超过超时窗口
  SCHEDULER_TASK_EXECUTION_RUNTIME_STATE_UNKNOWN = 3; // 当前无法确认是否仍在运行
  SCHEDULER_TASK_EXECUTION_RUNTIME_STATE_TERMINAL = 4; // 数据库已记录终态
}
