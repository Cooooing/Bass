syntax = "proto3";

package common.api.app.scheduler.v1;

option go_package = "common/proto/gen/scheduler/v1/enum;enum";

enum SchedulerDelayedTaskStatus {
  SCHEDULER_DELAYED_TASK_STATUS_UNSPECIFIED = 0;
  SCHEDULER_DELAYED_TASK_STATUS_PENDING = 1; // 等待执行
  SCHEDULER_DELAYED_TASK_STATUS_RUNNING = 2; // 执行中
  SCHEDULER_DELAYED_TASK_STATUS_SUCCESS = 3; // 执行成功
  SCHEDULER_DELAYED_TASK_STATUS_FAILED = 4; // 执行失败
  SCHEDULER_DELAYED_TASK_STATUS_CANCELLED = 5; // 已取消
}