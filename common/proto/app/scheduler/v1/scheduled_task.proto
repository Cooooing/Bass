syntax = "proto3";

package common.api.app.scheduler.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "scheduler/enum/v1/task_execution_status.proto";
import "scheduler/enum/v1/task_handler_name.proto";
import "scheduler/enum/v1/task_misfire_policy.proto";
import "scheduler/enum/v1/task_trigger_type.proto";

option go_package = "common/proto/gen/scheduler/v1;v1";

// 服务定义。
service SchedulerScheduledTaskService {
  // 创建或更新定时任务配置。
  rpc UpsertSchedulerScheduledTask(UpsertSchedulerScheduledTask.Req) returns (UpsertSchedulerScheduledTask.Resp) {}
  // 获取定时任务配置。
  rpc GetSchedulerScheduledTask(GetSchedulerScheduledTask.Req) returns (GetSchedulerScheduledTask.Resp) {}
  // 分页查询定时任务配置。
  rpc PageSchedulerScheduledTasks(PageSchedulerScheduledTasks.Req) returns (PageSchedulerScheduledTasks.Resp) {}
  // 查询代码中可用任务。
  rpc ListSchedulerAvailableScheduledTasks(ListSchedulerAvailableScheduledTasks.Req) returns (ListSchedulerAvailableScheduledTasks.Resp) {}
  // 分页查询定时任务执行记录。
  rpc PageSchedulerScheduledTaskExecutionRecords(PageSchedulerScheduledTaskExecutionRecords.Req) returns (PageSchedulerScheduledTaskExecutionRecords.Resp) {}
  // 手动触发一次定时任务。
  rpc TriggerSchedulerScheduledTask(TriggerSchedulerScheduledTask.Req) returns (TriggerSchedulerScheduledTask.Resp) {}
  // 取消执行中的定时任务记录。
  rpc CancelSchedulerScheduledTaskExecution(CancelSchedulerScheduledTaskExecution.Req) returns (CancelSchedulerScheduledTaskExecution.Resp) {}
}

// 协议消息。
message UpsertSchedulerScheduledTask {
  // 请求参数。
  message Req {
    // 定时任务 ID，创建时为空。
    int64 id = 1;
    // 代码内任务处理器。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
    // 展示标题。
    string title = 3;
    // 任务说明。
    string description = 4;
    // 是否启用调度。
    bool enabled = 5;
    // cron 表达式。
    string cron_spec = 6;
    // 默认执行参数，JSON 字符串。
    string payload = 7;
    // 单次执行超时秒数。
    int32 timeout_seconds = 8;
    // 是否允许重叠执行。
    bool allow_overlap = 9;
    // 最大尝试次数，默认 1。
    int32 max_attempts = 10;
    // 错过计划时间后的处理策略。
    .common.api.app.scheduler.enum.v1.SchedulerTaskMisfirePolicy misfire_policy = 11;
    // 过期判断秒数；空值表示不过期。
    optional int32 stale_after_seconds = 12;
  }
  // 响应结果。
  message Resp {
    // 定时任务配置。
    ScheduledTask row = 1;
  }
}

// 协议消息。
message GetSchedulerScheduledTask {
  // 请求参数。
  message Req {
    // 定时任务 ID。
    int64 id = 1;
    // 代码内任务处理器，未传 ID 时使用。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
  }
  // 响应结果。
  message Resp {
    // 定时任务配置。
    ScheduledTask row = 1;
  }
}

// 协议消息。
message PageSchedulerScheduledTasks {
  // 请求参数。
  message Req {
    // 协议消息。
    message Query {
      // 定时任务 ID 列表。
      repeated int64 ids = 1;
      // 代码内任务处理器。
      optional .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
      // 展示标题。
      optional string title = 3;
      // 是否启用调度。
      optional bool enabled = 4;
    }
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 1;
    // 查询条件。
    Query query = 2;
  }
  // 响应结果。
  message Resp {
    // 分页结果。
    .common.api.app.common.v1.PageResp page = 1;
    // 定时任务列表。
    repeated ScheduledTask rows = 2;
  }
}

// 协议消息。
message ListSchedulerAvailableScheduledTasks {
  // 请求参数。
  message Req {
    // 协议消息。
    message Query {
      // 搜索关键字。
      optional string keyword = 1;
    }
    // 查询条件。
    Query query = 1;
  }
  // 响应结果。
  message Resp {
    // 协议消息。
    message AvailableTask {
      // 代码内任务处理器。
      .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 1;
      // 展示标题。
      string title = 2;
      // 任务说明。
      string description = 3;
    }
    // 可用任务列表。
    repeated AvailableTask rows = 1;
  }
}

// 协议消息。
message PageSchedulerScheduledTaskExecutionRecords {
  // 请求参数。
  message Req {
    // 协议消息。
    message Query {
      // 执行记录 ID 列表。
      repeated int64 ids = 1;
      // 定时任务 ID。
      optional int64 scheduled_task_id = 2;
      // 执行状态。
      optional .common.api.app.scheduler.enum.v1.SchedulerTaskExecutionStatus status = 3;
      // 触发类型。
      optional .common.api.app.scheduler.enum.v1.SchedulerTaskTriggerType trigger_type = 4;
    }
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 1;
    // 查询条件。
    Query query = 2;
  }
  // 响应结果。
  message Resp {
    // 分页结果。
    .common.api.app.common.v1.PageResp page = 1;
    // 执行记录列表。
    repeated ScheduledTaskExecutionRecord rows = 2;
  }
}

// 协议消息。
message TriggerSchedulerScheduledTask {
  // 请求参数。
  message Req {
    // 代码内任务处理器。
    .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 1;
    // 手动触发参数，空值使用默认参数。
    string payload = 2;
  }
  // 响应结果。
  message Resp {
    // 执行记录。
    ScheduledTaskExecutionRecord row = 1;
  }
}

// 协议消息。
message CancelSchedulerScheduledTaskExecution {
  // 请求参数。
  message Req {
    // 执行记录 ID。
    int64 id = 1;
  }
  // 响应结果。
  message Resp {
    // 执行记录。
    ScheduledTaskExecutionRecord row = 1;
  }
}

// 协议消息。
message ScheduledTask {
  // 定时任务 ID。
  int64 id = 1;
  // 代码内任务处理器。
  .common.api.app.scheduler.enum.v1.SchedulerTaskHandlerName handler_name = 2;
  // 展示标题。
  string title = 3;
  // 任务说明。
  string description = 4;
  // 是否启用调度。
  bool enabled = 5;
  // cron 表达式。
  string cron_spec = 6;
  // 默认执行参数，JSON 字符串。
  string payload = 7;
  // 单次执行超时秒数。
  int32 timeout_seconds = 8;
  // 是否允许重叠执行。
  bool allow_overlap = 9;
  // 最大尝试次数。
  int32 max_attempts = 10;
  // 配置版本。
  int64 version = 11;
  // 错过计划时间后的处理策略。
  .common.api.app.scheduler.enum.v1.SchedulerTaskMisfirePolicy misfire_policy = 12;
  // 过期判断秒数；空值表示不过期。
  optional int32 stale_after_seconds = 13;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message ScheduledTaskExecutionRecord {
  // 执行记录 ID。
  int64 id = 1;
  // 定时任务 ID。
  int64 scheduled_task_id = 2;
  // 定时任务配置版本。
  int64 scheduled_task_version = 3;
  // 触发类型。
  .common.api.app.scheduler.enum.v1.SchedulerTaskTriggerType trigger_type = 4;
  // 调度消息唯一键。
  string schedule_key = 5;
  // 计划执行时间。
  google.protobuf.Timestamp scheduled_at = 6;
  // 开始时间。
  optional google.protobuf.Timestamp started_at = 7;
  // 结束时间。
  optional google.protobuf.Timestamp finished_at = 8;
  // 执行耗时毫秒。
  optional int64 duration_ms = 9;
  // 执行状态。
  .common.api.app.scheduler.enum.v1.SchedulerTaskExecutionStatus status = 10;
  // 当前尝试次数。
  int32 attempt = 11;
  // 最大尝试次数。
  int32 max_attempts = 12;
  // 执行超时秒数。
  int32 timeout_seconds = 13;
  // 执行节点标识。
  string worker_id = 14;
  // 执行参数快照。
  string payload = 15;
  // 最近错误摘要。
  string last_error = 16;
  // 链路追踪标识。
  string trace_id = 17;
  // 错过计划时间后的处理策略。
  .common.api.app.scheduler.enum.v1.SchedulerTaskMisfirePolicy misfire_policy = 18;
  // 过期判断秒数；空值表示不过期。
  optional int32 stale_after_seconds = 19;
  // 创建时间。
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 1001;
}
