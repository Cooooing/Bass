syntax = "proto3";

package common.api.app.scheduler.v1;

import "common/common.proto";
import "scheduler/v1/model.proto";

option go_package = "common/proto/gen/scheduler/v1;v1";

service SchedulerTaskService {
  rpc Upsert(UpsertSchedulerTask.Request) returns (UpsertSchedulerTask.Reply) {} // 新增或更新定时任务。
  rpc Get(GetSchedulerTask.Request) returns (GetSchedulerTask.Reply) {} // 获取定时任务。
  rpc Page(PageSchedulerTasks.Request) returns (PageSchedulerTasks.Reply) {} // 分页查询定时任务。
  rpc ListAvailableTasks(ListSchedulerAvailableTasks.Request) returns (ListSchedulerAvailableTasks.Reply) {} // 查询代码内已注册任务。
  rpc PageExecutionRecords(PageSchedulerTaskExecutionRecords.Request) returns (PageSchedulerTaskExecutionRecords.Reply) {} // 分页查询任务执行记录。
  rpc Trigger(TriggerSchedulerTask.Request) returns (TriggerSchedulerTask.Reply) {} // 手动触发一次任务运行。
  rpc CancelExecution(CancelSchedulerTaskExecution.Request) returns (CancelSchedulerTaskExecution.Reply) {} // 取消正在运行的任务执行记录。
  rpc CheckExecutionRuntimes(CheckSchedulerTaskExecutionRuntimes.Request) returns (CheckSchedulerTaskExecutionRuntimes.Reply) {} // 检查执行记录 Redis 运行态。
  rpc MarkExecutionsUnknown(MarkSchedulerTaskExecutionsUnknown.Request) returns (MarkSchedulerTaskExecutionsUnknown.Reply) {} // 将已确认丢失运行心跳的记录标记为未知。
}

message UpsertSchedulerTask {
  message Request {
    int64 id = 1; // 任务 ID，0 表示新增
    string name = 2; // 代码内任务名称
    string title = 3; // 展示名称
    string description = 4; // 任务说明
    bool enabled = 5; // 是否启用调度
    string cron_spec = 6; // Quartz cron 表达式
    string payload = 7; // JSON 编码后的调度参数
    int32 timeout_seconds = 8; // 单次执行等待超时时间，单位秒
    bool allow_overlap = 9; // 是否允许同一任务重叠执行
    optional bool alert_enabled = 10; // 是否启用告警，未传时默认启用
  }
  message Reply {
    SchedulerTask row = 1; // 任务
  }
}

message GetSchedulerTask {
  message Request {
    int64 id = 1; // 任务 ID
  }
  message Reply {
    SchedulerTask row = 1; // 任务
  }
}

message PageSchedulerTasks {
  message Request {
    common.PageRequest page = 1; // 分页参数
    SchedulerTaskQueryParams query = 2; // 查询条件
  }
  message Reply {
    common.PageReply page = 1; // 分页结果
    repeated SchedulerTask rows = 2; // 任务列表
  }
}

message ListSchedulerAvailableTasks {
  message Request {
    SchedulerAvailableTaskQueryParams query = 1; // 查询条件
  }
  message Reply {
    repeated SchedulerAvailableTask rows = 1; // 已注册任务列表
  }
}

message PageSchedulerTaskExecutionRecords {
  message Request {
    common.PageRequest page = 1; // 分页参数
    SchedulerTaskExecutionRecordQueryParams query = 2; // 查询条件
  }
  message Reply {
    common.PageReply page = 1; // 分页结果
    repeated SchedulerTaskExecutionRecord rows = 2; // 执行记录列表
  }
}

message TriggerSchedulerTask {
  message Request {
    int64 id = 1; // 任务 ID
    string payload = 2; // 本次手动触发覆盖使用的 JSON 参数
  }
  message Reply {
    SchedulerTaskExecutionRecord row = 1; // 执行记录
  }
}

message CancelSchedulerTaskExecution {
  message Request {
    int64 id = 1; // 执行记录 ID
  }
  message Reply {
    SchedulerTaskExecutionRecord row = 1; // 执行记录
  }
}

message CheckSchedulerTaskExecutionRuntimes {
  message Request {
    repeated int64 ids = 1; // 执行记录 ID 列表
  }
  message Reply {
    repeated SchedulerTaskExecutionRuntime rows = 1; // 运行态检测结果
  }
}

message MarkSchedulerTaskExecutionsUnknown {
  message Request {
    repeated int64 ids = 1; // 执行记录 ID 列表
  }
  message Reply {
    repeated SchedulerTaskExecutionRecord rows = 1; // 已更新的执行记录
    uint32 updated_count = 2; // 已更新数量
  }
}
