syntax = "proto3";

package common.api.app.scheduler.v1;

import "common/common.proto";
import "google/protobuf/timestamp.proto";
import "scheduler/v1/enum.proto";

option go_package = "common/proto/gen/scheduler/v1;v1";

service SchedulerTaskService {
  rpc Upsert(UpsertSchedulerTask.Request) returns (UpsertSchedulerTask.Response) {} // 新增或更新定时任务。
  rpc Get(GetSchedulerTask.Request) returns (GetSchedulerTask.Response) {} // 获取定时任务。
  rpc Page(PageSchedulerTasks.Request) returns (PageSchedulerTasks.Response) {} // 分页查询定时任务。
  rpc ListAvailableTasks(ListSchedulerAvailableTasks.Request) returns (ListSchedulerAvailableTasks.Response) {} // 查询代码内已注册任务。
  rpc PageExecutionRecords(PageSchedulerTaskExecutionRecords.Request) returns (PageSchedulerTaskExecutionRecords.Response) {} // 分页查询任务执行记录。
  rpc Trigger(TriggerSchedulerTask.Request) returns (TriggerSchedulerTask.Response) {} // 手动触发一次任务运行。
  rpc CancelExecution(CancelSchedulerTaskExecution.Request) returns (CancelSchedulerTaskExecution.Response) {} // 取消正在运行的任务执行记录。
  rpc CheckExecutionRuntimes(CheckSchedulerTaskExecutionRuntimes.Request) returns (CheckSchedulerTaskExecutionRuntimes.Response) {} // 检查执行记录 Redis 运行态。
  rpc MarkExecutionsUnknown(MarkSchedulerTaskExecutionsUnknown.Request) returns (MarkSchedulerTaskExecutionsUnknown.Response) {} // 将已确认丢失运行心跳的记录标记为未知。
}

message UpsertSchedulerTask {
  message Request {
    int64 id = 1; // 任务 ID，0 表示新增
    string name = 2; // 代码内任务名称
    string title = 3; // 展示名称
    string description = 4; // 任务说明
    bool enabled = 5; // 是否启用调度
    string cron_spec = 6; // Quartz cron 表达式
    string payload = 7; // JSON 编码后的调度参数
    int32 timeout_seconds = 8; // 单次执行等待超时时间，单位秒
    bool allow_overlap = 9; // 是否允许同一任务重叠执行
    optional bool alert_enabled = 10; // 是否启用告警，未传时默认启用
  }
  message Response {

    message SchedulerTask {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 任务 ID
      string name = 2; // 代码内任务名称
      string title = 3; // 展示名称
      string description = 4; // 任务说明
      bool enabled = 5; // 是否启用调度
      string cron_spec = 6; // cron 表达式
      string payload = 7; // JSON 编码后的调度参数
      int32 timeout_seconds = 8; // 单次执行等待超时时间，单位秒
      bool allow_overlap = 9; // 是否允许同一任务重叠执行
      bool alert_enabled = 10; // 是否启用告警
      int64 version = 16; // 任务配置版本
    }
    SchedulerTask row = 1; // 任务
  }
}

message GetSchedulerTask {
  message Request {
    int64 id = 1; // 任务 ID
  }
  message Response {

    message SchedulerTask {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 任务 ID
      string name = 2; // 代码内任务名称
      string title = 3; // 展示名称
      string description = 4; // 任务说明
      bool enabled = 5; // 是否启用调度
      string cron_spec = 6; // cron 表达式
      string payload = 7; // JSON 编码后的调度参数
      int32 timeout_seconds = 8; // 单次执行等待超时时间，单位秒
      bool allow_overlap = 9; // 是否允许同一任务重叠执行
      bool alert_enabled = 10; // 是否启用告警
      int64 version = 16; // 任务配置版本
    }
    SchedulerTask row = 1; // 任务
  }
}

message PageSchedulerTasks {
  message Request {

    message SchedulerTaskQueryParams {
      repeated int64 ids = 1; // 任务 ID 列表
      optional string name = 2; // 代码内任务名称，模糊匹配
      optional string title = 3; // 展示名称，模糊匹配
      optional bool enabled = 4; // 是否启用
    }
    .common.api.app.common.PageRequest page = 1; // 分页参数
    SchedulerTaskQueryParams query = 2; // 查询条件
  }
  message Response {

    message SchedulerTask {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 任务 ID
      string name = 2; // 代码内任务名称
      string title = 3; // 展示名称
      string description = 4; // 任务说明
      bool enabled = 5; // 是否启用调度
      string cron_spec = 6; // cron 表达式
      string payload = 7; // JSON 编码后的调度参数
      int32 timeout_seconds = 8; // 单次执行等待超时时间，单位秒
      bool allow_overlap = 9; // 是否允许同一任务重叠执行
      bool alert_enabled = 10; // 是否启用告警
      int64 version = 16; // 任务配置版本
    }
    .common.api.app.common.PageResponse page = 1; // 分页结果
    repeated SchedulerTask rows = 2; // 任务列表
  }
}

message ListSchedulerAvailableTasks {
  message Request {

    message SchedulerAvailableTaskQueryParams {
      optional string keyword = 1; // 搜索关键词，匹配 name、title、description
    }
    SchedulerAvailableTaskQueryParams query = 1; // 查询条件
  }
  message Response {

    message SchedulerAvailableTask {
      string name = 1; // 代码内任务名称
      string title = 2; // 展示名称
      string description = 3; // 任务说明
    }
    repeated SchedulerAvailableTask rows = 1; // 已注册任务列表
  }
}

message PageSchedulerTaskExecutionRecords {
  message Request {

    message SchedulerTaskExecutionRecordQueryParams {
      repeated int64 ids = 1; // 执行记录 ID 列表
      optional int64 task_id = 2; // 任务 ID
      optional SchedulerTaskExecutionStatus status = 3; // 执行状态
      optional SchedulerTaskTriggerType trigger_type = 4; // 触发类型
    }
    .common.api.app.common.PageRequest page = 1; // 分页参数
    SchedulerTaskExecutionRecordQueryParams query = 2; // 查询条件
  }
  message Response {

    message SchedulerTaskExecutionRecord {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 执行记录 ID
      int64 task_id = 2; // 任务 ID
      google.protobuf.Timestamp scheduled_at = 3; // 理论调度时间
      optional google.protobuf.Timestamp started_at = 4; // 实际开始时间
      optional google.protobuf.Timestamp finished_at = 5; // 实际结束时间
      optional int64 duration_ms = 6; // 执行耗时，单位毫秒
      SchedulerTaskExecutionStatus status = 7; // 执行状态
      SchedulerTaskTriggerType trigger_type = 8; // 触发类型
      int64 task_version = 9; // 执行时使用的任务配置版本
      string worker_id = 10; // 触发本次执行的 scheduler 实例
      string payload = 15; // JSON 编码后的执行参数快照
      string last_error = 16; // 最近一次错误摘要
      string trace_id = 17; // 链路追踪 ID
    }
    .common.api.app.common.PageResponse page = 1; // 分页结果
    repeated SchedulerTaskExecutionRecord rows = 2; // 执行记录列表
  }
}

message TriggerSchedulerTask {
  message Request {
    int64 id = 1; // 任务 ID
    string payload = 2; // 本次手动触发覆盖使用的 JSON 参数
  }
  message Response {

    message SchedulerTaskExecutionRecord {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 执行记录 ID
      int64 task_id = 2; // 任务 ID
      google.protobuf.Timestamp scheduled_at = 3; // 理论调度时间
      optional google.protobuf.Timestamp started_at = 4; // 实际开始时间
      optional google.protobuf.Timestamp finished_at = 5; // 实际结束时间
      optional int64 duration_ms = 6; // 执行耗时，单位毫秒
      SchedulerTaskExecutionStatus status = 7; // 执行状态
      SchedulerTaskTriggerType trigger_type = 8; // 触发类型
      int64 task_version = 9; // 执行时使用的任务配置版本
      string worker_id = 10; // 触发本次执行的 scheduler 实例
      string payload = 15; // JSON 编码后的执行参数快照
      string last_error = 16; // 最近一次错误摘要
      string trace_id = 17; // 链路追踪 ID
    }
    SchedulerTaskExecutionRecord row = 1; // 执行记录
  }
}

message CancelSchedulerTaskExecution {
  message Request {
    int64 id = 1; // 执行记录 ID
  }
  message Response {

    message SchedulerTaskExecutionRecord {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 执行记录 ID
      int64 task_id = 2; // 任务 ID
      google.protobuf.Timestamp scheduled_at = 3; // 理论调度时间
      optional google.protobuf.Timestamp started_at = 4; // 实际开始时间
      optional google.protobuf.Timestamp finished_at = 5; // 实际结束时间
      optional int64 duration_ms = 6; // 执行耗时，单位毫秒
      SchedulerTaskExecutionStatus status = 7; // 执行状态
      SchedulerTaskTriggerType trigger_type = 8; // 触发类型
      int64 task_version = 9; // 执行时使用的任务配置版本
      string worker_id = 10; // 触发本次执行的 scheduler 实例
      string payload = 15; // JSON 编码后的执行参数快照
      string last_error = 16; // 最近一次错误摘要
      string trace_id = 17; // 链路追踪 ID
    }
    SchedulerTaskExecutionRecord row = 1; // 执行记录
  }
}

message CheckSchedulerTaskExecutionRuntimes {
  message Request {
    repeated int64 ids = 1; // 执行记录 ID 列表
  }
  message Response {

    message SchedulerTaskExecutionRuntime {
      int64 execution_record_id = 1; // 执行记录 ID
      int64 task_id = 2; // 任务 ID
      SchedulerTaskExecutionRuntimeState state = 3; // Redis 运行态检测结果
    }
    repeated SchedulerTaskExecutionRuntime rows = 1; // 运行态检测结果
  }
}

message MarkSchedulerTaskExecutionsUnknown {
  message Request {
    repeated int64 ids = 1; // 执行记录 ID 列表
  }
  message Response {

    message SchedulerTaskExecutionRecord {
      google.protobuf.Timestamp created_at = 1000; // 创建时间
      google.protobuf.Timestamp updated_at = 1001; // 更新时间

      int64 id = 1; // 执行记录 ID
      int64 task_id = 2; // 任务 ID
      google.protobuf.Timestamp scheduled_at = 3; // 理论调度时间
      optional google.protobuf.Timestamp started_at = 4; // 实际开始时间
      optional google.protobuf.Timestamp finished_at = 5; // 实际结束时间
      optional int64 duration_ms = 6; // 执行耗时，单位毫秒
      SchedulerTaskExecutionStatus status = 7; // 执行状态
      SchedulerTaskTriggerType trigger_type = 8; // 触发类型
      int64 task_version = 9; // 执行时使用的任务配置版本
      string worker_id = 10; // 触发本次执行的 scheduler 实例
      string payload = 15; // JSON 编码后的执行参数快照
      string last_error = 16; // 最近一次错误摘要
      string trace_id = 17; // 链路追踪 ID
    }
    repeated SchedulerTaskExecutionRecord rows = 1; // 已更新的执行记录
    uint32 updated_count = 2; // 已更新数量
  }
}
