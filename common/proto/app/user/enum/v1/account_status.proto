syntax = "proto3";

package common.api.app.user.enum.v1;

option go_package = "common/proto/gen/user/enum/v1;enum";

// AccountStatus 表示账号生命周期状态。
enum AccountStatus {
  // 未指定
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // 正常
  ACCOUNT_STATUS_NORMAL = 1;
  // 封禁
  ACCOUNT_STATUS_BANNED = 2;
  // 注销
  ACCOUNT_STATUS_CANCELLED = 3;
}
