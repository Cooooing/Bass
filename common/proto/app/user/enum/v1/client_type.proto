syntax = "proto3";

package common.api.app.user.enum.v1;

option go_package = "common/proto/gen/user/enum/v1;enum";

// ClientType 表示发起登录的客户端类型。
enum ClientType {
  // 未指定
  CLIENT_TYPE_UNSPECIFIED = 0;
  // 未识别客户端
  CLIENT_TYPE_UNKNOWN = 1;
  // Web 客户端
  CLIENT_TYPE_WEB = 2;
  // 管理后台 Web 客户端
  CLIENT_TYPE_ADMIN_WEB = 3;
  // 移动客户端
  CLIENT_TYPE_MOBILE = 4;
}
