syntax = "proto3";

package common.api.app.user.enum.v1;

option go_package = "common/proto/gen/user/enum/v1;enum";

// DeviceType 表示发起登录的设备类型。
enum DeviceType {
  // 未指定
  DEVICE_TYPE_UNSPECIFIED = 0;
  // 未识别设备
  DEVICE_TYPE_UNKNOWN = 1;
  // 桌面设备
  DEVICE_TYPE_DESKTOP = 2;
  // 手机设备
  DEVICE_TYPE_MOBILE = 3;
  // 平板设备
  DEVICE_TYPE_TABLET = 4;
  // 机器人或爬虫
  DEVICE_TYPE_BOT = 5;
}
