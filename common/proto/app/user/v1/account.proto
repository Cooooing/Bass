syntax = "proto3";

package common.api.app.user.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "user/enum/v1/account_status.proto";

option go_package = "common/proto/gen/user/v1;v1";

// AccountService 提供账号资料与安全能力
service AccountService {
  // 查询单个账号
  rpc GetAccount(GetAccount.Req) returns (GetAccount.Resp) {}
  // 查询账号列表
  rpc ListAccounts(ListAccounts.Req) returns (ListAccounts.Resp) {}
  // 查询账号映射
  rpc MapAccounts(MapAccounts.Req) returns (MapAccounts.Resp) {}
  // 检索可在内容中提及的账号
  rpc SearchMentionAccounts(SearchMentionAccounts.Req) returns (SearchMentionAccounts.Resp) {}
  // 更新账号展示资料
  rpc UpdateProfileAccount(UpdateProfileAccount.Req) returns (UpdateProfileAccount.Resp) {}
  // 更新账号密码
  rpc UpdatePasswordAccount(UpdatePasswordAccount.Req) returns (UpdatePasswordAccount.Resp) {}
  // 更新账号邮箱
  rpc UpdateEmailAccount(UpdateEmailAccount.Req) returns (UpdateEmailAccount.Resp) {}
  // 更新账号手机号
  rpc UpdatePhoneAccount(UpdatePhoneAccount.Req) returns (UpdatePhoneAccount.Resp) {}
  // 生成默认头像
  rpc AvatarAccount(AvatarAccount.Req) returns (AvatarAccount.Resp) {}
}

// 协议消息。
message AccountBasic {
  // 账号 ID
  int64 id = 1;
  // 账号名
  string name = 2;
  // 昵称
  optional string nickname = 3;
  // 个人主页 URL
  optional string url = 4;
  // 头像资源 ID
  optional int64 avatar_asset_id = 5;
  // 个人主页背景图资源 ID
  optional int64 background_asset_id = 6;
  // 个人简介
  optional string introduction = 7;
  // MBTI 类型，规范化为大写
  optional string mbti = 8;
  // 账号状态
  .common.api.app.user.enum.v1.AccountStatus status = 9;
  // 关注数量
  optional int32 follow_count = 10;
  // 粉丝数量
  optional int32 follower_count = 11;
  // 创建时间
  google.protobuf.Timestamp created_at = 1000;
  // 更新时间
  google.protobuf.Timestamp updated_at = 1001;
}

// 协议消息。
message AccountContact {
  // 账号 ID
  int64 user_id = 1;
  // 邮箱地址
  optional string email = 2;
  // 手机号
  optional string phone = 3;
}

// 协议消息。
message AccountInfo {
  // 账号基础资料
  AccountBasic basic = 1;
  // 账号联系方式
  AccountContact contact = 2;
}

// 协议消息。
message GetAccount {
  // 请求参数。
  message Req {
    // 账号 ID；name 未传时必填
    int64 user_id = 1;
    // 账号名；传入时优先于 user_id
    optional string name = 2;
  }
  // 响应结果。
  message Resp {
    // 账号完整资料
    AccountInfo account = 1;
    // 最近一次成功登录时间
    optional google.protobuf.Timestamp last_success_login_at = 2;
  }
}

// 协议消息。
message ListAccounts {
  // 请求参数。
  message Req {
    // 协议消息。
    message AccountQuery {
      // 账号 ID 列表
      repeated int64 user_ids = 1;
      // 账号名列表。
      repeated string names = 2;
      // 不返回的账号 ID。
      repeated int64 excluded_user_ids = 3;
    }
    // 查询条件
    AccountQuery query = 1;
  }
  // 响应结果。
  message Resp {
    // 账号列表
    repeated AccountInfo rows = 1;
  }
}

// 协议消息。
message MapAccounts {
  // 请求参数。
  message Req {
    // 协议消息。
    message AccountQuery {
      // 账号 ID 列表
      repeated int64 user_ids = 1;
      // 账号名列表。
      repeated string names = 2;
      // 不返回的账号 ID。
      repeated int64 excluded_user_ids = 3;
    }
    // 查询条件
    AccountQuery query = 1;
  }
  // 响应结果。
  message Resp {
    // 账号映射
    map<int64, AccountInfo> accounts = 1;
  }
}

// 协议消息。
message SearchMentionAccounts {
  // 请求参数。
  message Req {
    // 用户名或昵称搜索词，可为空。
    string query = 1;
    // 分页参数。
    .common.api.app.common.v1.PageReq page = 2;
    // 不返回的账号 ID。
    repeated int64 excluded_user_ids = 3;
  }
  // 响应结果。
  message Resp {
    // 可提及账号。
    repeated AccountBasic rows = 1;
    // 分页结果。
    .common.api.app.common.v1.PageResp page = 2;
  }
}

// 协议消息。
message UpdateProfileAccount {
  // 请求参数。
  message Req {
    // 账号 ID
    int64 user_id = 1;
    // 头像资源 ID
    optional int64 avatar_asset_id = 2;
    // 个人主页背景图资源 ID；0 表示清除
    optional int64 background_asset_id = 3;
    // 昵称
    optional string nickname = 4;
    // 个人主页 URL
    optional string url = 5;
    // 个人简介
    optional string introduction = 6;
    // MBTI 类型，空字符串表示清除
    optional string mbti = 7;
  }
  // 响应结果。
  message Resp {
    // 更新后的账号资料
    AccountBasic account = 1;
  }
}

// 协议消息。
message UpdatePasswordAccount {
  // 请求参数。
  message Req {
    // 账号 ID
    int64 user_id = 1;
    // 旧密码
    string old_password = 2;
    // 新密码
    string new_password = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message UpdateEmailAccount {
  // 请求参数。
  message Req {
    // 账号 ID
    int64 user_id = 1;
    // 新邮箱地址
    string email = 2;
    // 邮箱 OTP
    string code = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message UpdatePhoneAccount {
  // 请求参数。
  message Req {
    // 账号 ID
    int64 user_id = 1;
    // 新手机号
    string phone = 2;
    // 手机 OTP
    string code = 3;
  }
  // 响应结果。
  message Resp {}
}

// 协议消息。
message AvatarAccount {
  // 请求参数。
  message Req {
    // 账号名
    string name = 1;
  }
  // Resp 通过 raw_body 返回头像原始字节及内容类型。
  message Resp {
    // 协议字段。
    .common.api.app.common.v1.ImageResp raw_body = 1;
  }
}
