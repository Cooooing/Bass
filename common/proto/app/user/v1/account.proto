syntax = "proto3";

package common.api.app.user.v1;

import "common/common.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/enum/account_status.proto";
import "user/v1/enum/mbti.proto";

option go_package = "common/proto/gen/user/v1;v1";

// AccountService 提供账号资料与安全能力
service AccountService {
  // 查询单个账号
  rpc Get(GetAccount.Req) returns (GetAccount.Resp) {}
  // 查询账号列表
  rpc List(ListAccounts.Req) returns (ListAccounts.Resp) {}
  // 查询账号映射
  rpc Map(MapAccounts.Req) returns (MapAccounts.Resp) {}
  // 更新账号展示资料
  rpc UpdateProfile(UpdateProfileAccount.Req) returns (UpdateProfileAccount.Resp) {}
  // 更新账号密码
  rpc UpdatePassword(UpdatePasswordAccount.Req) returns (UpdatePasswordAccount.Resp) {}
  // 更新账号邮箱
  rpc UpdateEmail(UpdateEmailAccount.Req) returns (UpdateEmailAccount.Resp) {}
  // 更新账号手机号
  rpc UpdatePhone(UpdatePhoneAccount.Req) returns (UpdatePhoneAccount.Resp) {}
  // 生成默认头像
  rpc Avatar(AvatarAccount.Req) returns (.common.api.app.common.ImageResp) {}
}

message AccountBasic {
  int64 id = 1; // 账号 ID
  string name = 2; // 账号名
  optional string nickname = 3; // 昵称
  optional string url = 4; // 个人主页 URL
  optional int64 avatar_asset_id = 5; // 头像资源 ID
  optional string introduction = 6; // 个人简介
  MBTI mbti = 7; // MBTI 类型
  AccountStatus status = 8; // 账号状态
  optional int32 follow_count = 10; // 关注数量
  optional int32 follower_count = 11; // 粉丝数量
  google.protobuf.Timestamp created_at = 1000; // 创建时间
  google.protobuf.Timestamp updated_at = 1001; // 更新时间
}

message AccountContact {
  int64 user_id = 1; // 账号 ID
  optional string email = 2; // 邮箱地址
  optional string phone = 3; // 手机号
}

message AccountInfo {
  AccountBasic basic = 1; // 账号基础资料
  AccountContact contact = 2; // 账号联系方式
}

message GetAccount {
  message Req {
    int64 user_id = 1; // 账号 ID
  }
  message Resp {
    AccountInfo account = 1; // 账号完整资料
  }
}

message ListAccounts {
  message Req {
    message AccountQuery {
      repeated int64 user_ids = 1; // 账号 ID 列表
    }
    AccountQuery query = 1; // 查询条件
  }
  message Resp {
    repeated AccountInfo rows = 1; // 账号列表
  }
}

message MapAccounts {
  message Req {
    message AccountQuery {
      repeated int64 user_ids = 1; // 账号 ID 列表
    }
    AccountQuery query = 1; // 查询条件
  }
  message Resp {
    map<int64, AccountInfo> accounts = 1; // 账号映射
  }
}

message UpdateProfileAccount {
  message Req {
    int64 user_id = 1; // 账号 ID
    optional int64 avatar_asset_id = 2; // 头像资源 ID
    optional string nickname = 3; // 昵称
    optional string url = 4; // 个人主页 URL
    optional string introduction = 5; // 个人简介
    optional MBTI mbti = 6; // MBTI 类型
  }
  message Resp {
    AccountBasic account = 1; // 更新后的账号资料
  }
}

message UpdatePasswordAccount {
  message Req {
    int64 user_id = 1; // 账号 ID
    string old_password = 2; // 旧密码
    string new_password = 3; // 新密码
  }
  message Resp {}
}

message UpdateEmailAccount {
  message Req {
    int64 user_id = 1; // 账号 ID
    string email = 2; // 新邮箱地址
    string code = 3; // 邮箱 OTP
  }
  message Resp {}
}

message UpdatePhoneAccount {
  message Req {
    int64 user_id = 1; // 账号 ID
    string phone = 2; // 新手机号
    string code = 3; // 手机 OTP
  }
  message Resp {}
}

message AvatarAccount {
  message Req {
    string name = 1; // 账号名
  }
}
