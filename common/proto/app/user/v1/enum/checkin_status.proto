syntax = "proto3";

package common.api.app.user.v1;

option go_package = "common/proto/gen/user/v1/enum;enum";

// CheckinStatus 表示自动签到积分事务的状态。
enum CheckinStatus {
  CHECKIN_STATUS_UNSPECIFIED = 0; // 未指定
  CHECKIN_STATUS_PENDING = 1; // 签到中
  CHECKIN_STATUS_COMPLETED = 2; // 已完成
  CHECKIN_STATUS_CANCELED = 3; // 已取消
}
