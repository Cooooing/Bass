syntax = "proto3";

package common.api.app.user.v1;

import "common/enums/language.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/enum/relation.proto";

option go_package = "common/proto/gen/user/v1;v1";

service PrivacySettingService {
  rpc Get(GetPrivacySetting.Req) returns (GetPrivacySetting.Resp) {} // 获取账号隐私设置，缺省时返回默认设置。
  rpc Map(MapPrivacySettings.Req) returns (MapPrivacySettings.Resp) {} // 批量获取账号隐私设置，缺省账号返回默认设置。
  rpc Update(UpdatePrivacySetting.Req) returns (UpdatePrivacySetting.Resp) {} // 更新账号隐私设置；缺省扩展表使用 upsert 创建。
}

message PrivacySetting {
  int64 user_id = 1;
  optional bool public_points = 2;
  optional bool public_follower_list = 3;
  optional bool public_following_list = 4;
  optional bool public_article_list = 5;
  optional bool public_comment_list = 6;
  optional bool public_online_status = 7;
  optional bool public_location = 8;
  optional bool public_moonbreeze_list = 9;
}

message GetPrivacySetting {
  message Req {
    int64 user_id = 1;
  }
  message Resp {
    PrivacySetting privacy_setting = 1;
  }
}

message MapPrivacySettings {
  message Req {
    repeated int64 user_ids = 1;
  }
  message Resp {
    map<int64, PrivacySetting> privacy_settings = 1;
  }
}

message UpdatePrivacySetting {
  message Req {
    int64 user_id = 1;
    optional bool public_points = 2;
    optional bool public_follower_list = 3;
    optional bool public_following_list = 4;
    optional bool public_article_list = 5;
    optional bool public_comment_list = 6;
    optional bool public_online_status = 7;
    optional bool public_location = 8;
    optional bool public_moonbreeze_list = 9;
  }
  message Resp {
    PrivacySetting privacy_setting = 1;
  }
}
