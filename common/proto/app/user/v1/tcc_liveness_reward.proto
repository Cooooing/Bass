syntax = "proto3";

package common.api.app.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "common/proto/gen/user/v1;v1";

// TCCLivenessRewardService 提供活跃奖励领取的 TCC 分支操作。
service TCCLivenessRewardService {
  // 预留活跃奖励领取状态。
  rpc Try(TCCLivenessReward.Req) returns (TCCLivenessReward.Resp) {}
  // 确认活跃奖励已领取。
  rpc Confirm(TCCLivenessReward.Req) returns (TCCLivenessReward.Resp) {}
  // 取消活跃奖励领取状态。
  rpc Cancel(TCCLivenessReward.Req) returns (TCCLivenessReward.Resp) {}
}

// TCCLivenessReward 表示一次活跃奖励领取的 TCC 分支参数。
message TCCLivenessReward {
  // 请求参数。
  message Req {
    // 领取账号 ID。
    int64 user_id = 1;
    // 已结算的业务日。
    google.protobuf.Timestamp date = 2;
  }
  // 响应结果。
  message Resp {}
}
