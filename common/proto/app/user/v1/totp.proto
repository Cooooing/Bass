syntax = "proto3";

package common.api.app.user.v1;

import "common/enums/language.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/enum.proto";


option go_package = "common/proto/gen/user/v1;v1";

service TotpService {
  rpc Validate(ValidateTotp.Request) returns (ValidateTotp.Response) {} // 校验账号的 TOTP 验证码。
  rpc BeginEnable(BeginEnableTotp.Request) returns (BeginEnableTotp.Response) {} // 开始启用 TOTP，生成临时密钥和二维码图片。
  rpc ConfirmEnable(ConfirmEnableTotp.Request) returns (ConfirmEnableTotp.Response) {} // 确认 TOTP 验证码并正式启用 TOTP。
  rpc Disable(DisableTotp.Request) returns (DisableTotp.Response) {} // 校验 TOTP 验证码并关闭 TOTP。
  rpc Get(GetTotp.Request) returns (GetTotp.Response) {} // 获取账号 TOTP 状态。
}

message ValidateTotp {
  message Request {
      int64 user_id = 1;
      string code = 2;
    }
  message Response {
      bool verified = 1;
    }
}

message BeginEnableTotp {
  message Request {
      int64 user_id = 1;
      string account_name = 2;
    }
  message Response {
      string url = 1;
      bytes qr_code = 2;
    }
}

message ConfirmEnableTotp {
  message Request {
      int64 user_id = 1;
      string code = 2;
    }
  message Response {}
}

message DisableTotp {
  message Request {
      int64 user_id = 1;
      string code = 2;
    }
  message Response {}
}

message GetTotp {
  message Request {
      int64 user_id = 1;
    }
  message Response {

    message Totp {
        int64 user_id = 1;
        bool enable = 2;
        google.protobuf.Timestamp enable_time = 3;
      }
      Totp totp = 1;
    }
}
