name: bass-infra

networks:
  bass:
    name: bass
    driver: bridge

services:
  postgres:
    image: postgres:18.4
    restart: on-failure:3
    env_file:
      - .test.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - bass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8.8.1
    restart: on-failure:3
    env_file:
      - .test.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  consul:
    image: hashicorp/consul:2.0.0
    restart: on-failure:3
    env_file:
      - .test.env
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_HTTP_TOKEN=${CONSUL_ACL_MASTER_TOKEN}
    command: >
      consul agent
      -server
      -bootstrap-expect=1
      -ui
      -client=0.0.0.0
      -data-dir=/consul/data
      -hcl '
      disable_update_check = true
      acl {
        enabled = true
        default_policy = "deny"
        enable_token_persistence = true
        tokens {
          initial_management = "${CONSUL_ACL_MASTER_TOKEN}"
          agent = "${CONSUL_ACL_MASTER_TOKEN}"
        }
      }'
    ports:
      - "${CONSUL_PORT:-8500}:8500"
    volumes:
      - consul_data:/consul/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD", "consul", "info", "-token=${CONSUL_ACL_MASTER_TOKEN}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14.2
    restart: on-failure:3
    env_file:
      - .test.env
    environment:
      - TZ=Asia/Shanghai
      - MAX_PAYLOAD=1048576  # 1MB，可选，默认也是 1MB
    command: >
      --js
      --sd /data/jetstream
      -m 8222
      --user ${NATS_USER}
      --pass ${NATS_PASSWORD}
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
      - "${NATS_CLUSTER_PORT:-6222}:6222"
    volumes:
      - nats_data:/data/jetstream
    networks:
      - bass

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: on-failure:3
    env_file:
      - .test.env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # CORS is a MinIO server setting, not a bucket-level S3 API call.
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:2324}
      # This is an infrastructure-only route: MinIO publishes object-created events to the stable NATS subject.
      - MINIO_NOTIFY_NATS_ENABLE_ASSET_EVENTS=on
      - MINIO_NOTIFY_NATS_ADDRESS_ASSET_EVENTS=nats:4222
      - MINIO_NOTIFY_NATS_SUBJECT_ASSET_EVENTS=${ASSET_EVENT_SUBJECT:-storage.asset.object-created}
      - MINIO_NOTIFY_NATS_USERNAME_ASSET_EVENTS=${NATS_USER}
      - MINIO_NOTIFY_NATS_PASSWORD_ASSET_EVENTS=${NATS_PASSWORD}
      - MINIO_NOTIFY_NATS_JETSTREAM_ASSET_EVENTS=on
      - MINIO_NOTIFY_NATS_QUEUE_DIR_ASSET_EVENTS=/data/minio-events/asset-events
      - MINIO_NOTIFY_NATS_QUEUE_LIMIT_ASSET_EVENTS=10000
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - bass
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5

  minio-asset-event-rule:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    env_file:
      - .test.env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-bass-assets}
    depends_on:
      minio:
        condition: service_healthy
    # The image defaults to the `minio` entrypoint. Override it explicitly so
    # this one-shot bootstrap container executes the bundled `mc` client.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set bass-minio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing bass-minio/"$${MINIO_BUCKET}"
        mc anonymous set download bass-minio/"$${MINIO_BUCKET}"/assets/sha256/
        mc event add bass-minio/"$${MINIO_BUCKET}" arn:minio:sqs::ASSET_EVENTS:nats \
          --event put \
          --prefix assets/sha256/ \
          --ignore-existing
    networks:
      - bass


  dtm-init:
    image: postgres:18.4
    restart: "no"
    env_file:
      - .test.env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" <<'SQL'
        CREATE SCHEMA IF NOT EXISTS dtm;
        SET search_path TO dtm;

        CREATE SEQUENCE IF NOT EXISTS trans_global_seq;
        CREATE TABLE IF NOT EXISTS trans_global (
          id bigint NOT NULL DEFAULT NEXTVAL('trans_global_seq'),
          gid varchar(128) NOT NULL,
          trans_type varchar(45) NOT NULL,
          status varchar(45) NOT NULL,
          query_prepared varchar(1024) NOT NULL,
          protocol varchar(45) NOT NULL,
          create_time timestamp(0) with time zone DEFAULT NULL,
          update_time timestamp(0) with time zone DEFAULT NULL,
          finish_time timestamp(0) with time zone DEFAULT NULL,
          rollback_time timestamp(0) with time zone DEFAULT NULL,
          options varchar(1024) DEFAULT '',
          custom_data varchar(1024) DEFAULT '',
          next_cron_interval int DEFAULT NULL,
          next_cron_time timestamp(0) with time zone DEFAULT NULL,
          owner varchar(128) NOT NULL DEFAULT '',
          ext_data text,
          result varchar(1024) DEFAULT '',
          rollback_reason varchar(1024) DEFAULT '',
          PRIMARY KEY (id),
          CONSTRAINT gid UNIQUE (gid)
        );
        CREATE INDEX IF NOT EXISTS owner ON trans_global(owner);
        CREATE INDEX IF NOT EXISTS status_next_cron_time ON trans_global(status, next_cron_time);

        CREATE SEQUENCE IF NOT EXISTS trans_branch_op_seq;
        CREATE TABLE IF NOT EXISTS trans_branch_op (
          id bigint NOT NULL DEFAULT NEXTVAL('trans_branch_op_seq'),
          gid varchar(128) NOT NULL,
          url varchar(1024) NOT NULL,
          data text,
          bin_data bytea,
          branch_id varchar(128) NOT NULL,
          op varchar(45) NOT NULL,
          status varchar(45) NOT NULL,
          finish_time timestamp(0) with time zone DEFAULT NULL,
          rollback_time timestamp(0) with time zone DEFAULT NULL,
          create_time timestamp(0) with time zone DEFAULT NULL,
          update_time timestamp(0) with time zone DEFAULT NULL,
          PRIMARY KEY (id),
          CONSTRAINT gid_branch_uniq UNIQUE (gid, branch_id, op)
        );

        CREATE SEQUENCE IF NOT EXISTS kv_seq;
        CREATE TABLE IF NOT EXISTS kv (
          id bigint NOT NULL DEFAULT NEXTVAL('kv_seq'),
          cat varchar(45) NOT NULL,
          k varchar(128) NOT NULL,
          v text,
          version bigint DEFAULT 1,
          create_time timestamp(0) with time zone DEFAULT NULL,
          update_time timestamp(0) with time zone DEFAULT NULL,
          PRIMARY KEY (id),
          CONSTRAINT uniq_k UNIQUE(cat, k)
        );
        SQL
    networks:
      - bass

  dtm:
    image: yedf/dtm:1.19.0
    restart: on-failure:3
    env_file:
      - .test.env
    depends_on:
      postgres:
        condition: service_healthy
      dtm-init:
        condition: service_completed_successfully
    environment:
      STORE_DRIVER: postgres
      STORE_HOST: postgres
      STORE_PORT: 5432
      STORE_USER: ${POSTGRES_USER}
      STORE_PASSWORD: ${POSTGRES_PASSWORD}
      STORE_DB: ${POSTGRES_DB}
      STORE_SCHEMA: dtm
    ports:
      - "${DTM_HTTP_PORT:-36789}:36789"
      - "${DTM_GRPC_PORT:-36790}:36790"
    networks:
      - bass
volumes:
  postgres_data:
  redis_data:
  consul_data:
  nats_data:
  minio_data:
