apiVersion: apps/v1
kind: Deployment
metadata:
  name: bass-dtm
  namespace: bass-dev
  labels:
    app.kubernetes.io/name: dtm
    app.kubernetes.io/part-of: bass
    app.kubernetes.io/component: middleware
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dtm
      app.kubernetes.io/part-of: bass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dtm
        app.kubernetes.io/part-of: bass
        app.kubernetes.io/component: middleware
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: dtm
          image: docker.m.daocloud.io/yedf/dtm:1.19.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 36789
              protocol: TCP
            - name: grpc
              containerPort: 36790
              protocol: TCP
          env:
            - name: STORE_DRIVER
              value: postgres
            - name: STORE_HOST
              value: bass-postgresql.bass-dev.svc.cluster.local
            - name: STORE_PORT
              value: "5432"
            - name: STORE_USER
              value: admin
            - name: STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bass-postgres-secret
                  key: password
            - name: STORE_DB
              value: bass
            - name: STORE_SCHEMA
              value: dtm
          readinessProbe:
            httpGet:
              path: /api/dtmsvr/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/dtmsvr/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bass-dtm
  namespace: bass-dev
  labels:
    app.kubernetes.io/name: dtm
    app.kubernetes.io/part-of: bass
    app.kubernetes.io/component: middleware
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dtm
    app.kubernetes.io/part-of: bass
  ports:
    - name: http
      port: 36789
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 36790
      targetPort: grpc
      protocol: TCP
