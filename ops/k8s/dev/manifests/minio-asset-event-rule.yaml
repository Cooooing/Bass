apiVersion: batch/v1
kind: Job
metadata:
  name: bass-minio-asset-event-rule
  namespace: bass-dev
  labels:
    app.kubernetes.io/component: asset-event-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: asset-event-bootstrap
    spec:
      restartPolicy: OnFailure
      # The MinIO development volume and its cached image live on master.
      nodeSelector:
        kubernetes.io/hostname: master
      containers:
        - name: mc
          # MinIO's server image contains a matching /usr/bin/mc client.
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set bass-minio http://bass-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing bass-minio/"$MINIO_BUCKET"
              mc anonymous set download bass-minio/"$MINIO_BUCKET"/assets/sha256/
              # MinIO canonicalizes target identifiers to uppercase in SQS ARNs.
              mc event add bass-minio/"$MINIO_BUCKET" arn:minio:sqs::ASSET_EVENTS:nats \
                --event put \
                --prefix assets/sha256/ \
                --ignore-existing
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: bass-minio-secret
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bass-minio-secret
                  key: rootPassword
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: bass-minio-secret
                  key: bucket
