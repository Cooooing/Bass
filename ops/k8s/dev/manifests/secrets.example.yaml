# Copy this file to secrets.local.yaml and replace every placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: bass-postgres-secret
  namespace: bass-dev
type: Opaque
stringData:
  password: "<set-a-strong-postgres-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: bass-redis-secret
  namespace: bass-dev
type: Opaque
stringData:
  redis-password: "<set-a-strong-redis-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: bass-minio-secret
  namespace: bass-dev
type: Opaque
stringData:
  rootUser: "<set-a-minio-admin-user>"
  rootPassword: "<set-a-strong-minio-password>"
  bucket: "bass-assets"
---
apiVersion: v1
kind: Secret
metadata:
  name: bass-nats-secret
  namespace: bass-dev
type: Opaque
stringData:
  NATS_USER: "<set-a-nats-user>"
  NATS_PASSWORD: "<set-a-strong-nats-password>"
  # This file is mounted by MinIO as MINIO_CONFIG_ENV_FILE. Its subject must
  # match Platform's ASSET_EVENT_SUBJECT runtime setting.
  config.env: |
    MINIO_NOTIFY_NATS_ENABLE_ASSET_EVENTS=on
    # CORS is configured globally by MinIO; this is not a bucket CORS API call.
    MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:2324
    MINIO_NOTIFY_NATS_ADDRESS_ASSET_EVENTS=bass-nats:4222
    MINIO_NOTIFY_NATS_SUBJECT_ASSET_EVENTS=storage.asset.object-created
    MINIO_NOTIFY_NATS_USERNAME_ASSET_EVENTS=<set-a-nats-user>
    MINIO_NOTIFY_NATS_PASSWORD_ASSET_EVENTS=<set-a-strong-nats-password>
    MINIO_NOTIFY_NATS_JETSTREAM_ASSET_EVENTS=on
    # The MinIO container runs unprivileged; use its writable persistent volume.
    MINIO_NOTIFY_NATS_QUEUE_DIR_ASSET_EVENTS=/export/minio-events/asset-events
    MINIO_NOTIFY_NATS_QUEUE_LIMIT_ASSET_EVENTS=10000
