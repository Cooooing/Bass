# Copy this file to secrets.local.yaml and replace every placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: bass-postgres-secret
  namespace: bass-dev
type: Opaque
stringData:
  password: "<set-a-strong-postgres-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: bass-redis-secret
  namespace: bass-dev
type: Opaque
stringData:
  redis-password: "<set-a-strong-redis-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: bass-minio-secret
  namespace: bass-dev
type: Opaque
stringData:
  rootUser: "<set-a-minio-admin-user>"
  rootPassword: "<set-a-strong-minio-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: bass-nats-secret
  namespace: bass-dev
type: Opaque
stringData:
  NATS_USER: "<set-a-nats-user>"
  NATS_PASSWORD: "<set-a-strong-nats-password>"
